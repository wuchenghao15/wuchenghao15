<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThemeManager 测试</title>
</head>
<body>
    <h1>ThemeManager 测试页面</h1>
    <div id="output"></div>
    
    <script src="assets/js/theme-manager.js?v=20251120"></script>
    <script>
        setTimeout(() => {
            const output = document.getElementById('output');
            output.innerHTML = `
                <p>ThemeManager class: ${typeof ThemeManager}</p>
                <p>window.themeManager: ${typeof window.themeManager}</p>
                <p>window.themeManager instance: ${window.themeManager instanceof ThemeManager}</p>
            `;
            
            console.log('ThemeManager class:', typeof ThemeManager);
            console.log('window.themeManager:', typeof window.themeManager);
            console.log('window.themeManager instance:', window.themeManager instanceof ThemeManager);
        }, 1000);
    </script>
</body>
</html>
