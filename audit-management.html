<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>审核管理 - MTSCOS系统</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/audit.css">

</head>
<body>
    <div class="audit-container">
        <!-- 页面头部 -->
        <header class="audit-header">
            <h1>审核管理系统</h1>
            <p>管理系统敏感操作的审核流程、批准请求和回滚机制</p>
        </header>

        <!-- 统计卡片 -->
        <section class="audit-stats">
            <div class="stat-card">
                <h3>待处理审核</h3>
                <div class="value" id="pendingCount">0</div>
                <div class="description">需要批准的敏感操作</div>
            </div>
            <div class="stat-card">
                <h3>今日审核</h3>
                <div class="value" id="todayCount">0</div>
                <div class="description">今天处理的审核数量</div>
            </div>
            <div class="stat-card">
                <h3>批准率</h3>
                <div class="value" id="approvalRate">0%</div>
                <div class="description">操作批准的成功率</div>
            </div>
            <div class="stat-card">
                <h3>回滚次数</h3>
                <div class="value" id="rollbackCount">0</div>
                <div class="description">本月操作回滚次数</div>
            </div>
        </section>

        <!-- 审核管理标签页 -->
        <main class="audit-tabs">
            <nav class="tab-nav">
                <button class="tab-btn active" data-tab="pending">待处理审核</button>
                <button class="tab-btn" data-tab="history">审核历史</button>
                <button class="tab-btn" data-tab="approvals">批准管理</button>
                <button class="tab-btn" data-tab="rollbacks">回滚管理</button>
                <button class="tab-btn" data-tab="settings">审核设置</button>
            </nav>

            <div class="tab-content">
                <!-- 待处理审核 -->
                <div class="tab-pane active" id="pending">
                    <div class="audit-filters">
                        <div class="filter-row">
                            <div class="filter-group">
                                <label>操作类型</label>
                                <select id="filterOperation">
                                    <option value="">全部</option>
                                    <option value="delete_user">删除用户</option>
                                    <option value="delete_data">删除数据</option>
                                    <option value="modify_permissions">修改权限</option>
                                    <option value="system_settings">系统设置</option>
                                    <option value="backup_restore">备份恢复</option>
                                    <option value="vikey_management">Vikey管理</option>
                                </select>
                            </div>
                            <div class="filter-group">
                                <label>优先级</label>
                                <select id="filterPriority">
                                    <option value="">全部</option>
                                    <option value="high">高</option>
                                    <option value="medium">中</option>
                                    <option value="low">低</option>
                                </select>
                            </div>
                            <div class="filter-group">
                                <label>提交用户</label>
                                <input type="text" id="filterUser" placeholder="输入用户名">
                            </div>
                        </div>
                        <div class="filter-actions">
                            <button class="btn btn-secondary" onclick="clearFilters()">清除筛选</button>
                            <button class="btn btn-primary" onclick="refreshPendingAudits()">刷新</button>
                        </div>
                    </div>

                    <div id="pendingAuditsList">
                        <div class="loading">
                            <div class="spinner"></div>
                            <p>加载待处理审核...</p>
                        </div>
                    </div>
                </div>

                <!-- 审核历史 -->
                <div class="tab-pane" id="history">
                    <div class="audit-filters">
                        <div class="filter-row">
                            <div class="filter-group">
                                <label>状态</label>
                                <select id="filterStatus">
                                    <option value="">全部</option>
                                    <option value="pending">待处理</option>
                                    <option value="approved">已批准</option>
                                    <option value="rejected">已拒绝</option>
                                    <option value="executed">已执行</option>
                                    <option value="failed">执行失败</option>
                                    <option value="rolled_back">已回滚</option>
                                </select>
                            </div>
                            <div class="filter-group">
                                <label>开始时间</label>
                                <input type="datetime-local" id="filterStartTime">
                            </div>
                            <div class="filter-group">
                                <label>结束时间</label>
                                <input type="datetime-local" id="filterEndTime">
                            </div>
                        </div>
                        <div class="filter-actions">
                            <button class="btn btn-secondary" onclick="clearHistoryFilters()">清除筛选</button>
                            <button class="btn btn-primary" onclick="refreshAuditHistory()">刷新</button>
                        </div>
                    </div>

                    <div id="auditHistoryList">
                        <div class="loading">
                            <div class="spinner"></div>
                            <p>加载审核历史...</p>
                        </div>
                    </div>
                </div>

                <!-- 批准管理 -->
                <div class="tab-pane" id="approvals">
                    <div id="approvalsList">
                        <div class="loading">
                            <div class="spinner"></div>
                            <p>加载批准管理...</p>
                        </div>
                    </div>
                </div>

                <!-- 回滚管理 -->
                <div class="tab-pane" id="rollbacks">
                    <div class="audit-filters">
                        <div class="filter-row">
                            <div class="filter-group">
                                <label>回滚状态</label>
                                <select id="filterRollbackStatus">
                                    <option value="">全部</option>
                                    <option value="pending">待处理</option>
                                    <option value="completed">已完成</option>
                                    <option value="failed">失败</option>
                                </select>
                            </div>
                        </div>
                        <div class="filter-actions">
                            <button class="btn btn-secondary" onclick="clearRollbackFilters()">清除筛选</button>
                            <button class="btn btn-primary" onclick="refreshRollbacks()">刷新</button>
                        </div>
                    </div>

                    <div id="rollbacksList">
                        <div class="loading">
                            <div class="spinner"></div>
                            <p>加载回滚管理...</p>
                        </div>
                    </div>
                </div>

                <!-- 审核设置 -->
                <div class="tab-pane" id="settings">
                    <div class="audit-details">
                        <h3>审核配置</h3>
                        <form id="auditSettingsForm">
                            <div class="detail-row">
                                <label class="detail-label">启用审核</label>
                                <div class="detail-value">
                                    <input type="checkbox" id="auditEnabled" checked>
                                    <span>启用系统审核功能</span>
                                </div>
                            </div>
                            <div class="detail-row">
                                <label class="detail-label">需要批准</label>
                                <div class="detail-value">
                                    <input type="checkbox" id="requireApproval" checked>
                                    <span>敏感操作需要批准</span>
                                </div>
                            </div>
                            <div class="detail-row">
                                <label class="detail-label">批准超时</label>
                                <div class="detail-value">
                                    <input type="number" id="approvalTimeout" value="24" min="1" max="168">
                                    <span>小时</span>
                                </div>
                            </div>
                            <div class="detail-row">
                                <label class="detail-label">最小批准人数</label>
                                <div class="detail-value">
                                    <input type="number" id="minApprovers" value="2" min="1" max="5">
                                    <span>人</span>
                                </div>
                            </div>
                            <div class="detail-row">
                                <label class="detail-label">最大回滚次数</label>
                                <div class="detail-value">
                                    <input type="number" id="maxRollbacks" value="3" min="1" max="10">
                                    <span>次</span>
                                </div>
                            </div>
                            <div class="detail-row">
                                <label class="detail-label">启用通知</label>
                                <div class="detail-value">
                                    <input type="checkbox" id="notificationEnabled" checked>
                                    <span>发送批准通知</span>
                                </div>
                            </div>
                            <div class="filter-actions">
                                <button type="button" class="btn btn-secondary" onclick="resetAuditSettings()">重置</button>
                                <button type="submit" class="btn btn-primary">保存设置</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 审核详情模态框 -->
    <div id="auditModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>审核详情</h2>
                <button class="modal-close" onclick="closeAuditModal()">&times;</button>
            </div>
            <div id="auditModalBody">
                <!-- 动态内容 -->
            </div>
        </div>
    </div>

    <!-- 批准模态框 -->
    <div id="approvalModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>批准审核</h2>
                <button class="modal-close" onclick="closeApprovalModal()">&times;</button>
            </div>
            <div id="approvalModalBody">
                <!-- 动态内容 -->
            </div>
        </div>
    </div>

    <!-- 核心脚本 -->
    <script src="assets/js/core/vikey-api.js"></script>
    <script src="assets/js/core/vikey-database.js"></script>
    <script src="assets/js/core/user-management.js"></script>
    <script src="assets/js/core/system-logger.js"></script>
    <script src="assets/js/core/audit-system.js"></script>
    
    <!-- 页面脚本 -->
    <script src="assets/js/audit-page.js"></script>
    <script src="assets/js/audit-page.js"></script>
</body>
</html>
