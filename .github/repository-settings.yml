# GitHub 仓库元数据
repository:
  name: MTSCOS
  description: "MTSCOS AI - 多租户智能配置操作系统，集成AI引擎、学习系统、权限管理、备份恢复、影子系统"
  homepage: "https://github.com/wuchenghao15/MTSCOS"
  topics:
    - python
    - flask
    - ai
    - 多租户
    - 权限管理
    - 备份恢复
    - 影子系统
    - 安全
    - sqlite
    - 学习系统
    - 智能运维
    - 自动化
  private: false
  has_issues: true
  has_projects: true
  has_wiki: true
  has_discussions: true

# 分支保护
branch_protection:
  main:
    required_pull_request_reviews:
      required_approving_review_count: 1
      dismiss_stale_reviews: true
      require_code_owner_reviews: false
    required_status_checks:
      strict: true
      contexts:
        - "Python CI"
    enforce_admins: true
    restrictions:
      users: ["wuchenghao15"]
