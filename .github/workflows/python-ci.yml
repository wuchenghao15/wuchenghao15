name: Python CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: 设置 Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install flask

    - name: 语法检查
      run: |
        python -m py_compile server_real_db.py
        python -m py_compile flask-app/scripts/tools/mtscos_system_test_engine.py
        echo "语法检查通过"

    - name: 代码风格检查
      run: |
        pip install flake8
        flake8 server_real_db.py --max-line-length=120 --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 server_real_db.py --max-line-length=120 --count --exit-zero --max-complexity=10 --statistics
      continue-on-error: true

    - name: 检查项目文件
      run: |
        echo "=== 项目文件结构 ==="
        ls -la
        echo ""
        echo "=== 核心文件 ==="
        test -f server_real_db.py && echo "✅ server_real_db.py 存在" || echo "❌ server_real_db.py 缺失"
        test -f flask-app/scripts/tools/mtscos_system_test_engine.py && echo "✅ 测试引擎 存在" || echo "❌ 测试引擎 缺失"
        test -f README.md && echo "✅ README.md 存在" || echo "❌ README.md 缺失"
        test -f LICENSE && echo "✅ LICENSE 存在" || echo "❌ LICENSE 缺失"
        test -f SECURITY.md && echo "✅ SECURITY.md 存在" || echo "❌ SECURITY.md 缺失"
        test -f CONTRIBUTING.md && echo "✅ CONTRIBUTING.md 存在" || echo "❌ CONTRIBUTING.md 缺失"
        test -f CODE_OF_CONDUCT.md && echo "✅ CODE_OF_CONDUCT.md 存在" || echo "❌ CODE_OF_CONDUCT.md 缺失"
