# MTSCOS AI Project - Dependabot 版本与安全更新配置
# 文档: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
      time: "03:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 12
    labels:
      - "dependencies"
      - "security"
    rebase-strategy: "auto"
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    groups:
      security-patches:
        applies-to: security-updates
        patterns:
          - "*"
      patch-updates:
        applies-to: version-updates
        update-types:
          - "patch"
      minor-updates:
        applies-to: version-updates
        update-types:
          - "minor"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    ignore:
      - dependency-name: "protobuf"
        versions: ["6.x"]
      - dependency-name: "paho-mqtt"
        versions: ["2.x"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 10
    labels:
      - "github-actions"
      - "security"
    rebase-strategy: "auto"
    commit-message:
      prefix: "ci(actions)"
      include: "scope"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "docker"
      - "security"
    commit-message:
      prefix: "chore(docker)"
      include: "scope"
