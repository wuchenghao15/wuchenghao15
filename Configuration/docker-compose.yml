version: '3.8'

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mtscos-mssql
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=LoginMe15
      - MSSQL_PID=Developer
    ports:
      - "33693:1433"
    volumes:
      - mssql_data:/var/opt/mssql
      - ./init-mssql:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P LoginMe15 -Q 'SELECT 1' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  mssql_data:
    driver: local