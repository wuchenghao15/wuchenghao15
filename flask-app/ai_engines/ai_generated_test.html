<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>库存只读视图</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding-top: 4rem; }
        .table-responsive { max-height: 60vh; overflow-y: auto; }
        .search-input { width: 250px; }
        .pagination { justify-content: center; }
    </style>
</head>
<body>
<nav class="navbar fixed-top navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">库存管理</a>
        <div class="collapse navbar-collapse">
            <form class="d-flex ms-auto" id="search-form">
                <input class="form-control me-2 search-input" type="search" placeholder="搜索" aria-label="Search" id="search-input">
                <button class="btn btn-outline-success" type="submit">搜索</button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="table-responsive">
        <table class="table table-striped table-hover" id="inventory-table">
            <thead class="table-light">
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">名称</th>
                    <th scope="col">数量</th>
                    <th scope="col">位置</th>
                    <th scope="col">状态</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <!-- 数据行将动态插入 -->
            </tbody>
        </table>
    </div>
    <nav>
        <ul class="pagination" id="pagination">
            <!-- 分页按钮将动态插入 -->
        </ul>
    </nav>
</div>

<script>
    const apiEndpoint = '/api/inventory';
    const tableBody = document.getElementById('table-body');
    const pagination = document.getElementById('pagination');
    const searchInput = document.getElementById('search-input');
    const searchForm = document.getElementById('search-form');

    let currentPage = 1;
    let totalPages = 1;
    let currentSearch = '';

    async function fetchData(page = 1, search = '') {
        try {
            const params = new URLSearchParams({ page, search });
            const response = await fetch(`${apiEndpoint}?${params.toString()}`);
            if (!response.ok) throw new Error('网络错误');
            const data = await response.json();
            renderTable(data.items);
            renderPagination(data.current_page, data.total_pages);
        } catch (err) {
            console.error(err);
            tableBody.innerHTML = '<tr><td colspan="5" class="text-center text-danger">加载失败，请稍后重试。</td></tr>';
        }
    }

    function renderTable(items) {
        if (!items.length) {
            tableBody.innerHTML = '<tr><td colspan="5" class="text-center">暂无数据。</td></tr>';
            return;
        }
        tableBody.innerHTML = items.map(item => `
            <tr>
                <td>${item.id}</td>
                <td>${item.name}</td>
                <td>${item.quantity}</td>
                <td>${item.location}</td>
                <td>${item.status}</td>
            </tr>
        `).join('');
    }

    function renderPagination(current, total) {
        currentPage = current;
        totalPages = total;
        const pages = [];
        const start = Math.max(1, current - 2);
        const end = Math.min(total, current + 2);
        if (current > 1) pages.push({ text: '«', page: current - 1, disabled: false });
        for (let i = start; i <= end; i++) {
            pages.push({ text: i, page: i, disabled: false, active: i === current });
        }
        if (current < total) pages.push({ text: '»', page: current + 1, disabled: false });

        pagination.innerHTML = pages.map(p => `
            <li class="page-item ${p.disabled ? 'disabled' : ''} ${p.active ? 'active' : ''}">
                <a class="page-link" href="#" data-page="${p.page}">${p.text}</a>
            </li>
        `).join('');
    }

    pagination.addEventListener('click', e => {
        e.preventDefault();
        const target = e.target.closest('.page-link');
        if (!target || target.parentElement.classList.contains('disabled')) return;
        const page = parseInt(target.dataset.page, 10);
        if (page && page !== currentPage) fetchData(page, currentSearch);
    });

    searchForm.addEventListener('submit', e => {
        e.preventDefault();
        currentSearch = searchInput.value.trim();
        fetchData(1, currentSearch);
    });

    // 初始加载
    fetchData();
</script>
</body>
</html>
