<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTSCOS - 听力专项训练系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --success: #4caf50;
            --warning: #ff9800;
            --danger: #f44336;
            --dark: #1a1a2e;
            --card: rgba(255,255,255,0.1);
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, var(--dark) 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 30px;
            background: var(--card);
            border-radius: 15px;
        }
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header p { color: #aaa; }
        
        .stats-panel {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: var(--card);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }
        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: var(--primary);
        }
        .stat-label { color: #aaa; font-size: 0.9em; }
        
        .filter-panel {
            background: var(--card);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .filter-group { flex: 1; min-width: 150px; }
        .filter-group label { display: block; margin-bottom: 8px; color: #aaa; }
        .filter-group select {
            width: 100%;
            padding: 10px;
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
        }
        .filter-group select:hover { border-color: var(--primary); }
        
        .training-area {
            background: var(--card);
            border-radius: 15px;
            padding: 30px;
        }
        
        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(255,255,255,0.1);
        }
        .question-info { display: flex; align-items: center; gap: 15px; }
        .question-number {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2em;
        }
        .question-title { font-size: 1.3em; }
        .question-tags { display: flex; gap: 10px; }
        .tag {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            background: rgba(255,255,255,0.1);
        }
        .tag.language { background: rgba(102,126,234,0.3); color: #667eea; }
        .tag.difficulty { background: rgba(76,175,80,0.3); color: #4caf50; }
        .tag.topic { background: rgba(255,152,0,0.3); color: #ff9800; }
        
        .audio-section {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
        }
        .audio-controls {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .play-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border: none;
            color: white;
            font-size: 1.8em;
            cursor: pointer;
            transition: transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .play-btn:hover { transform: scale(1.1); }
        .speed-controls { display: flex; gap: 10px; }
        .speed-btn {
            padding: 10px 18px;
            border-radius: 8px;
            border: 2px solid rgba(255,255,255,0.1);
            background: transparent;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
        }
        .speed-btn:hover { border-color: var(--primary); }
        .speed-btn.active { background: var(--primary); border-color: var(--primary); }
        
        .progress-section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .progress-bar {
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            width: 0%;
            transition: width 0.3s;
        }
        
        .options-section { margin-top: 25px; }
        .options-list { list-style: none; }
        .option-item {
            padding: 15px 20px;
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
        }
        .option-item:hover { border-color: var(--primary); background: rgba(102,126,234,0.1); }
        .option-item.selected { border-color: var(--primary); background: rgba(102,126,234,0.2); }
        .option-item.correct { border-color: var(--success); background: rgba(76,175,80,0.2); }
        .option-item.wrong { border-color: var(--danger); background: rgba(244,67,54,0.2); }
        .option-letter {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-right: 15px;
        }
        .option-item.selected .option-letter { background: var(--primary); }
        .option-item.correct .option-letter { background: var(--success); }
        .option-item.wrong .option-letter { background: var(--danger); }
        
        .transcript-section {
            margin-top: 20px;
            padding: 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            display: none;
        }
        .transcript-section.show { display: block; }
        .transcript-title { color: var(--primary); margin-bottom: 10px; font-weight: bold; }
        .transcript-text { color: #ccc; line-height: 1.8; }
        
        .explanation-section {
            margin-top: 15px;
            padding: 15px;
            background: rgba(102,126,234,0.1);
            border-radius: 10px;
            border-left: 4px solid var(--primary);
            display: none;
        }
        .explanation-section.show { display: block; }
        
        .actions-section {
            margin-top: 30px;
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        .action-btn {
            padding: 12px 30px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s;
        }
        .action-btn.primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
        }
        .action-btn.secondary {
            background: rgba(255,255,255,0.1);
            color: #fff;
            border: 2px solid rgba(255,255,255,0.1);
        }
        .action-btn:hover { transform: translateY(-2px); }
        
        .timer {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--card);
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 1.3em;
            font-weight: bold;
        }
        
        .result-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(26,26,46,0.95);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            z-index: 1000;
            min-width: 400px;
            border: 2px solid var(--primary);
        }
        .result-modal.show { display: block; }
        .result-icon { font-size: 4em; margin-bottom: 20px; }
        .result-title { font-size: 2em; margin-bottom: 15px; }
        .result-message { color: #aaa; margin-bottom: 30px; }
        
        @media (max-width: 768px) {
            .stats-panel { grid-template-columns: repeat(2, 1fr); }
            .filter-panel { flex-direction: column; }
            .header h1 { font-size: 1.8em; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎧 听力专项训练系统</h1>
            <p>智能语速调节 · 多语言支持 · 实时统计反馈</p>
        </div>
        
        <div class="stats-panel">
            <div class="stat-card">
                <div class="stat-value" id="stat-total">0</div>
                <div class="stat-label">已完成题目</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stat-correct">0</div>
                <div class="stat-label">正确数量</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stat-accuracy">0%</div>
                <div class="stat-label">正确率</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stat-time">0m</div>
                <div class="stat-label">总训练时长</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stat-speed">1.0x</div>
                <div class="stat-label">平均语速</div>
            </div>
        </div>
        
        <div class="filter-panel">
            <div class="filter-group">
                <label>语言选择</label>
                <select id="filter-language">
                    <option value="all">全部语言</option>
                    <option value="english">英语</option>
                    <option value="japanese">日语</option>
                    <option value="chinese">中文</option>
                </select>
            </div>
            <div class="filter-group">
                <label>难度等级</label>
                <select id="filter-difficulty">
                    <option value="all">全部难度</option>
                    <option value="1">初级</option>
                    <option value="2">中级</option>
                    <option value="3">高级</option>
                    <option value="4">专家级</option>
                </select>
            </div>
            <div class="filter-group">
                <label>主题分类</label>
                <select id="filter-topic">
                    <option value="all">全部主题</option>
                    <option value="daily">日常对话</option>
                    <option value="business">商务场景</option>
                    <option value="campus">校园场景</option>
                    <option value="news">新闻广播</option>
                </select>
            </div>
            <div class="filter-group">
                <label>题目数量</label>
                <select id="filter-limit">
                    <option value="10">10题</option>
                    <option value="20" selected>20题</option>
                    <option value="30">30题</option>
                    <option value="50">50题</option>
                </select>
            </div>
        </div>
        
        <div class="training-area">
            <div id="no-questions" style="text-align: center; padding: 60px; color: #aaa;">
                <p style="font-size: 1.5em;">请选择筛选条件后点击"开始训练"</p>
                <button class="action-btn primary" onclick="startTraining()" style="margin-top: 20px;">🚀 开始训练</button>
            </div>
            
            <div id="question-area" style="display: none;">
                <div class="question-header">
                    <div class="question-info">
                        <div class="question-number" id="current-number">1</div>
                        <div class="question-title" id="question-title">听力题标题</div>
                    </div>
                    <div class="question-tags">
                        <span class="tag language" id="tag-language">英语</span>
                        <span class="tag difficulty" id="tag-difficulty">中级</span>
                        <span class="tag topic" id="tag-topic">日常</span>
                    </div>
                </div>
                
                <div class="audio-section">
                    <div class="audio-controls">
                        <button class="play-btn" onclick="playAudio()" id="play-btn">▶️</button>
                        <div class="speed-controls">
                            <button class="speed-btn" onclick="setSpeed(0.7)">🐢 0.7x</button>
                            <button class="speed-btn active" onclick="setSpeed(1.0)">⚡ 1.0x</button>
                            <button class="speed-btn" onclick="setSpeed(1.3)">🚀 1.3x</button>
                            <button class="speed-btn" onclick="setSpeed(1.5)">🔥 1.5x</button>
                        </div>
                        <button class="action-btn secondary" onclick="toggleTranscript()">📄 显示原文</button>
                    </div>
                    <div class="progress-section">
                        <div class="progress-bar">
                            <div class="progress-fill" id="audio-progress"></div>
                        </div>
                    </div>
                </div>
                
                <div class="transcript-section" id="transcript-section">
                    <div class="transcript-title">📝 听力原文</div>
                    <div class="transcript-text" id="transcript-text"></div>
                </div>
                
                <div class="options-section">
                    <h3 style="margin-bottom: 15px;">请选择正确答案：</h3>
                    <ul class="options-list" id="options-list"></ul>
                </div>
                
                <div class="explanation-section" id="explanation-section">
                    <div class="transcript-title">💡 解析说明</div>
                    <div class="transcript-text" id="explanation-text"></div>
                </div>
                
                <div class="actions-section">
                    <button class="action-btn primary" onclick="submitAnswer()" id="submit-btn">✓ 提交答案</button>
                    <button class="action-btn secondary" onclick="nextQuestion()" id="next-btn" style="display: none;">→ 下一题</button>
                    <button class="action-btn secondary" onclick="showAnswer()" id="hint-btn">💡 提示</button>
                </div>
            </div>
        </div>
    </div>
    
    <div class="timer" id="timer">⏱️ 00:00</div>
    
    <div class="result-modal" id="result-modal">
        <div class="result-icon" id="result-icon">🎉</div>
        <div class="result-title" id="result-title">训练完成！</div>
        <div class="result-message" id="result-message"></div>
        <div class="actions-section">
            <button class="action-btn primary" onclick="closeResultAndRestart()">重新训练</button>
            <button class="action-btn secondary" onclick="closeResult()">关闭</button>
        </div>
    </div>
    
    <audio id="audio-player" style="display: none;"></audio>
    
    <script>
        let questions = [];
        let currentIndex = 0;
        let selectedAnswer = null;
        let currentSpeed = 1.0;
        let startTime = null;
        let timerInterval = null;
        let totalCorrect = 0;
        let totalTime = 0;
        
        // 加载统计数据
        function loadStats() {
            fetch('/api/listening/stats')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        const stats = data.data;
                        document.getElementById('stat-total').textContent = stats.total_questions;
                        document.getElementById('stat-correct').textContent = stats.correct_count;
                        document.getElementById('stat-accuracy').textContent = stats.accuracy.toFixed(1) + '%';
                        document.getElementById('stat-time').textContent = Math.floor(stats.total_time / 60) + 'm';
                        document.getElementById('stat-speed').textContent = stats.avg_speed.toFixed(1) + 'x';
                    }
                });
        }
        
        // 开始训练
        function startTraining() {
            const language = document.getElementById('filter-language').value;
            const difficulty = document.getElementById('filter-difficulty').value;
            const topic = document.getElementById('filter-topic').value;
            const limit = document.getElementById('filter-limit').value;
            
            const url = `/api/listening/questions?language=${language}&difficulty=${difficulty}&topic=${topic}&limit=${limit}`;
            console.log('Fetch URL:', url);
            console.log('Selected filters:', {language, difficulty, topic, limit});
            
            fetch(url)
                .then(response => {
                    console.log('Response status:', response.status);
                    console.log('Response URL:', response.url);
                    console.log('Response redirected:', response.redirected);
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    console.log('API response:', data);
                    if (data.success && data.data && data.data.length > 0) {
                        questions = data.data;
                        currentIndex = 0;
                        totalCorrect = 0;
                        totalTime = 0;
                        
                        document.getElementById('no-questions').style.display = 'none';
                        document.getElementById('question-area').style.display = 'block';
                        
                        showQuestion(currentIndex);
                        startTimer();
                    } else {
                        console.log('No questions found or success=false');
                        alert(`没有找到符合条件的听力题。\nURL: ${url}\n返回数据: ${JSON.stringify(data)}`);
                    }
                })
                .catch(error => {
                    console.error('Fetch error:', error);
                    alert('获取听力题失败: ' + error.message + '\nURL: ' + url);
                });
        }
        
        // 显示题目
        function showQuestion(index) {
            const q = questions[index];
            selectedAnswer = null;
            
            document.getElementById('current-number').textContent = index + 1;
            document.getElementById('question-title').textContent = q.content;
            document.getElementById('tag-language').textContent = q.language === 'english' ? '英语' : q.language === 'japanese' ? '日语' : q.language === 'chinese' ? '中文' : q.language;
            document.getElementById('tag-difficulty').textContent = ['初级', '中级', '高级', '专家级'][q.difficulty - 1] || '中级';
            document.getElementById('tag-topic').textContent = q.topic;
            
            // 显示选项
            const optionsList = document.getElementById('options-list');
            optionsList.innerHTML = '';
            q.options.forEach(opt => {
                const li = document.createElement('li');
                li.className = 'option-item';
                li.onclick = () => selectOption(opt.key, li);
                li.innerHTML = `<span class="option-letter">${opt.key}</span><span>${opt.text}</span>`;
                optionsList.appendChild(li);
            });
            
            // 设置音频
            const audio = document.getElementById('audio-player');
            audio.src = q.audio_url || '';
            audio.playbackRate = currentSpeed;
            
            // 隐藏原文和解析
            document.getElementById('transcript-section').classList.remove('show');
            document.getElementById('explanation-section').classList.remove('show');
            document.getElementById('transcript-text').textContent = q.transcript || '';
            document.getElementById('explanation-text').textContent = q.explanation || '';
            
            // 重置按钮状态
            document.getElementById('submit-btn').style.display = 'inline-block';
            document.getElementById('next-btn').style.display = 'none';
            
            startTime = Date.now();
        }
        
        // 选择选项
        function selectOption(key, element) {
            document.querySelectorAll('.option-item').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
            selectedAnswer = key;
        }
        
        // 提交答案
        function submitAnswer() {
            if (!selectedAnswer) {
                alert('请先选择答案');
                return;
            }
            
            const q = questions[currentIndex];
            const timeSpent = Math.floor((Date.now() - startTime) / 1000);
            
            fetch('/api/listening/submit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    question_id: q.id,
                    answer: selectedAnswer,
                    time_spent: timeSpent,
                    speed_used: currentSpeed,
                    voice_used: 'default'
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    const isCorrect = data.data.is_correct;
                    const correctAnswer = data.data.correct_answer;
                    
                    // 显示结果
                    document.querySelectorAll('.option-item').forEach(el => {
                        const letter = el.querySelector('.option-letter').textContent;
                        if (letter === correctAnswer) {
                            el.classList.add('correct');
                        } else if (letter === selectedAnswer && !isCorrect) {
                            el.classList.add('wrong');
                        }
                    });
                    
                    if (isCorrect) totalCorrect++;
                    totalTime += timeSpent;
                    
                    // 显示解析
                    document.getElementById('explanation-section').classList.add('show');
                    
                    // 更新按钮
                    document.getElementById('submit-btn').style.display = 'none';
                    document.getElementById('next-btn').style.display = 'inline-block';
                    
                    // 更新统计
                    loadStats();
                }
            });
        }
        
        // 下一题
        function nextQuestion() {
            currentIndex++;
            if (currentIndex < questions.length) {
                showQuestion(currentIndex);
            } else {
                // 训练完成
                stopTimer();
                showResult();
            }
        }
        
        // 显示答案提示
        function showAnswer() {
            const q = questions[currentIndex];
            document.getElementById('transcript-section').classList.add('show');
        }
        
        // 播放音频
        function playAudio() {
            const audio = document.getElementById('audio-player');
            const btn = document.getElementById('play-btn');
            
            if (audio.paused) {
                audio.play();
                btn.textContent = '⏸️';
            } else {
                audio.pause();
                btn.textContent = '▶️';
            }
            
            audio.onended = () => {
                btn.textContent = '▶️';
                document.getElementById('audio-progress').style.width = '0%';
            };
            
            audio.ontimeupdate = () => {
                const progress = (audio.currentTime / audio.duration) * 100;
                document.getElementById('audio-progress').style.width = progress + '%';
            };
        }
        
        // 设置语速
        function setSpeed(speed) {
            currentSpeed = speed;
            document.getElementById('audio-player').playbackRate = speed;
            document.querySelectorAll('.speed-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }
        
        // 显示/隐藏原文
        function toggleTranscript() {
            const section = document.getElementById('transcript-section');
            section.classList.toggle('show');
        }
        
        // 计时器
        function startTimer() {
            let elapsed = 0;
            timerInterval = setInterval(() => {
                elapsed++;
                const mins = Math.floor(elapsed / 60);
                const secs = elapsed % 60;
                document.getElementById('timer').textContent = `⏱️ ${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }, 1000);
        }
        
        function stopTimer() {
            clearInterval(timerInterval);
        }
        
        // 显示结果
        function showResult() {
            const accuracy = (totalCorrect / questions.length * 100).toFixed(1);
            
            document.getElementById('result-icon').textContent = accuracy >= 80 ? '🎉' : accuracy >= 60 ? '👍' : '💪';
            document.getElementById('result-title').textContent = '训练完成！';
            document.getElementById('result-message').innerHTML = `
                <p>正确率: ${accuracy}%</p>
                <p>正确题数: ${totalCorrect}/${questions.length}</p>
                <p>总用时: ${Math.floor(totalTime / 60)}分${totalTime % 60}秒</p>
            `;
            
            document.getElementById('result-modal').classList.add('show');
        }
        
        function closeResult() {
            document.getElementById('result-modal').classList.remove('show');
        }
        
        function closeResultAndRestart() {
            closeResult();
            document.getElementById('no-questions').style.display = 'block';
            document.getElementById('question-area').style.display = 'none';
            stopTimer();
        }
        
        // 页面加载时获取统计
        document.addEventListener('DOMContentLoaded', loadStats);
        
        // 筛选条件改变时自动加载新题目
        document.querySelectorAll('.filter-group select').forEach(select => {
            select.addEventListener('change', () => {
                if (questions.length > 0) {
                    startTraining();
                }
            });
        });
    </script>
</body>
</html>
