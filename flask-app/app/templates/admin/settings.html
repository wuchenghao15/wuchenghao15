{% extends "base.html" %}

{% block title %}系统设置 - 语言学习系统{% endblock %}

{% block content %}
<style>
    /* 系统设置页面样式 */
    .system-settings {
        max-width: 1000px;
        margin: 0 auto;
    }
    
    .settings-header {
        text-align: center;
        margin-bottom: 40px;
        padding: 30px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border-radius: 20px;
        color: white;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }
    
    .settings-title {
        font-size: 2rem;
        font-weight: 700;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 15px;
    }
    
    .settings-description {
        font-size: 1.1rem;
        opacity: 0.9;
    }
    
    .settings-sections {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
        gap: 30px;
    }
    
    .settings-section {
        background: white;
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }
    
    .section-title {
        font-size: 1.5rem;
        font-weight: 600;
        margin-bottom: 20px;
        color: #667eea;
        display: flex;
        align-items: center;
        gap: 10px;
        padding-bottom: 10px;
        border-bottom: 2px solid #e0e0e0;
    }
    
    .form-group {
        margin-bottom: 20px;
    }
    
    .form-label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #333;
    }
    
    .form-input {
        width: 100%;
        padding: 12px 15px;
        border: 2px solid #e0e0e0;
        border-radius: 10px;
        font-size: 1rem;
        transition: all 0.3s ease;
    }
    
    .form-input:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    
    .form-select {
        width: 100%;
        padding: 12px 15px;
        border: 2px solid #e0e0e0;
        border-radius: 10px;
        font-size: 1rem;
        background: white;
        transition: all 0.3s ease;
    }
    
    .form-select:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    
    .form-checkbox {
        display: flex;
        align-items: center;
        gap: 10px;
    }
    
    .form-checkbox input[type="checkbox"] {
        width: 20px;
        height: 20px;
        cursor: pointer;
    }
    
    .save-btn {
        display: block;
        width: 100%;
        padding: 15px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        font-size: 1.1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 30px;
    }
    
    .save-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }
    
    /* 响应式设计 */
    @media (max-width: 768px) {
        .system-settings {
            padding: 0 20px;
        }
        
        .settings-sections {
            grid-template-columns: 1fr;
        }
    }
</style>

<div class="system-settings">
    <!-- 设置头部 -->
    <div class="settings-header">
        <h1 class="settings-title">
            <i class="fas fa-cogs"></i>
            系统设置
        </h1>
        <p class="settings-description">
            配置系统参数、安全设置、邮件设置等，确保系统正常运行。
        </p>
    </div>
    
    <!-- 设置区域 -->
    <div class="settings-sections">
        <!-- 基本设置 -->
        <div class="settings-section">
            <h2 class="section-title">
                <i class="fas fa-info-circle"></i>
                基本设置
            </h2>
            <form>
                <div class="form-group">
                    <label class="form-label">系统名称</label>
                    <input type="text" class="form-input" value="语言学习系统">
                </div>
                <div class="form-group">
                    <label class="form-label">系统版本</label>
                    <input type="text" class="form-input" value="1.0.0">
                </div>
                <div class="form-group">
                    <label class="form-label">系统描述</label>
                    <input type="text" class="form-input" value="提供语言学习和测试服务的系统">
                </div>
                <div class="form-group">
                    <label class="form-label">管理员邮箱</label>
                    <input type="email" class="form-input" value="admin@example.com">
                </div>
            </form>
        </div>
        
        <!-- 安全设置 -->
        <div class="settings-section">
            <h2 class="section-title">
                <i class="fas fa-shield-alt"></i>
                安全设置
            </h2>
            <form>
                <div class="form-group">
                    <label class="form-label">会话超时时间（分钟）</label>
                    <input type="number" class="form-input" value="30">
                </div>
                <div class="form-group">
                    <label class="form-label">密码复杂度要求</label>
                    <select class="form-select">
                        <option value="low">低</option>
                        <option value="medium" selected>中</option>
                        <option value="high">高</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">登录失败锁定次数</label>
                    <input type="number" class="form-input" value="5">
                </div>
                <div class="form-group form-checkbox">
                    <input type="checkbox" id="enable_2fa" checked>
                    <label for="enable_2fa">启用两步验证</label>
                </div>
            </form>
        </div>
        
        <!-- 测试设置 -->
        <div class="settings-section">
            <h2 class="section-title">
                <i class="fas fa-clipboard-check"></i>
                测试设置
            </h2>
            <form>
                <div class="form-group">
                    <label class="form-label">测试时长（分钟）</label>
                    <input type="number" class="form-input" value="15">
                </div>
                <div class="form-group">
                    <label class="form-label">题目数量</label>
                    <input type="number" class="form-input" value="20">
                </div>
                <div class="form-group">
                    <label class="form-label">及格分数</label>
                    <input type="number" class="form-input" value="60">
                </div>
                <div class="form-group form-checkbox">
                    <input type="checkbox" id="enable_test_timer" checked>
                    <label for="enable_test_timer">启用测试计时器</label>
                </div>
            </form>
        </div>
        
        <!-- 邮件设置 -->
        <div class="settings-section">
            <h2 class="section-title">
                <i class="fas fa-envelope"></i>
                邮件设置
            </h2>
            <form>
                <div class="form-group">
                    <label class="form-label">SMTP服务器</label>
                    <input type="text" class="form-input" value="smtp.example.com">
                </div>
                <div class="form-group">
                    <label class="form-label">SMTP端口</label>
                    <input type="number" class="form-input" value="587">
                </div>
                <div class="form-group">
                    <label class="form-label">发件人邮箱</label>
                    <input type="email" class="form-input" value="no-reply@example.com">
                </div>
                <div class="form-group form-checkbox">
                    <input type="checkbox" id="enable_email_notifications" checked>
                    <label for="enable_email_notifications">启用邮件通知</label>
                </div>
            </form>
        </div>
    </div>
    
    <!-- 保存按钮 -->
    <button class="save-btn">
        <i class="fas fa-save"></i>
        保存设置
    </button>
</div>
{% endblock %}
