<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTSCOS - 增强版听力测试</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; padding: 20px; color: #fff; }
        .container { max-width: 1000px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 2.5em; margin-bottom: 10px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .config-panel { background: rgba(255,255,255,0.1); border-radius: 15px; padding: 25px; margin-bottom: 30px; }
        .config-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
        .config-item { background: rgba(255,255,255,0.05); border-radius: 10px; padding: 20px; }
        .config-item h4 { margin-bottom: 15px; color: #667eea; }
        .config-options { display: flex; flex-direction: column; gap: 10px; }
        .config-btn { padding: 12px 20px; border: 2px solid rgba(255,255,255,0.2); border-radius: 8px; background: transparent; color: #fff; cursor: pointer; transition: all 0.3s; }
        .config-btn:hover { border-color: #667eea; background: rgba(102,126,234,0.2); }
        .config-btn.active { border-color: #667eea; background: #667eea; }
        .difficulty-display { text-align: center; margin-top: 20px; padding: 20px; background: rgba(255,255,255,0.05); border-radius: 10px; }
        .difficulty-bar { height: 10px; background: rgba(255,255,255,0.1); border-radius: 5px; margin: 15px 0; }
        .difficulty-fill { height: 100%; border-radius: 5px; transition: width 0.5s, background 0.5s; }
        .difficulty-label { font-size: 1.5em; font-weight: bold; }
        .exam-card { background: rgba(255,255,255,0.1); border-radius: 15px; padding: 25px; margin-bottom: 25px; }
        .question-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid rgba(255,255,255,0.1); }
        .question-number { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .question-title { flex: 1; margin-left: 20px; font-size: 1.3em; }
        .tags { display: flex; gap: 10px; }
        .tag { padding: 5px 12px; border-radius: 20px; font-size: 0.85em; background: rgba(255,255,255,0.1); }
        .audio-controls { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; padding: 20px; background: rgba(255,255,255,0.05); border-radius: 10px; }
        .play-btn { width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; color: white; font-size: 1.5em; cursor: pointer; transition: transform 0.2s; display: flex; align-items: center; justify-content: center; }
        .play-btn:hover { transform: scale(1.1); }
        .speed-control { display: flex; gap: 10px; }
        .speed-btn { padding: 8px 15px; border-radius: 8px; border: 2px solid rgba(255,255,255,0.2); background: transparent; color: #fff; cursor: pointer; }
        .speed-btn.active { background: #667eea; border-color: #667eea; }
        .options-list { list-style: none; }
        .option-item { padding: 15px 20px; border: 2px solid rgba(255,255,255,0.1); border-radius: 10px; margin-bottom: 12px; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; }
        .option-item:hover { border-color: #667eea; background: rgba(102,126,234,0.1); }
        .option-item.selected { border-color: #667eea; background: rgba(102,126,234,0.2); }
        .option-letter { width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; font-weight: bold; margin-right: 15px; }
        .option-item.selected .option-letter { background: #667eea; }
        .submit-btn { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; padding: 15px 40px; font-size: 1.1em; border-radius: 10px; cursor: pointer; display: block; margin: 30px auto; }
        .timer { background: rgba(255,255,255,0.1); padding: 15px 30px; border-radius: 10px; text-align: center; font-size: 1.5em; font-weight: bold; }
        .stats-bar { display: flex; justify-content: space-between; margin-bottom: 20px; padding: 15px; background: rgba(255,255,255,0.05); border-radius: 10px; }
        .stat-item { text-align: center; }
        .stat-value { font-size: 1.5em; font-weight: bold; color: #667eea; }
        .stat-label { font-size: 0.85em; color: #aaa; }
        .question-nav { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
        .nav-item { width: 40px; height: 40px; border-radius: 8px; border: 2px solid rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .nav-item.active { background: #667eea; border-color: #667eea; }
        .nav-item.answered { background: rgba(76,175,80,0.3); border-color: #4caf50; }
        .progress-bar { height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; margin-bottom: 20px; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #667eea, #764ba2); border-radius: 4px; }
        .result-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(26,26,46,0.95); border-radius: 20px; padding: 40px; text-align: center; z-index: 1000; min-width: 400px; }
        .result-modal.show { display: block; }
        .result-score { font-size: 4em; font-weight: bold; margin-bottom: 20px; }
        .result-details { margin-bottom: 30px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎧 MTSCOS 增强版听力测试</h1>
            <p>语速 · 音色 · 主题 · 智能难度评估</p>
        </div>

        <div class="config-panel">
            <div class="config-grid">
                <div class="config-item">
                    <h4>🎚️ 语速选择</h4>
                    <div class="config-options">
                        <button class="config-btn" onclick="setSpeed(0.7)">🐢 慢速 (0.7x)</button>
                        <button class="config-btn active" onclick="setSpeed(1.0)">⚡ 正常 (1.0x)</button>
                        <button class="config-btn" onclick="setSpeed(1.5)">🚀 快速 (1.5x)</button>
                    </div>
                </div>
                <div class="config-item">
                    <h4>🎤 音色选择</h4>
                    <div class="config-options">
                        <button class="config-btn active" onclick="setVoice('aria')">Aria (英文女)</button>
                        <button class="config-btn" onclick="setVoice('guy')">Guy (英文男)</button>
                        <button class="config-btn" onclick="setVoice('nanami')">Nanami (日文女)</button>
                        <button class="config-btn" onclick="setVoice('xiaoxiao')">晓晓 (中文女)</button>
                    </div>
                </div>
                <div class="config-item">
                    <h4>📚 主题选择</h4>
                    <div class="config-options">
                        <button class="config-btn active" onclick="setTopic('daily')">日常对话</button>
                        <button class="config-btn" onclick="setTopic('business')">商务英语</button>
                        <button class="config-btn" onclick="setTopic('campus')">校园场景</button>
                        <button class="config-btn" onclick="setTopic('news')">新闻广播</button>
                    </div>
                </div>
                <div class="config-item">
                    <h4>📊 预估难度</h4>
                    <div class="difficulty-display">
                        <div class="difficulty-bar">
                            <div class="difficulty-fill" id="difficulty-fill" style="width: 30%; background: #4caf50;"></div>
                        </div>
                        <div class="difficulty-label" id="difficulty-label">🟢 初级</div>
                        <div class="difficulty-score" id="difficulty-score">难度分数: 30</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="stats-bar">
            <div class="stat-item"><div class="stat-value" id="total-questions">10</div><div class="stat-label">总题数</div></div>
            <div class="stat-item"><div class="stat-value" id="answered-count">0</div><div class="stat-label">已答题</div></div>
            <div class="timer" id="timer">05:00</div>
            <div class="stat-item"><div class="stat-value" id="current-speed">1.0x</div><div class="stat-label">当前语速</div></div>
            <div class="stat-item"><div class="stat-value" id="current-voice">Aria</div><div class="stat-label">当前音色</div></div>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progress" style="width: 0%;"></div>
        </div>

        <div class="question-nav" id="question-nav"></div>

        <div id="questions-container"></div>

        <button class="submit-btn" onclick="submitExam()">📝 提交试卷</button>
    </div>

    <div class="result-modal" id="result-modal">
        <h2>考试结果</h2>
        <div class="result-score" id="result-score">0</div>
        <div class="result-details">
            <p>正确: <span id="correct-count">0</span> / <span id="total-count">10</span></p>
            <p>用时: <span id="time-used">00:00</span></p>
            <p>难度: <span id="final-difficulty">初级</span></p>
        </div>
        <button class="submit-btn" onclick="closeResult()">关闭</button>
    </div>

    <script>
        // 配置变量
        var currentSpeed = 1.0;
        var currentVoice = 'aria';
        var currentTopic = 'daily';
        var currentIndex = 0;
        var selectedAnswers = {};
        var timeRemaining = 300;
        var timerInterval;
        var audioPlayers = {};

        // 题目数据
        var questions = [
            {id: 'q1', title: '英语听力 - 日常对话', content: 'M: Good morning! How can I help you today? W: I would like to book a flight to New York.', options: ['The man is booking a flight.', 'The woman wants to go to New York.', 'They are at the airport.', 'It is afternoon now.'], correct: 1, language: '英文', difficulty: '中等', audio: '/audio/audio_q1_content.mp3'},
            {id: 'q2', title: '日本語リスニング - 自己紹介', content: '私は鈴木です。大阪出身です。大学生です。', options: ['鈴木さんは東京出身です。', '鈴木さんは大学生です。', '鈴木さんは仕事をしています。', '鈴木さんは絵を描くのが好きです。'], correct: 1, language: '日文', difficulty: '简单', audio: '/audio/audio_q2_content.mp3'},
            {id: 'q3', title: '英语听力 - 天气预报', content: 'Good evening. Tomorrow will be sunny with a high of 28 degrees Celsius.', options: ['Tomorrow will be rainy.', 'The high temperature is 28C.', 'Winds will be from the west.', 'It is morning now.'], correct: 1, language: '英文', difficulty: '中等', audio: '/audio/audio_q3_content.mp3'},
            {id: 'q4', title: '日本語リスニング - 天気予報', content: '明日は晴れです。最高気温は二十五度です。', options: ['明日は雨です。', '最高気温は30度です。', '最低気温は15度です。', '風が強いです。'], correct: 2, language: '日文', difficulty: '中等', audio: '/audio/audio_q4_content.mp3'},
            {id: 'q5', title: '英语听力 - 电话对话', content: 'W: Hello, this is the restaurant. M: Yes, I would like to book a table for two.', options: ['They are in a restaurant.', 'The man is booking a table.', 'The woman is a waiter.', 'The man wants pizza.'], correct: 1, language: '英文', difficulty: '困难', audio: '/audio/audio_q5_content.mp3'},
            {id: 'q6', title: '日本語リスニング - 時間', content: '今は午後三時です。会議は午後四時からです。', options: ['今は午後四時です。', '会議は三時からです。', 'まだ一時間あります。', '会議はもう終わりました。'], correct: 2, language: '日文', difficulty: '简单', audio: '/audio/audio_q6_content.mp3'},
            {id: 'q7', title: '英语听力 - 新闻广播', content: 'Scientists have discovered a new species of bird in the Amazon rainforest.', options: ['The bird is black.', 'It was found in Africa.', 'The bird has blue feathers.', 'Scientists found a new mammal.'], correct: 2, language: '英文', difficulty: '简单', audio: '/audio/audio_q7_content.mp3'},
            {id: 'q8', title: '日本語リスニング - 旅行', content: '来週、東京に旅行に行きます。友達と一緒です。', options: ['東京に一人で行きます。', 'バスで行きます。', '友達と一緒に行きます。', '今週旅行に行きます。'], correct: 2, language: '日文', difficulty: '困难', audio: '/audio/audio_q8_content.mp3'},
            {id: 'q9', title: '英语听力 - 校园对话', content: 'M: Excuse me, where is the library? W: It is on the second floor, next to the computer lab.', options: ['The library is on the first floor.', 'The library is next to the lab.', 'There is no elevator.', 'They are in a mall.'], correct: 1, language: '英文', difficulty: '中等', audio: '/audio/audio_q9_content.mp3'},
            {id: 'q10', title: '英语听力 - 日常对话', content: 'M: Hello, this is John speaking. W: I am sorry, she is not in right now.', options: ['John is calling Sarah.', 'Sarah is calling John.', 'John is leaving a message.', 'Sarah is not available.'], correct: 3, language: '英文', difficulty: '困难', audio: '/audio/audio_q10_content.mp3'}
        ];

        // 设置语速
        function setSpeed(speed) {
            currentSpeed = speed;
            document.querySelectorAll('.config-item:nth-child(1) .config-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('current-speed').textContent = speed + 'x';
            updateDifficulty();
            updateAudioSpeed();
        }

        // 设置音色
        function setVoice(voice) {
            currentVoice = voice;
            document.querySelectorAll('.config-item:nth-child(2) .config-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            var voiceNames = {'aria': 'Aria', 'guy': 'Guy', 'nanami': 'Nanami', 'xiaoxiao': '晓晓'};
            document.getElementById('current-voice').textContent = voiceNames[voice];
            updateDifficulty();
        }

        // 设置主题
        function setTopic(topic) {
            currentTopic = topic;
            document.querySelectorAll('.config-item:nth-child(3) .config-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            updateDifficulty();
        }

        // 更新难度显示
        function updateDifficulty() {
            var speedScore = (currentSpeed - 0.7) * 20;
            var topicScores = {'daily': 10, 'campus': 20, 'business': 30, 'news': 40};
            var topicScore = topicScores[currentTopic] || 10;
            var voiceScore = currentVoice === 'aria' ? 0 : (currentVoice === 'nanami' ? 10 : 5);
            var totalScore = Math.round(speedScore + topicScore + voiceScore);

            var difficultyFill = document.getElementById('difficulty-fill');
            var difficultyLabel = document.getElementById('difficulty-label');
            var difficultyScore = document.getElementById('difficulty-score');

            difficultyFill.style.width = totalScore + '%';
            difficultyScore.textContent = '难度分数: ' + totalScore;

            if (totalScore <= 30) {
                difficultyFill.style.background = '#4caf50';
                difficultyLabel.textContent = '🟢 初级';
            } else if (totalScore <= 60) {
                difficultyFill.style.background = '#ff9800';
                difficultyLabel.textContent = '🟡 中级';
            } else if (totalScore <= 80) {
                difficultyFill.style.background = '#f44336';
                difficultyLabel.textContent = '🔴 高级';
            } else {
                difficultyFill.style.background = '#9c27b0';
                difficultyLabel.textContent = '🟣 专家级';
            }
        }

        // 更新音频速度
        function updateAudioSpeed() {
            for (var key in audioPlayers) {
                if (audioPlayers[key]) {
                    audioPlayers[key].playbackRate = currentSpeed;
                }
            }
        }

        // 播放音频
        function playAudio(audioPath) {
            if (audioPlayers[audioPath]) {
                audioPlayers[audioPath].pause();
                audioPlayers[audioPath].currentTime = 0;
            }
            var audio = new Audio(audioPath);
            audio.playbackRate = currentSpeed;
            audioPlayers[audioPath] = audio;
            audio.play();
        }

        // 渲染题目
        function renderQuestion() {
            var q = questions[currentIndex];
            var html = `
                <div class="exam-card">
                    <div class="question-header">
                        <div class="question-number">${currentIndex + 1}</div>
                        <div class="question-title">${q.title}</div>
                        <div class="tags">
                            <span class="tag">${q.language}</span>
                            <span class="tag">${q.difficulty}</span>
                        </div>
                    </div>
                    <div class="audio-controls">
                        <button class="play-btn" onclick="playAudio('${q.audio}')">▶</button>
                        <div class="speed-control">
                            <span>语速: ${currentSpeed}x</span>
                        </div>
                    </div>
                    <div style="background: rgba(255,255,255,0.05); padding: 15px; border-radius: 8px; font-style: italic; margin-bottom: 20px;">${q.content}</div>
                    <ul class="options-list">
            `;
            q.options.forEach((opt, idx) => {
                var letter = String.fromCharCode(65 + idx);
                var isSelected = selectedAnswers[q.id] === idx;
                html += `<li class="option-item ${isSelected ? 'selected' : ''}" onclick="selectAnswer('${q.id}', ${idx})">
                    <span class="option-letter">${letter}</span>
                    <span>${opt}</span>
                </li>`;
            });
            html += `</ul></div>`;
            document.getElementById('questions-container').innerHTML = html;
        }

        // 渲染导航
        function renderNav() {
            var html = '';
            questions.forEach((q, idx) => {
                var isActive = idx === currentIndex;
                var isAnswered = selectedAnswers[q.id] !== undefined;
                html += `<div class="nav-item ${isActive ? 'active' : ''} ${isAnswered ? 'answered' : ''}" onclick="goToQuestion(${idx})">${idx + 1}</div>`;
            });
            document.getElementById('question-nav').innerHTML = html;
        }

        // 选择答案
        function selectAnswer(questionId, optionIndex) {
            selectedAnswers[questionId] = optionIndex;
            renderQuestion();
            renderNav();
            updateProgress();
        }

        // 跳转题目
        function goToQuestion(index) {
            currentIndex = index;
            renderQuestion();
            renderNav();
        }

        // 更新进度
        function updateProgress() {
            var answered = Object.keys(selectedAnswers).length;
            document.getElementById('answered-count').textContent = answered;
            document.getElementById('progress').style.width = (answered / questions.length * 100) + '%';
        }

        // 提交考试
        function submitExam() {
            clearInterval(timerInterval);
            var correctCount = 0;
            questions.forEach(q => {
                if (selectedAnswers[q.id] === q.correct) correctCount++;
            });
            var score = Math.round((correctCount / questions.length) * 100);
            
            document.getElementById('result-score').textContent = score + '分';
            document.getElementById('correct-count').textContent = correctCount;
            document.getElementById('total-count').textContent = questions.length;
            document.getElementById('time-used').textContent = formatTime(300 - timeRemaining);
            document.getElementById('final-difficulty').textContent = document.getElementById('difficulty-label').textContent;
            document.getElementById('result-modal').classList.add('show');
            
            // 发送结果到服务器
            fetch('/api/exam/submit', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    answers: selectedAnswers,
                    score: score,
                    correct: correctCount,
                    total: questions.length,
                    speed: currentSpeed,
                    voice: currentVoice,
                    topic: currentTopic,
                    difficulty: document.getElementById('difficulty-label').textContent
                })
            }).catch(err => console.log('提交结果:', err));
        }

        // 格式化时间
        function formatTime(seconds) {
            var mins = Math.floor(seconds / 60);
            var secs = seconds % 60;
            return mins.toString().padStart(2, '0') + ':' + secs.toString().padStart(2, '0');
        }

        // 关闭结果
        function closeResult() {
            document.getElementById('result-modal').classList.remove('show');
        }

        // 启动计时器
        function startTimer() {
            timerInterval = setInterval(() => {
                timeRemaining--;
                document.getElementById('timer').textContent = formatTime(timeRemaining);
                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    submitExam();
                }
            }, 1000);
        }

        // 初始化
        function init() {
            renderQuestion();
            renderNav();
            updateDifficulty();
            startTimer();
        }

        init();
    </script>
</body>
</html>
