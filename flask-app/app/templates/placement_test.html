<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>摸底测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        .icon {
            font-size: 80px;
            margin-bottom: 20px;
        }
        .title {
            color: #333;
            font-size: 28px;
            margin-bottom: 15px;
        }
        .subtitle {
            color: #666;
            font-size: 16px;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .level-badge {
            display: inline-block;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            padding: 8px 20px;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .btn {
            display: inline-block;
            padding: 15px 40px;
            border: none;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            margin: 10px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        .info-box {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 15px 20px;
            margin: 20px 0;
            border-radius: 0 10px 10px 0;
            text-align: left;
        }
        .info-box h4 {
            color: #333;
            margin-bottom: 10px;
        }
        .info-box ul {
            list-style: none;
            color: #666;
        }
        .info-box li {
            padding: 5px 0;
            padding-left: 20px;
            position: relative;
        }
        .info-box li::before {
            content: '✓';
            position: absolute;
            left: 0;
            color: #667eea;
        }
        .completed-section {
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        {% if has_completed %}
            <div class="completed-section">
                <div class="icon">🎉</div>
                <h1 class="title">摸底测试已完成！</h1>
                <div class="level-badge">当前水平: {{ current_level }}</div>
                <p class="subtitle">
                    您已经完成了摸底测试，系统已根据您的表现评估了您的知识水平。<br>
                    现在您可以进入考试中心，根据您的水平选择合适的考试。
                </p>
                <a href="/exam/exam_center" class="btn btn-primary">进入考试中心</a>
                <button class="btn btn-secondary" onclick="createNewTest()">重新测试</button>
            </div>
        {% else %}
            <div class="icon">📝</div>
            <h1 class="title">欢迎参加摸底测试</h1>
            <p class="subtitle">
                为了更好地为您推荐合适的考试，我们需要先了解您的知识水平。<br>
                请完成以下摸底测试，系统将根据您的表现评估您的水平。
            </p>
            
            <div class="info-box">
                <h4>测试说明</h4>
                <ul>
                    <li>测试包含30道综合题目</li>
                    <li>预计用时约30分钟</li>
                    <li>涵盖数学、物理、英语等多个学科</li>
                    <li>系统将根据结果评估您的水平</li>
                </ul>
            </div>
            
            <button class="btn btn-primary" onclick="startPlacementTest()">开始测试</button>
        {% endif %}
    </div>

    <script>
        function startPlacementTest() {
            // 创建摸底测试
            fetch('/api/placement/test', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ subject: null })
            })
            .then(response => response.json())
            .then(data => {
                if (data.test_id) {
                    // 开始测试
                    fetch(`/api/placement/test/${data.test_id}/start`, {
                        method: 'POST'
                    })
                    .then(() => {
                        // 重定向到测试页面
                        window.location.href = `/exam/placement_test/take/${data.test_id}`;
                    });
                }
            })
            .catch(error => {
                console.error('创建测试失败:', error);
                alert('创建测试失败，请重试');
            });
        }

        function createNewTest() {
            if (confirm('确定要重新进行摸底测试吗？这将生成新的评估报告。')) {
                startPlacementTest();
            }
        }
    </script>
</body>
</html>
