<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shieldInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0E7FF;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#3B82F6" flood-opacity="0.4"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <g filter="url(#shadow)">
    <path d="M100 10 L170 35 L170 95 C170 145 135 180 100 195 C65 180 30 145 30 95 L30 35 Z" 
          fill="url(#shieldBg)" 
          stroke="rgba(255,255,255,0.3)" 
          stroke-width="2"/>
    
    <path d="M100 20 L160 42 L160 95 C160 138 130 168 100 182 C70 168 40 138 40 95 L40 42 Z" 
          fill="none" 
          stroke="rgba(255,255,255,0.2)" 
          stroke-width="1.5"/>
    
    <path d="M100 30 L150 50 L150 95 C150 132 125 158 100 170 C75 158 50 132 50 95 L50 50 Z" 
          fill="none" 
          stroke="rgba(255,255,255,0.15)" 
          stroke-width="1"/>
    
    <path d="M75 75 L100 60 L125 75 L125 120 L100 140 L75 120 Z" 
          fill="url(#shieldInner)" 
          opacity="0.95"
          filter="url(#glow)"/>
    
    <path d="M85 90 L100 80 L115 90 L115 115 L100 130 L85 115 Z" 
          fill="#3B82F6" 
          opacity="0.8"/>
    
    <circle cx="100" cy="105" r="12" fill="#FFFFFF" opacity="0.9"/>
    <path d="M100 93 L106 105 L100 117 L94 105 Z" fill="#3B82F6" opacity="0.7"/>
  </g>
</svg>
