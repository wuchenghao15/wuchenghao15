version: '3.8'

services:
  web:
    build: .
    image: mtscos-ai-web
    container_name: mtscos-ai-web
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - FLASK_ENV=production
      - FLASK_APP=app.py
    volumes:
      - ./logs:/app/logs
      - ./mtscos.db:/app/mtscos.db
    networks:
      - mtscos-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  mtscos-network:
    driver: bridge
    name: mtscos-network
