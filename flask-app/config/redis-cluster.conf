# Redis集群配置文件

# 集群节点配置

# 主节点1
port 7000
bind 127.0.0.1
cluster-enabled yes
cluster-config-file nodes-7000.conf
cluster-node-timeout 5000
appendonly yes
pidfile /var/run/redis-7000.pid
dir /tmp/redis-7000

