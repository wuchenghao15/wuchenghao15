<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>摸底测试提示</title>
    <style>
        /* 预载入动画 */
        .preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        
        .preloader.hidden {
            opacity: 0;
            visibility: hidden;
        }
        
        .preloader-content {
            text-align: center;
            color: white;
        }
        
        .preloader-spinner {
            width: 80px;
            height: 80px;
            border: 8px solid rgba(255, 255, 255, 0.3);
            border-top: 8px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        .preloader-text {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
        }
        
        .preloader-subtext {
            font-size: 14px;
            opacity: 0.8;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* 基础样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* 头部样式 */
        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 {
            color: #343a40;
            font-size: 24px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .back-btn {
            background: #f8f9fa;
            color: #343a40;
            border: 2px solid #dee2e6;
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .back-btn:hover {
            background: #e9ecef;
            border-color: #adb5bd;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 16px;
        }
        
        .username {
            font-weight: 600;
            color: #495057;
        }
        
        .logout-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .logout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        /* 主要内容样式 */
        .container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }
        
        .prompt-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 50px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            max-width: 700px;
            width: 100%;
            text-align: center;
        }
        
        .prompt-icon {
            font-size: 80px;
            margin-bottom: 30px;
        }
        
        .prompt-title {
            color: #343a40;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 20px;
        }
        
        .prompt-description {
            color: #6c757d;
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 40px;
        }
        
        .prompt-features {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .feature-item {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 12px;
            padding: 20px;
            flex: 1;
            min-width: 200px;
            text-align: left;
        }
        
        .feature-icon {
            font-size: 24px;
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .feature-title {
            font-weight: 600;
            color: #343a40;
            margin-bottom: 5px;
        }
        
        .feature-description {
            font-size: 14px;
            color: #6c757d;
        }
        
        .prompt-actions {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        
        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            flex: 1;
            max-width: 200px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }
        
        /* 页脚样式 */
        .footer {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px;
            text-align: center;
            color: #6c757d;
            font-size: 14px;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .header {
                padding: 15px 20px;
                flex-direction: column;
                gap: 15px;
            }
            
            .header-left {
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }
            
            .header h1 {
                font-size: 20px;
            }
            
            .user-info {
                flex-direction: column;
                gap: 10px;
            }
            
            .container {
                padding: 20px;
            }
            
            .prompt-container {
                padding: 30px 20px;
            }
            
            .prompt-title {
                font-size: 24px;
            }
            
            .prompt-description {
                font-size: 16px;
            }
            
            .feature-item {
                min-width: 100%;
            }
            
            .prompt-actions {
                flex-direction: column;
                align-items: stretch;
            }
            
            .btn {
                max-width: none;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
</head>
<body>
    <!-- 预载入动画 -->
    <div class="preloader" id="preloader">
        <div class="preloader-content">
            <div class="preloader-spinner"></div>
            <div class="preloader-text">系统加载中</div>
            <div class="preloader-subtext">正在准备测试系统，请稍候...</div>
        </div>
    </div>
    
    <!-- 头部 -->
    <header class="header">
        <div class="header-left">
            <a href="/test-system" class="back-btn">
                <i class="fas fa-arrow-left"></i> 返回测试系统
            </a>
            <h1>
                <span>🎓</span>
                摸底测试提示
            </h1>
        </div>
        <div class="user-info">
            <span class="username">欢迎, {{ user.username }}！</span>
            <a href="/auth/logout" class="logout-btn">退出登录</a>
        </div>
    </header>
    
    <!-- 主要内容 -->
    <main class="container">
        <div class="prompt-container">
            <div class="prompt-icon">📋</div>
            <h2 class="prompt-title">准备开始摸底测试</h2>
            <p class="prompt-description">
                摸底测试将帮助我们了解您的语言水平，为您提供更加个性化的学习建议。测试过程中，请认真作答，以确保评估结果的准确性。
            </p>
            
            <div class="prompt-features">
                <div class="feature-item">
                    <div class="feature-icon"><i class="fas fa-clock"></i></div>
                    <div class="feature-title">测试时间</div>
                    <div class="feature-description">约30分钟，包含20道题目</div>
                </div>
                <div class="feature-item">
                    <div class="feature-icon"><i class="fas fa-graduation-cap"></i></div>
                    <div class="feature-title">测试内容</div>
                    <div class="feature-description">涵盖词汇、语法、阅读等多个方面</div>
                </div>
                <div class="feature-item">
                    <div class="feature-icon"><i class="fas fa-chart-line"></i></div>
                    <div class="feature-title">测试结果</div>
                    <div class="feature-description">测试完成后将获得详细的水平评估</div>
                </div>
            </div>
            
            <div class="prompt-actions">
                <button class="btn btn-secondary" onclick="window.location.href='/test-system'">
                    <i class="fas fa-times"></i> 取消
                </button>
                <button class="btn btn-primary" onclick="startTest()">
                    <i class="fas fa-play"></i> 开始测试
                </button>
            </div>
        </div>
    </main>
    
    <!-- 页脚 -->
    <footer class="footer">
        <p>&copy; 2026 统一语言测试系统. 保留所有权利.</p>
    </footer>
    
    <script>
        // 检查是否已经显示过预载入动画
        function checkPreloaderShown() {
            return sessionStorage.getItem('preloaderShown') === 'true';
        }
        
        // 标记预载入动画已显示
        function markPreloaderShown() {
            sessionStorage.setItem('preloaderShown', 'true');
        }
        
        // 显示预载入动画
        function showPreloader() {
            const preloader = document.getElementById('preloader');
            if (preloader) {
                preloader.classList.remove('hidden');
            }
        }
        
        // 隐藏预载入动画
        function hidePreloader() {
            const preloader = document.getElementById('preloader');
            if (preloader) {
                preloader.classList.add('hidden');
                // 动画结束后完全移除元素
                setTimeout(() => {
                    if (preloader.parentNode) {
                        preloader.parentNode.removeChild(preloader);
                    }
                }, 500);
            }
        }
        
        // 页面加载完成后处理
        window.addEventListener('load', function() {
            // 检查是否已经显示过预载入动画
            if (!checkPreloaderShown()) {
                // 标记动画已显示
                markPreloaderShown();
                
                // 显示动画一段时间后隐藏
                setTimeout(hidePreloader, 2000); // 2秒后隐藏
            } else {
                // 如果已经显示过，直接隐藏
                hidePreloader();
            }
        });
        
        // 开始测试
        function startTest() {
            // 使用后端传递的语言参数
            const language = '{{ language }}';
            if (language === 'japanese') {
                window.location.href = '/test-system/japanese/test';
            } else if (language === 'english') {
                window.location.href = '/test-system/english/test';
            } else {
                window.location.href = '/test-system';
            }
        }
    </script>
</body>
</html>
