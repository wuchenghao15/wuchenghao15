{% extends "base.html" %}

{% block title %}个人设置 - MTSCOS AI{% endblock %}

{% block head %}
<style>
    .settings-wrap {
        max-width: 720px;
        margin: 30px auto;
        padding: 0 16px;
    }
    .settings-header {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 24px;
    }
    .settings-header h1 {
        font-size: 24px;
        color: var(--text-primary);
        margin: 0;
    }
    .settings-card {
        background: var(--bg-primary);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-lg);
        margin-bottom: 20px;
        overflow: hidden;
        box-shadow: var(--shadow-sm);
    }
    .card-head {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 18px 24px;
        border-bottom: 1px solid var(--border-color);
    }
    .card-icon {
        width: 40px;
        height: 40px;
        border-radius: var(--radius-md);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
    }
    .icon-blue { background: rgba(99,102,241,0.12); color: var(--primary-color); }
    .icon-green { background: rgba(34,197,94,0.12); color: var(--success-color); }
    .icon-orange { background: rgba(249,115,22,0.12); color: var(--warning-color); }
    .icon-purple { background: rgba(168,85,247,0.12); color: var(--secondary-color); }
    .card-head h2 {
        font-size: 16px;
        font-weight: 700;
        color: var(--text-primary);
        margin: 0;
    }
    .card-body {
        padding: 20px 24px;
    }
    .form-group {
        margin-bottom: 18px;
    }
    .form-group:last-child {
        margin-bottom: 0;
    }
    .form-group label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: var(--text-secondary);
        margin-bottom: 6px;
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
        width: 100%;
        padding: 10px 14px;
        border: 1.5px solid var(--border-color);
        border-radius: var(--radius-sm);
        font-size: 14px;
        color: var(--text-primary);
        background: var(--bg-primary);
        transition: border-color 0.2s;
        box-sizing: border-box;
        font-family: inherit;
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
        outline: none;
        border-color: var(--primary-color);
    }
    .form-group input[readonly] {
        background: var(--bg-secondary);
        color: var(--text-secondary);
        cursor: not-allowed;
    }
    .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
    }
    @media (max-width: 520px) {
        .form-row { grid-template-columns: 1fr; }
    }
    .btn-group {
        display: flex;
        gap: 12px;
        justify-content: flex-end;
        margin-top: 8px;
    }
    .btn {
        padding: 10px 24px;
        border: none;
        border-radius: var(--radius-sm);
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
    }
    .btn-primary {
        background: var(--primary-color);
        color: #fff;
    }
    .btn-primary:hover {
        background: var(--primary-dark);
    }
    .btn-secondary {
        background: var(--bg-secondary);
        color: var(--text-primary);
        border: 1px solid var(--border-color);
    }
    .btn-secondary:hover {
        background: var(--border-color);
    }
    .toast {
        position: fixed;
        top: 20px;
        right: 20px;
        padding: 12px 24px;
        border-radius: var(--radius-md);
        color: #fff;
        font-size: 14px;
        z-index: 9999;
        transform: translateX(120%);
        transition: transform 0.3s;
        box-shadow: var(--shadow-lg);
    }
    .toast.show {
        transform: translateX(0);
    }
    .toast.success { background: var(--success-color); }
    .toast.error { background: var(--danger-color); }
    .field-desc {
        font-size: 12px;
        color: var(--text-secondary);
        margin-top: 4px;
    }
</style>
{% endblock %}

{% block content %}
<div class="settings-wrap">
    <div class="settings-header">
        <a href="/" class="back-btn" style="color: var(--text-secondary); text-decoration: none; font-size: 20px;">
            <i class="fas fa-arrow-left"></i>
        </a>
        <h1><i class="fas fa-gear"></i> 个人设置</h1>
    </div>

    <div class="settings-card">
        <div class="card-head">
            <div class="card-icon icon-blue"><i class="fas fa-user"></i></div>
            <h2>个人信息</h2>
        </div>
        <div class="card-body">
            <div class="form-row">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="username" value="{{ user.username }}" readonly>
                </div>
                <div class="form-group">
                    <label>角色</label>
                    <input type="text" id="role" value="{{ user.role }}" readonly>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>邮箱</label>
                    <input type="email" id="email" value="{{ user.email or '' }}" placeholder="请输入邮箱">
                </div>
                <div class="form-group">
                    <label>手机号</label>
                    <input type="text" id="phone" value="{{ user.phone or '' }}" placeholder="请输入手机号">
                </div>
            </div>
            {% if user.role == 'student' or user.role == 'student_vip' %}
            <div class="form-row">
                <div class="form-group">
                    <label>年级</label>
                    <input type="text" id="grade" value="{{ user.grade or '' }}" placeholder="请输入年级">
                </div>
                <div class="form-group">
                    <label>教育阶段</label>
                    <select id="education_level">
                        <option value="general" {% if user.education_level == 'general' %}selected{% endif %}>九年制义务教育</option>
                        <option value="adult" {% if user.education_level == 'adult' %}selected{% endif %}>成人教育</option>
                        <option value="vocational" {% if user.education_level == 'vocational' %}selected{% endif %}>职业教育</option>
                        <option value="higher" {% if user.education_level == 'higher' %}selected{% endif %}>高等教育</option>
                    </select>
                </div>
            </div>
            {% endif %}
            <div class="btn-group">
                <button class="btn btn-primary" onclick="saveProfile()">保存信息</button>
            </div>
        </div>
    </div>

    <div class="settings-card">
        <div class="card-head">
            <div class="card-icon icon-green"><i class="fas fa-lock"></i></div>
            <h2>安全设置</h2>
        </div>
        <div class="card-body">
            <div class="form-group">
                <label>当前密码</label>
                <input type="password" id="old_password" placeholder="请输入当前密码">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>新密码</label>
                    <input type="password" id="new_password" placeholder="至少6位字符">
                    <div class="field-desc">密码长度至少6位，建议包含字母和数字</div>
                </div>
                <div class="form-group">
                    <label>确认新密码</label>
                    <input type="password" id="confirm_password" placeholder="再次输入新密码">
                </div>
            </div>
            <div class="btn-group">
                <button class="btn btn-secondary" onclick="clearPasswordFields()">清空</button>
                <button class="btn btn-primary" onclick="changePassword()">修改密码</button>
            </div>
        </div>
    </div>

    <div class="settings-card">
        <div class="card-head">
            <div class="card-icon icon-orange"><i class="fas fa-sliders"></i></div>
            <h2>偏好设置</h2>
        </div>
        <div class="card-body">
            <div class="form-row">
                <div class="form-group">
                    <label>界面语言</label>
                    <select id="preference_language">
                        <option value="zh-CN" {% if default_language == 'zh-CN' %}selected{% endif %}>简体中文</option>
                        <option value="en" {% if default_language == 'en' %}selected{% endif %}>English</option>
                        <option value="ja" {% if default_language == 'ja' %}selected{% endif %}>日本語</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>通知偏好</label>
                    <select id="notification_pref">
                        <option value="all">接收所有通知</option>
                        <option value="important">仅接收重要通知</option>
                        <option value="none">不接收通知</option>
                    </select>
                </div>
            </div>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="savePreferences()">保存偏好</button>
            </div>
        </div>
    </div>

    <div class="settings-card">
        <div class="card-head">
            <div class="card-icon icon-purple"><i class="fas fa-info-circle"></i></div>
            <h2>账户信息</h2>
        </div>
        <div class="card-body">
            <div class="form-row">
                <div class="form-group">
                    <label>注册时间</label>
                    <input type="text" value="{{ user.created_at or '-' }}" readonly>
                </div>
                <div class="form-group">
                    <label>最后登录</label>
                    <input type="text" value="{{ user.last_login or '-' }}" readonly>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>账户状态</label>
                    <input type="text" value="{{ '正常' if user.is_active else '已禁用' }}" readonly>
                </div>
                <div class="form-group">
                    <label>学习积分</label>
                    <input type="text" value="{{ user.score or 0 }}" readonly>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
function showToast(message, type) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.className = 'toast ' + (type || 'success');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
}

async function saveProfile() {
    const data = {
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value
    };
    const gradeEl = document.getElementById('grade');
    if (gradeEl) {
        data.grade = gradeEl.value;
        data.education_level = document.getElementById('education_level').value;
    }

    try {
        const res = await fetch('/api/user/profile', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        const result = await res.json();
        if (result.success) {
            showToast('个人信息保存成功', 'success');
        } else {
            showToast(result.message || '保存失败', 'error');
        }
    } catch (e) {
        showToast('网络错误，请重试', 'error');
    }
}

async function changePassword() {
    const oldPwd = document.getElementById('old_password').value;
    const newPwd = document.getElementById('new_password').value;
    const confirmPwd = document.getElementById('confirm_password').value;

    if (!oldPwd || !newPwd) {
        showToast('请填写原密码和新密码', 'error');
        return;
    }
    if (newPwd !== confirmPwd) {
        showToast('两次输入的新密码不一致', 'error');
        return;
    }
    if (newPwd.length < 6) {
        showToast('新密码长度不能少于6位', 'error');
        return;
    }

    try {
        const res = await fetch('/api/user/change_password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                old_password: oldPwd,
                new_password: newPwd,
                confirm_password: confirmPwd
            })
        });
        const result = await res.json();
        if (result.success) {
            showToast('密码修改成功', 'success');
            clearPasswordFields();
        } else {
            showToast(result.message || '修改失败', 'error');
        }
    } catch (e) {
        showToast('网络错误，请重试', 'error');
    }
}

function clearPasswordFields() {
    document.getElementById('old_password').value = '';
    document.getElementById('new_password').value = '';
    document.getElementById('confirm_password').value = '';
}

function savePreferences() {
    showToast('偏好设置已保存', 'success');
}
</script>
{% endblock %}
