<!DOCTYPE html>
<html lang="zh-CN" data-theme="andromeda">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="MTSCOS AI System · 仙女座星系主题">
    <meta name="keywords" content="AI, education, exam system, andromeda, design system">
    <title>{{ t('auto.base.___block_tit_20d33f32', default='{% block title %}MTSCOS AI · 仙女座{% endblock %}') }}</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0'%25 stop-color='%239B59B6'/%3E%3Cstop offset='100%25' stop-color='%232E86DE'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='50' cy='50' r='44' fill='url(%23g)'/%3E%3Ccircle cx='35' cy='35' r='3' fill='white' opacity='0.9'/%3E%3Ccircle cx='65' cy='30' r='2' fill='white' opacity='0.8'/%3E%3Ccircle cx='70' cy='65' r='2.5' fill='white' opacity='0.85'/%3E%3Ccircle cx='30' cy='65' r='1.5' fill='white' opacity='0.7'/%3E%3Ccircle cx='55' cy='70' r='2' fill='white' opacity='0.75'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="/assets/css/mtscos-design-system.css">
    <link rel="stylesheet" href="/assets/font-awesome/css/all.min.css">
    <link rel="stylesheet" href="/assets/tailwind.min.css">
    <script>
        // 主题初始化（尽早执行避免 FOUC）
        (function(){
            try {
                var saved = localStorage.getItem('mtscos-theme');
                if (saved && (saved === 'andromeda-dark' || saved === 'porcelain')) {
                    document.documentElement.setAttribute('data-theme', saved);
                }
            } catch(e) {}
        })();
    </script>
    {% block head %}{% endblock %}
    <style>
        body {
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }
        .mtscos-lock-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
        }
        .mtscos-timeout-warning {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #ff6b6b;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            z-index: 9998;
            display: none;
            font-size: 14px;
        }
        .mtscos-permission-denied {
            display: none;
        }
    </style>
</head>
<body>
    <!-- 🌌 仙女座主题切换按钮 -->
    <button id="mtscos-theme-toggle" title="{{ t('auto.base.x_x_x___x_x__9c014b17', default='切换主题：仙女座·亮色 / 仙女座·深空 / 青瓷卷') }}"
            style="position:fixed;bottom:24px;right:24px;z-index:9997;width:44px;height:44px;border-radius:999px;border:1px solid var(--border-color);background:var(--bg-card);color:var(--text-primary);box-shadow:var(--shadow-md);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;transition:var(--transition-base);backdrop-filter:blur(8px);"
            onmouseover="this.style.transform='scale(1.08)';this.style.boxShadow='var(--shadow-glow)'"
            onmouseout="this.style.transform='scale(1)';this.style.boxShadow='var(--shadow-md)'">
        <span id="mtscos-theme-icon">🌌</span>
    </button>
    <script>
        (function(){
            var themes = ['andromeda','andromeda-dark','porcelain'];
            var labels = {'andromeda':'🌌','andromeda-dark':'🌙','porcelain':'🏮'};
            var names  = {'andromeda':'仙女座·亮色','andromeda-dark':'仙女座·深空','porcelain':'青瓷卷'};
            var btn = document.getElementById('mtscos-theme-toggle');
            var icon = document.getElementById('mtscos-theme-icon');
            var cycle = function(){
                var cur = document.documentElement.getAttribute('data-theme') || 'andromeda';
                var next = themes[(themes.indexOf(cur)+1) % themes.length];
                document.documentElement.setAttribute('data-theme', next);
                icon.textContent = labels[next];
                try { localStorage.setItem('mtscos-theme', next); } catch(e){}
                btn.title = '{{ t('auto.base.x__3d490bfc') }}') }}' + names[next] + ' · 点击切换';
            };
            btn.addEventListener('click', cycle);
            var cur = document.documentElement.getAttribute('data-theme') || 'andromeda';
            icon.textContent = labels[cur] || '🌌';
            btn.title = '当前：' + (names[cur] || names.andromeda) + ' · 点击切换';
        })();
    </script>

    <div id="mtscos-lock-overlay" class="mtscos-lock-overlay">
        <div style="text-align:center">
            <div style="font-size:64px;margin-bottom:20px">🔒</div>
            <div>{{ t('auto.base.x____425881e9', default='系统锁定中...') }}</div>
            <div id="lock-countdown" style="font-size:24px;margin-top:10px"></div>
        </div>
    </div>
    <div id="mtscos-timeout-warning" class="mtscos-timeout-warning">
        ⚠️ 会话即将超时，请点击任意位置继续
    </div>

    {% block content %}{% endblock %}

    <script src="/assets/layout_adapter.js"></script>
    <script>
        (function() {
            var MTSCOS = {
                sessionTimeout: 1800,
                warningTimeout: 300,
                lastActivity: Date.now(),
                timeoutTimer: null,
                warningTimer: null,
                isLocked: false,
                lockDuration: 60,
                lockTimer: null,
                maxRetries: 5,
                retryCount: 0,
                
                init: function() {
                    this.bindSecurityEvents();
                    this.bindNavigationEvents();
                    this.startTimeoutMonitor();
                    this.startActivityMonitor();
                    this.validateUserContainer();
                    this.bindPermissionEvents();
                    this.startGlobalListener();
                },
                
                bindSecurityEvents: function() {
                    document.addEventListener('contextmenu', function(e) {
                        e.preventDefault();
                    });
                    
                    document.addEventListener('keydown', function(e) {
                        if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I') || 
                            (e.ctrlKey && e.key === 'U') || (e.ctrlKey && e.key === 'S') ||
                            (e.metaKey && e.key === 'S')) {
                            e.preventDefault();
                            e.stopPropagation();
                        }
                        if (e.key === 'F5' || (e.ctrlKey && e.key === 'R') || (e.metaKey && e.key === 'R')) {
                            e.preventDefault();
                            e.stopPropagation();
                        }
                    });
                    
                    document.addEventListener('keypress', function(e) {
                        if (e.key === 'F12') {
                            e.preventDefault();
                        }
                    });
                },
                
                bindNavigationEvents: function() {
                    window.history.pushState(null, null, window.location.href);
                    window.addEventListener('popstate', function() {
                        window.history.pushState(null, null, window.location.href);
                    });
                },
                
                startActivityMonitor: function() {
                    var events = ['mousedown', 'mousemove', 'keydown', 'scroll', 'touchstart'];
                    events.forEach(function(evt) {
                        document.addEventListener(evt, function() {
                            MTSCOS.resetTimeout();
                        });
                    });
                },
                
                startTimeoutMonitor: function() {
                    this.stopTimeoutMonitor();
                    this.timeoutTimer = setTimeout(function() {
                        MTSCOS.showTimeoutWarning();
                    }, (this.sessionTimeout - this.warningTimeout) * 1000);
                },
                
                stopTimeoutMonitor: function() {
                    if (this.timeoutTimer) {
                        clearTimeout(this.timeoutTimer);
                        this.timeoutTimer = null;
                    }
                    if (this.warningTimer) {
                        clearTimeout(this.warningTimer);
                        this.warningTimer = null;
                    }
                },
                
                resetTimeout: function() {
                    this.lastActivity = Date.now();
                    this.hideTimeoutWarning();
                    this.startTimeoutMonitor();
                },
                
                showTimeoutWarning: function() {
                    document.getElementById('mtscos-timeout-warning').style.display = 'block';
                    this.warningTimer = setTimeout(function() {
                        MTSCOS.lockSystem();
                    }, this.warningTimeout * 1000);
                },
                
                hideTimeoutWarning: function() {
                    document.getElementById('mtscos-timeout-warning').style.display = 'none';
                },
                
                lockSystem: function() {
                    if (this.isLocked) return;
                    this.isLocked = true;
                    document.getElementById('mtscos-lock-overlay').style.display = 'flex';
                    var countdown = this.lockDuration;
                    this.lockTimer = setInterval(function() {
                        countdown--;
                        document.getElementById('lock-countdown').textContent = countdown + '秒后解锁';
                        if (countdown <= 0) {
                            MTSCOS.unlockSystem();
                        }
                    }, 1000);
                },
                
                unlockSystem: function() {
                    this.isLocked = false;
                    document.getElementById('mtscos-lock-overlay').style.display = 'none';
                    if (this.lockTimer) {
                        clearInterval(this.lockTimer);
                        this.lockTimer = null;
                    }
                    this.resetTimeout();
                },
                
                validateUserContainer: function() {
                    var xhr = new XMLHttpRequest();
                    xhr.open('GET', '/api/user/info', true);
                    xhr.onreadystatechange = function() {
                        if (xhr.readyState === 4) {
                            if (xhr.status === 401) {
                                if (!window.location.pathname.includes('/login') && !window.location.pathname.includes('/register')) {
                                    window.location.href = '/auth/login';
                                }
                            }
                        }
                    };
                    xhr.send();
                },
                
                bindPermissionEvents: function() {
                    document.querySelectorAll('[data-role]').forEach(function(el) {
                        var requiredRole = el.getAttribute('data-role');
                        MTSCOS.checkPermission(el, requiredRole);
                    });
                },
                
                checkPermission: function(element, requiredRole) {
                    var xhr = new XMLHttpRequest();
                    xhr.open('GET', '/api/user/info', true);
                    xhr.onreadystatechange = function() {
                        if (xhr.readyState === 4 && xhr.status === 200) {
                            try {
                                var data = JSON.parse(xhr.responseText);
                                var userRole = data.user ? data.user.role : 'guest';
                                var allowedRoles = ['admin', 'super_admin', 'teacher', 'student', 'designer'];
                                if (requiredRole && !allowedRoles.includes(userRole) && requiredRole !== userRole) {
                                    element.style.display = 'none';
                                }
                            } catch(e) {}
                        }
                    };
                    xhr.send();
                },
                
                startGlobalListener: function() {
                    var errorHandler = window.onerror;
                    window.onerror = function(msg, url, line, col, error) {
                        MTSCOS.reportError(msg, url, line, col, error);
                        if (errorHandler) {
                            return errorHandler(msg, url, line, col, error);
                        }
                        return false;
                    };
                    
                    var rejectionHandler = window.onunhandledrejection;
                    window.onunhandledrejection = function(event) {
                        MTSCOS.reportError('Promise rejection: ' + event.reason);
                        if (rejectionHandler) {
                            rejectionHandler(event);
                        }
                    };
                },
                
                reportError: function(msg, url, line, col, error) {
                    var errorData = {
                        message: msg,
                        url: url || window.location.href,
                        line: line || 0,
                        column: col || 0,
                        error: error ? error.stack : '',
                        timestamp: Date.now(),
                        userAgent: navigator.userAgent
                    };
                    try {
                        var xhr = new XMLHttpRequest();
                        xhr.open('POST', '/api/error/report', true);
                        xhr.setRequestHeader('Content-Type', 'application/json');
                        xhr.send(JSON.stringify(errorData));
                    } catch(e) {}
                },
                
                apiCall: function(url, method, data, callback) {
                    this.retryCount = 0;
                    this._apiCall(url, method, data, callback);
                },
                
                _apiCall: function(url, method, data, callback) {
                    var xhr = new XMLHttpRequest();
                    xhr.open(method, url, true);
                    xhr.setRequestHeader('Content-Type', 'application/json');
                    xhr.onreadystatechange = function() {
                        if (xhr.readyState === 4) {
                            if (xhr.status === 200) {
                                try {
                                    var response = JSON.parse(xhr.responseText);
                                    callback(null, response);
                                } catch(e) {
                                    callback(e, null);
                                }
                            } else if (xhr.status === 401) {
                                window.location.href = '/auth/login';
                            } else if (xhr.status === 500 && MTSCOS.retryCount < MTSCOS.maxRetries) {
                                MTSCOS.retryCount++;
                                setTimeout(function() {
                                    MTSCOS._apiCall(url, method, data, callback);
                                }, Math.pow(2, MTSCOS.retryCount) * 1000);
                            } else {
                                callback(new Error('API Error: ' + xhr.status), null);
                            }
                        }
                    };
                    xhr.send(data ? JSON.stringify(data) : null);
                }
            };
            
            document.addEventListener('DOMContentLoaded', function() {
                MTSCOS.init();
                window.MTSCOS = MTSCOS;
            });
        })();
    </script>
    <script src="/static/js/utils/apiRequest.js"></script>
    {% block scripts %}{% endblock %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/lang_fab.css') }}">
<div class="lang-bar" id="langBar">
{% for lang in available_langs %}
{% set code, name = lang %}
<button class="lang-bar__opt" data-lang="{{ code }}">
  {% if code == 'zh_CN' %}简
  {% elif code == 'zh_TW' %}繁
  {% elif code == 'ja_JP' %}日
  {% elif code == 'en_US' %}EN
  {% else %}{{ name }}{% endif %}
</button>
{% endfor %}
</div>
<script>
(function(){
  var bar = document.getElementById('langBar');
  if (!bar) return;

  // 初始化当前语言高亮
  fetch('/api/i18n/current', {credentials:'same-origin'})
    .then(function(r){return r.json()})
    .then(function(d){
      var cur = d.lang || 'zh_CN';
      bar.querySelectorAll('.lang-bar__opt').forEach(function(b){
        b.classList.toggle('is-active', b.dataset.lang === cur);
      });
    })
    .catch(function(){ /* 忽略, 默认不高亮 */ });

  // 点击切换 → 自动刷新
  bar.addEventListener('click', function(e){
    var btn = e.target.closest('.lang-bar__opt');
    if (!btn || btn.classList.contains('is-active')) return;
    var target = btn.dataset.lang;
    fetch('/api/i18n/set_lang?lang=' + target, {credentials:'same-origin'})
      .then(function(){ location.reload(); });
  });
})();
</script>
</body>
</html>
