<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#3b82f6">
    <meta name="description" content="MTSCOS AI 智能管理系统 - {% block description %}{{ description }}{% endblock %}">
    <meta name="keywords" content="MTSCOS, AI, 智能管理, 分布式服务器, 集群集成">
    <meta name="author" content="MTSCOS AI Team">
    <meta name="robots" content="index, follow">
    <title>MTSCOS AI 管理系统 - {% block title %}{{ title }}{% endblock %}">
    
    <!-- 设计系统样式 -->
    <link href="{{ url_for(\'static\', filename=\'css/mtscos-design-system.css\') }}" rel="stylesheet">
    <!-- 主样式文件 -->
    <link href="{{ url_for(\'static\', filename=\'css/style.css\') }}" rel="stylesheet">
    <!-- 图标库 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <!-- 预加载关键资源 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- 自定义CSS -->
    <style>
        /* 全局样式 */
        :root {
            --primary-color: #3b82f6;
            --secondary-color: #8b5cf6;
            --accent-color: #ec4899;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --error-color: #ef4444;
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --bg-tertiary: #f1f5f9;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --text-tertiary: #94a3b8;
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --radius-sm: 0.375rem;
            --radius-md: 0.5rem;
            --radius-lg: 0.75rem;
            --radius-xl: 1rem;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            line-height: 1.6;
        }
        
        /* 布局容器 */
        .app-container {
            display: flex;
            min-height: 100vh;
        }
        
        /* 侧边栏样式 */
        .sidebar {
            width: 260px;
            background: var(--bg-primary);
            border-right: 1px solid var(--border-color);
            padding: 1.5rem;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
            z-index: 100;
        }
        
        .sidebar.collapsed {
            width: 70px;
            padding: 1rem 0.75rem;
        }
        
        /* 主内容区 */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        /* 顶部导航 */
        .top-nav {
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
        }
        
        /* 内容区域 */
        .content {
            flex: 1;
            padding: 2rem;
            overflow-y: auto;
            background: var(--bg-secondary);
        }
        
        /* 卡片样式 */
        .card {
            background: var(--bg-primary);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        
        .card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-1px);
        }
        
        /* 卡片头部 */
        .card-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--bg-primary);
        }
        
        /* 卡片内容 */
        .card-body {
            padding: 1.5rem;
        }
        
        /* 按钮样式 */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.625rem 1.25rem;
            border-radius: var(--radius-md);
            font-weight: 500;
            transition: var(--transition);
            cursor: pointer;
            border: none;
            font-size: 0.875rem;
            font-family: inherit;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.4);
        }
        
        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }
        
        .btn-secondary:hover {
            background: #e2e8f0;
            transform: translateY(-1px);
        }
        
        /* 渐变文字 */
        .gradient-text {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        /* 动画效果 */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }
        
        /* 导航链接 */
        .nav-link {
            display: flex;
            align-items: center;
            gap: 0.875rem;
            padding: 0.875rem 1rem;
            border-radius: var(--radius-md);
            color: var(--text-secondary);
            transition: var(--transition);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.25rem;
        }
        
        .nav-link:hover,
        .nav-link.active {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1) 0%, rgba(139, 92, 246, 0.1) 100%);
            color: #3b82f6;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: -260px;
                top: 0;
                height: 100vh;
            }
            
            .sidebar.open {
                left: 0;
                box-shadow: 0 0 0 1000px rgba(0, 0, 0, 0.5);
            }
            
            .main-content {
                margin-left: 0;
            }
            
            .top-nav {
                padding: 1rem;
            }
            
            .content {
                padding: 1rem;
            }
        }
        
        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: var(--bg-tertiary);
            border-radius: var(--radius-lg);
        }
        
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            border-radius: var(--radius-lg);
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
        }
        
        /* 页脚样式 */
        .footer {
            background: var(--bg-primary);
            border-top: 1px solid var(--border-color);
            padding: 1.5rem 2rem;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.875rem;
            margin-top: auto;
        }
        
        /* 面包屑导航 */
        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }
        
        .breadcrumb-item {
            color: var(--text-secondary);
            text-decoration: none;
            transition: var(--transition);
        }
        
        .breadcrumb-item:hover {
            color: #3b82f6;
        }
        
        .breadcrumb-item.active {
            color: var(--text-primary);
            font-weight: 500;
        }
        
        .breadcrumb-separator {
            color: var(--text-tertiary);
        }
        
        /* 加载状态 */
        .loading {
            display: inline-block;
            width: 1rem;
            height: 1rem;
            border: 2px solid rgba(59, 130, 246, 0.3);
            border-radius: 50%;
            border-top-color: #3b82f6;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        
        /* 侧边栏Logo */
        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 0.875rem;
            margin-bottom: 2rem;
            padding: 0.5rem;
            border-radius: var(--radius-md);
            transition: var(--transition);
        }
        
        .sidebar-logo:hover {
            background: var(--bg-tertiary);
        }
        
        /* 导航组 */
        .nav-group {
            margin-bottom: 1.5rem;
        }
        
        .nav-group-title {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-tertiary);
            margin-bottom: 0.75rem;
            padding: 0 1rem;
            letter-spacing: 0.05em;
        }
        
        /* 顶部用户信息 */
        .user-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 0.875rem;
        }
        
        /* 移动端菜单按钮 */
        .mobile-menu-btn {
            display: none;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: var(--radius-md);
            background: var(--bg-tertiary);
            transition: var(--transition);
            border: none;
            cursor: pointer;
        }
        
        .mobile-menu-btn:hover {
            background: #e2e8f0;
        }
        
        @media (max-width: 768px) {
            .mobile-menu-btn {
                display: flex;
            }
        }
        
        /* 统计卡片 */
        .stat-card {
            background: var(--bg-primary);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
        }
        
        .stat-card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-1px);
        }
        
        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            margin-bottom: 1rem;
        }
        
        /* 渐变背景 */
        .gradient-bg {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
        }
        
        /* 平滑滚动 */
        html {
            scroll-behavior: smooth;
        }
    

    /* 现代CSS特性 - 宽高比 */
    .aspect-ratio-16x9 {
        aspect-ratio: 16 / 9;
    }
    
    .aspect-ratio-4x3 {
        aspect-ratio: 4 / 3;
    }
    
    .aspect-ratio-square {
        aspect-ratio: 1 / 1;
    }

    /* 尊重用户减少动画偏好 */
    @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
            animation-duration: 0.01ms !important;
            animation-iteration-count: 1 !important;
            transition-duration: 0.01ms !important;
            scroll-behavior: auto !important;
        }
    }

    /* 优化渲染性能 */
    .card, .sidebar, .main-content {
        contain: layout style paint;
        content-visibility: auto;
    }

    /* 响应式设计 - clamp()函数 */
    .clamp-text {
        font-size: clamp(1rem, 2vw, 1.5rem);
    }
    
    .clamp-container {
        width: clamp(300px, 80vw, 1200px);
    }</style>
    
    <!-- 页面特定样式 -->
    {% block styles %}{% endblock %}
</head>
<body>
    <!-- 应用容器 -->
    <div class="app-container">
        <!-- 侧边栏 -->
        <aside id="sidebar" class="sidebar">
            <!-- 侧边栏头部 -->
            <div class="sidebar-header mb-6">
                <!-- Logo -->
                <div class="sidebar-logo">
                    <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-purple-600 rounded-lg flex items-center justify-center shadow-md">
                        <i class="fas fa-brain text-white text-xl"></i>
                    </div>
                    <h1 class="text-xl font-bold text-gray-800 hidden md:block">MTSCOS AI</h1>
                </div>
                
                <!-- 侧边栏折叠按钮 -->
                <button id="toggle-sidebar" class="btn btn-secondary w-full justify-center md:justify-start mt-2">
                    <i class="fas fa-chevron-left"></i>
                    <span class="hidden md:inline">收起菜单</span>
                </button>
            </div>
            
            <!-- 侧边栏导航 -->
            <nav class="sidebar-nav">
                <!-- 主导航组 -->
                <div class="nav-group">
                    <h3 class="nav-group-title">主菜单</h3>
                    <ul class="space-y-1">
                        <li>
                            <a href="/" class="nav-link active">
                                <i class="fas fa-home w-5 text-center"></i>
                                <span class="hidden md:inline">首页</span>
                            </a>
                        </li>
                        
                        <!-- 仅管理员、超级管理员和硬件管理员显示仪表盘链接 -->
                        {% if session.logged_in and session.user_level in ['admin', 'super_admin', 'hardware_admin'] %}
                        <li>
                            <a href="/dashboard" class="nav-link">
                                <i class="fas fa-tachometer-alt w-5 text-center"></i>
                                <span class="hidden md:inline">仪表盘</span>
                            </a>
                        </li>
                        {% endif %}
                        
                        <!-- 服务器管理 -->
                        {% if session.logged_in and session.user_level in ['admin', 'super_admin', 'hardware_admin'] %}
                        <li>
                            <a href="#" class="nav-link">
                                <i class="fas fa-server w-5 text-center"></i>
                                <span class="hidden md:inline">服务器管理</span>
                            </a>
                        </li>
                        {% endif %}
                    </ul>
                </div>
                
                <!-- 管理导航组 -->
                {% if session.logged_in and session.user_level in ['admin', 'super_admin'] %}
                <div class="nav-group">
                    <h3 class="nav-group-title">管理</h3>
                    <ul class="space-y-1">
                        <!-- 用户管理 -->
                        <li>
                            <a href="#" class="nav-link">
                                <i class="fas fa-users w-5 text-center"></i>
                                <span class="hidden md:inline">用户管理</span>
                            </a>
                        </li>
                        
                        <!-- 安全防护 -->
                        <li>
                            <a href="#" class="nav-link">
                                <i class="fas fa-shield-alt w-5 text-center"></i>
                                <span class="hidden md:inline">安全防护</span>
                            </a>
                        </li>
                        
                        <!-- AI管理 -->
                        <li>
                            <a href="#" class="nav-link">
                                <i class="fas fa-robot w-5 text-center"></i>
                                <span class="hidden md:inline">AI管理</span>
                            </a>
                        </li>
                        
                        <!-- 统计分析 -->
                        <li>
                            <a href="#" class="nav-link">
                                <i class="fas fa-chart-line w-5 text-center"></i>
                                <span class="hidden md:inline">统计分析</span>
                            </a>
                        </li>
                        
                        <!-- 操作日志 -->
                        <li>
                            <a href="#" class="nav-link">
                                <i class="fas fa-history w-5 text-center"></i>
                                <span class="hidden md:inline">操作日志</span>
                            </a>
                        </li>
                    </ul>
                </div>
                {% endif %}
                
                <!-- 系统导航组 -->
                <div class="nav-group">
                    <h3 class="nav-group-title">系统</h3>
                    <ul class="space-y-1">
                        <!-- 系统设置 -->
                        {% if session.logged_in %}
                        <li>
                            <a href="/settings" class="nav-link">
                                <i class="fas fa-cog w-5 text-center"></i>
                                <span class="hidden md:inline">系统设置</span>
                            </a>
                        </li>
                        {% endif %}
                    </ul>
                </div>
            </nav>
            
            <!-- 侧边栏底部 -->
            {% if session.logged_in %}
            <div class="sidebar-footer absolute bottom-6 left-0 right-0 px-4">
                <div class="bg-gray-50 rounded-lg p-4 border border-gray-100">
                    <div class="flex items-center gap-2 mb-3">
                        <div class="user-avatar">
                            <i class="fas fa-user"></i>
                        </div>
                        <div class="flex-1 hidden md:block">
                            <p class="text-sm font-medium text-gray-800">{{ session.username or '访客' }}</p>
                            <p class="text-xs text-gray-500 capitalize">{{ session.user_level or 'guest' }}</p>
                        </div>
                    </div>
                    <a href="/auth/logout" class="nav-link justify-center md:justify-start text-red-600 hover:text-red-700 hover:bg-red-50">
                        <i class="fas fa-sign-out-alt w-5 text-center"></i>
                        <span class="hidden md:inline">退出登录</span>
                    </a>
                </div>
            </div>
            {% endif %}
        </aside>
        
        <!-- 主内容区 -->
        <div class="main-content">
            <!-- 顶部导航 -->
            <header class="top-nav">
                <div class="flex items-center gap-2">
                    <!-- 移动端菜单按钮 -->
                    <button id="mobile-menu-btn" class="mobile-menu-btn">
                        <i class="fas fa-bars text-gray-600"></i>
                    </button>
                    
                    <!-- 面包屑导航 -->
                    <nav class="breadcrumb">
                        <a href="/" class="breadcrumb-item">首页</a>
                        <span class="breadcrumb-separator">/</span>
                        <span class="breadcrumb-item active">{% block breadcrumb %}{{ title }}{% endblock %}</span>
                    </nav>
                </div>
                
                <div class="flex items-center gap-4">
                    <!-- 搜索框 -->
                    <div class="relative hidden md:block">
                        <input type="text" placeholder="搜索..." 
                               class="pl-10 pr-4 py-2 rounded-lg border border-gray-200 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all duration-300 w-64">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-search text-gray-400"></i>
                        </div>
                    </div>
                    
                    <!-- 通知图标 -->
                    <button class="relative p-2 rounded-lg hover:bg-gray-100 transition-colors">
                        <i class="fas fa-bell text-gray-600"></i>
                        <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
                    </button>
                    
                    <!-- 实时信息显示 -->
                    <div class="flex items-center gap-4 text-sm text-gray-600">
                        <div class="flex items-center gap-2">
                            <i class="fas fa-clock text-gray-500"></i>
                            <span id="current-time"></span>
                        </div>
                        <div class="flex items-center gap-2">
                            <i class="fas fa-globe text-gray-500"></i>
                            <span id="user-ip">检测中...</span>
                        </div>
                    </div>
                </div>
            </header>
            
            <!-- 内容区域 -->
            <main class="content">
                {% block content %}{% endblock %}
            </main>
            
            <!-- 页脚 -->
            <footer class="footer">
                <div class="container mx-auto">
                    <p>&copy; 2026 MTSCOS AI System. All rights reserved.</p>
                    <p class="mt-1 text-xs text-gray-500">Powered by Advanced AI Technology & Distributed Architecture</p>
                </div>
            </footer>
        </div>
    </div>
    
    <!-- JavaScript -->
    <script>
        // 密码可见性切换
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const toggleBtn = document.querySelector(`[data-toggle="${inputId}"]`);
            if (input && toggleBtn) {
                const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
                input.setAttribute('type', type);
                toggleBtn.classList.toggle('fa-eye');
                toggleBtn.classList.toggle('fa-eye-slash');
            }
        }
        
        // 实时时间显示
        function updateTime() {
            const now = new Date();
            const timeString = now.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
            document.getElementById('current-time').textContent = timeString;
        }
        
        // 初始加载和每秒更新
        updateTime();
        setInterval(updateTime, 1000);
        
        // 获取用户IP
        async function getUserIP() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                document.getElementById('user-ip').textContent = data.ip;
            } catch (error) {
                document.getElementById('user-ip').textContent = '无法获取';
            }
        }
        
        getUserIP();
        
        // 侧边栏折叠功能
        const toggleSidebarBtn = document.getElementById('toggle-sidebar');
        const sidebar = document.getElementById('sidebar');
        
        if (toggleSidebarBtn && sidebar) {
            toggleSidebarBtn.addEventListener('click', () => {
                sidebar.classList.toggle('collapsed');
                const isCollapsed = sidebar.classList.contains('collapsed');
                toggleSidebarBtn.innerHTML = isCollapsed ? 
                    '<i class="fas fa-chevron-right"></i><span class="hidden md:inline">展开菜单</span>' : 
                    '<i class="fas fa-chevron-left"></i><span class="hidden md:inline">收起菜单</span>';
            });
        }
        
        // 移动端菜单切换
        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        
        if (mobileMenuBtn && sidebar) {
            mobileMenuBtn.addEventListener('click', () => {
                sidebar.classList.toggle('open');
            });
        }
        
        // 点击外部关闭侧边栏
        document.addEventListener('click', (e) => {
            if (!sidebar.contains(e.target) && !mobileMenuBtn.contains(e.target)) {
                sidebar.classList.remove('open');
            }
        });
        
        // 表单提交处理
        document.addEventListener('DOMContentLoaded', () => {
            const forms = document.querySelectorAll('form');
            forms.forEach(form => {
                form.addEventListener('submit', (e) => {
                    const submitBtn = form.querySelector('button[type="submit"]');
                    if (submitBtn) {
                        submitBtn.disabled = true;
                        submitBtn.innerHTML = '<span class="loading"></span> 处理中...';
                    }
                });
            });
        });
        
        // 平滑滚动
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({
                        behavior: 'smooth',
                        block: 'start'
                    });
                }
            });
        });
        
        // 页面加载完成后的动画
        document.addEventListener('DOMContentLoaded', function() {
            const elements = document.querySelectorAll('.card, .fade-in');
            elements.forEach((element, index) => {
                element.style.animationDelay = `${index * 0.1}s`;
            });
        });
        
        // 实时监控系统状态
        function monitorSystemStatus() {
            console.log('监控系统状态...');
            // 这里可以添加系统状态监控逻辑
            // 比如从服务器获取实时状态数据
        }
        
        // 每分钟监控一次系统状态
        setInterval(monitorSystemStatus, 60000);
    </script>
    
    <!-- 页面特定脚本 -->
    {% block scripts %}{% endblock %}
</body>
</html>
