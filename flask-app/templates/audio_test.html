<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音频测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .audio-section {
            background: #f0f4f8;
            border-radius: 12px;
            padding: 30px;
            margin: 20px 0;
        }
        .audio-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
        }
        audio {
            width: 100%;
            margin: 20px 0;
        }
        .info {
            background: #e8f5e9;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
        }
        .error {
            background: #ffebee;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            color: #c62828;
        }
    </style>
</head>
<body>
    <h1>音频播放测试</h1>
    
    <div class="audio-section">
        <div class="audio-title">🎧 日语N4听力测试</div>
        <div class="info">
            <strong>音频路径：</strong>/static/audio/japanese/n4/listening_2.wav
        </div>
        <audio id="audio1" controls>
            <source src="/static/audio/japanese/n4/listening_2.wav" type="audio/wav">
            您的浏览器不支持音频播放
        </audio>
    </div>
    
    <div class="audio-section">
        <div class="audio-title">🎧 日语N5听力测试</div>
        <div class="info">
            <strong>音频路径：</strong>/static/audio/japanese/n5/listening_139.wav
        </div>
        <audio id="audio2" controls>
            <source src="/static/audio/japanese/n5/listening_139.wav" type="audio/wav">
            您的浏览器不支持音频播放
        </audio>
    </div>
    
    <script>
        // 检查音频是否加载成功
        document.querySelectorAll('audio').forEach((audio, index) => {
            audio.addEventListener('canplay', function() {
                console.log(`音频 ${index + 1} 加载成功`);
            });
            audio.addEventListener('error', function(e) {
                console.error(`音频 ${index + 1} 加载失败:`, e);
                const errorDiv = document.createElement('div');
                errorDiv.className = 'error';
                errorDiv.textContent = `音频 ${index + 1} 加载失败，请检查文件是否存在`;
                audio.parentElement.appendChild(errorDiv);
            });
        });
    </script>
</body>
</html>
