<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员仪表盘 - MTSCOS AI</title>
    <link rel="stylesheet" href="/assets/css/mtscos-design-system.css">
    <link rel="stylesheet" href="/assets/font-awesome/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-family);
            background: var(--bg-secondary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 24px;
        }
        .page-wrap { max-width: 1200px; margin: 0 auto; }

        .topbar {
            display: flex; align-items: center; justify-content: space-between;
            background: var(--bg-primary); border: 1px solid var(--border-color);
            border-radius: var(--radius-lg); padding: 18px 24px;
            box-shadow: var(--shadow-sm); margin-bottom: 24px;
        }
        .topbar-left { display: flex; align-items: center; gap: 14px; }
        .brand-badge {
            width: 50px; height: 50px; border-radius: var(--radius-md);
            background: var(--primary-color); color: #fff;
            display: flex; align-items: center; justify-content: center; font-size: 23px;
        }
        .brand-text h1 { font-size: 20px; font-weight: 700; }
        .brand-text .sub { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
        .topbar-right { display: flex; align-items: center; gap: 10px; }
        .icon-btn {
            width: 40px; height: 40px; border-radius: var(--radius-md);
            background: var(--bg-secondary); border: 1px solid var(--border-color);
            color: var(--text-primary); display: flex; align-items: center; justify-content: center;
            text-decoration: none; font-size: 17px;
        }
        .icon-btn:hover { background: var(--primary-color); color: #fff; }
        .status-pill {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 6px 14px; border-radius: 999px; font-size: 13px;
            background: rgba(34,197,94,0.12); color: var(--success-color);
        }
        .status-pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success-color); }

        /* 统计卡片 */
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
        .stat-card {
            background: var(--bg-primary); border: 1px solid var(--border-color);
            border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow-sm);
            transition: transform .2s, box-shadow .2s;
        }
        .stat-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
        .stat-card .si {
            width: 42px; height: 42px; border-radius: var(--radius-md);
            display: flex; align-items: center; justify-content: center; font-size: 19px; margin-bottom: 12px;
        }
        .si.blue { background: rgba(59,130,246,0.12); color: var(--primary-color); }
        .si.green { background: rgba(34,197,94,0.12); color: var(--success-color); }
        .si.orange { background: rgba(249,115,22,0.12); color: var(--warning-color); }
        .si.purple { background: rgba(168,85,247,0.12); color: var(--secondary-color); }
        .si.red { background: rgba(239,68,68,0.12); color: var(--danger-color); }
        .stat-card .sv { font-size: 28px; font-weight: 700; }
        .stat-card .sl { font-size: 13px; color: var(--text-secondary); margin-top: 3px; }

        /* 双栏 */
        .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
        .panel {
            background: var(--bg-primary); border: 1px solid var(--border-color);
            border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); overflow: hidden;
        }
        .panel-head {
            display: flex; align-items: center; gap: 10px;
            padding: 16px 20px; border-bottom: 1px solid var(--border-color);
        }
        .panel-head h2 { font-size: 15px; font-weight: 700; }
        .panel-head .si { width: 30px; height: 30px; border-radius: var(--radius-sm);
            display: flex; align-items: center; justify-content: center; font-size: 14px; }
        .panel-body { padding: 8px 0; }

        .list-item {
            display: flex; align-items: center; gap: 12px; padding: 13px 20px;
            border-bottom: 1px solid var(--border-color);
        }
        .list-item:last-child { border-bottom: none; }
        .li-avatar {
            width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
            background: rgba(99,102,241,0.12); color: var(--primary-color);
            display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600;
        }
        .li-main { flex: 1; min-width: 0; }
        .li-title { font-size: 14px; font-weight: 600; }
        .li-meta { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
        .role-badge { font-size: 11px; padding: 2px 9px; border-radius: 999px;
            background: rgba(99,102,241,0.12); color: var(--primary-color); }

        /* 资源进度 */
        .res-row { padding: 14px 20px; border-bottom: 1px solid var(--border-color); }
        .res-row:last-child { border-bottom: none; }
        .res-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .res-name { font-size: 13px; display: flex; align-items: center; gap: 8px; }
        .res-name i { color: var(--primary-color); }
        .res-val { font-size: 13px; font-weight: 700; }
        .track { height: 8px; background: var(--bg-secondary); border-radius: 999px; overflow: hidden; }
        .fill { height: 100%; border-radius: 999px; transition: width .4s; }
        .fill.ok { background: var(--success-color); }
        .fill.warn { background: var(--warning-color); }
        .fill.crit { background: var(--danger-color); }

        .empty { text-align: center; padding: 30px 20px; color: var(--text-secondary); font-size: 13px; }
        .empty i { font-size: 32px; margin-bottom: 8px; display: block; color: var(--border-color); }

        .btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 9px 20px; border-radius: var(--radius-md); text-decoration: none;
            font-weight: 600; font-size: 13px; border: none; cursor: pointer;
            background: var(--primary-color); color: #fff;
        }
        .btn:hover { background: var(--primary-dark); }

        @media (max-width: 980px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .cols { grid-template-columns: 1fr; }
            .topbar { flex-direction: column; gap: 12px; align-items: flex-start; }
        }
    </style>
</head>
<body>
<div class="page-wrap">

    <!-- 顶部栏 -->
    <div class="topbar">
        <div class="topbar-left">
            <a href="/" class="icon-btn" title="返回首页"><i class="fas fa-arrow-left"></i></a>
            <div class="brand-badge"><i class="fas fa-gauge-high"></i></div>
            <div class="brand-text">
                <h1>管理员仪表盘</h1>
                <div class="sub">
                    {% if session and session.username %}{{ session.username }}{% else %}管理员{% endif %}
                    {% if session and session.role %} · {{ session.role }}{% endif %}
                </div>
            </div>
        </div>
        <div class="topbar-right">
            <span class="status-pill" id="sys-status"><span class="dot"></span> 系统状态加载中…</span>
            <a href="/" class="icon-btn" title="返回首页"><i class="fas fa-house"></i></a>
        </div>
    </div>

    <!-- 统计卡片 -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="si blue"><i class="fas fa-users"></i></div>
            <div class="sv" id="stat-users">-</div>
            <div class="sl">用户总数</div>
        </div>
        <div class="stat-card">
            <div class="si green"><i class="fas fa-user-check"></i></div>
            <div class="sv" id="stat-active">-</div>
            <div class="sl">今日活跃</div>
        </div>
        <div class="stat-card">
            <div class="si orange"><i class="fas fa-file-pen"></i></div>
            <div class="sv" id="stat-exams">-</div>
            <div class="sl">考试数量</div>
        </div>
        <div class="stat-card">
            <div class="si purple"><i class="fas fa-circle-question"></i></div>
            <div class="sv" id="stat-questions">-</div>
            <div class="sl">题库题目</div>
        </div>
        <div class="stat-card">
            <div class="si green"><i class="fas fa-check-double"></i></div>
            <div class="sv" id="stat-completed">-</div>
            <div class="sl">已完成考试</div>
        </div>
        <div class="stat-card">
            <div class="si orange"><i class="fas fa-book-open"></i></div>
            <div class="sv" id="stat-learning">-</div>
            <div class="sl">学习记录</div>
        </div>
        <div class="stat-card">
            <div class="si red"><i class="fas fa-right-to-bracket"></i></div>
            <div class="sv" id="stat-logins">-</div>
            <div class="sl">今日登录</div>
        </div>
        <div class="stat-card">
            <div class="si blue"><i class="fas fa-user-plus"></i></div>
            <div class="sv" id="stat-registers">-</div>
            <div class="sl">今日注册</div>
        </div>
    </div>

    <!-- 双栏：系统资源 + 角色分布 -->
    <div class="cols">
        <div class="panel">
            <div class="panel-head">
                <div class="si blue"><i class="fas fa-microchip"></i></div>
                <h2>系统资源</h2>
            </div>
            <div class="panel-body">
                <div class="res-row">
                    <div class="res-head">
                        <span class="res-name"><i class="fas fa-microchip"></i> CPU 使用率</span>
                        <span class="res-val" id="cpu-val">-</span>
                    </div>
                    <div class="track"><div class="fill" id="cpu-fill" style="width:0%"></div></div>
                </div>
                <div class="res-row">
                    <div class="res-head">
                        <span class="res-name"><i class="fas fa-memory"></i> 内存使用率</span>
                        <span class="res-val" id="mem-val">-</span>
                    </div>
                    <div class="track"><div class="fill" id="mem-fill" style="width:0%"></div></div>
                </div>
                <div class="res-row">
                    <div class="res-head">
                        <span class="res-name"><i class="fas fa-hard-drive"></i> 磁盘使用率</span>
                        <span class="res-val" id="disk-val">-</span>
                    </div>
                    <div class="track"><div class="fill" id="disk-fill" style="width:0%"></div></div>
                </div>
            </div>
        </div>

        <div class="panel">
            <div class="panel-head">
                <div class="si purple"><i class="fas fa-user-tag"></i></div>
                <h2>用户角色分布</h2>
            </div>
            <div class="panel-body" id="role-list">
                <div class="empty"><i class="fas fa-spinner fa-spin"></i> 加载中…</div>
            </div>
        </div>
    </div>

    <!-- 双栏：最近用户 + 最近日志 -->
    <div class="cols">
        <div class="panel">
            <div class="panel-head">
                <div class="si green"><i class="fas fa-users"></i></div>
                <h2>最近注册用户</h2>
            </div>
            <div class="panel-body" id="recent-users">
                <div class="empty"><i class="fas fa-spinner fa-spin"></i> 加载中…</div>
            </div>
        </div>

        <div class="panel">
            <div class="panel-head">
                <div class="si orange"><i class="fas fa-list"></i></div>
                <h2>系统日志</h2>
            </div>
            <div class="panel-body" id="recent-logs">
                <div class="empty"><i class="fas fa-spinner fa-spin"></i> 加载中…</div>
            </div>
        </div>
    </div>

</div>

<script>
(function () {
    function setText(id, val) { var el = document.getElementById(id); if (el) el.textContent = val; }
    function fillBar(id, percent) {
        var el = document.getElementById(id);
        if (!el) return;
        el.style.width = Math.min(100, Math.max(0, percent)) + '%';
        el.className = 'fill ' + (percent >= 85 ? 'crit' : (percent >= 65 ? 'warn' : 'ok'));
    }
    function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
            return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
        });
    }

    fetch('/api/admin/dashboard_stats', { credentials: 'same-origin' })
        .then(function (r) { return r.json(); })
        .then(function (res) {
            var d = (res && res.data) ? res.data : {};
            setText('stat-users', d.user_count != null ? d.user_count : '-');
            setText('stat-active', d.active_users != null ? d.active_users : '-');
            setText('stat-exams', d.exams_count != null ? d.exams_count : '-');
            setText('stat-questions', d.questions_count != null ? d.questions_count : '-');
            setText('stat-completed', d.completed_exams != null ? d.completed_exams : '-');
            setText('stat-learning', d.learning_records != null ? d.learning_records : '-');
            setText('stat-logins', d.today_logins != null ? d.today_logins : '-');
            setText('stat-registers', d.today_registers != null ? d.today_registers : '-');

            var sr = d.system_resources || {};
            var cpu = sr.cpu_percent || 0, mem = sr.memory_percent || 0, disk = sr.disk_percent || 0;
            setText('cpu-val', cpu.toFixed(1) + '%'); fillBar('cpu-fill', cpu);
            setText('mem-val', mem.toFixed(1) + '%'); fillBar('mem-fill', mem);
            setText('disk-val', disk.toFixed(1) + '%'); fillBar('disk-fill', disk);

            var sp = document.getElementById('sys-status');
            if (sp) {
                var st = d.system_status || '正常运行';
                sp.innerHTML = '<span class="dot"></span> ' + esc(st) + (d.version ? ' · v' + esc(d.version) : '');
            }

            // 角色分布
            var rl = document.getElementById('role-list');
            var roles = d.role_distribution || [];
            if (rl) {
                if (roles.length) {
                    var max = 1;
                    roles.forEach(function (r) { if (r.count > max) max = r.count; });
                    rl.innerHTML = roles.map(function (r) {
                        var pct = Math.round((r.count / max) * 100);
                        return '<div class="res-row"><div class="res-head"><span class="res-name"><i class="fas fa-user-tag"></i> ' +
                            esc(r.role || '未知') + '</span><span class="res-val">' + r.count + '</span></div>' +
                            '<div class="track"><div class="fill ok" style="width:' + pct + '%"></div></div></div>';
                    }).join('');
                } else {
                    rl.innerHTML = '<div class="empty"><i class="fas fa-inbox"></i>暂无角色分布数据</div>';
                }
            }

            // 最近用户
            var ru = document.getElementById('recent-users');
            var users = d.recent_users || [];
            if (ru) {
                if (users.length) {
                    ru.innerHTML = users.map(function (u) {
                        var initial = esc((u.username || '?').charAt(0).toUpperCase());
                        return '<div class="list-item"><div class="li-avatar">' + initial + '</div>' +
                            '<div class="li-main"><div class="li-title">' + esc(u.username || '用户') + '</div>' +
                            '<div class="li-meta">ID: ' + esc(u.id) + (u.created_at ? ' · ' + esc(u.created_at) : '') + '</div></div>' +
                            (u.role ? '<span class="role-badge">' + esc(u.role) + '</span>' : '') + '</div>';
                    }).join('');
                } else {
                    ru.innerHTML = '<div class="empty"><i class="fas fa-inbox"></i>暂无最近注册用户</div>';
                }
            }

            // 最近日志
            var rl2 = document.getElementById('recent-logs');
            var logs = d.recent_logs || [];
            if (rl2) {
                if (logs.length) {
                    rl2.innerHTML = logs.map(function (l) {
                        return '<div class="list-item"><div class="li-avatar"><i class="fas fa-file-lines"></i></div>' +
                            '<div class="li-main"><div class="li-title">' + esc(l.action || l.username || '操作') + '</div>' +
                            '<div class="li-meta">' + esc(l.username || ('用户' + l.user_id)) + (l.ip_address ? ' · ' + esc(l.ip_address) : '') +
                            (l.created_at ? ' · ' + esc(l.created_at) : '') + '</div></div></div>';
                    }).join('');
                } else {
                    rl2.innerHTML = '<div class="empty"><i class="fas fa-inbox"></i>暂无系统日志</div>';
                }
            }
        })
        .catch(function () {
            ['stat-users','stat-active','stat-exams','stat-questions','stat-completed','stat-learning','stat-logins','stat-registers']
                .forEach(function (id) { setText(id, '-'); });
            var sp = document.getElementById('sys-status');
            if (sp) sp.innerHTML = '<span class="dot" style="background:var(--danger-color)"></span> 数据加载失败';
            ['role-list','recent-users','recent-logs'].forEach(function (id) {
                var el = document.getElementById(id);
                if (el) el.innerHTML = '<div class="empty"><i class="fas fa-triangle-exclamation"></i>暂无数据</div>';
            });
        });
})();
</script>
</body>
</html>
