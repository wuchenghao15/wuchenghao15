{% extends 'admin_app/base.html' %}

{% block title %}GitHub同步管理 - MTSCOS管理端{% endblock %}

{% block content %}
<div class="page-container">
    <div class="section-title">
        <i class="fab fa-github" style="color: var(--color-primary);"></i>
        GitHub同步管理
    </div>

    <div class="card">
        <div class="card-header">
            <div class="card-title">同步状态</div>
        </div>
        <div style="padding: 16px;">
            <div class="stat-grid">
                <div class="stat-card blue">
                    <div class="stat-icon">📦</div>
                    <div class="stat-value" id="repoCount">-</div>
                    <div class="stat-label">仓库数量</div>
                </div>
                <div class="stat-card green">
                    <div class="stat-icon">✅</div>
                    <div class="stat-value" id="syncSuccess">-</div>
                    <div class="stat-label">同步成功</div>
                </div>
                <div class="stat-card orange">
                    <div class="stat-icon">⚠️</div>
                    <div class="stat-value" id="syncFailed">-</div>
                    <div class="stat-label">同步失败</div>
                </div>
                <div class="stat-card purple">
                    <div class="stat-icon">🕐</div>
                    <div class="stat-value" id="lastSync">-</div>
                    <div class="stat-label">上次同步</div>
                </div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <div class="card-title">同步操作</div>
        </div>
        <div style="padding: 16px;">
            <button class="btn btn-primary" onclick="syncAll()" style="width: 100%; margin-bottom: 12px;">
                <i class="fas fa-sync-alt"></i> 同步所有仓库
            </button>
            <button class="btn btn-secondary" onclick="syncFailed()" style="width: 100%; margin-bottom: 12px;">
                <i class="fas fa-redo"></i> 重新同步失败项
            </button>
            <button class="btn btn-secondary" onclick="fetchStatus()" style="width: 100%;">
                <i class="fas fa-refresh"></i> 刷新状态
            </button>
        </div>
    </div>

    <div class="section-title">同步日志</div>
    <div class="card">
        <div style="max-height: 400px; overflow-y: auto;">
            <div id="syncLog">
                <div class="loading" style="padding: 20px;">
                    <div class="spinner"></div>
                    <div style="color: var(--text-muted); font-size: 14px;">加载日志中...</div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    function fetchStatus() {
        fetch('/api/github/sync/status')
            .then(res => res.json())
            .then(data => {
                if (data.code === 200) {
                    document.getElementById('repoCount').textContent = data.data.repo_count || 0;
                    document.getElementById('syncSuccess').textContent = data.data.success_count || 0;
                    document.getElementById('syncFailed').textContent = data.data.failed_count || 0;
                    document.getElementById('lastSync').textContent = data.data.last_sync || '从未';
                }
            })
            .catch(err => console.error(err));
    }

    function syncAll() {
        fetch('/api/github/sync/all', { method: 'POST' })
            .then(res => res.json())
            .then(data => {
                if (data.code === 200) {
                    showToast('同步任务已启动');
                    fetchStatus();
                } else {
                    showToast(data.message || '同步失败');
                }
            })
            .catch(err => showToast('网络错误'));
    }

    function syncFailed() {
        fetch('/api/github/sync/failed', { method: 'POST' })
            .then(res => res.json())
            .then(data => {
                if (data.code === 200) {
                    showToast('重试失败项已启动');
                    fetchStatus();
                } else {
                    showToast(data.message || '重试失败');
                }
            })
            .catch(err => showToast('网络错误'));
    }

    function showToast(msg) {
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.textContent = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2000);
    }

    document.addEventListener('DOMContentLoaded', function() {
        fetchStatus();
    });
</script>
{% endblock %}
