<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#3b82f6">
    <meta name="description" content="MTSCOS AI 系统登录">
    <title>登录/注册 - MTSCOS AI 系统</title>
    
    <!-- 图标库 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <!-- 字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* 登录页面专用样式 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 480px;
        }
        
        .auth-ai-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            padding: 40px;
            width: 100%;
            animation: slideUp 0.6s ease-out;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .auth-header h2 {
            color: #2d3748;
            font-size: 28px;
            font-weight: 700;
            margin: 0 0 8px 0;
        }
        
        .auth-header p {
            color: #718096;
            font-size: 14px;
            margin: 0;
        }
        
        .auth-tabs {
            display: flex;
            margin-bottom: 24px;
            background: #f7fafc;
            border-radius: 12px;
            padding: 4px;
        }
        
        .auth-tab {
            flex: 1;
            padding: 12px 24px;
            text-align: center;
            border: none;
            background: transparent;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #718096;
        }
        
        .auth-tab.active {
            background: white;
            color: #3b82f6;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        
        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .form-group label {
            font-weight: 600;
            font-size: 14px;
            color: #2d3748;
        }
        
        .form-group input {
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #fafafa;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #3b82f6;
            background: white;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        
        .btn {
            padding: 14px 24px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3);
        }
        
        .w-full {
            width: 100%;
        }
        
        .auth-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: #718096;
        }
        
        .auth-footer a {
            color: #3b82f6;
            font-weight: 600;
            text-decoration: none;
        }
        
        .auth-footer a:hover {
            text-decoration: underline;
        }
        
        .error-message {
            background: #fed7d7;
            color: #c53030;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
            border: 1px solid #feb2b2;
        }
        
        .success-message {
            background: #c6f6d5;
            color: #22543d;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
            border: 1px solid #9ae6b4;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .auth-container {
                padding: 10px;
            }
            
            .auth-ai-card {
                padding: 24px;
            }
            
            .auth-header h2 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-ai-card">
            <div class="auth-header">
                <h2>登录/注册</h2>
                <p>MTSCOS AI 项目管理系统</p>
            </div>
            
            {% if error %}
            <div class="error-message">{{ error }}</div>
            {% endif %}
            
            {% if success %}
            <div class="success-message">{{ success }}</div>
            {% endif %}
            
            <div class="auth-tabs">
                <button class="auth-tab active" id="login-tab" onclick="switchTab('login')">登录</button>
                <button class="auth-tab" id="register-tab" onclick="switchTab('register')">注册</button>
            </div>
            
            <!-- 登录表单 -->
            <form class="auth-form" id="login-form" method="POST" action="/auth/login">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" name="username" required>
                </div>
                
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" name="password" required>
                </div>
                
                <!-- 多因素验证字段 -->
                <div class="form-group">
                    <label for="roll_code">滚码 (动态验证码)</label>
                    <input type="text" id="roll_code" name="roll_code" placeholder="可选 - 6位数字">
                </div>
                
                <div class="form-group">
                    <label for="unique_code">唯一码 (一次性验证码)</label>
                    <input type="text" id="unique_code" name="unique_code" placeholder="可选 - 8位字母数字">
                </div>
                
                <div class="form-group">
                    <label for="anti_fake_code">防伪码</label>
                    <input type="text" id="anti_fake_code" name="anti_fake_code" placeholder="可选 - 16位字母数字">
                </div>
                
                <div class="form-group">
                    <label for="db_id">数据库ID</label>
                    <input type="number" id="db_id" name="db_id" placeholder="可选 - 用户ID">
                </div>
                
                <div class="form-group">
                    <label for="vikey_hardware_id">Vikey硬件码</label>
                    <input type="text" id="vikey_hardware_id" name="vikey_hardware_id" placeholder="可选 - Vikey硬件ID">
                </div>
                
                <div class="form-group">
                    <label for="whitelist_token">白名单Token (可选 - 可以直接登录)</label>
                    <input type="text" id="whitelist_token" name="whitelist_token" placeholder="可选 - 白名单Token">
                </div>
                
                <button type="submit" class="btn btn-primary w-full">登录</button>
            </form>
            
            <!-- 注册表单 -->
            <form class="auth-form" id="register-form" method="POST" action="{{ url_for('register') }}" style="display: none;">
                <div class="form-group">
                    <label for="reg_username">用户名</label>
                    <input type="text" id="reg_username" name="username" required>
                </div>
                
                <div class="form-group">
                    <label for="reg_email">邮箱</label>
                    <input type="email" id="reg_email" name="email" required>
                </div>
                
                <div class="form-group">
                    <label for="reg_password">密码</label>
                    <input type="password" id="reg_password" name="password" required>
                </div>
                
                <div class="form-group">
                    <label for="reg_confirm_password">确认密码</label>
                    <input type="password" id="reg_confirm_password" name="confirm_password" required>
                </div>
                
                <button type="submit" class="btn btn-primary w-full">注册</button>
            </form>
            
            <div class="auth-footer">
            </div>
        </div>
    </div>
    
    <script>
        function switchTab(tabName) {
            // 切换标签样式
            document.querySelectorAll('.auth-tab').forEach(tab => tab.classList.remove('active'));
            document.getElementById(tabName + '-tab').classList.add('active');
            
            // 切换表单显示
            document.getElementById('login-form').style.display = tabName === 'login' ? 'flex' : 'none';
            document.getElementById('register-form').style.display = tabName === 'register' ? 'flex' : 'none';
        }
        
        // 自动检测URL参数中的错误类型，切换到对应标签
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const error = urlParams.get('error');
            
            if (error === 'register') {
                switchTab('register');
            }
        });
    </script>
</body>
</html>
