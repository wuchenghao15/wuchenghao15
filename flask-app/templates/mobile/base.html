<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="stylesheet" href="/assets/css/mtscos-design-system.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#6366f1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>{% block title %}MTSCOS AI{% endblock %}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --primary: #6366f1;
            --primary-light: #818cf8;
            --primary-dark: #4f46e5;
            --secondary: #ec4899;
            --accent: #14b8a6;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --dark: #0f0f1a;
            --dark-card: rgba(15, 23, 42, 0.85);
            --glass: rgba(30, 41, 59, 0.7);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(180deg, #0f0f1a 0%, #1e1b4b 50%, #17172e 100%);
            color: var(--text-primary);
            min-height: 100vh;
            padding-top: var(--safe-top);
            padding-bottom: calc(68px + var(--safe-bottom));
            -webkit-font-smoothing: antialiased;
        }

        .page-container {
            padding: 16px;
            max-width: 480px;
            margin: 0 auto;
        }

        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: calc(56px + var(--safe-top));
            padding-top: var(--safe-top);
            background: rgba(15, 15, 26, 0.92);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-left: 16px;
            padding-right: 16px;
            z-index: 100;
        }

        .header-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .header-back {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            cursor: pointer;
            font-size: 20px;
            transition: all 0.2s;
        }

        .header-back:hover, .header-back:active {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(0.95);
        }

        .header-action {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            cursor: pointer;
            font-size: 20px;
            transition: all 0.2s;
            position: relative;
        }

        .header-action:hover, .header-action:active {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(0.95);
        }

        .header-badge {
            position: absolute;
            top: 6px;
            right: 6px;
            min-width: 16px;
            height: 16px;
            background: var(--danger);
            color: white;
            font-size: 10px;
            font-weight: 600;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
        }

        .tab-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: calc(68px + var(--safe-bottom));
            padding-bottom: var(--safe-bottom);
            background: rgba(15, 15, 26, 0.96);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-around;
            z-index: 100;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.3);
        }

        .tab-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6px 0;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            min-height: 60px;
        }

        .tab-item.active {
            color: var(--primary-light);
            transform: translateY(-2px);
        }

        .tab-item-icon {
            font-size: 24px;
            margin-bottom: 4px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .tab-item.active .tab-item-icon {
            transform: scale(1.1);
            filter: drop-shadow(0 0 8px rgba(99, 102, 241, 0.5));
        }

        .tab-item-text {
            font-size: 11px;
            color: var(--text-secondary);
            font-weight: 500;
            transition: all 0.2s;
        }

        .tab-item.active .tab-item-text {
            color: var(--primary-light);
            font-weight: 600;
        }

        .tab-indicator {
            position: absolute;
            bottom: 0;
            width: 24px;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 2px;
            opacity: 0;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .tab-item.active .tab-indicator {
            opacity: 1;
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 12px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card:active {
            transform: scale(0.98);
            border-color: rgba(99, 102, 241, 0.3);
        }

        .card:hover {
            border-color: rgba(99, 102, 241, 0.2);
        }

        .gradient-card {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
        }

        .gradient-card-alt {
            background: linear-gradient(135deg, var(--accent), var(--success));
            border: none;
        }

        .gradient-card-warning {
            background: linear-gradient(135deg, var(--warning), #d97706);
            border: none;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px 24px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            min-height: 48px;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .btn:active::before {
            left: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
        }

        .btn-primary:active {
            transform: scale(0.98);
            box-shadow: 0 2px 10px rgba(99, 102, 241, 0.3);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:active {
            background: rgba(255, 255, 255, 0.15);
        }

        .btn-warning {
            background: linear-gradient(135deg, var(--warning), #d97706);
            color: white;
            box-shadow: 0 4px 20px rgba(245, 158, 11, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--danger), #dc2626);
            color: white;
            box-shadow: 0 4px 20px rgba(239, 68, 68, 0.4);
        }

        .input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.3);
            color: var(--text-primary);
            font-size: 16px;
            outline: none;
            transition: all 0.2s;
        }

        .input:focus {
            border-color: var(--primary);
            background: rgba(0, 0, 0, 0.4);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .input::placeholder {
            color: var(--text-secondary);
        }

        .label {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            display: block;
        }

        .stat-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 0;
            border-bottom: 1px solid var(--border);
        }

        .stat-row:last-child {
            border-bottom: none;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .stat-value {
            color: var(--text-primary);
            font-size: 16px;
            font-weight: 600;
        }

        .tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .tag-blue { background: rgba(99, 102, 241, 0.2); color: var(--primary-light); }
        .tag-green { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
        .tag-yellow { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
        .tag-red { background: rgba(239, 68, 68, 0.2); color: #f87171; }
        .tag-purple { background: rgba(168, 85, 247, 0.2); color: #c084fc; }
        .tag-cyan { background: rgba(6, 182, 212, 0.2); color: #22d3ee; }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .avatar-lg {
            width: 72px;
            height: 72px;
            font-size: 28px;
            border: 3px solid rgba(255, 255, 255, 0.3);
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            border-radius: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }
        .gap-4 { gap: 16px; }
        .gap-3 { gap: 12px; }
        .gap-2 { gap: 8px; }
        .mb-4 { margin-bottom: 16px; }
        .mb-3 { margin-bottom: 12px; }
        .mb-2 { margin-bottom: 8px; }
        .mt-4 { margin-top: 16px; }
        .mt-2 { margin-top: 8px; }
        .text-center { text-align: center; }
        .text-sm { font-size: 14px; }
        .text-xs { font-size: 12px; }
        .text-gray { color: var(--text-secondary); }
        .text-primary { color: var(--primary-light); }
        .text-success { color: var(--success); }
        .text-warning { color: var(--warning); }
        .text-danger { color: var(--danger); }
        .font-bold { font-weight: 600; }
        .font-semibold { font-weight: 500; }

        .animate-fade-in {
            animation: fadeIn 0.3s ease;
        }

        .animate-slide-up {
            animation: slideUp 0.3s ease;
        }

        .animate-pulse {
            animation: pulse 2s infinite;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            padding: 16px;
            animation: fadeIn 0.2s ease;
        }

        .modal {
            background: var(--dark-card);
            border: 1px solid var(--border);
            border-radius: 24px;
            width: 100%;
            max-width: 340px;
            padding: 24px;
            animation: slideUp 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .modal-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 12px;
            text-align: center;
        }

        .modal-content {
            font-size: 14px;
            color: var(--text-secondary);
            text-align: center;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
        }

        .modal-actions .btn {
            flex: 1;
            padding: 12px;
            font-size: 14px;
            border-radius: 12px;
        }

        .toast-container {
            position: fixed;
            top: calc(56px + var(--safe-top) + 16px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 300;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }

        .toast {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 20px;
            color: var(--text-primary);
            font-size: 14px;
            white-space: nowrap;
            animation: slideDown 0.3s ease, fadeOut 0.3s ease 1.7s forwards;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-icon {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.4;
            color: var(--text-secondary);
        }

        .empty-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .divider {
            height: 1px;
            background: var(--border);
            margin: 16px 0;
        }

        .skeleton {
            background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.05) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 8px;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body>
    {% block content %}{% endblock %}
    
    {% if current_page != 'login' %}
    <div class="tab-bar">
        <div class="tab-item {% if current_page == 'home' %}active{% endif %}" onclick="location.href='/mobile/home'">
            <div class="tab-item-icon"><i class="fas fa-home"></i></div>
            <div class="tab-item-text">首页</div>
            <div class="tab-indicator"></div>
        </div>
        <div class="tab-item {% if current_page == 'exam' %}active{% endif %}" onclick="location.href='/mobile/exam'">
            <div class="tab-item-icon"><i class="fas fa-file-alt"></i></div>
            <div class="tab-item-text">考试</div>
            <div class="tab-indicator"></div>
        </div>
        <div class="tab-item {% if current_page == 'ai_learning' %}active{% endif %}" onclick="location.href='/mobile/ai_learning'">
            <div class="tab-item-icon"><i class="fas fa-brain"></i></div>
            <div class="tab-item-text">AI学习</div>
            <div class="tab-indicator"></div>
        </div>
        <div class="tab-item {% if current_page == 'training' %}active{% endif %}" onclick="location.href='/mobile/training'">
            <div class="tab-item-icon"><i class="fas fa-chart-line"></i></div>
            <div class="tab-item-text">训练</div>
            <div class="tab-indicator"></div>
        </div>
        <div class="tab-item {% if current_page == 'profile' %}active{% endif %}" onclick="location.href='/mobile/profile'">
            <div class="tab-item-icon"><i class="fas fa-user"></i></div>
            <div class="tab-item-text">我的</div>
            <div class="tab-indicator"></div>
        </div>
    </div>
    {% endif %}

    <script src="/assets/font-awesome/js/all.min.js"></script>
    <script>
        function showModal(title, content, onConfirm, onCancel) {
            var modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.innerHTML = `
                <div class="modal">
                    <div class="modal-title">${title}</div>
                    <div class="modal-content">${content}</div>
                    <div class="modal-actions">
                        <button class="btn btn-secondary" onclick="handleModalCancel()">取消</button>
                        <button class="btn btn-primary" onclick="handleModalConfirm()">确定</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            
            window.handleModalConfirm = function() {
                modal.remove();
                if (onConfirm) onConfirm();
            };
            
            window.handleModalCancel = function() {
                modal.remove();
                if (onCancel) onCancel();
            };
        }

        function showToast(message, type = 'info') {
            var container = document.querySelector('.toast-container');
            if (!container) {
                container = document.createElement('div');
                container.className = 'toast-container';
                document.body.appendChild(container);
            }
            
            var toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            
            if (type === 'success') {
                toast.style.borderColor = 'var(--success)';
            } else if (type === 'error') {
                toast.style.borderColor = 'var(--danger)';
            } else if (type === 'warning') {
                toast.style.borderColor = 'var(--warning)';
            }
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 2000);
        }

        async function fetchData(url, options = {}) {
            try {
                var response = await fetch(url, {
                    ...options,
                    headers: {
                        'Content-Type': 'application/json',
                        ...options.headers
                    }
                });
                return await response.json();
            } catch (error) {
                console.error('Fetch error:', error);
                showToast('网络请求失败', 'error');
                return { success: false, error: '网络请求失败' };
            }
        }

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            var date = new Date(dateStr);
            var now = new Date();
            var diff = now - date;
            
            if (diff < 60000) return '刚刚';
            if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
            if (diff < 86400000) return Math.floor(diff / 3600000) + '小时前';
            if (diff < 604800000) return Math.floor(diff / 86400000) + '天前';
            
            return date.getMonth() + 1 + '月' + date.getDate() + '日';
        }

        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = '/mobile/home';
            }
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
