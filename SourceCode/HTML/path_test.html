<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>路径测试</title>
    <script>
        // 测试各种文件路径
        function testPaths() {
            console.log('开始测试文件路径...');
            
            const paths = [
                '../CSS/main.css',
                '../CSS/dashboard.css',
                '../JavaScript/error_handler.js',
                '../JavaScript/check_links.js',
                '../JavaScript/load_footer.js',
                '../JavaScript/MyScript/anti_hotlink_encrypted.js'
            ];
            
            paths.forEach(path => {
                fetch(path)
                    .then(response => {
                        if (response.ok) {
                            console.log(`✅ 成功访问: ${path}`);
                        } else {
                            console.error(`❌ 访问失败: ${path}, 状态码: ${response.status}`);
                        }
                    })
                    .catch(error => {
                        console.error(`❌ 请求错误: ${path}, 错误: ${error.message}`);
                    });
            });
        }
        
        window.addEventListener('DOMContentLoaded', testPaths);
    </script>
</head>
<body>
    <h1>路径测试页面</h1>
    <p>请查看控制台输出以了解文件访问状态</p>
</body>
</html>
