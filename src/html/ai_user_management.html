<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 用户管理系统</title>
    <link rel="stylesheet" href="/assets/css/ai_user_management.css">
    <link rel="stylesheet" href="assets/css/theme.css"></head>
<body>
    <div class="container">
        <h1>AI 用户管理系统</h1>

        <!-- 统计卡片 -->
        <div class="dashboard-grid">
            <div class="card">
                <h2>系统概览</h2>
                <div class="stats" id="systemStats">
                    <!-- 统计数据将通过JS动态生成 -->
                </div>
            </div>
        </div>

        <!-- AI接管提示 -->
        <div class="ai-prompt" id="aiPrompt">
            <strong>AI提示：</strong> <span id="aiPromptMessage">AI正在管理此操作，将提供智能优化建议</span>
        </div>

        <!-- 选项卡 -->
        <div class="tabs">
            <button class="tab active" data-tab="user-actions">用户操作记录</button>
            <button class="tab" data-tab="login-demo">登录演示</button>
            <button class="tab" data-tab="register-demo">注册演示</button>
            <button class="tab" data-tab="user-management">用户管理</button>
            <button class="tab" data-tab="ai-settings">AI设置</button>
        </div>

        <!-- 用户操作记录 -->
        <div class="tab-content active" id="user-actions">
            <h2>用户操作记录</h2>
            <div style="margin-bottom: 20px;">
                <button class="btn btn-primary" onclick="refreshUserActions()">刷新记录</button>
                <button class="btn btn-primary" onclick="clearUserActions()">清除记录</button>
            </div>
            <div id="userActions" style="max-height: 500px; overflow-y: auto;">
                <!-- 用户操作记录将通过JS动态生成 -->
            </div>
        </div>

        <!-- 登录演示 -->
        <div class="tab-content" id="login-demo">
            <h2>登录演示</h2>
            <div style="max-width: 500px; margin: 0 auto;">
                <form onsubmit="return false;">
                    <div class="form-group">
                        <label for="loginUsername">用户名</label>
                        <input type="text" id="loginUsername" placeholder="请输入用户名" required>
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">密码</label>
                        <input type="password" id="loginPassword" placeholder="请输入密码" required>
                    </div>
                    <div style="text-align: center; margin-top: 20px;">
                        <button class="btn btn-primary" onclick="performLogin()">登录</button>
                    </div>
                </form>
                <div id="loginResult" style="margin-top: 20px;"></div>
            </div>
        </div>

        <!-- 注册演示 -->
        <div class="tab-content" id="register-demo">
            <h2>注册演示</h2>
            <div style="max-width: 500px; margin: 0 auto;">
                <form onsubmit="return false;">
                    <div class="form-group">
                        <label for="registerUsername">用户名</label>
                        <input type="text" id="registerUsername" placeholder="请输入用户名" required>
                    </div>
                    <div class="form-group">
                        <label for="registerEmail">邮箱</label>
                        <input type="email" id="registerEmail" placeholder="请输入邮箱" required>
                    </div>
                    <div class="form-group">
                        <label for="registerPassword">密码</label>
                        <input type="password" id="registerPassword" placeholder="请输入密码" required>
                    </div>
                    <div style="text-align: center; margin-top: 20px;">
                        <button class="btn btn-primary" onclick="performRegister()">注册</button>
                    </div>
                </form>
                <div id="registerResult" style="margin-top: 20px;"></div>
            </div>
        </div>

        <!-- 用户管理 -->
        <div class="tab-content" id="user-management">
            <h2>用户管理</h2>
            <div style="margin-bottom: 20px;">
                <button class="btn btn-primary" onclick="refreshUsers()">刷新用户列表</button>
            </div>
            <table id="usersTable">
                <thead>
                    <tr>
                        <th>用户名</th>
                        <th>邮箱</th>
                        <th>角色</th>
                        <th>创建时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- 用户列表将通过JS动态生成 -->
                </tbody>
            </table>
        </div>

        <!-- AI设置 -->
        <div class="tab-content" id="ai-settings">
            <h2>AI 设置</h2>
            <div style="max-width: 600px;">
                <div class="form-group">
                    <label for="aiTakeoverEnabled">启用AI接管提示</label>
                    <select id="aiTakeoverEnabled">
                        <option value="true">启用</option>
                        <option value="false">禁用</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="aiTakeoverMessage">AI接管提示消息</label>
                    <input type="text" id="aiTakeoverMessage" placeholder="请输入AI提示消息">
                </div>
                <div class="form-group">
                    <label for="aiRiskThreshold">AI风险阈值</label>
                    <input type="range" id="aiRiskThreshold" min="0" max="1" step="0.1" value="0.7">
                    <span id="riskThresholdValue">0.7</span>
                </div>
                <div style="text-align: center; margin-top: 20px;">
                    <button class="btn btn-primary" onclick="saveAISettings()">保存设置</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/assets/js/ai_user_management.js" async></script>
</body>
</html>
