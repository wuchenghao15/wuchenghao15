<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arduino设计页面</title>
    <link href="/assets/vendor/fontawesome/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1e3a5f 0%, #2d5a87 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }
        .container {
            text-align: center;
            color: white;
            padding: 40px;
        }
        .icon {
            font-size: 80px;
            margin-bottom: 20px;
            color: #00d4ff;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
        }
        .subtitle {
            font-size: 1.2rem;
            opacity: 0.8;
            margin-bottom: 30px;
        }
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .menu-item {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 30px;
            transition: transform 0.3s, background 0.3s;
            cursor: pointer;
        }
        .menu-item:hover {
            transform: translateY(-5px);
            background: rgba(255,255,255,0.2);
        }
        .menu-item i {
            font-size: 40px;
            margin-bottom: 15px;
            color: #00d4ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon"><i class="fas fa-microchip"></i></div>
        <h1>Arduino 设计工作室</h1>
        <div class="subtitle">欢迎来到设计师专属页面</div>
        
        <div class="menu-grid">
            <div class="menu-item">
                <i class="fas fa-wrench"></i>
                <div>Arduino设计</div>
            </div>
            <div class="menu-item">
                <i class="fas fa-folder-open"></i>
                <div>项目管理</div>
            </div>
            <div class="menu-item">
                <i class="fas fa-box"></i>
                <div>组件库</div>
            </div>
            <div class="menu-item">
                <i class="fas fa-code"></i>
                <div>代码编辑器</div>
            </div>
        </div>
    </div>
</body>
</html>
