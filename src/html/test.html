<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTSCOS - 系统测试页面</title>
    <style>
        body { font-family: system-ui; padding: 20px; background: #0f172a; color: #fff; }
        .status { padding: 10px; margin: 10px 0; border-radius: 8px; }
        .success { background: #22c55e; }
        .error { background: #ef4444; }
    </style>
</head>
<body>
    <h1>MTSCOS AI System - 测试页面</h1>
    <div id="status"></div>
    <script>
        const status = document.getElementById('status');
        async function test() {
            try {
                const r1 = await fetch('config/ai-employees.json');
                const data = await r1.json();
                status.innerHTML = '<div class="success">✓ 系统正常 - AI员工: ' + data.team_stats.total_members + '人</div>';
            } catch (e) {
                status.innerHTML = '<div class="error">✗ 错误: ' + e.message + '</div>';
            }
        }
        test();
    </script>
</body>
</html>
