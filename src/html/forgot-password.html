<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTSCOS AI - 忘记密码</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #fff;
        }
        .forgot-container {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .forgot-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .forgot-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .forgot-header h1 { font-size: 22px; margin-bottom: 8px; color: #fff; }
        .forgot-header p { font-size: 14px; color: rgba(255, 255, 255, 0.6); }
        .step-indicator { display: flex; justify-content: center; margin-bottom: 24px; gap: 8px; }
        .step-dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255, 255, 255, 0.2); transition: all 0.3s; }
        .step-dot.active { background: #667eea; transform: scale(1.2); }
        .progress-text { text-align: center; font-size: 12px; color: rgba(255, 255, 255, 0.5); margin-bottom: 20px; }
        .step { display: none; }
        .step.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .step-title { font-size: 16px; font-weight: 600; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
        .step-number { width: 24px; height: 24px; background: rgba(102, 126, 234, 0.3); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #667eea; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; margin-bottom: 6px; color: rgba(255, 255, 255, 0.8); }
        .form-group input, .form-group select {
            width: 100%; padding: 12px; border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 8px;
            background: rgba(255, 255, 255, 0.05); color: #fff; font-size: 14px; transition: border-color 0.3s;
        }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #667eea; }
        .form-group input::placeholder { color: rgba(255, 255, 255, 0.3); }
        .captcha-group { display: flex; gap: 10px; }
        .captcha-group input { flex: 1; }
        .captcha-display {
            min-width: 90px; padding: 12px; background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 8px;
            text-align: center; font-size: 14px; font-weight: 600; letter-spacing: 2px;
            cursor: pointer; user-select: none;
        }
        .captcha-display:hover { background: rgba(255, 255, 255, 0.15); }
        .password-input-group { position: relative; }
        .toggle-password {
            position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
            background: none; border: none; color: rgba(255, 255, 255, 0.5); cursor: pointer; font-size: 14px;
        }
        .password-strength { margin-top: 8px; font-size: 11px; color: rgba(255, 255, 255, 0.5); }
        .strength-bar { height: 3px; background: rgba(255, 255, 255, 0.1); border-radius: 2px; margin-top: 4px; display: flex; gap: 2px; }
        .strength-segment { flex: 1; border-radius: 2px; }
        .strength-segment.weak { background: #ef4444; }
        .strength-segment.fair { background: #f59e0b; }
        .strength-segment.good { background: #22c55e; }
        .strength-segment.strong { background: #10b981; }
        .form-actions { display: flex; gap: 10px; margin-top: 24px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.3s; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3); }
        .btn-secondary { background: rgba(255, 255, 255, 0.1); color: rgba(255, 255, 255, 0.8); }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.15); }
        .error-message { color: #ef4444; font-size: 11px; margin-top: 4px; display: none; }
        .error-message.show { display: block; }
        .success-message { text-align: center; padding: 30px 20px; display: none; }
        .success-message.show { display: block; }
        .success-icon {
            width: 50px; height: 50px; margin: 0 auto 15px;
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
        }
        .success-message h3 { margin-bottom: 8px; font-size: 18px; }
        .success-message p { font-size: 13px; color: rgba(255, 255, 255, 0.6); margin-bottom: 20px; }
        .back-link { text-align: center; margin-top: 20px; padding-top: 20px; border-top: 1px solid rgba(255, 255, 255, 0.1); }
        .back-link a { color: #667eea; text-decoration: none; font-size: 13px; }
        .back-link a:hover { text-decoration: underline; }
        .security-notice {
            background: rgba(251, 191, 36, 0.1); border-left: 2px solid #fbbf24;
            padding: 10px 12px; border-radius: 0 4px 4px 0; margin-bottom: 20px;
            font-size: 12px; color: rgba(255, 255, 255, 0.7);
        }
        .sync-status {
            font-size: 11px; color: rgba(255, 255, 255, 0.4);
            text-align: center; margin-top: 10px;
        }
        .loading-spinner {
            display: none; width: 20px; height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-top-color: #667eea; border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 420px) { .forgot-container { padding: 25px; } .form-actions { flex-direction: column; } .btn { width: 100%; } }
    </style>
</head>
<body>
    <div class="forgot-container">
        <div class="forgot-header">
            <div class="forgot-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            </div>
            <h1>忘记密码</h1>
            <p>请按照步骤重置您的密码</p>
        </div>
        <div class="progress-text" id="progress-text">步骤 1/3</div>
        <div class="step-indicator">
            <div class="step-dot active" id="step-dot-1"></div>
            <div class="step-dot" id="step-dot-2"></div>
            <div class="step-dot" id="step-dot-3"></div>
        </div>
        <div class="security-notice">请确保在安全网络环境下操作，重置密码后请妥善保管新密码</div>

        <div class="step active" id="step1">
            <div class="step-title"><span class="step-number">1</span>验证身份</div>
            <div class="form-group"><label>用户名</label><input type="text" id="username" placeholder="请输入用户名" required><div class="error-message" id="username-error"></div></div>
            <div class="form-group"><label>电子邮箱</label><input type="email" id="email" placeholder="请输入电子邮箱" required><div class="error-message" id="email-error"></div></div>
            <div class="form-group"><label>验证码</label><div class="captcha-group"><input type="text" id="captcha" placeholder="验证码" required maxlength="4"><div class="captcha-display" id="captcha-display">点击刷新</div></div><div class="error-message" id="captcha-error"></div></div>
            <div class="form-actions"><button class="btn btn-secondary" onclick="window.location.href='index.html'">返回登录</button><button class="btn btn-primary" onclick="nextStep(1)">下一步</button></div>
            <div class="loading-spinner" id="step1-loading"></div>
        </div>

        <div class="step" id="step2">
            <div class="step-title"><span class="step-number">2</span>安全验证</div>
            <div class="form-group"><label>安全问题</label><select id="security-question" required><option value="">请选择安全问题</option><option value="birth-city">您的出生城市是什么？</option><option value="elementary-school">您的小学名称是什么？</option><option value="first-pet">您的第一只宠物叫什么名字？</option><option value="mother-maiden-name">您母亲的姓氏是什么？</option><option value="favorite-movie">您最喜欢的电影是什么？</option></select><div class="error-message" id="security-question-error"></div></div>
            <div class="form-group"><label>安全答案</label><input type="text" id="security-answer" placeholder="请输入答案" required><div class="error-message" id="security-answer-error"></div></div>
            <div class="form-actions"><button class="btn btn-secondary" onclick="prevStep()">上一步</button><button class="btn btn-primary" onclick="nextStep(2)">下一步</button></div>
            <div class="loading-spinner" id="step2-loading"></div>
        </div>

        <div class="step" id="step3">
            <div class="step-title"><span class="step-number">3</span>设置新密码</div>
            <div class="form-group"><label>新密码</label><div class="password-input-group"><input type="password" id="new-password" placeholder="请设置新密码" required><button class="toggle-password" onclick="togglePassword('new-password')"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg></button></div><div class="error-message" id="new-password-error"></div><div class="password-strength"><div id="strength-text"></div><div class="strength-bar"><div class="strength-segment"></div><div class="strength-segment"></div><div class="strength-segment"></div><div class="strength-segment"></div></div></div></div>
            <div class="form-group"><label>确认新密码</label><div class="password-input-group"><input type="password" id="confirm-password" placeholder="请再次输入" required><button class="toggle-password" onclick="togglePassword('confirm-password')"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg></button></div><div class="error-message" id="confirm-password-error"></div></div>
            <div class="form-actions"><button class="btn btn-secondary" onclick="prevStep()">上一步</button><button class="btn btn-primary" onclick="resetPassword()">重置密码</button></div>
            <div class="loading-spinner" id="step3-loading"></div>
        </div>

        <div class="success-message" id="success-message">
            <div class="success-icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></div>
            <h3>密码重置成功！</h3>
            <p>您的密码已成功更新</p>
            <div class="sync-status" id="sync-status">正在同步数据...</div>
            <button class="btn btn-primary" style="width:100%" onclick="window.location.href='index.html'">返回登录</button>
        </div>

        <div class="back-link"><a href="index.html">返回登录页面</a></div>
    </div>

    <script src="assets/js/core/database-manager.js"></script>
    <script src="assets/js/core/data-sync-service.js"></script>
    <script>
        var currentStep = 1;
        var captchaCode = '';
        var currentUser = null;
        var resetRecordId = null;
        var database = null;
        var syncService = null;

        function initDatabase() {
            try {
                database = new DatabaseManager();
                syncService = new DataSyncService(database);
            } catch (e) {
                console.warn('数据库初始化失败:', e.message);
            }
        }

        async function waitForDatabase() {
            if (!database) {
                initDatabase();
            }
            if (database && typeof database.waitForReady === 'function') {
                await database.waitForReady();
            }
        }

        function generateCaptcha() {
            var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789';
            var code = '';
            for (var i = 0; i < 4; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
            captchaCode = code;
            document.getElementById('captcha-display').textContent = code;
        }

        function nextStep(step) {
            if (!validateStep(step)) return;
            showLoading(step);
            processStep(step);
        }

        async function processStep(step) {
            try {
                if (step === 1) {
                    await verifyUserIdentity();
                } else if (step === 2) {
                    await verifySecurityQuestion();
                }
                currentStep = step + 1;
                showStep(currentStep);
            } catch (error) {
                showError(step === 1 ? 'email-error' : 'security-answer-error', error.message);
            } finally {
                hideLoading(step);
            }
        }

        async function verifyUserIdentity() {
            await waitForDatabase();
            var username = document.getElementById('username').value.trim();
            var email = document.getElementById('email').value.trim();

            if (!database) {
                currentUser = { userId: username, email: email };
                await createResetRecord(username, email, 'pending');
                return;
            }

            var profiles = await database.getAll('user_profiles');
            var user = profiles.find(p => p.username === username && p.email === email);

            if (!user) {
                profiles = await database.getAllByIndex('user_profiles', 'email', email);
                user = profiles.find(p => p.email === email);
            }

            if (!user) {
                throw new Error('用户名或邮箱不存在');
            }

            currentUser = user;
            await createResetRecord(user.userId, user.email, 'pending');
        }

        async function verifySecurityQuestion() {
            await waitForDatabase();
            var question = document.getElementById('security-question').value;
            var answer = document.getElementById('security-answer').value.trim();

            if (!currentUser || !currentUser.securityQuestions) {
                await updateResetRecord('verified');
                return;
            }

            var securityAnswer = currentUser.securityQuestions[question];
            if (!securityAnswer || securityAnswer.toLowerCase() !== answer.toLowerCase()) {
                throw new Error('安全答案不正确');
            }

            await updateResetRecord('verified');
        }

        async function createResetRecord(userId, email, status) {
            if (database && typeof database.addPasswordResetRecord === 'function') {
                await database.addPasswordResetRecord(userId, email, status, {
                    step: currentStep,
                    username: document.getElementById('username').value.trim()
                });
            }
        }

        async function updateResetRecord(status) {
            if (database && typeof database.updatePasswordResetRecord === 'function') {
                await database.updatePasswordResetRecord(resetRecordId, status, {
                    step: currentStep,
                    timestamp: Date.now()
                });
            }
        }

        function prevStep() {
            if (currentStep > 1) { currentStep--; showStep(currentStep); }
        }

        function showStep(step) {
            document.querySelectorAll('.step').forEach(function(s) { s.style.display = 'none'; });
            document.querySelectorAll('.step-dot').forEach(function(d) { d.classList.remove('active'); });
            document.getElementById('step' + step).style.display = 'block';
            document.getElementById('step-dot-' + step).classList.add('active');
            for (var i = 1; i < step; i++) document.getElementById('step-dot-' + i).classList.add('active');
            document.getElementById('progress-text').textContent = '步骤 ' + step + '/3';
        }

        function validateStep(step) {
            var isValid = true;
            if (step === 1) {
                var username = document.getElementById('username').value.trim();
                var email = document.getElementById('email').value.trim();
                var captcha = document.getElementById('captcha').value.trim().toUpperCase();
                hideError('username-error'); hideError('email-error'); hideError('captcha-error');
                if (!username) { showError('username-error', '请输入用户名'); isValid = false; }
                if (!email) { showError('email-error', '请输入电子邮箱'); isValid = false; }
                if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showError('email-error', '请输入有效的电子邮箱'); isValid = false; }
                if (!captcha) { showError('captcha-error', '请输入验证码'); isValid = false; }
                if (captcha !== captchaCode) { showError('captcha-error', '验证码错误'); generateCaptcha(); isValid = false; }
            } else if (step === 2) {
                var question = document.getElementById('security-question').value;
                var answer = document.getElementById('security-answer').value.trim();
                hideError('security-question-error'); hideError('security-answer-error');
                if (!question) { showError('security-question-error', '请选择安全问题'); isValid = false; }
                if (!answer) { showError('security-answer-error', '请输入安全答案'); isValid = false; }
            }
            return isValid;
        }

        function validateStep3() {
            var newPassword = document.getElementById('new-password').value;
            var confirmPassword = document.getElementById('confirm-password').value;
            hideError('new-password-error'); hideError('confirm-password-error');
            if (!newPassword) { showError('new-password-error', '请输入新密码'); return false; }
            if (newPassword.length < 6) { showError('new-password-error', '密码长度至少6位'); return false; }
            if (!/[a-zA-Z]/.test(newPassword) || !/\d/.test(newPassword)) { showError('new-password-error', '密码需包含字母和数字'); return false; }
            if (!confirmPassword) { showError('confirm-password-error', '请确认新密码'); return false; }
            if (newPassword !== confirmPassword) { showError('confirm-password-error', '两次输入的密码不一致'); return false; }
            return true;
        }

        function togglePassword(fieldId) {
            var field = document.getElementById(fieldId);
            field.type = field.type === 'password' ? 'text' : 'password';
        }

        async function resetPassword() {
            if (!validateStep3()) return;
            showLoading(3);

            try {
                var newPassword = document.getElementById('new-password').value;
                
                await waitForDatabase();

                if (database && currentUser) {
                    var updatedProfile = {
                        ...currentUser,
                        password: newPassword,
                        updatedAt: Date.now(),
                        lastPasswordChange: Date.now(),
                        passwordVersion: (currentUser.passwordVersion || 0) + 1
                    };
                    await database.saveUserProfile(currentUser.userId, updatedProfile);
                }

                if (database && typeof database.updatePasswordResetRecord === 'function') {
                    await database.updatePasswordResetRecord(resetRecordId, 'success', {
                        passwordChanged: true,
                        timestamp: Date.now()
                    });
                }

                if (database && typeof database.addLog === 'function') {
                    await database.addLog('用户密码重置成功', 'info', 'forgot-password', {
                        userId: currentUser?.userId,
                        email: currentUser?.email
                    });
                }

                document.querySelectorAll('.step').forEach(function(s) { s.style.display = 'none'; });
                document.getElementById('success-message').style.display = 'block';

                await syncData();

            } catch (error) {
                showError('new-password-error', '密码重置失败: ' + error.message);
                if (database && typeof database.updatePasswordResetRecord === 'function') {
                    await database.updatePasswordResetRecord(resetRecordId, 'failed', {
                        error: error.message,
                        timestamp: Date.now()
                    });
                }
            } finally {
                hideLoading(3);
            }
        }

        async function syncData() {
            try {
                if (syncService && typeof syncService.performSync === 'function') {
                    await syncService.performSync();
                    document.getElementById('sync-status').textContent = '数据同步完成';
                } else {
                    document.getElementById('sync-status').textContent = '数据已保存';
                }
            } catch (e) {
                document.getElementById('sync-status').textContent = '数据同步中...';
            }
        }

        function showLoading(step) {
            document.getElementById('step' + step + '-loading').style.display = 'block';
        }

        function hideLoading(step) {
            document.getElementById('step' + step + '-loading').style.display = 'none';
        }

        function showError(id, message) { document.getElementById(id).textContent = message; document.getElementById(id).style.display = 'block'; }
        function hideError(id) { document.getElementById(id).style.display = 'none'; }

        document.getElementById('new-password').addEventListener('input', function(e) {
            var pwd = e.target.value;
            var strength = 0;
            var segments = document.querySelectorAll('.strength-segment');
            segments.forEach(function(s) { s.className = 'strength-segment'; });
            if (!pwd) { document.getElementById('strength-text').textContent = ''; return; }
            if (pwd.length >= 6) strength++;
            if (pwd.length >= 10) strength++;
            if (/[a-zA-Z]/.test(pwd) && /\d/.test(pwd)) strength++;
            if (/[!@#$%^&*()_+\-=\[\]{}|;:,.<>?]/.test(pwd)) strength++;
            segments.forEach(function(s, i) {
                if (i < strength) s.classList.add(strength === 1 ? 'weak' : strength === 2 ? 'fair' : strength === 3 ? 'good' : 'strong');
            });
            var messages = ['', '密码较弱', '密码一般', '密码良好', '密码强度高'];
            document.getElementById('strength-text').textContent = messages[strength];
        });

        document.getElementById('captcha-display').addEventListener('click', generateCaptcha);
        window.addEventListener('DOMContentLoaded', function() {
            initDatabase();
            generateCaptcha();
        });
    </script>
</body>
</html>
