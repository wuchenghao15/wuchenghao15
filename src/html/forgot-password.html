<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="MTSCOS AI 项目管理系统 - 重设密码">
    <meta name="keywords" content="MTSCOS, AI项目, 管理系统, 重设密码, 忘记密码">
    <title>MTSCOS - 重设密码</title>
    
    <!-- 兼容性meta标签 -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no, email=no">
    <meta name="msapplication-tap-highlight" content="no">
    <!-- 安全相关 meta（建议由后端设置安全头，但这里加一层防护） -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https:; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https:; frame-ancestors 'none'; object-src 'none';">
    
    <!-- 引入外部字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- 引入Font Awesome图标 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 引入项目基础样式 -->
    <link rel="stylesheet" href="assets/css/common_styles/variables-fallback.css">
    <link rel="stylesheet" href="assets/css/common_styles/fonts.css">
    <link rel="stylesheet" href="assets/css/common_styles/main.css">
    <link rel="stylesheet" href="assets/css/common_styles/responsive.css">
    <link rel="stylesheet" href="assets/css/common_styles/theme-system.css">
    <link rel="stylesheet" href="assets/css/common_styles/modern-animations.css">
    
    <!-- 引入登录页面专用样式 -->
    <link rel="stylesheet" href="assets/css/page_styles/login.css">
    <link rel="stylesheet" href="assets/css/page_styles/login-inline.css">
    
    <!-- 引入index页面专用样式 -->
    <link rel="stylesheet" href="assets/css/page_styles/index.css">
    <link rel="stylesheet" href="assets/css/page_styles/index-inline.css">
    
    <!-- 引入忘记密码页面专用样式 -->
    <link rel="stylesheet" href="assets/css/page_styles/forgot-password-styles.css">
</head>
<body>
    <!-- 主容器 -->
    <div class="auth-container">
        <!-- 左侧品牌区域 -->
        <div class="brand-section">
            <div class="brand-content">
                <div class="brand-logo">MTSCOS AI</div>
                <h1 class="brand-title">智能项目管理系统</h1>
                <p class="brand-description">
                    集成先进的AI技术，为您提供高效、智能的项目管理解决方案。
                    安全可靠，易于使用，助力您的项目成功。
                </p>
                <div class="brand-features">
                    <div class="feature-item">
                        <i class="fas fa-shield-alt"></i>
                        <span>多重安全认证机制</span>
                    </div>
                    <div class="feature-item">
                        <i class="fas fa-robot"></i>
                        <span>AI智能辅助功能</span>
                    </div>
                    <div class="feature-item">
                        <i class="fas fa-bolt"></i>
                        <span>高效项目管理流程</span>
                    </div>
                    <div class="feature-item">
                        <i class="fas fa-chart-line"></i>
                        <span>实时数据分析监控</span>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 右侧表单区域 -->
        <div class="form-section">
            <div class="form-container">
                <div class="auth-tabs">
                    <a href="index.html" class="tab-btn">登录</a>
                    <a href="register.html" class="tab-btn">注册</a>
                    <a href="forgot-password.html" class="tab-btn active">忘记密码</a>
                </div>
                
                <div class="forgot-password-container">
                    <div class="forgot-password-header">
                        <h2>重设密码</h2>
                        <p>请按照以下步骤重设您的密码</p>
                    </div>
                    
                    <div class="error-message" id="forgot-password-error"></div>
                    
                    <form id="forgotPasswordForm">
                        <!-- 步骤1：输入用户名 -->
                        <div id="step1" class="step">
                            <div class="step-title">步骤 1：验证身份</div>
                            <div class="form-group">
                                <label for="username">用户名</label>
                                <input type="text" id="username" name="username" placeholder="请输入您的用户名" required>
                                <div class="error-message" id="username-error"></div>
                            </div>
                            <div class="form-group">
                                <label for="email">电子邮箱</label>
                                <input type="email" id="email" name="email" placeholder="请输入您的电子邮箱" required>
                                <div class="error-message" id="email-error"></div>
                            </div>
                            <div class="form-group">
                                <label for="captcha">验证码</label>
                                <div class="captcha-group">
                                    <input type="text" id="captcha" name="captcha" placeholder="请输入验证码" required maxlength="4">
                                    <div class="captcha-display" id="captcha-display" onclick="generateCaptcha('forgot')">点击刷新</div>
                                </div>
                                <div class="error-message" id="captcha-error"></div>
                            </div>
                            <div class="form-actions">
                                <button type="button" class="btn btn-secondary" onclick="window.location.href='index.html'">返回登录</button>
                                <button type="button" class="btn btn-primary" onclick="nextStep(1)">下一步</button>
                            </div>
                        </div>
                        
                        <!-- 步骤2：验证安全问题 -->
                        <div id="step2" class="step" style="display: none;">
                            <div class="step-title">步骤 2：回答安全问题</div>
                            <div class="form-group">
                                <label for="security-question">安全问题</label>
                                <select id="security-question" name="securityQuestion" required>
                                    <option value="">请选择安全问题</option>
                                    <option value="birth-city">您的出生城市是？</option>
                                    <option value="elementary-school">您的小学校名是？</option>
                                    <option value="first-pet">您的第一个宠物名字是？</option>
                                    <option value="mother-maiden-name">您母亲的 maiden name 是？</option>
                                    <option value="favorite-teacher">您最喜欢的老师名字是？</option>
                                </select>
                                <div class="error-message" id="security-question-error"></div>
                            </div>
                            <div class="form-group">
                                <label for="security-answer">安全问题答案</label>
                                <input type="text" id="security-answer" name="securityAnswer" placeholder="请输入安全问题的答案" required>
                                <div class="error-message" id="security-answer-error"></div>
                            </div>
                            <div class="form-actions">
                                <button type="button" class="btn btn-secondary" onclick="prevStep()">上一步</button>
                                <button type="button" class="btn btn-primary" onclick="nextStep(2)">下一步</button>
                            </div>
                        </div>
                        
                        <!-- 步骤3：设置新密码 -->
                        <div id="step3" class="step" style="display: none;">
                            <div class="step-title">步骤 3：设置新密码</div>
                            <div class="form-group">
                                <label for="new-password">新密码</label>
                                <div class="password-input-group">
                                    <input type="password" id="new-password" name="newPassword" placeholder="请设置新密码" required>
                                    <button type="button" class="toggle-password" onclick="togglePassword('new-password')" title="显示/隐藏密码">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                </div>
                                <div class="error-message" id="new-password-error"></div>
                                <div class="password-strength" id="password-strength"></div>
                            </div>
                            <div class="form-group">
                                <label for="confirm-password">确认新密码</label>
                                <div class="password-input-group">
                                    <input type="password" id="confirm-password" name="confirmPassword" placeholder="请再次输入新密码" required>
                                    <button type="button" class="toggle-password" onclick="togglePassword('confirm-password')" title="显示/隐藏密码">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                </div>
                                <div class="error-message" id="confirm-password-error"></div>
                            </div>
                            <div class="form-actions">
                                <button type="button" class="btn btn-secondary" onclick="prevStep()">上一步</button>
                                <button type="submit" class="btn btn-primary">重设密码</button>
                            </div>
                        </div>
                        
                        <!-- 成功提示 -->
                        <div id="success-message" class="success-message" style="display: none;">
                            <i class="fas fa-check-circle"></i>
                            <h3>密码重设成功！</h3>
                            <p>您的密码已成功更新，请使用新密码登录。</p>
                            <a href="index.html" class="btn btn-primary">返回登录</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 脚本引入 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js" async></script>
    <script src="JavaScript/system-core.js" async></script>
    <script src="JavaScript/ui-manager.js" async></script>
    <script src="JavaScript/auth-scripts.js" async></script>
    <script src="JavaScript/vikey-detection.js" async></script>
    <script src="JavaScript/core/ai-integration.js" async></script>
    
    <!-- 引入忘记密码脚本 -->
    <script src="assets/js/forgot-password-scripts.js" async></script>
</body>
</html>
