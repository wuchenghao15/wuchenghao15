<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="MTSCOS 系统锁定页面">
    <title>MTSCOS 系统锁定</title>
    
    <!-- 兼容性meta标签 -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no, email=no">
    <meta name="msapplication-tap-highlight" content="no">
    
    <!-- 安全相关 meta -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta name="referrer" content="no-referrer">
    
    <!-- 引入外部字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- 引入Font Awesome图标 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    
    <!-- 引入项目基础样式 -->
    <link rel="stylesheet" href="assets/css/common_styles/variables-fallback.css">
    <link rel="stylesheet" href="assets/css/common_styles/fonts.css">
    <link rel="stylesheet" href="assets/css/common_styles/main.css">
    <link rel="stylesheet" href="assets/css/common_styles/responsive.css">
    
    <!-- 锁定页面专用样式 -->
    <link rel="stylesheet" href="assets/css/page_styles/lock-page-styles.css">
    <link rel="stylesheet" href="assets/css/theme.css"></head>
<body>
    <div class="lock-container">
        <div class="lock-icon">
            <i class="fas fa-lock"></i>
        </div>
        <h1 class="lock-title">系统已锁定</h1>
        <p class="lock-description">请输入密码解锁系统</p>
        
        <form class="unlock-form" id="unlockForm">
            <div class="form-group">
                <label class="form-label" for="unlock-password">解锁密码</label>
                <div class="password-input-group">
                    <input type="password" id="unlock-password" class="form-input" placeholder="请输入您的密码" required>
                    <button type="button" class="toggle-password" onclick="togglePassword()">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <div class="error-message" id="unlock-error"></div>
            </div>
            
            <button type="submit" class="unlock-btn" id="unlock-btn">
                <span>解锁系统</span>
            </button>
        </form>
    </div>
    
    <script src="assets/js/lock-page-scripts.js" async></script>
</body>
</html>
