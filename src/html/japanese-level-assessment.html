<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日语水平评估测试</title>
    <link rel="stylesheet" href="assets/css/page_styles/japanese-level-assessment.css">
    <link rel="stylesheet" href="/assets/css/japanese-level-assessment.css">
    <link rel="stylesheet" href="assets/css/theme.css"></head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="navbar-brand">日语学习平台</div>
        <div class="navbar-right">
            <div id="user-info" class="user-info" style="display: none;">
                <div class="user-avatar" id="user-avatar">U</div>
                <span id="user-name">用户名</span>
                <span class="status-indicator"></span>
            </div>
        </div>
    </nav>
    
    <div class="container">
        <h1>日语水平评估测试</h1>
        
        <div id="level-assessment-container" class="assessment-container">
            <!-- 开始评估界面 -->
            <div class="assessment-start-screen">
                <h2>日语水平评估测试</h2>
                <p>本测试包含20道题目，将评估您的日语水平并推荐适合的学习等级。</p>
                <p>测试时间约为15-20分钟，请在安静的环境中完成。</p>
                <button id="start-assessment" class="btn btn-primary btn-lg">开始评估</button>
            </div>
            
            <!-- 题目界面 -->
            <div class="assessment-question-screen" style="display: none;">
                <div class="question-header">
                    <div id="assessment-question-number" class="question-number">题目 1/20</div>
                    <div class="assessment-progress" id="assessment-progress">
                        <div class="progress-fill" id="assessment-progress-fill"></div>
                    </div>
                </div>
                
                <div id="assessment-question-content" class="question-content">
                    <!-- 题目内容将通过JavaScript动态加载 -->
                </div>
                
                <div id="assessment-question-options" class="question-options">
                    <!-- 选项将通过JavaScript动态加载 -->
                </div>
                
                <div class="question-actions">
                    <button id="submit-assessment-answer" class="btn btn-primary">提交答案</button>
                    <button id="next-assessment-question" class="btn btn-secondary" style="display: none;">下一题</button>
                </div>
            </div>
            
            <!-- 结果界面 -->
            <div class="assessment-result" id="assessment-result" style="display: none;">
                <h2>评估结果</h2>
                <div class="result-stats">
                    <p>总题目数: <span id="total-questions">20</span></p>
                    <p>正确答案: <span id="correct-answers">0</span></p>
                    <p>得分: <span id="assessment-score">0</span></p>
                    <p>正确率: <span id="accuracy">0</span>%</p>
                </div>
                <div class="suggested-level">
                    <h3>推荐等级: <span id="suggested-level" class="level-badge">N5</span></h3>
                    <p>根据您的表现，建议您从 <span id="recommended-level">N5</span> 级别开始学习。</p>
                </div>
                <div class="result-actions">
                    <button id="save-level" class="btn btn-primary">保存等级</button>
                    <button id="restart-assessment" class="btn btn-secondary">重新评估</button>
                    <button id="skip-assessment" class="btn btn-outline-secondary">跳过</button>
                </div>
            </div>
        </div>
    </div>
    


    <!-- 模块管理系统 -->
    <script src="../core/module-manager.js" async></script>
    
    <!-- AI试题生成器 -->
    <script src="../core/ai-question-generator.js" async></script>
    
    <!-- 错题本管理器 -->
    <script src="../core/error-book-manager.js" async></script>
    
    <!-- 页面脚本 -->
    <script src="assets/js/page_scripts/japanese-level-assessment.js" async></script>
    
    <script src="/assets/js/japanese-level-assessment.js" async></script>
</body>
</html>
