<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日语学习 - 错题本</title>
    <link rel="stylesheet" href="/assets/css/error-book.css">
    <link rel="stylesheet" href="assets/css/theme.css"></head>
<body>
    <div class="container">
        <header>
            <h1>📚 日语学习错题本</h1>
            <p class="subtitle">记录错题，分析弱点，AI助力提升</p>
        </header>

        <!-- 统计信息 -->
        <section class="stats-section">
            <h2>📊 错题统计</h2>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="total-errors">0</div>
                    <div class="stat-label">总错题数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="most-error-type">-</div>
                    <div class="stat-label">最易错题类型</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="most-error-level">-</div>
                    <div class="stat-label">最易错题级别</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="review-count">0</div>
                    <div class="stat-label">已复习次数</div>
                </div>
            </div>
        </section>

        <!-- AI分析和建议 -->
        <section class="analysis-section">
            <h2>🤖 AI分析与建议</h2>
            <div class="suggestions-list" id="suggestions-list">
                <div class="empty-state">
                    <i>📈</i>
                    <h3>暂无分析数据</h3>
                    <p>完成一些练习后，AI将为您提供个性化分析和建议</p>
                </div>
            </div>
        </section>

        <!-- 错题列表 -->
        <section class="error-list-section">
            <h2>📝 错题列表</h2>
            <div class="filter-controls">
                <button class="filter-btn active" data-filter="all">全部</button>
                <button class="filter-btn" data-filter="词汇">词汇</button>
                <button class="filter-btn" data-filter="语法">语法</button>
                <button class="filter-btn" data-filter="阅读">阅读</button>
                <button class="filter-btn" data-filter="N1">N1</button>
                <button class="filter-btn" data-filter="N2">N2</button>
                <button class="filter-btn" data-filter="N3">N3</button>
                <button class="filter-btn" data-filter="N4">N4</button>
                <button class="filter-btn" data-filter="N5">N5</button>
            </div>
            <div class="error-list" id="error-list">
                <div class="empty-state">
                    <i>📚</i>
                    <h3>暂无错题记录</h3>
                    <p>完成练习后，错题将自动添加到这里</p>
                </div>
            </div>
        </section>

        <!-- 操作按钮 -->
        <div class="action-buttons">
            <button class="btn btn-primary" id="export-btn">导出错题本</button>
            <button class="btn btn-secondary" id="refresh-btn">刷新数据</button>
            <button class="btn btn-danger" id="clear-btn">清空错题本</button>
        </div>
    </div>

    <!-- 模块管理系统 -->
    <script src="../core/module-manager.js" async></script>
    
    <!-- AI试题生成器 -->
    <script src="../core/ai-question-generator.js" async></script>
    
    <!-- 错题本管理器 -->
    <script src="../core/error-book-manager.js" async></script>
    
    <script src="/assets/js/error-book.js" async></script>
</body>
</html>
