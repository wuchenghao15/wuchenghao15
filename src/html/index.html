<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MTSCOS AI 智能管理系统 - 登录">
    <title>MTSCOS AI - 登录</title>
    
    <!-- 核心CSS -->
    <link rel="stylesheet" href="assets/css/common_styles/theme-system.css">
    <link rel="stylesheet" href="assets/css/page_styles/index.css">
    
    <!-- Tailwind CSS -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        /* ========== 科技感动态背景 ========== */
        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        
        /* 科技感网格背景 */
        .tech-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            background-image: 
                linear-gradient(var(--border-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--border-color) 1px, transparent 1px);
            background-size: 60px 60px;
            opacity: 0.15;
            animation: gridPulse 4s ease-in-out infinite;
        }
        
        @keyframes gridPulse {
            0%, 100% { opacity: 0.1; }
            50% { opacity: 0.2; }
        }
        
        /* 动态渐变球体背景 */
        .bg-orbs {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.4;
            animation: float 25s infinite ease-in-out;
        }
        
        .orb-1 {
            width: 700px;
            height: 700px;
            background: linear-gradient(135deg, var(--primary-500) 0%, var(--primary-600) 100%);
            top: -250px;
            left: -200px;
            animation-delay: 0s;
        }
        
        .orb-2 {
            width: 600px;
            height: 600px;
            background: linear-gradient(135deg, var(--secondary-500) 0%, var(--secondary-600) 100%);
            top: 60%;
            right: -200px;
            animation-delay: -8s;
        }
        
        .orb-3 {
            width: 500px;
            height: 500px;
            background: linear-gradient(135deg, var(--accent-500) 0%, var(--accent-600) 100%);
            bottom: -150px;
            left: 40%;
            animation-delay: -15s;
        }
        
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            20% { transform: translate(80px, -60px) scale(1.15); }
            40% { transform: translate(40px, 80px) scale(0.95); }
            60% { transform: translate(-60px, 40px) scale(1.1); }
            80% { transform: translate(-40px, -80px) scale(0.9); }
        }
        
        /* ========== 增强粒子效果 ========== */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }
        
        .particle {
            position: absolute;
            border-radius: 50%;
            opacity: 0;
            animation: particleFloat 20s infinite linear;
        }
        
        .particle.primary {
            background: var(--primary-500);
            box-shadow: 0 0 6px var(--primary-500);
        }
        
        .particle.secondary {
            background: var(--secondary-500);
            box-shadow: 0 0 6px var(--secondary-500);
        }
        
        .particle.accent {
            background: var(--accent-500);
            box-shadow: 0 0 6px var(--accent-500);
        }
        
        .particle.glow {
            background: white;
            box-shadow: 0 0 10px white, 0 0 20px var(--primary-500);
        }
        
        @keyframes particleFloat {
            0% { 
                transform: translateY(100vh) rotate(0deg); 
                opacity: 0; 
            }
            5% { opacity: 0.8; }
            95% { opacity: 0.8; }
            100% { 
                transform: translateY(-100vh) rotate(1080deg); 
                opacity: 0; 
            }
        }
        
        /* 粒子连接线 */
        .connections {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }
        
        .connection-line {
            position: absolute;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--primary-500), transparent);
            opacity: 0.3;
            animation: connectionPulse 3s ease-in-out infinite;
        }
        
        @keyframes connectionPulse {
            0%, 100% { opacity: 0.1; transform: scaleX(0.8); }
            50% { opacity: 0.4; transform: scaleX(1); }
        }
        
        /* 扫描线效果 */
        .scan-line {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, 
                transparent, 
                var(--primary-500), 
                var(--secondary-500), 
                transparent);
            z-index: 3;
            opacity: 0.5;
            animation: scanMove 8s linear infinite;
            pointer-events: none;
        }
        
        @keyframes scanMove {
            0% { top: -2px; }
            100% { top: 100%; }
        }
        
        /* 科技感光点 */
        .tech-dots {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }
        
        .tech-dot {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--primary-500);
            animation: techDotPulse 3s ease-in-out infinite;
        }
        
        .tech-dot::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 1px solid var(--primary-500);
            animation: techDotRing 3s ease-out infinite;
        }
        
        @keyframes techDotPulse {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.3); opacity: 1; }
        }
        
        @keyframes techDotRing {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(3); opacity: 0; }
        }
        
        /* 动态电路效果 */
        .circuit-lines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }
        
        .circuit-line {
            position: absolute;
            background: var(--primary-500);
            opacity: 0.2;
            animation: circuitFlow 4s linear infinite;
        }
        
        .circuit-line.horizontal {
            height: 1px;
            width: 200px;
        }
        
        .circuit-line.vertical {
            width: 1px;
            height: 200px;
        }
        
        @keyframes circuitFlow {
            0% { opacity: 0; }
            50% { opacity: 0.4; }
            100% { opacity: 0; }
        }
        
        /* 数据流动效果 */
        .data-flow {
            position: fixed;
            z-index: 2;
            pointer-events: none;
        }
        
        .data-particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--primary-500);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--primary-500);
            animation: dataMove 6s linear infinite;
        }
        
        @keyframes dataMove {
            0% { 
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% { 
                transform: translate(300px, 200px) scale(0);
                opacity: 0;
            }
        }
        
        /* ========== 登录容器 ========== */
        .login-container {
            position: relative;
            z-index: 10;
            max-width: 520px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        /* ========== 玻璃态卡片 ========== */
        .glass-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: var(--radius-2xl);
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.1),
                0 2px 8px rgba(0, 0, 0, 0.05),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            animation: cardAppear 0.8s ease-out;
        }
        
        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: 
                0 16px 48px rgba(0, 0, 0, 0.15),
                0 4px 16px rgba(0, 0, 0, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.4);
        }
        
        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        
        /* ========== Logo呼吸灯效果 ========== */
        .logo-container {
            position: relative;
            display: inline-block;
        }
        
        .logo-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120%;
            height: 120%;
            background: var(--primary-gradient);
            border-radius: 50%;
            filter: blur(15px);
            opacity: 0;
            animation: logoGlow 3s infinite ease-in-out;
            z-index: -1;
        }
        
        @keyframes logoGlow {
            0%, 100% { opacity: 0.3; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 0.6; transform: translate(-50%, -50%) scale(1.2); }
        }
        
        /* ========== 输入框样式 ========== */
        .input-group {
            position: relative;
            margin-bottom: 1.5rem;
        }
        
        .input-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            transition: all 0.3s ease;
        }
        
        .input-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-lg);
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
        }
        
        .input-group input:focus {
            border-color: var(--primary-500);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
            transform: translateY(-2px);
        }
        
        .input-group input:focus + label,
        .input-group input:not(:placeholder-shown) + label {
            color: var(--primary-500);
        }
        
        /* 输入框图标 */
        .input-icon {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            transition: all 0.3s ease;
        }
        
        .input-group input:focus ~ .input-icon {
            color: var(--primary-500);
            transform: translateY(-50%) scale(1.1);
        }
        
        /* ========== 按钮样式 ========== */
        .btn-primary {
            width: 100%;
            padding: 1rem;
            background: var(--primary-gradient);
            color: white;
            border: none;
            border-radius: var(--radius-lg);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }
        
        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }
        
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.4);
        }
        
        .btn-primary:hover::before {
            left: 100%;
        }
        
        .btn-primary:active {
            transform: translateY(-1px);
        }
        
        /* ========== Tab切换 ========== */
        .auth-tabs {
            display: flex;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 2rem;
        }
        
        .auth-tab {
            flex: 1;
            padding: 1rem;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
            border: none;
            background: transparent;
        }
        
        .auth-tab.active {
            color: var(--primary-500);
        }
        
        .auth-tab.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--primary-gradient);
            border-radius: 3px 3px 0 0;
            animation: tabSlide 0.3s ease-out;
        }
        
        @keyframes tabSlide {
            from { width: 0; }
            to { width: 100%; }
        }
        
        /* ========== 主题预览 ========== */
        .theme-color-preview {
            display: inline-block;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            margin-left: 8px;
            border: 2px solid var(--border-color);
            vertical-align: middle;
            transition: all 0.3s ease;
        }
        
        .theme-btn:hover .theme-color-preview {
            transform: scale(1.2);
        }
        
        /* ========== 导航栏 ========== */
        header {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            transition: all 0.3s ease;
        }
        
        header:hover {
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
        
        /* ========== 页脚 ========== */
        footer {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
        }
        
        /* ========== 响应式 ========== */
        @media (max-width: 640px) {
            .login-container {
                padding: 1rem;
            }
            
            .glass-card {
                padding: 1.5rem;
            }
            
            .orb {
                opacity: 0.2;
            }
        }
        
        /* ========== 深色主题适配 ========== */
        [data-theme="dark"] .glass-card {
            background: rgba(30, 41, 59, 0.8);
            border-color: rgba(255, 255, 255, 0.1);
        }
        
        [data-theme="dark"] .orb {
            opacity: 0.2;
        }
        
        [data-theme="sunset"] .orb {
            opacity: 0.25;
        }
        
        [data-theme="teal"] .orb {
            opacity: 0.25;
        }
    </style>
</head>

    <script>
        // ========== 粒子效果生成 ==========
        function createParticles() {
            const container = document.getElementById('particles');
            const particleCount = 30;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (15 + Math.random() * 10) + 's';
                particle.style.opacity = Math.random() * 0.5 + 0.2;
                particle.style.width = (2 + Math.random() * 4) + 'px';
                particle.style.height = particle.style.width;
                container.appendChild(particle);
            }
        }
        
        createParticles();
        
        // ========== 生成粒子连接线 ==========
        function createConnections() {
            const container = document.getElementById('connections');
            const connectionCount = 15;
            
            for (let i = 0; i < connectionCount; i++) {
                const line = document.createElement('div');
                line.className = 'connection-line';
                line.style.left = Math.random() * 100 + '%';
                line.style.top = Math.random() * 100 + '%';
                line.style.width = (100 + Math.random() * 200) + 'px';
                line.style.transform = `rotate(${Math.random() * 180}deg)`;
                line.style.animationDelay = Math.random() * 3 + 's';
                line.style.animationDuration = (2 + Math.random() * 2) + 's';
                container.appendChild(line);
            }
        }
        
        createConnections();
        
        // ========== 生成科技感光点 ==========
        function createTechDots() {
            const container = document.getElementById('tech-dots');
            const dotCount = 12;
            
            for (let i = 0; i < dotCount; i++) {
                const dot = document.createElement('div');
                dot.className = 'tech-dot';
                dot.style.left = Math.random() * 100 + '%';
                dot.style.top = Math.random() * 100 + '%';
                dot.style.animationDelay = Math.random() * 3 + 's';
                dot.style.animationDuration = (2 + Math.random() * 2) + 's';
                container.appendChild(dot);
            }
        }
        
        createTechDots();
        
        // ========== 生成电路线条 ==========
        function createCircuitLines() {
            const container = document.getElementById('circuit-lines');
            const circuitCount = 20;
            
            for (let i = 0; i < circuitCount; i++) {
                const line = document.createElement('div');
                const isHorizontal = Math.random() > 0.5;
                line.className = `circuit-line ${isHorizontal ? 'horizontal' : 'vertical'}`;
                line.style.left = Math.random() * 100 + '%';
                line.style.top = Math.random() * 100 + '%';
                line.style.animationDelay = Math.random() * 4 + 's';
                line.style.animationDuration = (3 + Math.random() * 2) + 's';
                container.appendChild(line);
            }
        }
        
        createCircuitLines();
        
        // ========== 生成数据流动 ==========
        function createDataFlow() {
            const container = document.getElementById('data-flow');
            const flowCount = 8;
            
            for (let i = 0; i < flowCount; i++) {
                const flow = document.createElement('div');
                flow.className = 'data-particle';
                flow.style.left = Math.random() * 100 + '%';
                flow.style.top = Math.random() * 100 + '%';
                flow.style.animationDelay = Math.random() * 6 + 's';
                flow.style.animationDuration = (5 + Math.random() * 3) + 's';
                container.appendChild(flow);
            }
        }
        
        createDataFlow();
        
        // ========== 登录/注册切换 ==========
        document.getElementById('login-tab').addEventListener('click', function() {
            document.getElementById('login-form').classList.remove('hidden');
            document.getElementById('register-form').classList.add('hidden');
            this.classList.add('active');
            document.getElementById('register-tab').classList.remove('active');
        });
        
        document.getElementById('register-tab').addEventListener('click', function() {
            document.getElementById('register-form').classList.remove('hidden');
            document.getElementById('login-form').classList.add('hidden');
            this.classList.add('active');
            document.getElementById('login-tab').classList.remove('active');
        });
        
        // ========== 主题菜单切换 ==========
        document.getElementById('theme-toggle').addEventListener('click', function(e) {
            e.stopPropagation();
            const menu = document.getElementById('theme-menu');
            menu.classList.toggle('hidden');
        });
        
        // 点击外部关闭主题菜单
        document.addEventListener('click', function(e) {
            const menu = document.getElementById('theme-menu');
            const btn = document.getElementById('theme-toggle');
            if (!menu.contains(e.target) && !btn.contains(e.target)) {
                menu.classList.add('hidden');
            }
        });
        
        // ========== 输入框动画 ==========
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.classList.add('focused');
            });
            
            input.addEventListener('blur', function() {
                this.parentElement.classList.remove('focused');
            });
        });
        
        // ========== 表单提交动画 ==========
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = this.querySelector('.btn-primary');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>登录中...';
            btn.disabled = true;
            
            // 模拟登录
            setTimeout(() => {
                btn.innerHTML = '<i class="fas fa-check mr-2"></i>登录成功';
                btn.style.background = 'var(--success-gradient)';
            }, 2000);
        });
        
        document.getElementById('register-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = this.querySelector('.btn-primary');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>注册中...';
            btn.disabled = true;
            
            // 模拟注册
            setTimeout(() => {
                btn.innerHTML = '<i class="fas fa-check mr-2"></i>注册成功';
                btn.style.background = 'var(--success-gradient)';
            }, 2000);
        });
    </script>
</body>
</html>
