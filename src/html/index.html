<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MTSCOS AI 智能管理系统 - 用户登录">
    <title>用户登录 - MTSCOS AI 智能管理系统</title>

    <link href="/assets/vendor/tailwind/tailwind.min.css" rel="stylesheet">
    <link href="/assets/vendor/fontawesome/css/all.min.css" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            padding: 20px;
        }
        .login-container {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 420px;
            padding: 40px 35px;
        }
        .logo-area {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }
        .system-title {
            font-size: 22px;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 6px;
        }
        .system-version {
            font-size: 12px;
            color: #6b7280;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 6px;
        }
        .input-wrapper {
            position: relative;
        }
        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            font-size: 14px;
        }
        .form-input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.2s;
            background: #f9fafb;
        }
        .form-input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
            font-size: 13px;
        }
        .checkbox-wrapper {
            display: flex;
            align-items: center;
            color: #6b7280;
            cursor: pointer;
        }
        .checkbox-wrapper input {
            margin-right: 6px;
            accent-color: #667eea;
        }
        .forgot-link {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }
        .forgot-link:hover {
            text-decoration: underline;
        }
        .login-btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }
        .login-btn:active {
            transform: translateY(0);
        }
        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .divider {
            text-align: center;
            margin: 22px 0;
            position: relative;
            color: #9ca3af;
            font-size: 12px;
        }
        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #e5e7eb;
            z-index: 0;
        }
        .divider span {
            background: white;
            padding: 0 12px;
            position: relative;
            z-index: 1;
        }
        .register-link {
            text-align: center;
            font-size: 13px;
            color: #6b7280;
        }
        .register-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            margin-left: 4px;
        }
        .register-link a:hover {
            text-decoration: underline;
        }
        .alert-message {
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 13px;
            display: none;
        }
        .alert-error {
            background: #fee2e2;
            color: #b91c1c;
            border-left: 3px solid #ef4444;
        }
        .alert-success {
            background: #d1fae5;
            color: #065f46;
            border-left: 3px solid #10b981;
        }
        .footer-info {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
            font-size: 11px;
            color: #9ca3af;
        }
        .tab-switcher {
            display: flex;
            background: #f3f4f6;
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 22px;
        }
        .tab-btn {
            flex: 1;
            padding: 8px;
            text-align: center;
            border-radius: 7px;
            font-size: 13px;
            font-weight: 600;
            color: #6b7280;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            background: transparent;
        }
        .tab-btn.active {
            background: white;
            color: #667eea;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-area">
            <div class="logo-icon">
                <i class="fas fa-brain text-white" style="font-size: 32px;"></i>
            </div>
            <div class="system-title">MTSCOS AI 智能管理系统</div>
            <div class="system-version">v5.0.0 智能系统优化版</div>
        </div>

        <div class="tab-switcher">
            <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">登录</button>
            <button class="tab-btn" id="tab-register" onclick="switchTab('register')">注册</button>
        </div>

        <div id="alert-message" class="alert-message"></div>

        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label class="form-label">用户名</label>
                <div class="input-wrapper">
                    <i class="fas fa-user input-icon"></i>
                    <input type="text" class="form-input" id="username" placeholder="请输入用户名" required autocomplete="username">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">密码</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" class="form-input" id="password" placeholder="请输入密码" required autocomplete="current-password">
                </div>
            </div>

            <div class="form-group" id="captcha-group" style="display:none;">
                <label class="form-label">验证码</label>
                <div class="input-wrapper">
                    <i class="fas fa-shield input-icon"></i>
                    <input type="text" class="form-input" id="captcha" placeholder="请输入验证码">
                </div>
            </div>

            <div class="form-options">
                <label class="checkbox-wrapper">
                    <input type="checkbox" id="remember"> 记住我
                </label>
                <a href="forgot-password.html" class="forgot-link">忘记密码？</a>
            </div>

            <button type="submit" class="login-btn" id="login-btn">
                <i class="fas fa-sign-in-alt"></i> 登 录
            </button>
        </form>

        <form id="register-form" style="display:none;" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label class="form-label">用户名</label>
                <div class="input-wrapper">
                    <i class="fas fa-user input-icon"></i>
                    <input type="text" class="form-input" id="reg-username" placeholder="请输入用户名" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">邮箱</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope input-icon"></i>
                    <input type="email" class="form-input" id="reg-email" placeholder="请输入邮箱" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">密码</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" class="form-input" id="reg-password" placeholder="请输入密码（至少6位）" required minlength="6">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">确认密码</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" class="form-input" id="reg-confirm" placeholder="请再次输入密码" required minlength="6">
                </div>
            </div>

            <div class="agreement-section" style="margin-bottom: 18px; padding: 12px; background: #f9fafb; border-radius: 8px; border: 1px solid #e5e7eb;">
                <label class="checkbox-wrapper" style="display: flex; align-items: flex-start; cursor: pointer; font-size: 13px; color: #4b5563; line-height: 1.5;">
                    <input type="checkbox" id="agree-terms" required style="margin-right: 8px; margin-top: 3px; accent-color: #667eea;">
                    <span>
                        我已阅读并同意
                        <a href="terms.html" target="_blank" style="color: #667eea; text-decoration: none; font-weight: 500;">《用户服务协议》</a>
                        和
                        <a href="privacy.html" target="_blank" style="color: #667eea; text-decoration: none; font-weight: 500;">《隐私政策》</a>
                        ，确认知悉并遵守相关规定。
                    </span>
                </label>
            </div>

            <button type="submit" class="login-btn" id="register-btn">
                <i class="fas fa-user-plus"></i> 注 册
            </button>
        </form>

        <div class="footer-info">
            © 2026 MTSCOS AI · 智能系统优化版<br>
            <span style="margin-top: 4px; display: inline-block;">
                <a href="register.html" style="color: #9ca3af; text-decoration: none;">用户协议</a> ·
                <a href="privacy.html" style="color: #9ca3af; text-decoration: none;">隐私政策</a>
            </span>
        </div>
    </div>

    <script src="/assets/vendor/crypto-js/crypto-js.min.js"></script>
    <script>
        const API_BASE = window.location.protocol + '//' + window.location.host;

        function switchTab(tab) {
            document.getElementById('tab-login').classList.toggle('active', tab === 'login');
            document.getElementById('tab-register').classList.toggle('active', tab === 'register');
            document.getElementById('login-form').style.display = tab === 'login' ? 'block' : 'none';
            document.getElementById('register-form').style.display = tab === 'register' ? 'block' : 'none';
            hideAlert();
        }

        function showAlert(message, type = 'error') {
            const el = document.getElementById('alert-message');
            el.className = 'alert-message alert-' + type;
            el.textContent = message;
            el.style.display = 'block';
        }

        function hideAlert() {
            document.getElementById('alert-message').style.display = 'none';
        }

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('login-btn');

            if (!username || !password) {
                showAlert('请输入用户名和密码', 'error');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 登录中...';

            try {
                const res = await fetch(API_BASE + '/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (res.ok && (data.status === 'success' || data.success)) {
                    const redirectUrl = data.redirect || '/dashboard';
                    showAlert(`登录成功！正在跳转至${data.user?.role_name || ''}页面...`, 'success');
                    if (data.token) localStorage.setItem('token', data.token);
                    if (data.user) localStorage.setItem('user', JSON.stringify(data.user));
                    if (data.sidebar_items) localStorage.setItem('sidebar_items', JSON.stringify(data.sidebar_items));

                    setTimeout(() => {
                        window.location.href = redirectUrl;
                    }, 1000);
                } else {
                    showAlert(data.message || '登录失败，请检查用户名和密码', 'error');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> 登 录';
                }
            } catch (err) {
                showAlert('网络错误：' + err.message, 'error');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> 登 录';
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const username = document.getElementById('reg-username').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value;
            const confirm = document.getElementById('reg-confirm').value;
            const agreeTerms = document.getElementById('agree-terms').checked;
            const btn = document.getElementById('register-btn');

            if (password !== confirm) {
                showAlert('两次输入的密码不一致', 'error');
                return;
            }

            if (!agreeTerms) {
                showAlert('请阅读并同意《用户服务协议》和《隐私政策》', 'error');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 注册中...';

            try {
                const res = await fetch(API_BASE + '/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });

                const data = await res.json();

                if (res.ok && (data.status === 'success' || data.success)) {
                    showAlert('注册成功！请登录', 'success');
                    setTimeout(() => switchTab('login'), 1500);
                } else {
                    showAlert(data.message || '注册失败', 'error');
                }
            } catch (err) {
                showAlert('网络错误：' + err.message, 'error');
            }

            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-user-plus"></i> 注 册';
        }
    </script>
</body>
</html>
