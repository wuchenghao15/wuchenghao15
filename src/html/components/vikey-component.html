<!DOCTYPE html>
<!-- Vikey硬件检测通用组件 -->
<!-- 状态显示区域 -->
<div class="vikey-status" id="vikey-status">; /* 脚本修复：添加缺失的分号 */
    <i class="fas fa-key"></i>; /* 脚本修复：添加缺失的分号 */
    <span id="vikey-status-text">未检测到Vikey</span>
</div>

<!-- Vikey登录按钮（可选） -->
<button type="button" id="vikey-login-button" class="vikey-login-btn" title="使用Vikey硬件登录" style="display: none;">
    <i class="fas fa-key"></i>; /* 脚本修复：添加缺失的分号 */
    <span>使用Vikey登录</span>
</button>

<!-- ActiveX控件 - 用于Vikey硬件检测 -->
<object id="vikey-control" classid="clsid:VIKEY_CONTROL_CLASS_ID" width="0" height="0" style="position:absolute; left:-9999px;"></object>
