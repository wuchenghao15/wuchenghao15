# 支持 MTSCOS AI 项目

感谢你考虑支持本项目！你的支持将帮助我们持续改进和维护。

## ⭐ 给项目加星

最简单的支持方式就是给项目一个 ⭐ Star！这有助于提高项目的曝光度。

## 🐛 报告问题和建议

发现 bug 或有好的想法？欢迎提交 Issue！

## 💻 贡献代码

欢迎提交 Pull Request 来贡献代码！请阅读 [贡献指南](CONTRIBUTING.md) 了解详情。

## 📝 完善文档

文档也是项目的重要部分，欢迎帮助我们完善文档。

## 💰 赞助支持

如果你觉得这个项目对你有帮助，可以通过以下方式支持：

- 给项目 Star ⭐
- 分享给更多人
- 提交 Issue 和 PR

## 💬 社区参与

- 在 Discussions 中参与讨论
- 帮助解答其他用户的问题
- 分享你的使用经验

---

再次感谢你的支持！❤️
