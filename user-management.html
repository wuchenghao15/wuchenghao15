<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理系统 - MTSCOS 管理平台</title>
    <!-- 引入外部样式表 -->
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/user-management.css">
    
    <!-- 引入外部JavaScript文件 -->
    <script src="assets/js/config.js" defer></script>
    <script src="assets/js/modules/auth.js" defer></script>
    <script src="assets/js/modules/notification.js" defer></script>
    <script src="assets/js/modules/user-management.js" defer></script>
    <script src="assets/js/modules/logging.js" defer></script>
</head>
<body>
    <div class="user-management-container">
        <!-- 页面头部 -->
        <div class="page-header">
            <div class="page-title">用户管理系统</div>
            <div class="page-subtitle">智能用户信息管理与权限控制</div>
            
            <div class="current-user-info">
                <div class="current-user-label">当前登录用户</div>
                <div class="current-user-name" id="current-user-name">加载中...</div>
                <div class="current-user-permission" id="current-user-permission">加载中...</div>
            </div>
        </div>

        <!-- 管理标签页 -->
        <div class="management-tabs">
            <button class="tab-button active" onclick="switchTab('overview')">用户概览</button>
            <button class="tab-button" onclick="switchTab('users')">用户管理</button>
            <button class="tab-button" onclick="switchTab('create-user')" id="create-user-tab">创建用户</button>
            <button class="tab-button" onclick="switchTab('permissions')">权限管理</button>
            <button class="tab-button" onclick="switchTab('activity')">活动日志</button>
        </div>

        <!-- 用户概览 -->
        <div id="overview-tab" class="tab-content active">
            <div class="content-section">
                <div class="section-title">
                    用户统计概览
                </div>
                
                <div class="statistics-grid" id="statistics-grid">
                    <!-- 统计卡片将通过JavaScript动态生成 -->
                </div>
            </div>

            <div class="content-section">
                <div class="section-title">
                    最近用户活动
                    <div class="section-actions">
                        <button class="btn btn-secondary" onclick="refreshActivityLog()">
                            🔄 刷新
                        </button>
                    </div>
                </div>
                
                <div id="recent-activities">
                    <!-- 最近活动将通过JavaScript动态生成 -->
                </div>
            </div>
        </div>

        <!-- 用户管理 -->
        <div id="users-tab" class="tab-content">
            <div class="content-section">
                <div class="section-title">
                    用户列表
                    <div class="section-actions">
                        <button class="btn btn-primary" onclick="showCreateUserModal()">
                            ➕ 创建用户
                        </button>
                        <button class="btn btn-secondary" onclick="refreshUserList()">
                            🔄 刷新
                        </button>
                    </div>
                </div>

                <!-- 搜索和过滤 -->
                <div class="search-box">
                    <input type="text" class="search-input" id="user-search" placeholder="搜索用户名、邮箱...">
                    <button class="btn btn-primary" onclick="searchUsers()">搜索</button>
                    <button class="btn btn-secondary" onclick="clearSearch()">清空</button>
                </div>

                <div class="filter-controls">
                    <div class="filter-group">
                        <label class="filter-label">权限级别:</label>
                        <select class="form-select" id="permission-filter" onchange="filterUsers()">
                            <option value="">全部</option>
                            <option value="0">访客</option>
                            <option value="1">普通用户</option>
                            <option value="2">管理员</option>
                            <option value="3">超级管理员</option>
                            <option value="4">Vikey管理员</option>
                        </select>
                    </div>
                    
                    <div class="filter-group">
                        <label class="filter-label">状态:</label>
                        <select class="form-select" id="status-filter" onchange="filterUsers()">
                            <option value="">全部</option>
                            <option value="active">活跃</option>
                            <option value="inactive">非活跃</option>
                            <option value="locked">已锁定</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label class="filter-label">Vikey用户:</label>
                        <select class="form-select" id="vikey-filter" onchange="filterUsers()">
                            <option value="">全部</option>
                            <option value="true">是</option>
                            <option value="false">否</option>
                        </select>
                    </div>
                </div>

                <!-- 用户表格 -->
                <div class="table-responsive">
                    <table class="user-table">
                        <thead>
                            <tr>
                                <th>用户名</th>
                                <th>邮箱</th>
                                <th>权限级别</th>
                                <th>状态</th>
                                <th>Vikey用户</th>
                                <th>最后登录</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="user-table-body">
                            <!-- 用户数据将通过JavaScript动态生成 -->
                        </tbody>
                    </table>
                </div>

                <!-- 分页 -->
                <div class="pagination" id="user-pagination">
                    <!-- 分页控件将通过JavaScript动态生成 -->
                </div>
            </div>
        </div>

        <!-- 创建用户 -->
        <div id="create-user-tab-content" class="tab-content">
            <div class="content-section">
                <div class="section-title">创建新用户</div>
                
                <form id="create-user-form" onsubmit="handleCreateUser(event)">
                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label" for="new-username">用户名 *</label>
                            <input type="text" class="form-control" id="new-username" required>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label" for="new-email">邮箱 *</label>
                            <input type="email" class="form-control" id="new-email" required>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label" for="new-password">密码 *</label>
                            <input type="password" class="form-control" id="new-password" required>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label" for="new-confirm-password">确认密码 *</label>
                            <input type="password" class="form-control" id="new-confirm-password" required>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label" for="new-permission">权限级别 *</label>
                            <select class="form-select" id="new-permission" required>
                                <option value="1">普通用户</option>
                                <option value="2">管理员</option>
                                <option value="3">超级管理员</option>
                                <option value="4">Vikey管理员</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label" for="new-phone">电话</label>
                            <input type="tel" class="form-control" id="new-phone">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="new-display-name">显示名称</label>
                        <input type="text" class="form-control" id="new-display-name">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="new-department">部门</label>
                        <input type="text" class="form-control" id="new-department">
                    </div>

                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="new-is-vikey-user">
                        <label class="form-check-label" for="new-is-vikey-user">
                            Vikey用户
                        </label>
                    </div>

                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="new-is-active" checked>
                        <label class="form-check-label" for="new-is-active">
                            激活账户
                        </label>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" onclick="resetCreateForm()">重置</button>
                        <button type="submit" class="btn btn-primary">创建用户</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- 权限管理 -->
        <div id="permissions-tab" class="tab-content">
            <div class="content-section">
                <div class="section-title">权限级别说明</div>
                
                <div style="margin-bottom: 30px;">
                    <div class="permission-badge guest">访客 (0)</div>
                    <p style="margin: 10px 0; color: #666;">只能访问公开内容，无系统操作权限</p>
                </div>

                <div style="margin-bottom: 30px;">
                    <div class="permission-badge user">普通用户 (1)</div>
                    <p style="margin: 10px 0; color: #666;">可以访问基本功能，管理个人信息</p>
                </div>

                <div style="margin-bottom: 30px;">
                    <div class="permission-badge admin">管理员 (2)</div>
                    <p style="margin: 10px 0; color: #666;">可以管理普通用户，查看系统日志，进行基本系统配置</p>
                </div>

                <div style="margin-bottom: 30px;">
                    <div class="permission-badge super-admin">超级管理员 (3)</div>
                    <p style="margin: 10px 0; color: #666;">完全系统控制权限，可以管理所有用户和系统设置</p>
                </div>

                <div style="margin-bottom: 30px;">
                    <div class="permission-badge vikey-admin">Vikey管理员 (4)</div>
                    <p style="margin: 10px 0; color: #666;">Vikey设备管理和系统锁定控制权限，可以忽略系统锁定和超时机制</p>
                </div>
            </div>
        </div>

        <!-- 活动日志 -->
        <div id="activity-tab" class="tab-content">
            <div class="content-section">
                <div class="section-title">
                    用户活动日志
                    <div class="section-actions">
                        <button class="btn btn-secondary" onclick="refreshActivityLog()">
                            🔄 刷新
                        </button>
                        <button class="btn btn-danger" onclick="clearActivityLog()">
                            🗑️ 清空日志
                        </button>
                    </div>
                </div>

                <div class="filter-controls">
                    <div class="filter-group">
                        <label class="filter-label">活动类型:</label>
                        <select class="form-select" id="activity-filter" onchange="filterActivityLog()">
                            <option value="">全部</option>
                            <option value="LOGIN">登录</option>
                            <option value="LOGOUT">登出</option>
                            <option value="LOGIN_FAILED">登录失败</option>
                            <option value="USER_CREATED">创建用户</option>
                            <option value="USER_UPDATED">更新用户</option>
                            <option value="USER_DELETED">删除用户</option>
                        </select>
                    </div>
                </div>

                <div id="activity-log-container">
                    <!-- 活动日志将通过JavaScript动态生成 -->
                </div>
            </div>
        </div>
    </div>

    <!-- 编辑用户模态框 -->
    <div id="edit-user-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">编辑用户</div>
                <button class="modal-close" onclick="closeEditUserModal()">&times;</button>
            </div>
            
            <form id="edit-user-form" onsubmit="handleEditUser(event)">
                <input type="hidden" id="edit-user-id">
                
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label" for="edit-username">用户名</label>
                        <input type="text" class="form-control" id="edit-username" readonly>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="edit-email">邮箱</label>
                        <input type="email" class="form-control" id="edit-email">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="edit-permission">权限级别</label>
                        <select class="form-select" id="edit-permission">
                            <option value="1">普通用户</option>
                            <option value="2">管理员</option>
                            <option value="3">超级管理员</option>
                            <option value="4">Vikey管理员</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="edit-phone">电话</label>
                        <input type="tel" class="form-control" id="edit-phone">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="edit-display-name">显示名称</label>
                    <input type="text" class="form-control" id="edit-display-name">
                </div>

                <div class="form-group">
                    <label class="form-label" for="edit-department">部门</label>
                    <input type="text" class="form-control" id="edit-department">
                </div>

                <div class="form-group">
                    <label class="form-label" for="edit-password">新密码（留空则不修改）</label>
                    <input type="password" class="form-control" id="edit-password">
                </div>

                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="edit-is-vikey-user">
                    <label class="form-check-label" for="edit-is-vikey-user">
                        Vikey用户
                    </label>
                </div>

                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="edit-is-active">
                    <label class="form-check-label" for="edit-is-active">
                        激活账户
                    </label>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeEditUserModal()">取消</button>
                    <button type="submit" class="btn btn-primary">保存更改</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 消息容器 -->
    <div id="message-container"></div>

    <!-- 引入JavaScript模块 -->
    <script src="assets/js/core/user-management.js"></script>

    <script>
        // 全局变量
        let userManagementSystem = null;
        let currentPage = 1;
        let pageSize = 10;
        let currentFilters = {};

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            initializeUserManagement();
        });

        /**
         * 初始化用户管理系统
         */
        async function initializeUserManagement() {
            try {
                showMessage('正在初始化用户管理系统...', 'info');

                // 初始化用户管理系统
                userManagementSystem = new UserManagementSystem();
                await userManagementSystem.init();

                // 检查当前用户权限
                const currentUser = userManagementSystem.getCurrentUser();
                if (!currentUser) {
                    showMessage('请先登录系统', 'warning');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 2000);
                    return;
                }

                if (!userManagementSystem.isAdmin()) {
                    showMessage('权限不足，只有管理员可以访问用户管理', 'error');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 2000);
                    return;
                }

                // 更新当前用户信息
                updateCurrentUserInfo();

                // 加载初始数据
                await loadStatistics();
                await loadUserList();
                await loadActivityLog();

                // 根据权限显示/隐藏创建用户标签
                const createUserTab = document.getElementById('create-user-tab');
                if (!userManagementSystem.isSuperAdmin()) {
                    createUserTab.style.display = 'none';
                }

                showMessage('用户管理系统初始化完成', 'success');

            } catch (error) {
                console.error('初始化用户管理系统失败:', error);
                showMessage('初始化失败: ' + error.message, 'error');
            }
        }

        /**
         * 更新当前用户信息
         */
        function updateCurrentUserInfo() {
            const currentUser = userManagementSystem.getCurrentUser();
            if (!currentUser) return;

            const nameElement = document.getElementById('current-user-name');
            const permissionElement = document.getElementById('current-user-permission');

            nameElement.textContent = currentUser.profile?.displayName || currentUser.username;
            
            const permissionLevels = {
                0: '访客',
                1: '普通用户',
                2: '管理员',
                3: '超级管理员',
                4: 'Vikey管理员'
            };
            
            permissionElement.textContent = permissionLevels[currentUser.permissionLevel] || '未知';
        }

        /**
         * 切换标签页
         */
        function switchTab(tabName) {
            // 更新标签按钮状态
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            // 更新标签内容显示
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            document.getElementById(tabName + '-tab').classList.add('active');

            // 根据标签页加载相应数据
            switch (tabName) {
                case 'overview':
                    loadStatistics();
                    loadRecentActivities();
                    break;
                case 'users':
                    loadUserList();
                    break;
                case 'activity':
                    loadActivityLog();
                    break;
            }
        }

        /**
         * 加载统计数据
         */
        async function loadStatistics() {
            try {
                const stats = await userManagementSystem.getUserStatistics();
                const container = document.getElementById('statistics-grid');
                
                container.innerHTML = `
                    <div class="stat-card">
                        <div class="stat-number">${stats.total}</div>
                        <div class="stat-label">总用户数</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">${stats.active}</div>
                        <div class="stat-label">活跃用户</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">${stats.vikeyUsers}</div>
                        <div class="stat-label">Vikey用户</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">${stats.locked}</div>
                        <div class="stat-label">已锁定用户</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">${stats.byPermissionLevel[3] || 0}</div>
                        <div class="stat-label">超级管理员</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">${stats.byPermissionLevel[2] || 0}</div>
                        <div class="stat-label">管理员</div>
                    </div>
                `;
            } catch (error) {
                console.error('加载统计数据失败:', error);
                showMessage('加载统计数据失败: ' + error.message, 'error');
            }
        }

        /**
         * 加载用户列表
         */
        async function loadUserList() {
            try {
                const result = await userManagementSystem.getUsers(currentFilters, {
                    page: currentPage,
                    limit: pageSize
                });

                const tbody = document.getElementById('user-table-body');
                tbody.innerHTML = '';

                result.users.forEach(user => {
                    const row = createUserTableRow(user);
                    tbody.appendChild(row);
                });

                // 更新分页
                updatePagination(result.total);

            } catch (error) {
                console.error('加载用户列表失败:', error);
                showMessage('加载用户列表失败: ' + error.message, 'error');
            }
        }

        /**
         * 创建用户表格行
         */
        function createUserTableRow(user) {
            const row = document.createElement('tr');
            
            const permissionLevels = {
                0: { text: '访客', class: 'guest' },
                1: { text: '普通用户', class: 'user' },
                2: { text: '管理员', class: 'admin' },
                3: { text: '超级管理员', class: 'super-admin' },
                4: { text: 'Vikey管理员', class: 'vikey-admin' }
            };

            const permission = permissionLevels[user.permissionLevel] || { text: '未知', class: '' };
            
            let status = 'active';
            let statusText = '活跃';
            if (user.isLocked) {
                status = 'locked';
                statusText = '已锁定';
            } else if (!user.isActive) {
                status = 'inactive';
                statusText = '非活跃';
            }

            const lastLogin = user.lastLogin ? new Date(user.lastLogin).toLocaleString() : '从未登录';

            row.innerHTML = `
                <td>${user.username}</td>
                <td>${user.email}</td>
                <td><span class="permission-badge ${permission.class}">${permission.text}</span></td>
                <td>
                    <span class="user-status ${status}">
                        <span class="status-indicator"></span>
                        ${statusText}
                    </span>
                </td>
                <td>
                    ${user.isVikeyUser ? '<span class="vikey-indicator">🔑 Vikey用户</span>' : '否'}
                </td>
                <td>${lastLogin}</td>
                <td>
                    <button class="btn btn-sm btn-primary" onclick="editUser(${user.id})">编辑</button>
                    ${user.id !== userManagementSystem.getCurrentUser().id ? 
                        `<button class="btn btn-sm btn-danger" onclick="deleteUser(${user.id}, '${user.username}')">删除</button>` : 
                        ''}
                </td>
            `;

            return row;
        }

        /**
         * 更新分页控件
         */
        function updatePagination(totalItems) {
            const container = document.getElementById('user-pagination');
            const totalPages = Math.ceil(totalItems / pageSize);
            
            let paginationHTML = '';
            
            // 上一页按钮
            paginationHTML += `<button class="page-btn" onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>上一页</button>`;
            
            // 页码按钮
            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
                    paginationHTML += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
                } else if (i === currentPage - 3 || i === currentPage + 3) {
                    paginationHTML += '<span>...</span>';
                }
            }
            
            // 下一页按钮
            paginationHTML += `<button class="page-btn" onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>下一页</button>`;
            
            container.innerHTML = paginationHTML;
        }

        /**
         * 切换页面
         */
        function changePage(page) {
            currentPage = page;
            loadUserList();
        }

        /**
         * 搜索用户
         */
        function searchUsers() {
            const searchTerm = document.getElementById('user-search').value.trim();
            if (searchTerm) {
                currentFilters.search = searchTerm;
            } else {
                delete currentFilters.search;
            }
            currentPage = 1;
            loadUserList();
        }

        /**
         * 清空搜索
         */
        function clearSearch() {
            document.getElementById('user-search').value = '';
            delete currentFilters.search;
            currentPage = 1;
            loadUserList();
        }

        /**
         * 过滤用户
         */
        function filterUsers() {
            const permissionFilter = document.getElementById('permission-filter').value;
            const statusFilter = document.getElementById('status-filter').value;
            const vikeyFilter = document.getElementById('vikey-filter').value;

            if (permissionFilter) {
                currentFilters.permissionLevel = parseInt(permissionFilter);
            } else {
                delete currentFilters.permissionLevel;
            }

            if (statusFilter) {
                if (statusFilter === 'active') {
                    currentFilters.isActive = true;
                    delete currentFilters.isLocked;
                } else if (statusFilter === 'inactive') {
                    currentFilters.isActive = false;
                    delete currentFilters.isLocked;
                } else if (statusFilter === 'locked') {
                    currentFilters.isLocked = true;
                    delete currentFilters.isActive;
                }
            } else {
                delete currentFilters.isActive;
                delete currentFilters.isLocked;
            }

            if (vikeyFilter) {
                currentFilters.isVikeyUser = vikeyFilter === 'true';
            } else {
                delete currentFilters.isVikeyUser;
            }

            currentPage = 1;
            loadUserList();
        }

        /**
         * 创建用户
         */
        async function handleCreateUser(event) {
            event.preventDefault();
            
            try {
                const formData = {
                    username: document.getElementById('new-username').value,
                    email: document.getElementById('new-email').value,
                    password: document.getElementById('new-password').value,
                    permissionLevel: parseInt(document.getElementById('new-permission').value),
                    isVikeyUser: document.getElementById('new-is-vikey-user').checked,
                    isActive: document.getElementById('new-is-active').checked,
                    profile: {
                        displayName: document.getElementById('new-display-name').value,
                        department: document.getElementById('new-department').value,
                        phone: document.getElementById('new-phone').value
                    }
                };

                // 验证密码确认
                const confirmPassword = document.getElementById('new-confirm-password').value;
                if (formData.password !== confirmPassword) {
                    showMessage('两次输入的密码不一致', 'error');
                    return;
                }

                // 检查权限
                if (formData.permissionLevel >= 3 && !userManagementSystem.isSuperAdmin()) {
                    showMessage('只有超级管理员可以创建管理员级别的用户', 'error');
                    return;
                }

                const result = await userManagementSystem.createUser(formData, userManagementSystem.getCurrentUser());
                
                if (result.success) {
                    showMessage('用户创建成功', 'success');
                    resetCreateForm();
                    loadUserList();
                    loadStatistics();
                } else {
                    showMessage('创建用户失败', 'error');
                }

            } catch (error) {
                console.error('创建用户失败:', error);
                showMessage('创建用户失败: ' + error.message, 'error');
            }
        }

        /**
         * 重置创建表单
         */
        function resetCreateForm() {
            document.getElementById('create-user-form').reset();
        }

        /**
         * 编辑用户
         */
        async function editUser(userId) {
            try {
                // 这里需要获取用户详细信息，简化版本
                const modal = document.getElementById('edit-user-modal');
                modal.classList.add('show');
                
                // 设置用户ID
                document.getElementById('edit-user-id').value = userId;
                
                // 这里应该加载用户详细信息到表单
                // 简化版本，实际需要从数据库获取
                
            } catch (error) {
                console.error('编辑用户失败:', error);
                showMessage('编辑用户失败: ' + error.message, 'error');
            }
        }

        /**
         * 关闭编辑用户模态框
         */
        function closeEditUserModal() {
            document.getElementById('edit-user-modal').classList.remove('show');
        }

        /**
         * 处理编辑用户
         */
        async function handleEditUser(event) {
            event.preventDefault();
            
            try {
                const userId = parseInt(document.getElementById('edit-user-id').value);
                const updateData = {
                    email: document.getElementById('edit-email').value,
                    permissionLevel: parseInt(document.getElementById('edit-permission').value),
                    isVikeyUser: document.getElementById('edit-is-vikey-user').checked,
                    isActive: document.getElementById('edit-is-active').checked,
                    profile: {
                        displayName: document.getElementById('edit-display-name').value,
                        department: document.getElementById('edit-department').value,
                        phone: document.getElementById('edit-phone').value
                    }
                };

                const password = document.getElementById('edit-password').value;
                if (password) {
                    updateData.password = password;
                }

                const result = await userManagementSystem.updateUser(userId, updateData, userManagementSystem.getCurrentUser());
                
                if (result.success) {
                    showMessage('用户信息更新成功', 'success');
                    closeEditUserModal();
                    loadUserList();
                } else {
                    showMessage('更新用户信息失败', 'error');
                }

            } catch (error) {
                console.error('更新用户信息失败:', error);
                showMessage('更新用户信息失败: ' + error.message, 'error');
            }
        }

        /**
         * 删除用户
         */
        async function deleteUser(userId, username) {
            if (!confirm(`确定要删除用户 "${username}" 吗？此操作不可撤销。`)) {
                return;
            }

            try {
                const result = await userManagementSystem.deleteUser(userId, userManagementSystem.getCurrentUser());
                
                if (result.success) {
                    showMessage('用户删除成功', 'success');
                    loadUserList();
                    loadStatistics();
                } else {
                    showMessage('删除用户失败', 'error');
                }

            } catch (error) {
                console.error('删除用户失败:', error);
                showMessage('删除用户失败: ' + error.message, 'error');
            }
        }

        /**
         * 加载活动日志
         */
        async function loadActivityLog() {
            try {
                // 这里需要实现活动日志加载逻辑
                const container = document.getElementById('activity-log-container');
                container.innerHTML = '<p>活动日志功能正在开发中...</p>';
            } catch (error) {
                console.error('加载活动日志失败:', error);
                showMessage('加载活动日志失败: ' + error.message, 'error');
            }
        }

        /**
         * 加载最近活动
         */
        async function loadRecentActivities() {
            try {
                const container = document.getElementById('recent-activities');
                container.innerHTML = '<p>最近活动功能正在开发中...</p>';
            } catch (error) {
                console.error('加载最近活动失败:', error);
            }
        }

        /**
         * 刷新用户列表
         */
        async function refreshUserList() {
            await loadUserList();
            showMessage('用户列表已刷新', 'success');
        }

        /**
         * 刷新活动日志
         */
        async function refreshActivityLog() {
            await loadActivityLog();
            showMessage('活动日志已刷新', 'success');
        }

        /**
         * 清空活动日志
         */
        function clearActivityLog() {
            if (!confirm('确定要清空所有活动日志吗？此操作不可撤销。')) {
                return;
            }
            
            // 这里需要实现清空日志逻辑
            showMessage('活动日志清空功能正在开发中', 'info');
        }

        /**
         * 显示消息
         */
        function showMessage(message, type = 'info') {
            const container = document.getElementById('message-container');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            
            const icons = {
                info: 'ℹ️',
                success: '✅',
                warning: '⚠️',
                error: '❌'
            };
            
            alert.innerHTML = `
                <span>${icons[type]}</span>
                <span>${message}</span>
            `;
            
            container.appendChild(alert);
            
            // 自动移除消息
            setTimeout(() => {
                if (alert.parentNode) {
                    alert.parentNode.removeChild(alert);
                }
            }, 5000);
        }
    </script>
