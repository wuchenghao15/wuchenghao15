<body>
    <div class="header">
        <h1>MTSCOS - 技术支持</h1>
    </div>
    
    <div class="container">
        <a href="index.html" class="back-link">返回首页</a>
        
        <div class="content">
            <h2>技术支持</h2>
            <p>我们提供多种技术支持方式，随时为您解决系统使用过程中遇到的问题。</p>
            
            <div class="support-methods">
                <div class="support-card">
                    <h4>邮件支持</h4>
                    <p>发送问题描述至我们的邮箱，我们将在一个工作日内回复您。</p>
                    <p><strong>邮箱：</strong>support@mtscos.com</p>
                </div>
                
                <div class="support-card">
                    <h4>电话支持</h4>
                    <p>工作时间内可直接拨打我们的技术支持热线获取即时帮助。</p>
                    <p><strong>电话：</strong>400-123-4567</p>
                    <p><strong>时间：</strong>周一至周五 09:00-18:00</p>
                </div>
                
                <div class="support-card">
                    <h4>现场支持</h4>
                    <p>对于企业客户，我们提供现场技术支持服务。</p>
                    <p><strong>地址：</strong>上海市浦东新区科技园区</p>
                </div>
            </div>
            
            <div class="support-form">
                <h3>提交支持请求</h3>
                <form>
                    <div class="form-group">
                        <label for="name">您的姓名</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">联系邮箱</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">联系电话</label>
                        <input type="tel" id="phone" name="phone">
                    </div>
                    <div class="form-group">
                        <label for="subject">问题主题</label>
                        <input type="text" id="subject" name="subject" required>
                    </div>
                    <div class="form-group">
                        <label for="message">问题描述</label>
                        <textarea id="message" name="message" required></textarea>
                    </div>
                    <button type="submit" class="submit-btn">提交请求</button>
                </form>
            </div>
        </div>
