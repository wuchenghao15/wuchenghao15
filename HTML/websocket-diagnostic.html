<!DOCTYPE html>
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket 连接诊断工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .status-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            border-left: 5px solid #667eea;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .status-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        .status-card h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 10px;
            animation: pulse 2s infinite;
        }

        .status-dot.connected {
            background: #10b981;
        }

        .status-dot.disconnected {
            background: #ef4444;
        }

        .status-dot.checking {
            background: #f59e0b;
        }

        .status-dot.error {
            background: #dc2626;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .status-text {
            font-weight: 600;
            color: #555;
        }

        .status-details {
            font-size: 0.9em;
            color: #666;
            margin-top: 5px;
        }

        .control-panel {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            margin-bottom: 30px;
        }

        .control-panel h3 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.3em;
        }

        .button-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        button {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .log-panel {
            background: #1e293b;
            border-radius: 15px;
            padding: 20px;
            color: #e2e8f0;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 0.9em;
            max-height: 400px;
            overflow-y: auto;
        }

        .log-panel h3 {
            color: #f1f5f9;
            margin-bottom: 15px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .log-entry {
            margin-bottom: 8px;
            padding: 5px 10px;
            border-radius: 5px;
            border-left: 3px solid transparent;
        }

        .log-entry.info {
            border-left-color: #3b82f6;
            background: rgba(59, 130, 246, 0.1);
        }

        .log-entry.success {
            border-left-color: #10b981;
            background: rgba(16, 185, 129, 0.1);
        }

        .log-entry.warning {
            border-left-color: #f59e0b;
            background: rgba(245, 158, 11, 0.1);
        }

        .log-entry.error {
            border-left-color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
        }

        .timestamp {
            color: #94a3b8;
            font-size: 0.85em;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .metric-item {
            background: #f8fafc;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            border: 2px solid #e2e8f0;
        }

        .metric-value {
            font-size: 1.8em;
            font-weight: bold;
            color: #667eea;
        }

        .metric-label {
            font-size: 0.9em;
            color: #64748b;
            margin-top: 5px;
        }

        .connection-test {
            background: #fef3c7;
            border: 2px solid #f59e0b;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .connection-test h4 {
            color: #92400e;
            margin-bottom: 10px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e5e7eb;
            border-radius: 3px;
            overflow: hidden;
            margin: 10px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(45deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔌 WebSocket 连接诊断工具</h1>
        
        <div class="status-grid">
            <div class="status-card">
                <h3>🌐 HTTP 服务器状态</h3>
                <div class="status-indicator">
                    <div class="status-dot" id="httpStatus"></div>
                    <span class="status-text" id="httpStatusText">检查中...</span>
                </div>
                <div class="status-details" id="httpDetails">正在检查 localhost:8082</div>
            </div>
            
            <div class="status-card">
                <h3>🔌 WebSocket 连接状态</h3>
                <div class="status-indicator">
                    <div class="status-dot" id="wsStatus"></div>
                    <span class="status-text" id="wsStatusText">检查中...</span>
                </div>
                <div class="status-details" id="wsDetails">正在测试 ws://localhost:8082</div>
            </div>
            
            <div class="status-card">
                <h3>📊 连接质量</h3>
                <div class="status-indicator">
                    <div class="status-dot" id="qualityStatus"></div>
                    <span class="status-text" id="qualityStatusText">待测试</span>
                </div>
                <div class="status-details" id="qualityDetails">延迟: -- ms | 稳定性: --</div>
            </div>
        </div>

        <div class="connection-test" id="connectionTest" style="display: none;">
            <h4>🔄 正在测试连接...</h4>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div id="testStatus">初始化测试...</div>
        </div>

        <div class="control-panel">
            <h3>🎛️ 控制面板</h3>
            <div class="button-group">
                <button onclick="runFullDiagnostic()">🔍 运行完整诊断</button>
                <button onclick="testHttpConnection()">🌐 测试HTTP连接</button>
                <button onclick="testWebSocketConnection()">🔌 测试WebSocket连接</button>
                <button onclick="testConnectionQuality()">📊 测试连接质量</button>
                <button onclick="startMonitoring()">📈 开始监控</button>
                <button onclick="stopMonitoring()">⏹️ 停止监控</button>
                <button onclick="clearLogs()">🗑️ 清除日志</button>
            </div>
        </div>

        <div class="metrics-grid">
            <div class="metric-item">
                <div class="metric-value" id="connectionCount">0</div>
                <div class="metric-label">连接次数</div>
            </div>
            <div class="metric-item">
                <div class="metric-value" id="successRate">0%</div>
                <div class="metric-label">成功率</div>
            </div>
            <div class="metric-item">
                <div class="metric-value" id="avgLatency">0ms</div>
                <div class="metric-label">平均延迟</div>
            </div>
            <div class="metric-item">
                <div class="metric-value" id="uptime">0s</div>
                <div class="metric-label">运行时间</div>
            </div>
        </div>

        <div class="log-panel">
            <h3>📋 诊断日志</h3>
            <div id="logContainer"></div>
        </div>
    </div>

    <script>
        let monitoringInterval = null;
        let metrics = {
            connectionCount: 0,
            successCount: 0,
            totalLatency: 0,
            startTime: Date.now()
        };

        // 日志函数
        function addLog(message, type = 'info') {
            const logContainer = document.getElementById('logContainer');
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry ${type}`;
            logEntry.innerHTML = `<span class="timestamp">[${timestamp}]</span> ${message}`;
            logContainer.appendChild(logEntry);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        // 更新状态指示器
        function updateStatus(elementId, status, text, details) {
            const dot = document.getElementById(elementId + 'Status');
            const textEl = document.getElementById(elementId + 'StatusText');
            const detailsEl = document.getElementById(elementId + 'Details');
            
            dot.className = `status-dot ${status}`;
            textEl.textContent = text;
            if (details) detailsEl.textContent = details;
        }

        // 更新指标
        function updateMetrics() {
            document.getElementById('connectionCount').textContent = metrics.connectionCount;
            const successRate = metrics.connectionCount > 0 ? 
                Math.round((metrics.successCount / metrics.connectionCount) * 100) : 0;
            document.getElementById('successRate').textContent = successRate + '%';
            
            const avgLatency = metrics.connectionCount > 0 ? 
                Math.round(metrics.totalLatency / metrics.connectionCount) : 0;
            document.getElementById('avgLatency').textContent = avgLatency + 'ms';
            
            const uptime = Math.floor((Date.now() - metrics.startTime) / 1000);
            document.getElementById('uptime').textContent = uptime + 's';
        }

        // 测试HTTP连接
        async function testHttpConnection() {
            addLog('开始测试HTTP连接...', 'info');
            updateStatus('http', 'checking', '检查中...', '正在连接 localhost:8082');
            
            const startTime = Date.now();
            try {
                const response = await fetch('http://localhost:8082', {
                    method: 'GET',
                    signal: AbortSignal.timeout(5000)
                });
                
                const latency = Date.now() - startTime;
                if (response.ok) {
                    updateStatus('http', 'connected', '已连接', `响应时间: ${latency}ms`);
                    addLog(`✅ HTTP连接成功，响应时间: ${latency}ms`, 'success');
                    metrics.successCount++;
                    metrics.totalLatency += latency;
                } else {
                    updateStatus('http', 'error', '错误', `状态码: ${response.status}`);
                    addLog(`❌ HTTP连接失败，状态码: ${response.status}`, 'error');
                }
            } catch (error) {
                updateStatus('http', 'disconnected', '未连接', `错误: ${error.message}`);
                addLog(`❌ HTTP连接失败: ${error.message}`, 'error');
            }
            
            metrics.connectionCount++;
            updateMetrics();
        }

        // 测试WebSocket连接
        function testWebSocketConnection() {
            return new Promise((resolve) => {
                addLog('开始测试WebSocket连接...', 'info');
                updateStatus('ws', 'checking', '检查中...', '正在连接 ws://localhost:8082');
                
                const startTime = Date.now();
                const ws = new WebSocket('ws://localhost:8082');
                let connected = false;
                
                const timeout = setTimeout(() => {
                    if (!connected) {
                        ws.close();
                        updateStatus('ws', 'error', '超时', '连接超时 (5秒)');
                        addLog('❌ WebSocket连接超时', 'error');
                        metrics.connectionCount++;
                        updateMetrics();
                        resolve(false);
                    }
                }, 5000);
                
                ws.onopen = () => {
                    connected = true;
                    clearTimeout(timeout);
                    const latency = Date.now() - startTime;
                    updateStatus('ws', 'connected', '已连接', `连接时间: ${latency}ms`);
                    addLog(`✅ WebSocket连接成功，连接时间: ${latency}ms`, 'success');
                    metrics.successCount++;
                    metrics.totalLatency += latency;
                    metrics.connectionCount++;
                    updateMetrics();
                    
                    // 发送测试消息
                    ws.send(JSON.stringify({type: 'test', timestamp: Date.now()}));
                    
                    setTimeout(() => {
                        ws.close();
                        resolve(true);
                    }, 1000);
                };
                
                ws.onmessage = (event) => {
                    addLog(`📨 收到消息: ${event.data}`, 'info');
                };
                
                ws.onerror = (error) => {
                    clearTimeout(timeout);
                    updateStatus('ws', 'error', '错误', `连接错误`);
                    addLog(`❌ WebSocket连接错误`, 'error');
                    metrics.connectionCount++;
                    updateMetrics();
                    resolve(false);
                };
                
                ws.onclose = (event) => {
                    if (!connected) {
                        clearTimeout(timeout);
                        updateStatus('ws', 'disconnected', '已断开', `代码: ${event.code}`);
                        addLog(`⚠️ WebSocket连接关闭: ${event.code} - ${event.reason}`, 'warning');
                        metrics.connectionCount++;
                        updateMetrics();
                    }
                };
            });
        }

        // 测试连接质量
        async function testConnectionQuality() {
            addLog('开始测试连接质量...', 'info');
            updateStatus('quality', 'checking', '测试中...', '正在进行多次连接测试');
            
            const testCount = 5;
            let successCount = 0;
            let totalLatency = 0;
            
            for (let i = 0; i < testCount; i++) {
                addLog(`连接测试 ${i + 1}/${testCount}...`, 'info');
                
                const success = await testWebSocketConnection();
                if (success) {
                    successCount++;
                }
                
                // 等待一秒再进行下一次测试
                await new Promise(resolve => setTimeout(resolve, 1000));
            }
            
            const successRate = Math.round((successCount / testCount) * 100);
            const avgLatency = Math.round(totalLatency / testCount);
            
            if (successRate >= 80) {
                updateStatus('quality', 'connected', '良好', `成功率: ${successRate}% | 平均延迟: ${avgLatency}ms`);
                addLog(`✅ 连接质量良好: 成功率 ${successRate}%`, 'success');
            } else if (successRate >= 50) {
                updateStatus('quality', 'checking', '一般', `成功率: ${successRate}% | 平均延迟: ${avgLatency}ms`);
                addLog(`⚠️ 连接质量一般: 成功率 ${successRate}%`, 'warning');
            } else {
                updateStatus('quality', 'error', '较差', `成功率: ${successRate}% | 平均延迟: ${avgLatency}ms`);
                addLog(`❌ 连接质量较差: 成功率 ${successRate}%`, 'error');
            }
        }

        // 运行完整诊断
        async function runFullDiagnostic() {
            addLog('🚀 开始运行完整诊断...', 'info');
            showConnectionTest();
            
            updateProgress(20);
            await testHttpConnection();
            
            updateProgress(50);
            await testWebSocketConnection();
            
            updateProgress(80);
            await testConnectionQuality();
            
            updateProgress(100);
            addLog('✅ 完整诊断完成！', 'success');
            
            setTimeout(() => {
                hideConnectionTest();
            }, 2000);
        }

        // 开始监控
        function startMonitoring() {
            if (monitoringInterval) {
                addLog('⚠️ 监控已在运行中', 'warning');
                return;
            }
            
            addLog('📈 开始实时监控...', 'info');
            monitoringInterval = setInterval(async () => {
                await testHttpConnection();
                await testWebSocketConnection();
            }, 10000); // 每10秒检查一次
        }

        // 停止监控
        function stopMonitoring() {
            if (!monitoringInterval) {
                addLog('⚠️ 监控未在运行', 'warning');
                return;
            }
            
            clearInterval(monitoringInterval);
            monitoringInterval = null;
            addLog('⏹️ 监控已停止', 'info');
        }

        // 清除日志
        function clearLogs() {
            document.getElementById('logContainer').innerHTML = '';
            addLog('📋 日志已清除', 'info');
        }

        // 显示连接测试进度
        function showConnectionTest() {
            document.getElementById('connectionTest').style.display = 'block';
        }

        // 隐藏连接测试进度
        function hideConnectionTest() {
            document.getElementById('connectionTest').style.display = 'none';
        }

        // 更新进度条
        function updateProgress(percent) {
            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('testStatus').textContent = `测试进度: ${percent}%`;
        }

        // 页面加载完成后自动运行诊断
        window.addEventListener('load', () => {
            addLog('🔌 WebSocket诊断工具已加载', 'success');
            setTimeout(() => {
                runFullDiagnostic();
            }, 1000);
        });

        // 定期更新运行时间
        setInterval(updateMetrics, 1000);
    </script>
</body>
</html>
