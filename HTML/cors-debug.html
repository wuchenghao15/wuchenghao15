<!DOCTYPE html>
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORS调试</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .result { margin: 10px 0; padding: 10px; border: 1px solid #ccc; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        .debug { background-color: #fff3cd; border-color: #ffeaa7; }
        pre { white-space: pre-wrap; word-wrap: break-word; }
        button { padding: 10px 20px; margin: 5px; }
    </style>
</head>
<body>
    <h1>CORS调试测试</h1>
    <button onclick="testSimpleRequest()">简单请求测试</button>
    <button onclick="testCORSRequest()">CORS请求测试</button>
    <button onclick="testDifferentPorts()">不同端口测试</button>
    <div id="result"></div>
    
    <script>
        function log(message, type = 'debug') {
            const resultDiv = document.getElementById('result');
            const logEntry = document.createElement('div');
            logEntry.className = `result ${type}`;
            logEntry.innerHTML = `<strong>${new Date().toLocaleTimeString()}:</strong> ${message}`;
            resultDiv.appendChild(logEntry);
            console.log(`[${type.toUpperCase()}] ${message}`);
        }
        
        // 简单请求（不触发预检）
        async function testSimpleRequest() {
            log('开始简单请求测试...', 'debug');
            
            try {
                // 使用简单请求方式，只包含基本头
                const response = await fetch('http://localhost:3001/api/csrf-token', {
                    method: 'GET',
                    credentials: 'include'
                });
                
                log(`响应状态: ${response.status}`, 'debug');
                log(`响应头: ${JSON.stringify([...response.headers.entries()])}`, 'debug');
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                log(`简单请求成功: ${JSON.stringify(data, null, 2)}`, 'success');
                
            } catch (error) {
                log(`简单请求失败: ${error.message}`, 'error');
                log(`错误类型: ${error.name}`, 'error');
            }
        }
        
        // 完整的CORS请求
        async function testCORSRequest() {
            log('开始CORS请求测试...', 'debug');
            
            try {
                const response = await fetch('http://localhost:3001/api/csrf-token', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest',
                        'Cache-Control': 'no-cache'
                    },
                    credentials: 'include',
                    mode: 'cors'
                });
                
                log(`响应状态: ${response.status}`, 'debug');
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                log(`CORS请求成功: ${JSON.stringify(data, null, 2)}`, 'success');
                
            } catch (error) {
                log(`CORS请求失败: ${error.message}`, 'error');
            }
        }
        
        // 测试不同端口
        async function testDifferentPorts() {
            const ports = [3001, 3000, 8000, 8080];
            
            for (const port of ports) {
                log(`测试端口 ${port}...`, 'debug');
                
                try {
                    const response = await fetch(`http://localhost:${port}/api/csrf-token`, {
                        method: 'GET',
                        credentials: 'include'
                    });
                    
                    log(`端口 ${port} 响应: ${response.status}`, 'debug');
                    
                    if (response.ok) {
                        const data = await response.json();
                        log(`端口 ${port} 成功: ${JSON.stringify(data).substring(0, 100)}...`, 'success');
                        break;
                    }
                } catch (error) {
                    log(`端口 ${port} 失败: ${error.message}`, 'error');
                }
            }
        }
        
        // 页面加载后显示信息
        document.addEventListener('DOMContentLoaded', () => {
            log(`当前页面: ${window.location.href}`, 'debug');
            log(`页面来源: ${window.location.origin}`, 'debug');
            log(`测试目标: http://localhost:3001/api/csrf-token`, 'debug');
            log('页面加载完成，点击按钮开始测试', 'debug');
        });
    </script>
</body>
</html>
