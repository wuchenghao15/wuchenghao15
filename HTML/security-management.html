<!DOCTYPE html>
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全管理中心 - MTSCOS</title>
    <link rel="stylesheet" href="assets/css/unified-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .security-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .security-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .security-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .security-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .security-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .security-card h3 {
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .security-card h3 i {
            color: #667eea;
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .status-indicator.online {
            background-color: #10b981;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
        }

        .status-indicator.warning {
            background-color: #f59e0b;
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
        }

        .status-indicator.danger {
            background-color: #ef4444;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
        }

        .security-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .control-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
            margin: 5px;
        }

        .control-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .control-button.danger {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }

        .control-button.warning {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
        }

        .control-button.success {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .log-container {
            background: #1f2937;
            color: #e5e7eb;
            padding: 20px;
            border-radius: 12px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 400px;
            overflow-y: auto;
        }

        .log-entry {
            margin-bottom: 10px;
            padding: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            border-left: 3px solid #667eea;
        }

        .log-entry.warning {
            border-left-color: #f59e0b;
        }

        .log-entry.danger {
            border-left-color: #ef4444;
        }

        .log-entry.success {
            border-left-color: #10b981;
        }

        .policy-selector {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .policy-option {
            padding: 15px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .policy-option:hover {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.05);
        }

        .policy-option.selected {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.1);
            color: #667eea;
            font-weight: bold;
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid;
        }

        .alert.info {
            background: #dbeafe;
            border-color: #3b82f6;
            color: #1e40af;
        }

        .alert.warning {
            background: #fef3c7;
            border-color: #f59e0b;
            color: #92400e;
        }

        .alert.danger {
            background: #fee2e2;
            border-color: #ef4444;
            color: #991b1b;
        }

        .alert.success {
            background: #d1fae5;
            border-color: #10b981;
            color: #065f46;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hidden {
            display: none;
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="security-container">
        <!-- 头部 -->
        <div class="security-header">
            <h1><i class="fas fa-shield-alt"></i> 安全管理中心</h1>
            <p>系统安全监控与管理控制台</p>
            <div style="margin-top: 20px;">
                <span class="status-indicator online"></span>
                <span>系统状态: 正常运行</span>
                <span style="margin-left: 20px;">最后更新: <span id="lastUpdate">--</span></span>
            </div>
        </div>

        <!-- 统计信息 -->
        <div class="security-stats">
            <div class="stat-card">
                <div class="stat-number" id="activeUsers">0</div>
                <div class="stat-label">活跃用户</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="lockedUsers">0</div>
                <div class="stat-label">锁定用户</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="highRiskUsers">0</div>
                <div class="stat-label">高风险用户</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="securityEvents">0</div>
                <div class="stat-label">安全事件</div>
            </div>
        </div>

        <!-- 警告信息 -->
        <div id="alertContainer"></div>

        <!-- 主要功能区 -->
        <div class="security-grid">
            <!-- 安全策略配置 -->
            <div class="security-card">
                <h3><i class="fas fa-cogs"></i> 安全策略配置</h3>
                <div class="policy-selector">
                    <div class="policy-option" data-policy="low">
                        <i class="fas fa-shield-alt"></i>
                        <div>低安全</div>
                        <small>基础保护</small>
                    </div>
                    <div class="policy-option selected" data-policy="medium">
                        <i class="fas fa-shield-alt"></i>
                        <div>中等安全</div>
                        <small>推荐设置</small>
                    </div>
                    <div class="policy-option" data-policy="high">
                        <i class="fas fa-shield-alt"></i>
                        <div>高安全</div>
                        <small>最高保护</small>
                    </div>
                </div>
                <button class="control-button" onclick="applySecurityPolicy()">
                    <i class="fas fa-check"></i> 应用策略
                </button>
            </div>

            <!-- 用户管理 -->
            <div class="security-card">
                <h3><i class="fas fa-users"></i> 用户管理</h3>
                <div class="form-group">
                    <label>用户ID</label>
                    <input type="text" id="userId" placeholder="输入用户ID">
                </div>
                <div class="form-group">
                    <label>锁定原因</label>
                    <input type="text" id="lockReason" placeholder="输入锁定原因">
                </div>
                <div>
                    <button class="control-button danger" onclick="lockUser()">
                        <i class="fas fa-lock"></i> 锁定用户
                    </button>
                    <button class="control-button success" onclick="unlockUser()">
                        <i class="fas fa-unlock"></i> 解锁用户
                    </button>
                    <button class="control-button warning" onclick="resetUserSecurity()">
                        <i class="fas fa-redo"></i> 重置安全状态
                    </button>
                </div>
            </div>

            <!-- 系统控制 -->
            <div class="security-card">
                <h3><i class="fas fa-server"></i> 系统控制</h3>
                <div class="form-group">
                    <label>紧急锁定原因</label>
                    <input type="text" id="emergencyReason" placeholder="输入紧急锁定原因">
                </div>
                <div>
                    <button class="control-button danger" onclick="emergencyLockdown()">
                        <i class="fas fa-exclamation-triangle"></i> 紧急锁定
                    </button>
                    <button class="control-button success" onclick="liftEmergencyLockdown()">
                        <i class="fas fa-check-circle"></i> 解除紧急锁定
                    </button>
                </div>
                <div style="margin-top: 20px;">
                    <button class="control-button" onclick="refreshSecurityReport()">
                        <i class="fas fa-sync"></i> 刷新报告
                    </button>
                    <button class="control-button" onclick="exportSecurityReport()">
                        <i class="fas fa-download"></i> 导出报告
                    </button>
                </div>
            </div>

            <!-- 实时监控 -->
            <div class="security-card">
                <h3><i class="fas fa-chart-line"></i> 实时监控</h3>
                <div id="monitoringData">
                    <div style="margin-bottom: 15px;">
                        <strong>系统风险评分:</strong> 
                        <span id="systemRiskScore">0</span>/100
                        <div style="background: #e5e7eb; height: 8px; border-radius: 4px; margin-top: 5px;">
                            <div id="riskProgressBar" style="background: #10b981; height: 100%; width: 0%; border-radius: 4px; transition: width 0.3s ease;"></div>
                        </div>
                    </div>
                    <div style="margin-bottom: 15px;">
                        <strong>会话超时设置:</strong> <span id="sessionTimeout">15</span> 分钟
                    </div>
                    <div style="margin-bottom: 15px;">
                        <strong>空闲超时设置:</strong> <span id="idleTimeout">10</span> 分钟
                    </div>
                    <div>
                        <strong>最后活动时间:</strong> <span id="lastActivity">--</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 安全日志 -->
        <div class="security-card">
            <h3><i class="fas fa-list-alt"></i> 安全日志</h3>
            <div style="margin-bottom: 20px;">
                <button class="control-button" onclick="refreshSecurityLogs()">
                    <i class="fas fa-sync"></i> 刷新日志
                </button>
                <button class="control-button" onclick="clearSecurityLogs()">
                    <i class="fas fa-trash"></i> 清空日志
                </button>
            </div>
            <div class="log-container" id="securityLogs">
                <div class="log-entry">等待加载安全日志...</div>
            </div>
        </div>
    </div>

    <!-- 系统锁定管理脚本 -->
    <!-- 全局锁定系统脚本 -->
    <script>
        // 全局变量
        let selectedPolicy = 'medium';
        let refreshInterval;

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            initializeSecurityCenter();
            startAutoRefresh();
        });

        /**
         * 初始化安全管理中心
         */
        function initializeSecurityCenter() {
            // 绑定策略选择器
            document.querySelectorAll('.policy-option').forEach(option => {
                option.addEventListener('click', function() {
                    document.querySelectorAll('.policy-option').forEach(opt => opt.classList.remove('selected'));
                    this.classList.add('selected');
                    selectedPolicy = this.dataset.policy;
                });
            });

            // 初始化系统锁定管理器
            if (window.systemLockManager) {
                console.log('系统锁定管理器已加载');
            }

            // 加载初始数据
            refreshSecurityReport();
            refreshSecurityLogs();
            updateLastUpdateTime();
        }

        /**
         * 应用安全策略
         */
        function applySecurityPolicy() {
            if (!window.systemLockManager) {
                showAlert('系统锁定管理器未加载', 'warning');
                return;
            }

            try {
                window.systemLockManager.setSecurityPolicy(selectedPolicy);
                showAlert(`已应用${getPolicyName(selectedPolicy)}安全策略`, 'success');
                refreshSecurityReport();
            } catch (error) {
                showAlert('应用安全策略失败: ' + error.message, 'danger');
            }
        }

        /**
         * 锁定用户
         */
        async function lockUser() {
            const userId = document.getElementById('userId').value.trim();
            const reason = document.getElementById('lockReason').value.trim() || '管理员操作';

            if (!userId) {
                showAlert('请输入用户ID', 'warning');
                return;
            }

            if (!window.systemLockManager) {
                showAlert('系统锁定管理器未加载', 'warning');
                return;
            }

            try {
                await window.systemLockManager.executeAdminOperation('lock_user', { userId, reason });
                showAlert(`用户 ${userId} 已锁定`, 'success');
                document.getElementById('userId').value = '';
                document.getElementById('lockReason').value = '';
                refreshSecurityReport();
            } catch (error) {
                showAlert('锁定用户失败: ' + error.message, 'danger');
            }
        }

        /**
         * 解锁用户
         */
        async function unlockUser() {
            const userId = document.getElementById('userId').value.trim();

            if (!userId) {
                showAlert('请输入用户ID', 'warning');
                return;
            }

            if (!window.systemLockManager) {
                showAlert('系统锁定管理器未加载', 'warning');
                return;
            }

            try {
                await window.systemLockManager.executeAdminOperation('unlock_user', { userId });
                showAlert(`用户 ${userId} 已解锁`, 'success');
                document.getElementById('userId').value = '';
                refreshSecurityReport();
            } catch (error) {
                showAlert('解锁用户失败: ' + error.message, 'danger');
            }
        }

        /**
         * 重置用户安全状态
         */
        async function resetUserSecurity() {
            const userId = document.getElementById('userId').value.trim();

            if (!userId) {
                showAlert('请输入用户ID', 'warning');
                return;
            }

            if (!window.systemLockManager) {
                showAlert('系统锁定管理器未加载', 'warning');
                return;
            }

            try {
                await window.systemLockManager.executeAdminOperation('reset_security', { userId });
                showAlert(`用户 ${userId} 安全状态已重置`, 'success');
                document.getElementById('userId').value = '';
                refreshSecurityReport();
            } catch (error) {
                showAlert('重置用户安全状态失败: ' + error.message, 'danger');
            }
        }

        /**
         * 紧急锁定
         */
        async function emergencyLockdown() {
            const reason = document.getElementById('emergencyReason').value.trim() || '安全威胁';

            if (!window.systemLockManager) {
                showAlert('系统锁定管理器未加载', 'warning');
                return;
            }

            if (!confirm('确定要执行紧急锁定吗？这将锁定所有用户会话。')) {
                return;
            }

            try {
                await window.systemLockManager.executeAdminOperation('emergency_lockdown', { reason });
                showAlert(`紧急锁定已激活: ${reason}`, 'warning');
                document.getElementById('emergencyReason').value = '';
                refreshSecurityReport();
            } catch (error) {
                showAlert('紧急锁定失败: ' + error.message, 'danger');
            }
        }

        /**
         * 解除紧急锁定
         */
        function liftEmergencyLockdown() {
            if (!window.systemLockManager) {
                showAlert('系统锁定管理器未加载', 'warning');
                return;
            }

            try {
                window.systemLockManager.liftEmergencyLockdown();
                showAlert('紧急锁定已解除', 'success');
                refreshSecurityReport();
            } catch (error) {
                showAlert('解除紧急锁定失败: ' + error.message, 'danger');
            }
        }

        /**
         * 刷新安全报告
         */
        async function refreshSecurityReport() {
            if (!window.systemLockManager) {
                return;
            }

            try {
                const report = await window.systemLockManager.executeAdminOperation('view_security_report');
                updateStatistics(report);
                updateMonitoringData(report);
            } catch (error) {
                console.error('获取安全报告失败:', error);
            }
        }

        /**
         * 更新统计信息
         */
        function updateStatistics(report) {
            document.getElementById('activeUsers').textContent = report.totalUsers || 0;
            document.getElementById('lockedUsers').textContent = report.lockedUsers || 0;
            document.getElementById('highRiskUsers').textContent = report.highRiskUsers || 0;
            document.getElementById('securityEvents').textContent = report.securityLogs || 0;
        }

        /**
         * 更新监控数据
         */
        function updateMonitoringData(report) {
            if (report.riskScore !== undefined) {
                const riskScore = report.riskScore;
                document.getElementById('systemRiskScore').textContent = riskScore;
                
                const progressBar = document.getElementById('riskProgressBar');
                progressBar.style.width = riskScore + '%';
                
                if (riskScore < 30) {
                    progressBar.style.background = '#10b981';
                } else if (riskScore < 70) {
                    progressBar.style.background = '#f59e0b';
                } else {
                    progressBar.style.background = '#ef4444';
                }
            }

            if (report.lastActivity) {
                document.getElementById('lastActivity').textContent = new Date(report.lastActivity).toLocaleString();
            }
        }

        /**
         * 刷新安全日志
         */
        async function refreshSecurityLogs() {
            try {
                const response = await fetch('/api/admin/security-logs?limit=50');
                if (response.ok) {
                    const data = await response.json();
                    displaySecurityLogs(data.data.logs);
                }
            } catch (error) {
                console.error('获取安全日志失败:', error);
                displayErrorLog('获取安全日志失败');
            }
        }

        /**
         * 显示安全日志
         */
        function displaySecurityLogs(logs) {
            const container = document.getElementById('securityLogs');
            
            if (!logs || logs.length === 0) {
                container.innerHTML = '<div class="log-entry">暂无安全日志</div>';
                return;
            }

            const logHtml = logs.map(log => {
                const level = getLogLevel(log.event);
                const timestamp = new Date(log.timestamp).toLocaleString();
                const userId = log.userId || 'system';
                const event = log.event || 'unknown';
                
                return `
                    <div class="log-entry ${level}">
                        <div>[${timestamp}] ${event}</div>
                        <div>用户: ${userId} | IP: ${log.ip}</div>
                        ${log.data ? `<div>数据: ${JSON.stringify(log.data)}</div>` : ''}
                    </div>
                `;
            }).reverse().join('');

            container.innerHTML = logHtml;
        }

        /**
         * 获取日志级别
         */
        function getLogLevel(event) {
            const dangerEvents = ['emergency_lockdown', 'user_locked_by_admin', 'unauthorized_admin_attempt'];
            const warningEvents = ['failed_auth', 'suspicious_activity', 'high_risk_detected'];
            const successEvents = ['user_unlocked_by_admin', 'admin_session_created'];

            if (dangerEvents.includes(event)) return 'danger';
            if (warningEvents.includes(event)) return 'warning';
            if (successEvents.includes(event)) return 'success';
            return '';
        }

        /**
         * 显示错误日志
         */
        function displayErrorLog(message) {
            const container = document.getElementById('securityLogs');
            container.innerHTML = `<div class="log-entry danger">${message}</div>`;
        }

        /**
         * 清空安全日志
         */
        function clearSecurityLogs() {
            if (!confirm('确定要清空所有安全日志吗？')) {
                return;
            }

            document.getElementById('securityLogs').innerHTML = '<div class="log-entry">日志已清空</div>';
            showAlert('安全日志已清空', 'info');
        }

        /**
         * 导出安全报告
         */
        function exportSecurityReport() {
            if (!window.systemLockManager) {
                showAlert('系统锁定管理器未加载', 'warning');
                return;
            }

            try {
                const report = window.systemLockManager.getSecurityReport();
                const dataStr = JSON.stringify(report, null, 2);
                const dataBlob = new Blob([dataStr], { type: 'application/json' });
                
                const link = document.createElement('a');
                link.href = URL.createObjectURL(dataBlob);
                link.download = `security-report-${new Date().toISOString().split('T')[0]}.json`;
                link.click();
                
                showAlert('安全报告已导出', 'success');
            } catch (error) {
                showAlert('导出安全报告失败: ' + error.message, 'danger');
            }
        }

        /**
         * 显示警告信息
         */
        function showAlert(message, type = 'info') {
            const container = document.getElementById('alertContainer');
            const alert = document.createElement('div');
            alert.className = `alert ${type} fade-in`;
            alert.innerHTML = `
                <strong>${getAlertTitle(type)}</strong> ${message}
                <button onclick="this.parentElement.remove()" style="float: right; background: none; border: none; color: inherit; cursor: pointer;">
                    <i class="fas fa-times"></i>
                </button>
            `;
            
            container.appendChild(alert);
            
            // 自动移除警告
            setTimeout(() => {
                if (alert.parentElement) {
                    alert.remove();
                }
            }, 5000);
        }

        /**
         * 获取警告标题
         */
        function getAlertTitle(type) {
            const titles = {
                'info': '信息',
                'warning': '警告',
                'danger': '错误',
                'success': '成功'
            };
            return titles[type] || '信息';
        }

        /**
         * 获取策略名称
         */
        function getPolicyName(policy) {
            const names = {
                'low': '低安全',
                'medium': '中等安全',
                'high': '高安全'
            };
            return names[policy] || policy;
        }

        /**
         * 更新最后更新时间
         */
        function updateLastUpdateTime() {
            document.getElementById('lastUpdate').textContent = new Date().toLocaleString();
        }

        /**
         * 开始自动刷新
         */
        function startAutoRefresh() {
            refreshInterval = setInterval(() => {
                refreshSecurityReport();
                refreshSecurityLogs();
                updateLastUpdateTime();
            }, 30000); // 每30秒刷新一次
        }

        /**
         * 页面卸载时清理
         */
        window.addEventListener('beforeunload', () => {
            if (refreshInterval) {
                clearInterval(refreshInterval);
            }
        });
    </script>
</body>
</html>
