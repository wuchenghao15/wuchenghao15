<head>
    <meta name="version" content="202511061306446373">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTSCOS - 重设密码</title>
    <!-- 引入Font Awesome图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 引入CSS样式 -->
    <link rel="stylesheet" href="assets/css/page_styles/index.css">
    <link rel="stylesheet" href="assets/css/page_styles/login-styles.css">
    <link rel="stylesheet" href="assets/css/common_styles/main.css">
    <link rel="stylesheet" href="assets/css/common_styles/responsive.css">
    <link rel="stylesheet" href="assets/css/footer.css">

    <!-- CryptoJS库，用于JS解密 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
</head>
<body>
    <!-- 头部 -->
    <header class="header">
        <div class="header-content">
            <div class="header-left">
                <div class="logo">MTSCOS</div>
            </div>
            <div class="header-right">
                <div id="datetime-display" class="datetime-display"></div>
                <button id="theme-toggle" class="theme-btn" aria-label="切换主题">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- 主要内容 -->
    <main class="login-main">
        <div class="login-container">
            <div class="login-header">
                <h2>重设密码</h2>
                <p>请按照以下步骤重设您的密码</p>
            </div>
            
            <div id="reset-error" class="login-error"></div>
            
            <form id="reset-form" class="login-form">
                <!-- 步骤1：输入用户名 -->
                <div id="step-username" class="reset-step">
                    <div class="form-group">
                        <label for="username">用户名</label>
                        <input type="text" id="username" name="username" placeholder="请输入您的用户名" required>
                    </div>
                    <button type="button" id="step1-next" class="login-btn">下一步</button>
                </div>
                
                <!-- 步骤2：验证身份 -->
                <div id="step-verify" class="reset-step" style="display: none;">
                    <div class="form-group">
                        <label for="verify-code">验证码</label>
                        <div class="captcha-container">
                            <input type="text" id="verify-code" name="verify-code" placeholder="请输入验证码" required>
                            <img id="verify-image" class="captcha-image" src="#" alt="验证码">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="security-question">安全问题</label>
                        <select id="security-question" name="security-question" required>
                            <option value="">请选择安全问题</option>
                            <option value="1">您的出生城市是？</option>
                            <option value="2">您的小学校名是？</option>
                            <option value="3">您的第一个宠物名字是？</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="security-answer">安全问题答案</label>
                        <input type="text" id="security-answer" name="security-answer" placeholder="请输入安全问题答案" required>
                    </div>
                    <div class="form-actions">
                        <button type="button" id="step2-back" class="theme-btn">上一步</button>
                        <button type="button" id="step2-next" class="login-btn">下一步</button>
                    </div>
                </div>
                
                <!-- 步骤3：设置新密码 -->
                <div id="step-new-password" class="reset-step" style="display: none;">
                    <div class="form-group">
                        <label for="new-password">新密码</label>
                        <input type="password" id="new-password" name="new-password" placeholder="请输入新密码" required>
                    </div>
                    <div class="form-group">
                        <label for="confirm-password">确认新密码</label>
                        <input type="password" id="confirm-password" name="confirm-password" placeholder="请再次输入新密码" required>
                    </div>
                    <div class="form-actions">
                        <button type="button" id="step3-back" class="theme-btn">上一步</button>
                        <button type="submit" id="reset-submit" class="login-btn">重设密码</button>
                    </div>
                </div>
                
                <!-- 成功提示 -->
                <div id="reset-success" class="reset-step" style="display: none;">
                    <div class="success-message">
                        <i class="fas fa-check-circle"></i>
                        <h3>密码重设成功！</h3>
                        <p>您的密码已成功更新，请使用新密码登录。</p>
                        <a href="login.html" class="login-btn">返回登录</a>
                    </div>
                </div>
            </form>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="footer-content">
            <div class="footer-info">
                <p>&copy; 2025 MTSCOS 系统. 保留所有权利.</p>
                <p>版本号: 3.251102.113947</p>
            </div>
            <div class="footer-links">
                <a href="help.html" class="footer-link">帮助中心</a>
                <a href="terms.html" class="footer-link">服务条款</a>
                <a href="privacy.html" class="footer-link">隐私政策</a>
                <a href="contact.html" class="footer-link">联系我们</a>
            </div>
        </div>
    </footer>

    <!-- 引入JavaScript脚本 -->
    <!-- 系统锁定管理脚本 -->
    <!-- 全局锁定系统脚本 -->
    <!-- 脚本已整理 -->
</body>
</html>
