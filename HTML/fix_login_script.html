<!DOCTYPE html>
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修复Login脚本</title>
    <script>
        // 这个页面将修复login-script.js中的语法错误
        function fixLoginScript() {
            // 重写关键函数以修复语法错误
            window.validateForm = function(username, password, captcha) {
                try {
                    // 检查参数是否存在并进行类型转换
                    username = username !== undefined && username !== null ? String(username).trim() : '';
                    password = password !== undefined && password !== null ? String(password) : '';
                    captcha = captcha !== undefined && captcha !== null ? String(captcha).trim() : '';
                    
                    // 用户名验证
                    if (!username) {
                        showError('请输入用户名');
                        return false;
                    }
                    
                    // 用户名格式验证
                    if (username.length < 3 || username.length > 20) {
                        showError('用户名长度应在3-20个字符之间');
                        return false;
                    }
                    
                    // 密码验证
                    if (!password) {
                        showError('请输入密码');
                        return false;
                    }
                    
                    if (password.length < 6) {
                        showError('密码长度不能少于6个字符');
                        return false;
                    }
                    
                    // 检查验证码
                    if (!captcha) {
                        showError('请输入验证码');
                        return false;
                    }
                    
                    let storedCaptcha = '';
                    try {
                        if (typeof sessionStorage !== 'undefined') {
                            storedCaptcha = sessionStorage.getItem('captcha') || '';
                        }
                    } catch (storageError) {
                        console.error('获取验证码存储失败:', storageError);
                        showError('验证码验证失败，请刷新页面重试');
                        return false;
                    }
                    
                    if (captcha.toUpperCase() !== storedCaptcha.toUpperCase()) {
                        showError('验证码错误，请重新输入');
                        return false;
                    }
                    
                    // 检查账户是否被锁定
                    if (window.accountLockedUntil > Date.now()) {
                        const remainingSeconds = Math.ceil((window.accountLockedUntil - Date.now()) / 1000);
                        showError(`账户已被锁定，请在 ${remainingSeconds} 秒后重试`);
                        return false;
                    }
                    
                    return true;
                } catch (error) {
                    console.error('表单验证过程中发生错误:', error);
                    showError('表单验证过程中发生错误，请重试');
                    return false;
                }
            };
            
            // 重写simulateLogin函数
            window.simulateLogin = async function(username, password, captcha, hardwareKey) {
                try {
                    // 简化的登录逻辑
                    await new Promise(resolve => setTimeout(resolve, 1000));
                    
                    if (username === 'demo' && password === 'password') {
                        return { 
                            success: true, 
                            token: 'mock_token_' + Date.now(),
                            userInfo: { 
                                username: 'demo', 
                                role: 'user',
                                name: '演示用户'
                            }
                        };
                    } else if (username === 'admin' && password === 'admin123') {
                        return { 
                            success: true, 
                            token: 'admin_token_' + Date.now(),
                            userInfo: { 
                                username: 'admin', 
                                role: 'admin',
                                name: '系统管理员'
                            }
                        };
                    } else {
                        return { 
                            success: false, 
                            message: '用户名或密码错误'
                        };
                    }
                } catch (error) {
                    console.error('登录过程中发生错误:', error);
                    return { 
                        success: false, 
                        message: '登录过程中发生错误，请稍后重试'
                    };
                }
            };
            
            // 显示修复成功消息
            document.getElementById('status').textContent = '登录脚本修复成功！';
            document.getElementById('status').style.color = 'green';
            
            // 提示用户可以返回登录页面
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 2000);
        }
    </script>
</head>
<body onload="fixLoginScript()">
    <div style="text-align: center; margin-top: 100px;">
        <h1>正在修复登录脚本...</h1>
        <p id="status" style="font-size: 24px; margin-top: 50px;">修复中，请稍候...</p>
        <p style="margin-top: 20px;">修复完成后将自动跳转到登录页面</p>
    </div>
</body>
</html>
