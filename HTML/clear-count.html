<!DOCTYPE html>
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>清理访问计数</title>
</head>
<body>
    <h1>清理访问计数</h1>
    <button onclick="clearDirectAccessCount()">清理直接访问计数</button>
    <button onclick="goToIndex()">返回首页</button>
    
    <script>
        function clearDirectAccessCount() {
            localStorage.removeItem('direct_access_count');
            console.log('直接访问计数已清理');
            alert('直接访问计数已清理');
        }
        
        function goToIndex() {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
