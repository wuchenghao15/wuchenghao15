<!DOCTYPE html>
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统锁定</title>
    <link rel="stylesheet" href="assets/css/common_styles/main.css">
    <link rel="stylesheet" href="assets/css/lock-screen.css">
    <link rel="stylesheet" href="assets/css/common_styles/modern-theme.css">
</head>
<body>
    <div class="lock-container">
        <!-- 锁定信息 -->
        <div class="lock-info">
            <div class="lock-time" id="lock-time">锁定时间: --</div>
            <div class="lock-user" id="lock-user">锁定用户: --</div>
        </div>

        <!-- 锁定图标 -->
        <div class="lock-icon">🔒</div>
        
        <!-- 锁定标题 -->
        <h1 class="lock-title">系统已锁定</h1>
        
        <!-- 锁定原因 -->
        <p class="lock-reason" id="lock-reason">系统已锁定，请验证身份以继续访问</p>
        
        <!-- 解锁方法 -->
        <div class="unlock-methods">
            <!-- 密码解锁 -->
            <div class="unlock-section" id="password-section">
                <div class="unlock-label">
                    🔐 密码解锁
                </div>
                <input type="password" 
                       class="unlock-input" 
                       id="password-input" 
                       placeholder="请输入您的密码"
                       autocomplete="current-password">
                <button class="unlock-button password" onclick="attemptPasswordUnlock()">
                    🔓 解锁系统
                </button>
                <div class="help-text">
                    输入您账户的密码以解锁系统
                </div>
            </div>
            
            <!-- Vikey解锁 -->
            <div class="unlock-section" id="vikey-section">
                <div class="unlock-label">
                    🔑 Vikey硬件解锁
                </div>
                <div class="vikey-status" id="vikey-status">
                    <span class="vikey-indicator"></span>
                    <span id="vikey-status-text">正在检测Vikey设备...</span>
                </div>
                <button class="unlock-button vikey" onclick="attemptVikeyUnlock()">
                    🔑 使用Vikey解锁
                </button>
                <div class="help-text">
                    插入您的Vikey硬件设备以快速解锁
                </div>
            </div>
        </div>
        
        <!-- 状态显示 -->
        <div class="unlock-status" id="unlock-status"></div>
        
        <!-- 快速操作 -->
        <div class="quick-actions">
            <button class="quick-action" onclick="refreshVikeyStatus()">
                🔄 刷新设备
            </button>
            <button class="quick-action" onclick="showHelp()">
                ❓ 帮助
            </button>
            <button class="quick-action" onclick="showSystemInfo()">
                ℹ️ 系统信息
            </button>
        </div>
        
        <!-- 安全提示 -->
        <div class="security-notice">
            🔒 此系统受多重安全保护，所有解锁尝试都会被记录
        </div>
    </div>

    <!-- 引入必要的JavaScript模块 -->
    <script src="assets/js/core/system-lock.js"></script>
    <script src="assets/js/core/vikey-api.js"></script>
    <script src="assets/js/core/user-management.js"></script>

    <script>
        // 全局变量
        let lockManager = null;
        let vikeyAPI = null;
        let userManagement = null;
        let lockInfo = null;

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', async function() {
            try {
                console.log('初始化锁定页面...');
                
                // 初始化模块
                await initializeModules();
                
                // 加载锁定信息
                await loadLockInfo();
                
                // 设置事件监听器
                setupEventListeners();
                
                // 自动检测Vikey设备
                await checkVikeyDevices();
                
                console.log('锁定页面初始化完成');
                
            } catch (error) {
                console.error('初始化锁定页面失败:', error);
                showStatus('初始化失败: ' + error.message, 'error');
            }
        });

        /**
         * 初始化模块
         */
        async function initializeModules() {
            try {
                // 初始化锁定管理器
                if (typeof SystemLockManager !== 'undefined') {
                    lockManager = new SystemLockManager();
                    await lockManager.init();
                }

                // 初始化Vikey API
                if (typeof VikeyAPI !== 'undefined') {
                    vikeyAPI = new VikeyAPI();
                    await vikeyAPI.init();
                }

                // 初始化用户管理
                if (typeof UserManagementSystem !== 'undefined') {
                    userManagement = new UserManagementSystem();
                    await userManagement.init();
                }

            } catch (error) {
                console.error('初始化模块失败:', error);
                throw error;
            }
        }

        /**
         * 加载锁定信息
         */
        async function loadLockInfo() {
            try {
                if (lockManager) {
                    lockInfo = lockManager.getLockStatus();
                    updateLockInfoDisplay();
                }

            } catch (error) {
                console.error('加载锁定信息失败:', error);
            }
        }

        /**
         * 更新锁定信息显示
         */
        function updateLockInfoDisplay() {
            if (!lockInfo) return;

            // 更新锁定时间
            const lockTimeElement = document.getElementById('lock-time');
            if (lockInfo.lockTime) {
                const lockDate = new Date(lockInfo.lockTime);
                lockTimeElement.textContent = `锁定时间: ${lockDate.toLocaleString()}`;
            }

            // 更新锁定用户
            const lockUserElement = document.getElementById('lock-user');
            if (lockInfo.lockedBy) {
                lockUserElement.textContent = `锁定用户: ID ${lockInfo.lockedBy}`;
            }

            // 更新锁定原因
            const lockReasonElement = document.getElementById('lock-reason');
            const reasonText = getLockReasonText(lockInfo.lockReason);
            lockReasonElement.textContent = reasonText;
        }

        /**
         * 获取锁定原因文本
         */
        function getLockReasonText(reason) {
            const reasons = {
                'MANUAL': '系统已被管理员手动锁定',
                'INACTIVITY_TIMEOUT': '由于长时间无操作，系统已自动锁定',
                'VIKEY_REMOVED': 'Vikey设备被移除，系统已自动锁定',
                'TAB_CLOSED': '由于标签页关闭，系统已自动锁定',
                'SECURITY_POLICY': '安全策略触发，系统已自动锁定',
                'ADMIN_ACTION': '管理员操作，系统已锁定'
            };

            return reasons[reason] || '系统已锁定，请验证身份以继续访问';
        }

        /**
         * 设置事件监听器
         */
        function setupEventListeners() {
            // 密码输入框回车事件
            const passwordInput = document.getElementById('password-input');
            if (passwordInput) {
                passwordInput.addEventListener('keypress', function(event) {
                    if (event.key === 'Enter') {
                        attemptPasswordUnlock();
                    }
                });

                // 输入时清除状态
                passwordInput.addEventListener('input', function() {
                    clearStatus();
                });
            }

            // 定期检查Vikey设备
            setInterval(checkVikeyDevices, 5000);
        }

        /**
         * 检查Vikey设备
         */
        async function checkVikeyDevices() {
            try {
                if (!vikeyAPI) return;

                const devices = await vikeyAPI.findDevices();
                const vikeyStatus = document.getElementById('vikey-status');
                const vikeyStatusText = document.getElementById('vikey-status-text');

                if (devices && devices.length > 0) {
                    vikeyStatus.classList.add('detected');
                    vikeyStatus.classList.remove('error');
                    vikeyStatusText.textContent = `检测到 ${devices.length} 个Vikey设备`;
                    
                    // 高亮Vikey解锁区域
                    document.getElementById('vikey-section').classList.add('active');
                } else {
                    vikeyStatus.classList.remove('detected');
                    vikeyStatusText.textContent = '未检测到Vikey设备';
                    
                    // 取消高亮
                    document.getElementById('vikey-section').classList.remove('active');
                }

            } catch (error) {
                console.error('检查Vikey设备失败:', error);
                const vikeyStatus = document.getElementById('vikey-status');
                const vikeyStatusText = document.getElementById('vikey-status-text');
                
                vikeyStatus.classList.add('error');
                vikeyStatusText.textContent = 'Vikey设备检测失败';
            }
        }

        /**
         * 密码解锁尝试
         */
        async function attemptPasswordUnlock() {
            const passwordInput = document.getElementById('password-input');
            const password = passwordInput.value.trim();

            if (!password) {
                showStatus('请输入密码', 'error');
                return;
            }

            showStatus('正在验证密码...', 'loading');

            try {
                let success = false;

                if (lockManager) {
                    success = await lockManager.unlockSystem({
                        type: 'password',
                        password: password
                    });
                } else {
                    // 备用验证方法
                    success = await validatePasswordFallback(password);
                }

                if (success) {
                    showStatus('解锁成功，正在跳转...', 'success');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1000);
                } else {
                    showStatus('密码错误，请重试', 'error');
                    passwordInput.value = '';
                    passwordInput.focus();
                }

            } catch (error) {
                console.error('密码解锁失败:', error);
                showStatus('解锁失败: ' + error.message, 'error');
            }
        }

        /**
         * Vikey解锁尝试
         */
        async function attemptVikeyUnlock() {
            showStatus('正在验证Vikey设备...', 'loading');

            try {
                let success = false;

                if (lockManager) {
                    success = await lockManager.unlockSystem({
                        type: 'vikey'
                    });
                } else {
                    // 备用验证方法
                    success = await validateVikeyFallback();
                }

                if (success) {
                    showStatus('Vikey验证成功，正在跳转...', 'success');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1000);
                } else {
                    showStatus('Vikey验证失败，请检查设备连接', 'error');
                }

            } catch (error) {
                console.error('Vikey解锁失败:', error);
                showStatus('Vikey验证失败: ' + error.message, 'error');
            }
        }

        /**
         * 备用密码验证
         */
        async function validatePasswordFallback(password) {
            try {
                if (!userManagement) return false;

                const currentUser = userManagement.getCurrentUser();
                if (!currentUser) return false;

                // 这里应该调用实际的密码验证逻辑
                // 简化版本，实际需要完整的验证流程
                return await userManagement.validatePassword(currentUser.username, password);

            } catch (error) {
                console.error('备用密码验证失败:', error);
                return false;
            }
        }

        /**
         * 备用Vikey验证
         */
        async function validateVikeyFallback() {
            try {
                if (!vikeyAPI) return false;

                const devices = await vikeyAPI.findDevices();
                if (!devices || devices.length === 0) {
                    return false;
                }

                // 验证第一个设备
                const device = devices[0];
                return await vikeyAPI.verifyDevice(device.deviceId);

            } catch (error) {
                console.error('备用Vikey验证失败:', error);
                return false;
            }
        }

        /**
         * 显示状态消息
         */
        function showStatus(message, type = 'info') {
            const statusElement = document.getElementById('unlock-status');
            
            statusElement.className = 'unlock-status ' + type;
            statusElement.textContent = message;

            // 自动清除成功和错误消息
            if (type === 'success' || type === 'error') {
                setTimeout(() => {
                    clearStatus();
                }, 5000);
            }
        }

        /**
         * 清除状态消息
         */
        function clearStatus() {
            const statusElement = document.getElementById('unlock-status');
            statusElement.className = 'unlock-status';
            statusElement.textContent = '';
        }

        /**
         * 刷新Vikey状态
         */
        async function refreshVikeyStatus() {
            showStatus('正在刷新设备状态...', 'loading');
            await checkVikeyDevices();
            showStatus('设备状态已刷新', 'success');
        }

        /**
         * 显示帮助
         */
        function showHelp() {
            const helpText = `
解锁帮助：

1. 密码解锁：
   - 输入您账户的登录密码
   - 确保密码输入正确
   - 注意大小写

2. Vikey解锁：
   - 确保Vikey设备已正确插入
   - 设备驱动已安装
   - 设备未被其他程序占用

3. 安全提示：
   - 所有解锁尝试都会被记录
   - 连续失败将触发安全机制
   - 如有问题请联系管理员

如需更多帮助，请联系系统管理员。
            `;

            alert(helpText);
        }

        /**
         * 显示系统信息
         */
        function showSystemInfo() {
            const info = {
                '系统版本': '1.0.0',
                '锁定时间': lockInfo?.lockTime || '未知',
                '锁定原因': lockInfo?.lockReason || '未知',
                '浏览器': navigator.userAgent.split(' ').pop(),
                '当前时间': new Date().toLocaleString()
            };

            let infoText = '系统信息：\n\n';
            for (const [key, value] of Object.entries(info)) {
                infoText += `${key}: ${value}\n`;
            }

            alert(infoText);
        }

        // 防止页面被缓存
        window.addEventListener('pageshow', function(event) {
            if (event.persisted) {
                window.location.reload();
            }
        });

        // 防止右键菜单
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        // 防止开发者工具快捷键
        document.addEventListener('keydown', function(e) {
            if (e.key === 'F12' || 
                (e.ctrlKey && e.shiftKey && e.key === 'I') ||
                (e.ctrlKey && e.shiftKey && e.key === 'C') ||
                (e.ctrlKey && e.key === 'u')) {
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
