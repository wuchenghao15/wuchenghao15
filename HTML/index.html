<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - MTSCOS 系统管理平台</title>
    <!-- 引入登录页面样式 -->
    <link rel="stylesheet" href="../SourceCode/CSS/页面样式/login-styles.css">
    <!-- 引入变量样式 -->
    <link rel="stylesheet" href="css/variables.css">
</head>
<body>
    <div class="login-container">
        <div class="login-wrapper">
            <!-- 左侧品牌区域 -->
            <div class="brand-side">
                <div class="brand-content">
                    <div class="brand-logo">
                        <i class="fas fa-cogs"></i>
                    </div>
                    <h1 class="brand-title">MTSCOS</h1>
                    <p class="brand-description">智能系统管理平台，提供高效、安全的服务器与数据库管理解决方案</p>
                    
                    <div class="brand-features">
                        <div class="feature-item">
                            <i class="fas fa-shield-alt"></i>
                            <span class="feature-text">企业级安全保障，多重加密保护</span>
                        </div>
                        <div class="feature-item">
                            <i class="fas fa-server"></i>
                            <span class="feature-text">全方位服务器监控与管理</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 右侧登录表单 -->
            <div class="form-side">
                <div class="form-header">
                    <h2 class="form-title">用户登录</h2>
                    <p class="form-subtitle">请登录您的账号，开始智能管理之旅</p>
                    <div id="loginError" class="error-message">
                        <i class="fas fa-exclamation-circle"></i> <span id="errorText">用户名或密码错误，请重试</span>
                    </div>
                </div>
                
                <form id="loginForm" class="login-form">
                    <div class="form-group">
                        <label for="username" class="form-label">用户名</label>
                        <div class="input-group">
                            <i class="fas fa-user input-icon"></i>
                            <input type="text" id="username" name="username" class="form-input" placeholder="请输入用户名" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="password" class="form-label">密码</label>
                        <div class="input-group">
                            <i class="fas fa-lock input-icon"></i>
                            <input type="password" id="password" name="password" class="form-input" placeholder="请输入密码" required>
                            <button type="button" class="toggle-password" aria-label="切换密码可见性">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        
                        <div class="login-options">
                            <div class="remember-me">
                                <span class="remember-text">记住我</span>
                            </div>
                            <a href="../SourceCode/HTML/PasswordReset.html" class="forgot-password">忘记密码？</a>
                        </div>
                    </div>
                    
                    <button type="submit" class="login-button">登录</button>
                    
                    <div class="divider">
                        <span class="divider-text">或</span>
                    </div>
                    
                    <div class="social-login">
                        <button type="button" class="social-button optimized-social-btn">
                            <i class="fab fa-github"></i>
                            <span class="social-text">GitHub</span>
                        </button>
                        <button type="button" class="social-button optimized-social-btn">
                            <i class="fab fa-google"></i>
                            <span class="social-text">Google</span>
                        </button>
                        <button type="button" class="social-button optimized-social-btn">
                            <i class="fab fa-weixin"></i>
                            <span class="social-text">微信</span>
                        </button>
                    </div>
                    
                    <div class="register-link">
                        还没有账号？ <a href="../SourceCode/HTML/register.html">立即注册</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <!-- 基础登录功能脚本 -->
    <script>
        // 简单的加密函数
        function simpleEncrypt(text) {
            return btoa(unescape(encodeURIComponent(text)));
        }
        
        // 记录日志到控制台和Cookie
        function logAction(action, data = {}) {
            const timestamp = new Date().toISOString();
            const logData = {
                timestamp,
                action,
                data
            };
            
            // 记录到控制台
            console.log('MTSCOS系统日志:', logData);
            
            // 记录到Cookie（加密敏感信息）
            let logs = getCookie('mtscos_logs') || '[]';
            logs = JSON.parse(logs);
            logs.push(logData);
            
            // 只保留最近100条日志
            if (logs.length > 100) {
                logs = logs.slice(-100);
            }
            
            setCookie('mtscos_logs', JSON.stringify(logs), 1);
        }
        
        // Cookie操作函数
        function setCookie(name, value, days) {
            const d = new Date();
            d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
            const expires = "expires=" + d.toUTCString();
            document.cookie = name + "=" + value + ";" + expires + ";path=/;SameSite=Lax;Secure";
        }
        
        function getCookie(name) {
            const cname = name + "=";
            const decodedCookie = decodeURIComponent(document.cookie);
            const ca = decodedCookie.split(';');
            for(let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) == ' ') {
                    c = c.substring(1);
                }
                if (c.indexOf(cname) == 0) {
                    return c.substring(cname.length, c.length);
                }
            }
            return "";
        }
        
        // 记录到sessionStorage
        function recordToSession(key, data) {
            try {
                sessionStorage.setItem(key, JSON.stringify(data));
                return true;
            } catch (e) {
                console.error('Session存储失败:', e);
                return false;
            }
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            // 页面加载日志
            logAction('页面加载', { page: 'login', timestamp: new Date().toISOString() });
            
            // 密码显示切换功能
            const togglePassword = document.querySelector('.toggle-password');
            const passwordInput = document.getElementById('password');
            
            if (togglePassword && passwordInput) {
                togglePassword.addEventListener('click', function() {
                    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordInput.setAttribute('type', type);
                    
                    // 切换图标
                    const icon = this.querySelector('i');
                    icon.classList.toggle('fa-eye');
                    icon.classList.toggle('fa-eye-slash');
                    
                    // 记录密码可见性切换日志
                    logAction('密码可见性切换', { visible: type === 'text' });
                });
            }
            
            // 记住我功能（已移除复选框）
            let rememberMe = false;
            const rememberText = document.querySelector('.remember-text');
            if (rememberText) {
                rememberText.addEventListener('click', function() {
                    rememberMe = !rememberMe;
                    // 记录记住我选择日志
                    logAction('记住我选择', { checked: rememberMe });
                });
            }
            
            // 输入框焦点事件日志
            const usernameInput = document.getElementById('username');
            if (usernameInput) {
                usernameInput.addEventListener('focus', function() {
                    logAction('用户名输入框焦点');
                });
                
                usernameInput.addEventListener('input', function() {
                    logAction('用户名输入', { length: this.value.length });
                });
            }
            
            if (passwordInput) {
                passwordInput.addEventListener('focus', function() {
                    logAction('密码输入框焦点');
                });
                
                passwordInput.addEventListener('input', function() {
                    logAction('密码输入', { length: this.value.length });
                });
            }
            
            // 表单提交处理
            const loginForm = document.getElementById('loginForm');
            if (loginForm) {
                loginForm.addEventListener('submit', function(e) {
                    e.preventDefault();
                    
                    const username = usernameInput.value;
                    const password = passwordInput.value;
                    // 使用已声明的rememberMe变量
                    
                    // 加密用户名和密码
                    const encryptedUsername = simpleEncrypt(username);
                    const encryptedPassword = simpleEncrypt(password);
                    
                    // 记录登录尝试日志
                    logAction('登录尝试', {
                        username: encryptedUsername,
                        password_length: password.length,
                        remember_me: rememberMe
                    });
                    
                    // 记录到session
                    recordToSession('login_attempt', {
                        timestamp: new Date().toISOString(),
                        username: encryptedUsername,
                        remember_me: rememberMe
                    });
                    
                    // 如果选择记住我，存储加密的用户名到Cookie
                    if (rememberMe) {
                        setCookie('mtscos_username', encryptedUsername, 7);
                    }
                    
                    console.log('登录表单提交，信息已加密记录');
                    // 这里可以添加实际的登录逻辑
                });
            }
        });
    </script>
</body>
</html>
