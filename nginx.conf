# Nginx负载均衡配置
# 用于MTSCOS AI Project服务器集群

# 定义upstream服务器组
events {
    worker_connections  1024;
}

http {
    # 日志配置
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log   error;
    
    # 负载均衡配置
    upstream mtscos_cluster {
        # 定义集群中的服务器节点
        server 127.0.0.1:8888 weight=1 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:8889 weight=1 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:8890 weight=1 max_fails=3 fail_timeout=30s;
        
        # 健康检查
        # check interval=3000 rise=2 fall=5 timeout=1000 type=http;
        # check_http_send "HEAD /health HTTP/1.0\r\nHost: localhost\r\n\r\n";
        # check_http_expect_alive http_2xx http_3xx;
    }
    
    # 主服务器配置
    server {
        listen       80;
        server_name  localhost;
        
        # 根路径配置
        location / {
            proxy_pass         http://mtscos_cluster;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            
            # 代理超时设置
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
        
        # 健康检查路径
        location /health {
            proxy_pass         http://mtscos_cluster;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
        
        # 静态文件配置
        location /static {
            alias /Users/wuchenghao/Library/CloudStorage/OneDrive-个人/文档/MTSCOS_AI_Project/flask-app/static;
            expires 30d;
        }
        
        # 错误页面配置
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
    
    # HTTPS配置（可选）
    # server {
    #     listen       443 ssl;
    #     server_name  localhost;
    #     
    #     ssl_certificate      cert.pem;
    #     ssl_certificate_key  cert.key;
    #     
    #     ssl_session_cache    shared:SSL:1m;
    #     ssl_session_timeout  5m;
    #     
    #     ssl_ciphers  HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers  on;
    #     
    #     location / {
    #         proxy_pass         http://mtscos_cluster;
    #         proxy_set_header   Host $host;
    #         proxy_set_header   X-Real-IP $remote_addr;
    #         proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header   X-Forwarded-Proto $scheme;
    #     }
    # }
}
