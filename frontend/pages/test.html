<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试页面</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(180deg, #0a0a0f, #0f172a);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 40px;
        }
        h1 {
            color: #00f0ff;
        }
        .test-section {
            margin: 20px 0;
            padding: 20px;
            background: rgba(30, 27, 75, 0.85);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .status-success {
            color: #10b981;
        }
        .status-error {
            color: #ef4444;
        }
        button {
            background: #00f0ff;
            color: #0a0a0f;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
        }
        button:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 系统诊断</h1>
        
        <div class="test-section">
            <h3>页面链接测试</h3>
            <button onclick="testPage('/')">首页</button>
            <button onclick="testPage('/frontend/pages/index.html')">主页</button>
            <button onclick="testPage('/frontend/pages/settings-v3.html')">设置页</button>
            <button onclick="testPage('/frontend/pages/learning.html')">学习页</button>
        </div>
        
        <div class="test-section">
            <h3>API测试</h3>
            <button onclick="testAPI('/api/health')">健康检查</button>
            <button onclick="testAPI('/api/ai-employees')">AI员工</button>
            <button onclick="testAPI('/api/statistics')">统计信息</button>
        </div>
        
        <div class="test-section">
            <h3>状态显示</h3>
            <div id="status">等待测试...</div>
        </div>
    </div>
    
    <script>
        function showStatus(message, isSuccess = true) {
            const status = document.getElementById('status');
            status.innerHTML = `<span class="${isSuccess ? 'status-success' : 'status-error'}">${message}</span>`;
            console.log(message);
        }
        
        function testPage(url) {
            showStatus(`正在测试: ${url}`);
            fetch(url)
                .then(response => {
                    if (response.ok) {
                        showStatus(`✅ ${url} - 成功 (${response.status})`);
                    } else {
                        showStatus(`❌ ${url} - 失败 (${response.status})`, false);
                    }
                })
                .catch(error => {
                    showStatus(`❌ ${url} - 错误: ${error}`, false);
                });
        }
        
        function testAPI(url) {
            showStatus(`正在测试API: ${url}`);
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    showStatus(`✅ ${url} - 成功: ${JSON.stringify(data).substring(0, 100)}...`);
                })
                .catch(error => {
                    showStatus(`❌ ${url} - 错误: ${error}`, false);
                });
        }
        
        console.log('测试页面已加载');
        showStatus('页面加载成功，请点击上面的按钮进行测试');
    </script>
</body>
</html>
