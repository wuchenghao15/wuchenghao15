{% extends "admin_app/base.html" %}
{% block title %}通讯中心 - MTSCOS AI{% endblock %}

{% block content %}
<div class="comm-center">
    <div class="comm-header">
        <h1>通讯中心</h1>
        <p>站内通知、邮件系统、短信系统、交流系统统一管理</p>
    </div>

    <div class="comm-tabs">
        <button class="comm-tab active" onclick="switchCommTab('notifications')">站内通知</button>
        <button class="comm-tab" onclick="switchCommTab('emails')">邮件系统</button>
        <button class="comm-tab" onclick="switchCommTab('sms')">短信系统</button>
        <button class="comm-tab" onclick="switchCommTab('chat')">交流系统</button>
        <button class="comm-tab" onclick="switchCommTab('stats')">统计概览</button>
    </div>

    <!-- 站内通知 -->
    <div id="tab-notifications" class="comm-tab-content active">
        <div class="comm-actions">
            <button class="btn-primary" onclick="showSendNotifModal()">发送通知</button>
            <button class="btn-secondary" onclick="markAllRead()">全部已读</button>
            <select id="notif-filter" onchange="loadNotifications()">
                <option value="">全部</option>
                <option value="unread">未读</option>
                <option value="read">已读</option>
                <option value="system">系统</option>
                <option value="exam">考试</option>
            </select>
        </div>
        <div id="notif-list" class="notif-list"></div>
    </div>

    <!-- 邮件系统 -->
    <div id="tab-emails" class="comm-tab-content">
        <div class="comm-actions">
            <button class="btn-primary" onclick="showSendEmailModal()">发送邮件</button>
            <button class="btn-secondary" onclick="loadEmailTemplates()">查看模板</button>
            <button class="btn-secondary" onclick="loadEmailHistory()">发送历史</button>
        </div>
        <div id="email-content"></div>
    </div>

    <!-- 短信系统 -->
    <div id="tab-sms" class="comm-tab-content">
        <div class="comm-actions">
            <button class="btn-primary" onclick="showSendSmsModal()">发送短信</button>
            <button class="btn-secondary" onclick="showVerifyCodeModal()">验证码测试</button>
            <button class="btn-secondary" onclick="loadSmsHistory()">发送历史</button>
        </div>
        <div id="sms-content"></div>
    </div>

    <!-- 交流系统 -->
    <div id="tab-chat" class="comm-tab-content">
        <div class="chat-layout">
            <div class="chat-sidebar">
                <button class="btn-primary full-width" onclick="showNewConvModal()">新建会话</button>
                <div id="conv-list" class="conv-list"></div>
            </div>
            <div class="chat-main">
                <div id="chat-messages" class="chat-messages"></div>
                <div class="chat-input-area">
                    <input type="text" id="chat-input" placeholder="输入消息..." onkeypress="if(event.key==='Enter')sendMessage()">
                    <button class="btn-primary" onclick="sendMessage()">发送</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 统计概览 -->
    <div id="tab-stats" class="comm-tab-content">
        <div id="stats-content" class="stats-grid"></div>
    </div>
</div>

<!-- 模态框容器 -->
<div id="modal-container"></div>

<style>
.comm-center { padding: 20px; }
.comm-header { margin-bottom: 20px; }
.comm-header h1 { margin: 0 0 5px 0; color: #333; }
.comm-header p { color: #666; margin: 0; }
.comm-tabs { display: flex; gap: 5px; margin-bottom: 20px; border-bottom: 2px solid #e0e0e0; }
.comm-tab { padding: 10px 20px; border: none; background: none; cursor: pointer; font-size: 14px; color: #666; border-bottom: 2px solid transparent; margin-bottom: -2px; }
.comm-tab.active { color: #1890ff; border-bottom-color: #1890ff; font-weight: 600; }
.comm-tab-content { display: none; }
.comm-tab-content.active { display: block; }
.comm-actions { display: flex; gap: 10px; margin-bottom: 15px; align-items: center; }
.btn-primary { background: #1890ff; color: #fff; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
.btn-primary:hover { background: #40a9ff; }
.btn-secondary { background: #f0f0f0; color: #333; border: 1px solid #d9d9d9; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
.btn-secondary:hover { background: #e0e0e0; }
.full-width { width: 100%; margin-bottom: 10px; }
.notif-item { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-bottom: 10px; }
.notif-item.unread { border-left: 4px solid #1890ff; }
.notif-item .notif-title { font-weight: 600; font-size: 15px; }
.notif-item .notif-meta { color: #999; font-size: 12px; margin-top: 5px; }
.notif-item .notif-actions { margin-top: 10px; }
.notif-item .notif-actions button { font-size: 12px; padding: 4px 10px; margin-right: 5px; }
.chat-layout { display: flex; height: 500px; gap: 10px; }
.chat-sidebar { width: 250px; border: 1px solid #e0e0e0; border-radius: 8px; overflow-y: auto; padding: 10px; }
.chat-main { flex: 1; border: 1px solid #e0e0e0; border-radius: 8px; display: flex; flex-direction: column; }
.chat-messages { flex: 1; overflow-y: auto; padding: 15px; }
.chat-input-area { display: flex; gap: 5px; padding: 10px; border-top: 1px solid #e0e0e0; }
.chat-input-area input { flex: 1; padding: 8px; border: 1px solid #d9d9d9; border-radius: 4px; }
.conv-item { padding: 10px; border-radius: 6px; cursor: pointer; margin-bottom: 5px; }
.conv-item:hover, .conv-item.active { background: #e6f7ff; }
.conv-item .conv-name { font-weight: 600; font-size: 13px; }
.conv-item .conv-preview { color: #999; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.msg-item { margin-bottom: 10px; max-width: 70%; }
.msg-item.sent { margin-left: auto; }
.msg-bubble { padding: 10px 14px; border-radius: 12px; font-size: 14px; }
.msg-item.sent .msg-bubble { background: #1890ff; color: #fff; }
.msg-item.received .msg-bubble { background: #f0f0f0; color: #333; }
.msg-meta { font-size: 11px; color: #999; margin-top: 3px; }
.stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; }
.stat-card { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 20px; text-align: center; }
.stat-card .stat-icon { font-size: 32px; margin-bottom: 10px; }
.stat-card .stat-value { font-size: 28px; font-weight: 700; color: #1890ff; }
.stat-card .stat-label { color: #666; font-size: 13px; margin-top: 5px; }
.modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 999; display: flex; align-items: center; justify-content: center; }
.modal-box { background: #fff; border-radius: 8px; padding: 25px; min-width: 400px; max-width: 600px; max-height: 80vh; overflow-y: auto; }
.modal-box h3 { margin: 0 0 15px 0; }
.modal-box .form-group { margin-bottom: 12px; }
.modal-box label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 13px; }
.modal-box input, .modal-box textarea, .modal-box select { width: 100%; padding: 8px; border: 1px solid #d9d9d9; border-radius: 4px; box-sizing: border-box; }
.modal-box textarea { min-height: 80px; resize: vertical; }
.modal-box .modal-actions { text-align: right; margin-top: 15px; }
.modal-box .modal-actions button { margin-left: 10px; }

@media (max-width: 768px) {
    .stats-grid, .section-grid, .feature-grid { grid-template-columns: 1fr !important; }
    .sidebar { width: 60px !important; }
    .main-content { padding: 12px !important; }
}

.loading-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:9999;}
.loading-spinner{width:40px;height:40px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>

<script>
let currentConvId = null;

function switchCommTab(tab) {
    document.querySelectorAll('.comm-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.comm-tab-content').forEach(c => c.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById('tab-' + tab).classList.add('active');

    if (tab === 'notifications') loadNotifications();
    else if (tab === 'stats') loadStats();
    else if (tab === 'chat') loadConversations();
}

// === 通知 ===
async function loadNotifications() {
    try {
        const filter = document.getElementById('notif-filter').value;
        let url = '/api/communication/notifications?limit=50';
        if (filter === 'unread' || filter === 'read') url += '&status=' + filter;
        else if (filter) url += '&category=' + filter;
        const res = await fetch(url);
        const data = await res.json();
        if (data.success) {
            const list = document.getElementById('notif-list');
            if (data.data.length === 0) {
                list.innerHTML = '<p style="text-align:center;color:#999;padding:40px;">暂无通知</p>';
                return;
            }
            list.innerHTML = data.data.map(n => `
                <div class="notif-item ${n.status === 'unread' ? 'unread' : ''}">
                    <div class="notif-title">${n.title}</div>
                    <div class="notif-content">${n.content || ''}</div>
                    <div class="notif-meta">${n.sender_name || '系统'} | ${n.category} | ${n.created_at}</div>
                    <div class="notif-actions">
                        ${n.status === 'unread' ? `<button class="btn-secondary" onclick="markRead('${n.notification_id}')">已读</button>` : ''}
                        <button class="btn-secondary" onclick="archiveNotif('${n.notification_id}')">归档</button>
                        <button class="btn-secondary" onclick="deleteNotif('${n.notification_id}')">删除</button>
                    </div>
                </div>
            `).join('');
        }
    } catch (e) { console.error(e); }
}

async function markRead(id) {
    await fetch(`/api/communication/notifications/${id}/read`, { method: 'PUT' });
    loadNotifications();
}

async function markAllRead() {
    await fetch('/api/communication/notifications/read-all', { method: 'PUT' });
    loadNotifications();
}

async function archiveNotif(id) {
    await fetch(`/api/communication/notifications/${id}/archive`, { method: 'PUT' });
    loadNotifications();
}

async function deleteNotif(id) {
    if (!confirm('确定删除？')) return;
    await fetch(`/api/communication/notifications/${id}`, { method: 'DELETE' });
    loadNotifications();
}

function showSendNotifModal() {
    document.getElementById('modal-container').innerHTML = `
        <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
            <div class="modal-box">
                <h3>发送通知</h3>
                <div class="form-group"><label>用户ID</label><input type="number" id="notif-user-id" placeholder="输入用户ID"></div>
                <div class="form-group"><label>标题</label><input type="text" id="notif-title" placeholder="通知标题"></div>
                <div class="form-group"><label>内容</label><textarea id="notif-content" placeholder="通知内容"></textarea></div>
                <div class="form-group"><label>类型</label><select id="notif-type"><option value="info">信息</option><option value="success">成功</option><option value="warning">警告</option><option value="error">错误</option></select></div>
                <div class="form-group"><label>分类</label><select id="notif-cat"><option value="system">系统</option><option value="exam">考试</option><option value="study">学习</option><option value="security">安全</option></select></div>
                <div class="modal-actions"><button class="btn-secondary" onclick="closeModal()">取消</button><button class="btn-primary" onclick="sendNotif()">发送</button></div>
            </div>
        </div>`;
}

async function sendNotif() {
    const res = await fetch('/api/communication/notifications', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            user_id: parseInt(document.getElementById('notif-user-id').value),
            title: document.getElementById('notif-title').value,
            content: document.getElementById('notif-content').value,
            type: document.getElementById('notif-type').value,
            category: document.getElementById('notif-cat').value
        })
    });
    const data = await res.json();
    if (data.success) { closeModal(); loadNotifications(); }
    else alert(data.error || '发送失败');
}

// === 邮件 ===
async function loadEmailTemplates() {
    const res = await fetch('/api/communication/emails/templates');
    const data = await res.json();
    if (data.success) {
        document.getElementById('email-content').innerHTML = `
            <h3>邮件模板</h3>
            ${data.data.map(t => `<div class="notif-item"><div class="notif-title">${t.name}</div><div class="notif-meta">分类: ${t.category} | 变量: ${t.variables}</div><div class="notif-content">${t.subject}</div></div>`).join('')}`;
    }
}

async function loadEmailHistory() {
    const res = await fetch('/api/communication/emails/history?limit=50');
    const data = await res.json();
    if (data.success) {
        document.getElementById('email-content').innerHTML = `
            <h3>邮件发送历史</h3>
            ${data.data.length === 0 ? '<p style="text-align:center;color:#999;">暂无记录</p>' :
            data.data.map(e => `<div class="notif-item"><div class="notif-title">${e.subject}</div><div class="notif-meta">收件: ${e.to_address} | 状态: ${e.status} | ${e.created_at}</div></div>`).join('')}`;
    }
}

function showSendEmailModal() {
    document.getElementById('modal-container').innerHTML = `
        <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
            <div class="modal-box">
                <h3>发送邮件</h3>
                <div class="form-group"><label>收件人</label><input type="email" id="email-to" placeholder="example@example.com"></div>
                <div class="form-group"><label>主题</label><input type="text" id="email-subject" placeholder="邮件主题"></div>
                <div class="form-group"><label>内容</label><textarea id="email-body" placeholder="邮件内容"></textarea></div>
                <div class="form-group"><label>模板</label><select id="email-tpl"><option value="">不使用模板</option><option value="TPL-EMAIL-WELCOME">欢迎注册</option><option value="TPL-EMAIL-EXAM-REMINDER">考试提醒</option><option value="TPL-EMAIL-SCORE">成绩通知</option></select></div>
                <div class="modal-actions"><button class="btn-secondary" onclick="closeModal()">取消</button><button class="btn-primary" onclick="sendEmail()">发送</button></div>
            </div>
        </div>`;
}

async function sendEmail() {
    const body = { to_address: document.getElementById('email-to').value, subject: document.getElementById('email-subject').value, body_text: document.getElementById('email-body').value };
    if (document.getElementById('email-tpl').value) body.template_id = document.getElementById('email-tpl').value;
    const res = await fetch('/api/communication/emails', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const data = await res.json();
    if (data.success) { closeModal(); loadEmailHistory(); }
    else alert(data.error || '发送失败');
}

// === 短信 ===
function showSendSmsModal() {
    document.getElementById('modal-container').innerHTML = `
        <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
            <div class="modal-box">
                <h3>发送短信</h3>
                <div class="form-group"><label>手机号</label><input type="text" id="sms-phone" placeholder="13xxxxxxxxx"></div>
                <div class="form-group"><label>内容</label><textarea id="sms-content" placeholder="短信内容"></textarea></div>
                <div class="form-group"><label>模板</label><select id="sms-tpl"><option value="">不使用模板</option><option value="TPL-SMS-VERIFY">验证码</option><option value="TPL-SMS-EXAM">考试提醒</option><option value="TPL-SMS-SCORE">成绩通知</option></select></div>
                <div class="modal-actions"><button class="btn-secondary" onclick="closeModal()">取消</button><button class="btn-primary" onclick="sendSms()">发送</button></div>
            </div>
        </div>`;
}

async function sendSms() {
    const body = { phone_number: document.getElementById('sms-phone').value, content: document.getElementById('sms-content').value };
    if (document.getElementById('sms-tpl').value) body.template_id = document.getElementById('sms-tpl').value;
    const res = await fetch('/api/communication/sms', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const data = await res.json();
    if (data.success) { closeModal(); loadSmsHistory(); }
    else alert(data.error || '发送失败');
}

function showVerifyCodeModal() {
    document.getElementById('modal-container').innerHTML = `
        <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
            <div class="modal-box">
                <h3>验证码测试</h3>
                <div class="form-group"><label>手机号</label><input type="text" id="verify-phone" placeholder="13xxxxxxxxx"></div>
                <button class="btn-primary" onclick="sendVerifyCode()">发送验证码</button>
                <div class="form-group" style="margin-top:15px;"><label>验证码</label><input type="text" id="verify-code" placeholder="输入收到的验证码"></div>
                <div class="modal-actions"><button class="btn-secondary" onclick="closeModal()">关闭</button><button class="btn-primary" onclick="checkVerifyCode()">验证</button></div>
            </div>
        </div>`;
}

async function sendVerifyCode() {
    const res = await fetch('/api/communication/sms/verification-code', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ phone_number: document.getElementById('verify-phone').value }) });
    const data = await res.json();
    if (data.success) alert('验证码已发送');
    else alert(data.error || '发送失败');
}

async function checkVerifyCode() {
    const res = await fetch('/api/communication/sms/verify-code', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ phone_number: document.getElementById('verify-phone').value, code: document.getElementById('verify-code').value }) });
    const data = await res.json();
    if (data.success) { alert('验证成功'); closeModal(); }
    else alert(data.error || '验证失败');
}

async function loadSmsHistory() {
    const res = await fetch('/api/communication/sms/history?limit=50');
    const data = await res.json();
    if (data.success) {
        document.getElementById('sms-content').innerHTML = `
            <h3>短信发送历史</h3>
            ${data.data.length === 0 ? '<p style="text-align:center;color:#999;">暂无记录</p>' :
            data.data.map(s => `<div class="notif-item"><div class="notif-title">${s.content.substring(0,50)}...</div><div class="notif-meta">手机: ${s.phone_number} | 状态: ${s.status} | ${s.created_at}</div></div>`).join('')}`;
    }
}

// === 交流 ===
async function loadConversations() {
    const res = await fetch('/api/communication/chat/conversations');
    const data = await res.json();
    if (data.success) {
        const list = document.getElementById('conv-list');
        list.innerHTML = data.data.map(c => `
            <div class="conv-item ${c.conversation_id === currentConvId ? 'active' : ''}" onclick="openConv('${c.conversation_id}')">
                <div class="conv-name">${c.name || '直接对话'}</div>
                <div class="conv-preview">${c.last_message_preview || '暂无消息'}</div>
            </div>`).join('');
    }
}

async function openConv(convId) {
    currentConvId = convId;
    loadConversations();
    const res = await fetch(`/api/communication/chat/conversations/${convId}/messages?limit=50`);
    const data = await res.json();
    if (data.success) {
        const box = document.getElementById('chat-messages');
        const userId = {{ user.id }};
        box.innerHTML = data.data.map(m => `
            <div class="msg-item ${m.sender_id === userId ? 'sent' : 'received'}">
                <div class="msg-bubble">${m.content}</div>
                <div class="msg-meta">${m.sender_name || '用户'} | ${m.created_at}</div>
            </div>`).join('');
        box.scrollTop = box.scrollHeight;
    }
}

async function sendMessage() {
    if (!currentConvId) { alert('请先选择会话'); return; }
    const input = document.getElementById('chat-input');
    const content = input.value.trim();
    if (!content) return;
    await fetch(`/api/communication/chat/conversations/${currentConvId}/messages`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content })
    });
    input.value = '';
    openConv(currentConvId);
    loadConversations();
}

function showNewConvModal() {
    document.getElementById('modal-container').innerHTML = `
        <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
            <div class="modal-box">
                <h3>新建会话</h3>
                <div class="form-group"><label>参与者ID（逗号分隔）</label><input type="text" id="conv-participants" placeholder="2,3,4"></div>
                <div class="form-group"><label>类型</label><select id="conv-type"><option value="direct">直接对话</option><option value="group">群聊</option></select></div>
                <div class="form-group"><label>群名称（群聊时）</label><input type="text" id="conv-name" placeholder="群名称"></div>
                <div class="modal-actions"><button class="btn-secondary" onclick="closeModal()">取消</button><button class="btn-primary" onclick="createConv()">创建</button></div>
            </div>
        </div>`;
}

async function createConv() {
    const ids = document.getElementById('conv-participants').value.split(',').map(s => parseInt(s.trim())).filter(n => n);
    const res = await fetch('/api/communication/chat/conversations', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ participant_ids: ids, conversation_type: document.getElementById('conv-type').value, name: document.getElementById('conv-name').value })
    });
    const data = await res.json();
    if (data.success) { closeModal(); loadConversations(); }
    else alert(data.error || '创建失败');
}

// === 统计 ===
async function loadStats() {
    const res = await fetch('/api/communication/stats');
    const data = await res.json();
    if (data.success) {
        const s = data.data;
        document.getElementById('stats-content').innerHTML = `
            <div class="stat-card"><div class="stat-icon"><i class="fas fa-bell"></i></div><div class="stat-value">${s.notifications.unread}</div><div class="stat-label">未读通知 (共${s.notifications.total})</div></div>
            <div class="stat-card"><div class="stat-icon">📧</div><div class="stat-value">${s.emails.sent}</div><div class="stat-label">已发送邮件</div></div>
            <div class="stat-card"><div class="stat-icon">⏳</div><div class="stat-value">${s.emails.pending}</div><div class="stat-label">待发邮件</div></div>
            <div class="stat-card"><div class="stat-icon">❌</div><div class="stat-value">${s.emails.failed}</div><div class="stat-label">失败邮件</div></div>
            <div class="stat-card"><div class="stat-icon">📱</div><div class="stat-value">${s.sms.sent}</div><div class="stat-label">已发短信</div></div>
            <div class="stat-card"><div class="stat-icon">💬</div><div class="stat-value">${s.chat.active_conversations}</div><div class="stat-label">活跃会话</div></div>
            <div class="stat-card"><div class="stat-icon"><i class="fas fa-file-alt"></i></div><div class="stat-value">${s.chat.total_messages}</div><div class="stat-label">总消息数</div></div>
            <div class="stat-card"><div class="stat-icon"><i class="fas fa-list-check"></i></div><div class="stat-value">${s.templates.email + s.templates.sms}</div><div class="stat-label">模板数 (邮件${s.templates.email}+短信${s.templates.sms})</div></div>`;
    }
}

function closeModal() { document.getElementById('modal-container').innerHTML = ''; }

// 初始加载
loadNotifications();
</script>
{% endblock %}
