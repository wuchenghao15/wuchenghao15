{% extends "admin_app/base.html" %}
{% block title %}SSL/VPN管理 - MTSCOS AI{% endblock %}

{% block content %}
<div class="sslvpn-page">
    <div class="page-header">
        <h1>🔒 SSL/VPN 管理中心</h1>
        <p>SSL证书管理、HTTPS配置、VPN管理、代理管理</p>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('ssl')">SSL证书</button>
        <button class="tab-btn" onclick="switchTab('config')">HTTPS配置</button>
        <button class="tab-btn" onclick="switchTab('vpn')">VPN管理</button>
        <button class="tab-btn" onclick="switchTab('proxy')">代理管理</button>
        <button class="tab-btn" onclick="switchTab('stats')">统计概览</button>
    </div>

    <!-- SSL证书 -->
    <div id="tab-ssl" class="tab-content active">
        <div class="actions">
            <button class="btn-primary" onclick="showGenCertModal()">生成自签名证书</button>
            <button class="btn-secondary" onclick="loadCertificates()">刷新列表</button>
        </div>
        <div id="cert-list" class="card-grid"></div>
    </div>

    <!-- HTTPS配置 -->
    <div id="tab-config" class="tab-content">
        <div class="config-section">
            <h3>SSL 基本配置</h3>
            <div class="form-grid">
                <div class="form-item">
                    <label>启用SSL</label>
                    <select id="cfg-ssl-enabled">
                        <option value="0">禁用</option>
                        <option value="1">启用</option>
                    </select>
                </div>
                <div class="form-item">
                    <label>HTTP端口</label>
                    <input type="number" id="cfg-http-port" value="8888">
                </div>
                <div class="form-item">
                    <label>HTTPS端口</label>
                    <input type="number" id="cfg-https-port" value="443">
                </div>
                <div class="form-item">
                    <label>安全等级</label>
                    <select id="cfg-security-level">
                        <option value="modern">Modern (TLS 1.3)</option>
                        <option value="intermediate" selected>Intermediate (TLS 1.2+)</option>
                        <option value="old">Old (TLS 1.0+)</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="config-section">
            <h3>安全头配置</h3>
            <div class="form-grid">
                <div class="form-item">
                    <label>HSTS</label>
                    <select id="cfg-hsts">
                        <option value="1">启用</option>
                        <option value="0">禁用</option>
                    </select>
                </div>
                <div class="form-item">
                    <label>HSTS max-age (秒)</label>
                    <input type="number" id="cfg-hsts-age" value="63072000">
                </div>
                <div class="form-item">
                    <label>CSP</label>
                    <select id="cfg-csp">
                        <option value="1">启用</option>
                        <option value="0">禁用</option>
                    </select>
                </div>
                <div class="form-item">
                    <label>Referrer Policy</label>
                    <select id="cfg-referrer">
                        <option value="strict-origin-when-cross-origin" selected>strict-origin-when-cross-origin</option>
                        <option value="no-referrer">no-referrer</option>
                        <option value="origin">origin</option>
                        <option value="same-origin">same-origin</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="actions">
            <button class="btn-primary" onclick="saveSSLConfig()">保存配置</button>
            <button class="btn-secondary" onclick="testSSLConfig()">测试配置</button>
        </div>
    </div>

    <!-- VPN管理 -->
    <div id="tab-vpn" class="tab-content">
        <div class="actions">
            <button class="btn-primary" onclick="showCreateVPNModal()">创建WireGuard VPN</button>
            <button class="btn-secondary" onclick="loadVPNs()">刷新列表</button>
            <button class="btn-primary" onclick="toggleVPNServer()" id="vpn-server-btn">启动VPN服务器</button>
        </div>

        <div id="vpn-server-status" class="vpn-server-status" style="display:none;">
            <div class="status-header">
                <span class="status-indicator" id="vpn-status-indicator"></span>
                <span class="status-text" id="vpn-status-text">VPN服务器状态</span>
            </div>
            <div class="status-grid">
                <div class="status-item">
                    <span class="status-label">运行状态</span>
                    <span class="status-value" id="vpn-running-status">停止</span>
                </div>
                <div class="status-item">
                    <span class="status-label">监听端口</span>
                    <span class="status-value" id="vpn-port">51820</span>
                </div>
                <div class="status-item">
                    <span class="status-label">SSL加密</span>
                    <span class="status-value" id="vpn-ssl">启用</span>
                </div>
                <div class="status-item">
                    <span class="status-label">当前连接数</span>
                    <span class="status-value" id="vpn-current-clients">0</span>
                </div>
                <div class="status-item">
                    <span class="status-label">最大连接数</span>
                    <span class="status-value" id="vpn-max-clients">10</span>
                </div>
                <div class="status-item">
                    <span class="status-label">总流量(上传)</span>
                    <span class="status-value" id="vpn-total-sent">0 MB</span>
                </div>
                <div class="status-item">
                    <span class="status-label">总流量(下载)</span>
                    <span class="status-value" id="vpn-total-received">0 MB</span>
                </div>
                <div class="status-item">
                    <span class="status-label">峰值连接</span>
                    <span class="status-value" id="vpn-peak-clients">0</span>
                </div>
            </div>
        </div>

        <div id="vpn-clients-section" class="vpn-clients-section" style="display:none;">
            <h3>在线客户端</h3>
            <div id="vpn-client-list"></div>
        </div>

        <div id="vpn-list" class="card-grid"></div>

        <div id="vpn-users-section" class="vpn-users" style="display:none;">
            <h3>VPN用户列表</h3>
            <div class="actions">
                <button class="btn-primary" onclick="showAddVPNUserModal()">添加用户</button>
            </div>
            <div id="vpn-user-list"></div>
        </div>
    </div>

    <!-- 代理管理 -->
    <div id="tab-proxy" class="tab-content">
        <div class="actions">
            <button class="btn-primary" onclick="showAddProxyModal()">添加代理</button>
            <button class="btn-secondary" onclick="loadProxies()">刷新列表</button>
        </div>
        <div id="proxy-list" class="proxy-grid"></div>
    </div>

    <!-- 统计概览 -->
    <div id="tab-stats" class="tab-content">
        <div id="stats-grid" class="stats-grid"></div>
        <div class="logs-section">
            <h3>操作日志</h3>
            <div id="log-list"></div>
        </div>
    </div>
</div>

<div id="modal-container"></div>

<style>
.sslvpn-page { padding: 20px; }
.page-header h1 { margin: 0 0 5px 0; }
.page-header p { color: #666; margin: 0 0 20px 0; }
.tabs { display: flex; gap: 5px; margin-bottom: 20px; border-bottom: 2px solid #e0e0e0; }
.tab-btn { padding: 10px 20px; border: none; background: none; cursor: pointer; color: #666; border-bottom: 2px solid transparent; margin-bottom: -2px; }
.tab-btn.active { color: #1890ff; border-bottom-color: #1890ff; font-weight: 600; }
.tab-content { display: none; }
.tab-content.active { display: block; }
.actions { margin-bottom: 15px; display: flex; gap: 10px; }
.btn-primary { background: #1890ff; color: #fff; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
.btn-primary:hover { background: #40a9ff; }
.btn-secondary { background: #f0f0f0; color: #333; border: 1px solid #d9d9d9; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
.btn-secondary:hover { background: #e0e0e0; }
.btn-danger { background: #ff4d4f; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
.btn-success { background: #52c41a; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; }
.cert-card, .vpn-card, .proxy-card { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 15px; }
.cert-card .cert-name, .vpn-card .vpn-name { font-weight: 600; font-size: 16px; margin-bottom: 8px; }
.cert-card .cert-meta, .vpn-card .vpn-meta, .proxy-card .proxy-meta { font-size: 12px; color: #999; margin-bottom: 5px; }
.cert-card .cert-valid { color: #52c41a; }
.cert-card .cert-expiring { color: #faad14; }
.cert-card .cert-expired { color: #ff4d4f; }
.cert-card .card-actions, .vpn-card .card-actions, .proxy-card .card-actions { margin-top: 10px; display: flex; gap: 5px; }
.config-section { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 20px; margin-bottom: 15px; }
.config-section h3 { margin-top: 0; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
.form-item label { display: block; margin-bottom: 5px; font-size: 13px; font-weight: 600; }
.form-item input, .form-item select { width: 100%; padding: 8px; border: 1px solid #d9d9d9; border-radius: 4px; box-sizing: border-box; }
.proxy-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
.vpn-users { margin-top: 25px; padding-top: 20px; border-top: 1px solid #e0e0e0; }
.user-row { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #fafafa; border-radius: 6px; margin-bottom: 8px; }

.vpn-server-status { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
.status-header { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
.status-indicator { width: 12px; height: 12px; border-radius: 50%; background: #999; }
.status-indicator.running { background: #52c41a; animation: pulse 2s infinite; }
.status-indicator.stopped { background: #ff4d4f; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(82,196,26,0.4); } 70% { box-shadow: 0 0 0 10px rgba(82,196,26,0); } 100% { box-shadow: 0 0 0 0 rgba(82,196,26,0); } }
.status-text { font-size: 18px; font-weight: 600; }
.status-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
.status-item { display: flex; justify-content: space-between; padding: 10px; background: #fafafa; border-radius: 6px; }
.status-label { color: #666; font-size: 13px; }
.status-value { font-weight: 600; color: #333; }

.vpn-clients-section { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 20px; margin-bottom: 20px; display: none; }
.vpn-client-row { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #fafafa; border-radius: 6px; margin-bottom: 8px; }
.vpn-client-info { display: flex; gap: 20px; }
.vpn-client-info span { font-size: 13px; }
.vpn-client-info span.label { color: #999; }
.vpn-client-info span.value { color: #333; font-weight: 500; }
.stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-bottom: 30px; }
.stat-card { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 20px; text-align: center; }
.stat-card .stat-icon { font-size: 32px; margin-bottom: 10px; }
.stat-card .stat-value { font-size: 28px; font-weight: 700; color: #1890ff; }
.stat-card .stat-label { color: #666; font-size: 13px; margin-top: 5px; }
.logs-section { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 20px; }
.log-item { padding: 8px; border-bottom: 1px solid #f0f0f0; font-size: 13px; }
.log-item:last-child { border-bottom: none; }
.log-item .log-time { color: #999; font-size: 11px; }
.modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 999; display: flex; align-items: center; justify-content: center; }
.modal-box { background: #fff; border-radius: 8px; padding: 25px; min-width: 400px; max-width: 600px; max-height: 80vh; overflow-y: auto; }
.modal-box h3 { margin: 0 0 15px 0; }
.modal-box .form-group { margin-bottom: 12px; }
.modal-box label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 13px; }
.modal-box input, .modal-box textarea, .modal-box select { width: 100%; padding: 8px; border: 1px solid #d9d9d9; border-radius: 4px; box-sizing: border-box; }
.modal-box .modal-actions { text-align: right; margin-top: 15px; }
.modal-box .modal-actions button { margin-left: 10px; }

@media (max-width: 768px) {
    .stats-grid, .section-grid, .feature-grid { grid-template-columns: 1fr !important; }
    .sidebar { width: 60px !important; }
    .main-content { padding: 12px !important; }
}

.loading-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:9999;}
.loading-spinner{width:40px;height:40px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>

<script>
let currentVPNId = null;

function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById('tab-' + tab).classList.add('active');

    if (tab === 'ssl') loadCertificates();
    else if (tab === 'config') loadSSLConfig();
    else if (tab === 'vpn') { loadVPNs(); loadVPNServerStatus(); }
    else if (tab === 'proxy') loadProxies();
    else if (tab === 'stats') loadStats();
}

// === SSL证书 ===
async function loadCertificates() {
    const res = await fetch('/api/sslvpn/certificates');
    const data = await res.json();
    if (data.success) {
        const list = document.getElementById('cert-list');
        if (data.data.length === 0) {
            list.innerHTML = '<p style="text-align:center;color:#999;padding:40px;grid-column:1/-1;">暂无证书，点击上方按钮生成</p>';
            return;
        }
        list.innerHTML = data.data.map(c => {
            let statusClass = 'cert-valid';
            let statusText = '有效';
            if (c.days_remaining <= 0) { statusClass = 'cert-expired'; statusText = '已过期'; }
            else if (c.days_remaining <= 30) { statusClass = 'cert-expiring'; statusText = '即将过期'; }
            return `
                <div class="cert-card">
                    <div class="cert-name">${c.name}</div>
                    <div class="cert-meta">域名: ${c.domain}</div>
                    <div class="cert-meta">颁发者: ${c.issuer || '自签名'}</div>
                    <div class="cert-meta">过期时间: ${c.valid_to}</div>
                    <div class="${statusClass}">${statusText} (剩余${c.days_remaining}天)</div>
                    <div class="card-actions">
                        ${c.is_default ? '<span style="color:#1890ff;font-size:12px;">默认</span>' : `<button class="btn-success" onclick="setDefaultCert('${c.cert_id}')">设为默认</button>`}
                        <button class="btn-danger" onclick="deleteCert('${c.cert_id}')">删除</button>
                    </div>
                </div>`;
        }).join('');
    }
}

function showGenCertModal() {
    document.getElementById('modal-container').innerHTML = `
        <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
            <div class="modal-box">
                <h3>生成自签名证书</h3>
                <div class="form-group"><label>域名</label><input type="text" id="cert-domain" value="localhost"></div>
                <div class="form-group"><label>组织</label><input type="text" id="cert-org" value="MTSCOS AI"></div>
                <div class="form-group"><label>国家</label><input type="text" id="cert-country" value="CN"></div>
                <div class="form-group"><label>省份</label><input type="text" id="cert-state" value="Beijing"></div>
                <div class="form-group"><label>城市</label><input type="text" id="cert-city" value="Beijing"></div>
                <div class="form-group"><label>有效期(天)</label><input type="number" id="cert-days" value="3650"></div>
                <div class="form-group"><label>密钥长度</label><select id="cert-keysize"><option value="2048">2048 bit</option><option value="4096">4096 bit</option></select></div>
                <div class="modal-actions"><button class="btn-secondary" onclick="closeModal()">取消</button><button class="btn-primary" onclick="generateCert()">生成</button></div>
            </div>
        </div>`;
}

async function generateCert() {
    const res = await fetch('/api/sslvpn/certificates', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            domain: document.getElementById('cert-domain').value,
            org: document.getElementById('cert-org').value,
            country: document.getElementById('cert-country').value,
            state: document.getElementById('cert-state').value,
            city: document.getElementById('cert-city').value,
            days_valid: parseInt(document.getElementById('cert-days').value),
            key_size: parseInt(document.getElementById('cert-keysize').value)
        })
    });
    const data = await res.json();
    if (data.success) { closeModal(); loadCertificates(); }
    else alert(data.error || '生成失败');
}

async function setDefaultCert(certId) {
    const res = await fetch(`/api/sslvpn/certificates/${certId}/default`, { method: 'PUT' });
    const data = await res.json();
    if (data.success) loadCertificates();
}

async function deleteCert(certId) {
    if (!confirm('确定删除此证书？')) return;
    const res = await fetch(`/api/sslvpn/certificates/${certId}`, { method: 'DELETE' });
    const data = await res.json();
    if (data.success) loadCertificates();
}

// === SSL配置 ===
async function loadSSLConfig() {
    const res = await fetch('/api/sslvpn/config');
    const data = await res.json();
    if (data.success) {
        const c = data.data;
        document.getElementById('cfg-ssl-enabled').value = c.ssl_enabled || 0;
        document.getElementById('cfg-http-port').value = c.http_port || 8888;
        document.getElementById('cfg-https-port').value = c.https_port || 443;
        document.getElementById('cfg-security-level').value = c.security_level || 'intermediate';
        document.getElementById('cfg-hsts').value = c.hsts_enabled || 1;
        document.getElementById('cfg-hsts-age').value = c.hsts_max_age || 63072000;
        document.getElementById('cfg-csp').value = c.csp_enabled || 1;
        document.getElementById('cfg-referrer').value = c.referrer_policy || 'strict-origin-when-cross-origin';
    }
}

async function saveSSLConfig() {
    const res = await fetch('/api/sslvpn/config', {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            ssl_enabled: parseInt(document.getElementById('cfg-ssl-enabled').value),
            http_port: parseInt(document.getElementById('cfg-http-port').value),
            https_port: parseInt(document.getElementById('cfg-https-port').value),
            security_level: document.getElementById('cfg-security-level').value,
            hsts_enabled: parseInt(document.getElementById('cfg-hsts').value),
            hsts_max_age: parseInt(document.getElementById('cfg-hsts-age').value),
            csp_enabled: parseInt(document.getElementById('cfg-csp').value),
            referrer_policy: document.getElementById('cfg-referrer').value
        })
    });
    const data = await res.json();
    if (data.success) alert('配置保存成功！');
    else alert(data.error || '保存失败');
}

async function testSSLConfig() {
    const res = await fetch('/api/sslvpn/config/test');
    const data = await res.json();
    if (data.success) {
        alert('SSL配置测试: \n' + JSON.stringify(data.data, null, 2));
    }
}

// === VPN ===
async function loadVPNs() {
    const res = await fetch('/api/sslvpn/vpns');
    const data = await res.json();
    if (data.success) {
        const list = document.getElementById('vpn-list');
        if (data.data.length === 0) {
            list.innerHTML = '<p style="text-align:center;color:#999;padding:40px;grid-column:1/-1;">暂无VPN配置</p>';
            return;
        }
        list.innerHTML = data.data.map(v => `
            <div class="vpn-card">
                <div class="vpn-name">${v.name}</div>
                <div class="vpn-meta">类型: ${v.vpn_type}</div>
                <div class="vpn-meta">服务器: ${v.server_address}:${v.server_port}</div>
                <div class="vpn-meta">网络: ${v.network_address}</div>
                <div class="vpn-meta">状态: <span style="color:${v.status==='running'?'#52c41a':'#999'}">${v.status}</span></div>
                <div class="card-actions">
                    <button class="btn-success" onclick="showVPNUsers('${v.vpn_id}')">用户管理</button>
                </div>
            </div>`).join('');
    }
}

function showCreateVPNModal() {
    document.getElementById('modal-container').innerHTML = `
        <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
            <div class="modal-box">
                <h3>创建WireGuard VPN</h3>
                <div class="form-group"><label>名称</label><input type="text" id="vpn-name" value="WireGuard VPN"></div>
                <div class="form-group"><label>服务器地址</label><input type="text" id="vpn-server" placeholder="vpn.example.com 或 IP"></div>
                <div class="form-group"><label>端口</label><input type="number" id="vpn-port" value="51820"></div>
                <div class="form-group"><label>内网网段</label><input type="text" id="vpn-network" value="10.0.0.0/24"></div>
                <div class="form-group"><label>DNS服务器</label><input type="text" id="vpn-dns" value="8.8.8.8, 1.1.1.1"></div>
                <div class="modal-actions"><button class="btn-secondary" onclick="closeModal()">取消</button><button class="btn-primary" onclick="createVPN()">创建</button></div>
            </div>
        </div>`;
}

async function createVPN() {
    const res = await fetch('/api/sslvpn/vpns/wireguard', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            name: document.getElementById('vpn-name').value,
            server_address: document.getElementById('vpn-server').value,
            port: parseInt(document.getElementById('vpn-port').value),
            network: document.getElementById('vpn-network').value,
            dns: document.getElementById('vpn-dns').value
        })
    });
    const data = await res.json();
    if (data.success) { closeModal(); loadVPNs(); }
    else alert(data.error || '创建失败');
}

async function showVPNUsers(vpnId) {
    currentVPNId = vpnId;
    document.getElementById('vpn-users-section').style.display = 'block';
    const res = await fetch(`/api/sslvpn/vpns/${vpnId}/users`);
    const data = await res.json();
    if (data.success) {
        const list = document.getElementById('vpn-user-list');
        if (data.data.length === 0) {
            list.innerHTML = '<p style="color:#999;text-align:center;padding:20px;">暂无用户</p>';
            return;
        }
        list.innerHTML = data.data.map(u => `
            <div class="user-row">
                <div>
                    <strong>${u.username}</strong>
                    <span style="color:#999;font-size:12px;margin-left:10px;">IP: ${u.client_ip}</span>
                </div>
                <div>
                    <span style="color:${u.is_active?'#52c41a':'#999'};font-size:12px;margin-right:10px;">${u.is_active?'活跃':'禁用'}</span>
                    <button class="btn-secondary" style="font-size:12px;padding:4px 10px;" onclick="toggleVPNUser('${u.user_id}', ${!u.is_active})">${u.is_active?'禁用':'启用'}</button>
                </div>
            </div>`).join('');
    }
}

function showAddVPNUserModal() {
    document.getElementById('modal-container').innerHTML = `
        <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
            <div class="modal-box">
                <h3>添加VPN用户</h3>
                <div class="form-group"><label>用户名</label><input type="text" id="vpn-user-name" placeholder="用户名"></div>
                <div class="form-group"><label>客户端IP（留空自动分配）</label><input type="text" id="vpn-user-ip" placeholder="10.0.0.2"></div>
                <div class="modal-actions"><button class="btn-secondary" onclick="closeModal()">取消</button><button class="btn-primary" onclick="addVPNUser()">添加</button></div>
            </div>
        </div>`;
}

async function addVPNUser() {
    const res = await fetch(`/api/sslvpn/vpns/${currentVPNId}/users`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            username: document.getElementById('vpn-user-name').value,
            client_ip: document.getElementById('vpn-user-ip').value || null
        })
    });
    const data = await res.json();
    if (data.success) { closeModal(); showVPNUsers(currentVPNId); }
    else alert(data.error || '添加失败');
}

async function toggleVPNUser(userId, active) {
    const res = await fetch(`/api/sslvpn/vpn-users/${userId}/toggle`, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ active })
    });
    const data = await res.json();
    if (data.success) showVPNUsers(currentVPNId);
}

// === VPN服务器控制 ===
let vpnServerPolling = null;

async function toggleVPNServer() {
    const btn = document.getElementById('vpn-server-btn');
    const isRunning = btn.textContent === '停止VPN服务器';
    
    if (isRunning) {
        const res = await fetch('/api/sslvpn/vpn-server/stop', { method: 'POST' });
        const data = await res.json();
        if (data.success) {
            btn.textContent = '启动VPN服务器';
            btn.className = 'btn-primary';
            stopVPNPolling();
            hideVPNServerStatus();
        } else {
            alert(data.error || '停止失败');
        }
    } else {
        const res = await fetch('/api/sslvpn/vpn-server/start', { method: 'POST' });
        const data = await res.json();
        if (data.success) {
            btn.textContent = '停止VPN服务器';
            btn.className = 'btn-danger';
            startVPNPolling();
        } else {
            alert(data.error || '启动失败');
        }
    }
}

async function loadVPNServerStatus() {
    const res = await fetch('/api/sslvpn/vpn-server/status');
    const data = await res.json();
    
    if (data.success && data.data && data.data.status === 'running') {
        showVPNServerStatus(data.data);
        loadVPNServerClients();
        const btn = document.getElementById('vpn-server-btn');
        btn.textContent = '停止VPN服务器';
        btn.className = 'btn-danger';
    } else {
        hideVPNServerStatus();
        const btn = document.getElementById('vpn-server-btn');
        btn.textContent = '启动VPN服务器';
        btn.className = 'btn-primary';
    }
}

function showVPNServerStatus(data) {
    document.getElementById('vpn-server-status').style.display = 'block';
    
    document.getElementById('vpn-status-indicator').className = 'status-indicator running';
    document.getElementById('vpn-status-text').textContent = 'VPN服务器运行中';
    
    document.getElementById('vpn-running-status').textContent = '运行中';
    document.getElementById('vpn-running-status').style.color = '#52c41a';
    document.getElementById('vpn-port').textContent = data.port;
    document.getElementById('vpn-ssl').textContent = data.ssl_enabled ? '启用' : '禁用';
    document.getElementById('vpn-current-clients').textContent = data.current_clients;
    document.getElementById('vpn-max-clients').textContent = data.max_clients;
    
    if (data.stats) {
        document.getElementById('vpn-total-sent').textContent = formatBytes(data.stats.total_bytes_sent);
        document.getElementById('vpn-total-received').textContent = formatBytes(data.stats.total_bytes_received);
        document.getElementById('vpn-peak-clients').textContent = data.stats.peak_connections;
    }
}

function hideVPNServerStatus() {
    document.getElementById('vpn-server-status').style.display = 'none';
    document.getElementById('vpn-clients-section').style.display = 'none';
    
    document.getElementById('vpn-status-indicator').className = 'status-indicator stopped';
    document.getElementById('vpn-status-text').textContent = 'VPN服务器已停止';
}

async function loadVPNServerClients() {
    const res = await fetch('/api/sslvpn/vpn-server/clients');
    const data = await res.json();
    
    if (data.success && data.data && data.data.clients && data.data.clients.length > 0) {
        document.getElementById('vpn-clients-section').style.display = 'block';
        const list = document.getElementById('vpn-client-list');
        list.innerHTML = data.data.clients.map(c => `
            <div class="vpn-client-row">
                <div class="vpn-client-info">
                    <span><span class="label">ID:</span> <span class="value">${c.id}</span></span>
                    <span><span class="label">用户:</span> <span class="value">${c.username}</span></span>
                    <span><span class="label">IP:</span> <span class="value">${c.ip}</span></span>
                    <span><span class="label">上传:</span> <span class="value">${formatBytes(c.bytes_sent)}</span></span>
                    <span><span class="label">下载:</span> <span class="value">${formatBytes(c.bytes_received)}</span></span>
                </div>
                <div>
                    <button class="btn-danger" style="font-size:12px;padding:4px 10px;" onclick="disconnectVPNClient(${c.id})">断开</button>
                </div>
            </div>`).join('');
    } else {
        document.getElementById('vpn-clients-section').style.display = 'none';
    }
}

async function disconnectVPNClient(clientId) {
    if (!confirm(`确定断开客户端 ${clientId} 的连接？`)) return;
    const res = await fetch(`/api/sslvpn/vpn-server/client/${clientId}/disconnect`, { method: 'POST' });
    const data = await res.json();
    if (data.success) loadVPNServerClients();
}

function startVPNPolling() {
    stopVPNPolling();
    loadVPNServerStatus();
    vpnServerPolling = setInterval(loadVPNServerStatus, 5000);
}

function stopVPNPolling() {
    if (vpnServerPolling) {
        clearInterval(vpnServerPolling);
        vpnServerPolling = null;
    }
}

function formatBytes(bytes) {
    if (bytes === 0) return '0 B';
    const k = 1024;
    const sizes = ['B', 'KB', 'MB', 'GB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
}

// === 代理 ===
async function loadProxies() {
    const res = await fetch('/api/sslvpn/proxies');
    const data = await res.json();
    if (data.success) {
        const list = document.getElementById('proxy-list');
        if (data.data.length === 0) {
            list.innerHTML = '<p style="text-align:center;color:#999;padding:40px;grid-column:1/-1;">暂无代理配置</p>';
            return;
        }
        list.innerHTML = data.data.map(p => `
            <div class="proxy-card">
                <div class="proxy-meta" style="font-weight:600;font-size:15px;color:#333;">${p.name}</div>
                <div class="proxy-meta">类型: ${p.proxy_type}</div>
                <div class="proxy-meta">地址: ${p.host}:${p.port}</div>
                <div class="proxy-meta">延迟: ${p.latency_ms ? p.latency_ms + 'ms' : '未测试'}</div>
                <div class="proxy-meta">成功率: ${(p.success_rate * 100).toFixed(0)}%</div>
                <div class="card-actions">
                    <button class="btn-success" onclick="testProxy('${p.proxy_id}')">测试</button>
                    <button class="btn-danger" onclick="deleteProxy('${p.proxy_id}')">删除</button>
                </div>
            </div>`).join('');
    }
}

function showAddProxyModal() {
    document.getElementById('modal-container').innerHTML = `
        <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
            <div class="modal-box">
                <h3>添加代理</h3>
                <div class="form-group"><label>名称</label><input type="text" id="proxy-name" placeholder="代理名称"></div>
                <div class="form-group"><label>类型</label><select id="proxy-type"><option value="http">HTTP</option><option value="https">HTTPS</option><option value="socks5">SOCKS5</option></select></div>
                <div class="form-group"><label>主机</label><input type="text" id="proxy-host" placeholder="proxy.example.com"></div>
                <div class="form-group"><label>端口</label><input type="number" id="proxy-port" value="8080"></div>
                <div class="form-group"><label>用户名（可选）</label><input type="text" id="proxy-user"></div>
                <div class="form-group"><label>密码（可选）</label><input type="password" id="proxy-pass"></div>
                <div class="form-group"><label>国家（可选）</label><input type="text" id="proxy-country" placeholder="US / CN"></div>
                <div class="modal-actions"><button class="btn-secondary" onclick="closeModal()">取消</button><button class="btn-primary" onclick="addProxy()">添加</button></div>
            </div>
        </div>`;
}

async function addProxy() {
    const res = await fetch('/api/sslvpn/proxies', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            name: document.getElementById('proxy-name').value,
            proxy_type: document.getElementById('proxy-type').value,
            host: document.getElementById('proxy-host').value,
            port: parseInt(document.getElementById('proxy-port').value),
            username: document.getElementById('proxy-user').value || null,
            password: document.getElementById('proxy-pass').value || null,
            country: document.getElementById('proxy-country').value || null
        })
    });
    const data = await res.json();
    if (data.success) { closeModal(); loadProxies(); }
    else alert(data.error || '添加失败');
}

async function testProxy(proxyId) {
    const res = await fetch(`/api/sslvpn/proxies/${proxyId}/test`, { method: 'POST' });
    const data = await res.json();
    if (data.success) alert('代理可用！延迟: ' + data.latency_ms + 'ms');
    else alert('代理不可用: ' + (data.error || ''));
    loadProxies();
}

async function deleteProxy(proxyId) {
    if (!confirm('确定删除此代理？')) return;
    const res = await fetch(`/api/sslvpn/proxies/${proxyId}`, { method: 'DELETE' });
    const data = await res.json();
    if (data.success) loadProxies();
}

// === 统计 ===
async function loadStats() {
    const res = await fetch('/api/sslvpn/stats');
    const data = await res.json();
    if (data.success) {
        const s = data.data;
        document.getElementById('stats-grid').innerHTML = `
            <div class="stat-card"><div class="stat-icon">📜</div><div class="stat-value">${s.ssl.certificates_total}</div><div class="stat-label">证书总数</div></div>
            <div class="stat-card"><div class="stat-icon">✅</div><div class="stat-value">${s.ssl.active_certificates}</div><div class="stat-label">有效证书</div></div>
            <div class="stat-card"><div class="stat-icon">⚠️</div><div class="stat-value">${s.ssl.expiring_certificates}</div><div class="stat-label">即将过期</div></div>
            <div class="stat-card"><div class="stat-icon">🔐</div><div class="stat-value">${s.ssl.enabled ? '已启用' : '已禁用'}</div><div class="stat-label">SSL状态 (${s.ssl.security_level})</div></div>
            <div class="stat-card"><div class="stat-icon">🌐</div><div class="stat-value">${s.vpn.configs_total}</div><div class="stat-label">VPN配置</div></div>
            <div class="stat-card"><div class="stat-icon"><i class="fas fa-users"></i></div><div class="stat-value">${s.vpn.active_users}/${s.vpn.users_total}</div><div class="stat-label">活跃VPN用户</div></div>
            <div class="stat-card"><div class="stat-icon">🔌</div><div class="stat-value">${s.proxy.active}/${s.proxy.total}</div><div class="stat-label">代理服务器</div></div>`;
    }

    const logRes = await fetch('/api/sslvpn/logs?limit=20');
    const logData = await logRes.json();
    if (logData.success) {
        document.getElementById('log-list').innerHTML = logData.data.length === 0
            ? '<p style="color:#999;text-align:center;padding:20px;">暂无日志</p>'
            : logData.data.map(l => `
                <div class="log-item">
                    <span style="color:${l.status==='success'?'#52c41a':'#ff4d4f'}">[${l.log_type}]</span>
                    ${l.action} - ${l.message || ''}
                    <div class="log-time">${l.created_at}</div>
                </div>`).join('');
    }
}

function closeModal() { document.getElementById('modal-container').innerHTML = ''; }

loadCertificates();
</script>
