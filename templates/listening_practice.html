<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTSCOS AI - 听力练习</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #6366f1;
            --primary-light: #8b5cf6;
            --success-color: #22c55e;
            --error-color: #ef4444;
            --bg-gradient-start: #0a0a1a;
            --bg-gradient-mid: #12123a;
            --bg-gradient-end: #0a0a1a;
            --glass-bg: rgba(15, 15, 35, 0.8);
            --glass-border: rgba(99, 102, 241, 0.2);
            --glass-blur: 20px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-mid) 50%, var(--bg-gradient-end) 100%);
            background-attachment: fixed;
            color: #ffffff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .header p {
            color: #94a3b8;
            font-size: 14px;
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .stat-item {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 15px 25px;
            text-align: center;
            min-width: 120px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary-color);
        }

        .stat-label {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 5px;
        }

        .question-card {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .question-number {
            font-size: 14px;
            color: #94a3b8;
        }

        .difficulty-tag {
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 20px;
            background: rgba(99, 102, 241, 0.2);
            color: var(--primary-color);
        }

        .audio-player {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .play-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-light));
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        .play-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
        }

        .play-btn:active {
            transform: scale(0.95);
        }

        .play-btn.playing {
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4); }
            50% { box-shadow: 0 4px 25px rgba(99, 102, 241, 0.8); }
        }

        .audio-controls {
            flex: 1;
            min-width: 200px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-color), var(--primary-light));
            width: 0%;
            transition: width 0.1s linear;
        }

        .time-display {
            font-size: 13px;
            color: #94a3b8;
            font-family: 'Courier New', monospace;
        }

        .audio-actions {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }

        .action-btn {
            padding: 8px 16px;
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: #94a3b8;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border-color: var(--primary-color);
        }

        .question-text {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .options-list {
            display: grid;
            gap: 15px;
            margin-bottom: 30px;
        }

        .option-item {
            padding: 20px;
            border: 2px solid var(--glass-border);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(255, 255, 255, 0.03);
        }

        .option-item:hover {
            border-color: var(--primary-color);
            background: rgba(99, 102, 241, 0.1);
            transform: translateX(5px);
        }

        .option-item.selected {
            border-color: var(--primary-color);
            background: rgba(99, 102, 241, 0.15);
        }

        .option-item.correct {
            border-color: var(--success-color);
            background: rgba(34, 197, 94, 0.15);
        }

        .option-item.wrong {
            border-color: var(--error-color);
            background: rgba(239, 68, 68, 0.15);
        }

        .option-key {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            flex-shrink: 0;
        }

        .option-item.selected .option-key {
            background: var(--primary-color);
            color: white;
        }

        .option-item.correct .option-key {
            background: var(--success-color);
            color: white;
        }

        .option-item.wrong .option-key {
            background: var(--error-color);
            color: white;
        }

        .option-value {
            font-size: 16px;
            color: #e2e8f0;
        }

        .transcript-section {
            margin-top: 25px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            border-left: 4px solid var(--primary-color);
        }

        .transcript-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .transcript-title {
            font-size: 14px;
            font-weight: 600;
            color: #94a3b8;
        }

        .transcript-toggle {
            font-size: 12px;
            color: var(--primary-color);
            cursor: pointer;
            text-decoration: underline;
        }

        .transcript-text {
            font-size: 14px;
            line-height: 1.8;
            color: #cbd5e1;
            white-space: pre-line;
        }

        .result-section {
            margin-top: 25px;
            padding: 20px;
            border-radius: 12px;
            display: none;
        }

        .result-section.show {
            display: block;
        }

        .result-section.success {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .result-section.error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .result-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .result-icon {
            font-size: 24px;
        }

        .result-title {
            font-size: 16px;
            font-weight: 600;
        }

        .result-explanation {
            font-size: 14px;
            color: #94a3b8;
            line-height: 1.6;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }

        .nav-btn {
            flex: 1;
            padding: 15px 30px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .nav-btn.primary {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-light));
            color: white;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        .nav-btn.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
        }

        .nav-btn.secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid var(--glass-border);
        }

        .nav-btn.secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--primary-color);
        }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .submit-btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-light));
            color: white;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
            margin-top: 20px;
        }

        .submit-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .language-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .lang-btn {
            padding: 8px 20px;
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            color: #94a3b8;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .lang-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .lang-btn:hover {
            border-color: var(--primary-color);
            color: white;
        }

        .listen-count {
            font-size: 12px;
            color: #64748b;
            margin-left: 10px;
        }

        @media (max-width: 600px) {
            .question-card {
                padding: 25px;
            }
            
            .audio-player {
                padding: 15px;
            }
            
            .play-btn {
                width: 50px;
                height: 50px;
            }
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loading">
        <div class="loading-spinner"></div>
    </div>

    <div class="container">
        <div class="header">
            <h1><i class="fas fa-headphones"></i> AI听力练习</h1>
            <p>自适应难度 · 多语言支持 · 智能评分</p>
        </div>

        <div class="language-selector" id="language-selector">
            <button class="lang-btn active" data-lang="english">英语</button>
            <button class="lang-btn" data-lang="japanese">日语</button>
            <button class="lang-btn" data-lang="chinese">中文</button>
            <button class="lang-btn" data-lang="korean">韩语</button>
            <button class="lang-btn" data-lang="french">法语</button>
            <button class="lang-btn" data-lang="german">德语</button>
            <button class="lang-btn" data-lang="spanish">西班牙语</button>
        </div>

        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-value" id="current-question">1</div>
                <div class="stat-label">当前题目</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="total-questions">5</div>
                <div class="stat-label">总题数</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="correct-count">0</div>
                <div class="stat-label">正确</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="wrong-count">0</div>
                <div class="stat-label">错误</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="accuracy">0%</div>
                <div class="stat-label">正确率</div>
            </div>
        </div>

        <div class="question-card" id="question-card">
            <div class="question-header">
                <span class="question-number">题目 <span id="q-number">1</span>/<span id="q-total">5</span></span>
                <span class="difficulty-tag" id="difficulty-tag">中级</span>
            </div>

            <div class="audio-player">
                <button class="play-btn" id="play-btn">
                    <i class="fas fa-play"></i>
                </button>
                <div class="audio-controls">
                    <div class="progress-bar" id="progress-bar">
                        <div class="progress-fill" id="progress-fill"></div>
                    </div>
                    <div class="time-display">
                        <span id="current-time">00:00</span> / <span id="duration">00:00</span>
                        <span class="listen-count" id="listen-count">已听 0 次</span>
                    </div>
                </div>
                <div class="audio-actions">
                    <button class="action-btn" onclick="toggleTranscript()">
                        <i class="fas fa-file-text"></i> 原文
                    </button>
                    <button class="action-btn" onclick="replayAudio()">
                        <i class="fas fa-redo"></i> 重播
                    </button>
                </div>
            </div>

            <div class="question-text" id="question-text">
                请听对话并回答问题
            </div>

            <div class="options-list" id="options-list">
            </div>

            <div class="transcript-section" id="transcript-section" style="display: none;">
                <div class="transcript-header">
                    <span class="transcript-title">听力原文</span>
                    <span class="transcript-toggle" onclick="toggleTranscript()">隐藏</span>
                </div>
                <div class="transcript-text" id="transcript-text"></div>
            </div>

            <div class="result-section" id="result-section">
                <div class="result-header">
                    <span class="result-icon" id="result-icon"></span>
                    <span class="result-title" id="result-title"></span>
                </div>
                <div class="result-explanation" id="result-explanation"></div>
            </div>

            <button class="submit-btn" id="submit-btn" onclick="submitAnswer()">
                提交答案
            </button>
        </div>

        <div class="nav-buttons">
            <button class="nav-btn secondary" id="prev-btn" onclick="prevQuestion()" disabled>
                <i class="fas fa-arrow-left"></i> 上一题
            </button>
            <button class="nav-btn primary" id="next-btn" onclick="nextQuestion()" disabled>
                下一题 <i class="fas fa-arrow-right"></i>
            </button>
        </div>
    </div>

    <script>
        const audio = new Audio();
        let questions = [];
        let currentIndex = 0;
        let userAnswers = {};
        let listenCounts = {};
        let correctCount = 0;
        let wrongCount = 0;
        let isPlaying = false;
        let currentLanguage = 'english';
        let startTime = {};

        document.addEventListener('DOMContentLoaded', function() {
            loadQuestions();
            
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentLanguage = this.dataset.lang;
                    loadQuestions();
                });
            });

            audio.addEventListener('timeupdate', updateProgress);
            audio.addEventListener('ended', onAudioEnded);
            audio.addEventListener('loadedmetadata', updateDuration);

            document.getElementById('progress-bar').addEventListener('click', seekAudio);
            document.getElementById('play-btn').addEventListener('click', togglePlay);
        });

        async function loadQuestions() {
            showLoading(true);
            try {
                const response = await fetch('/api/listening/practice', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        subject: currentLanguage,
                        question_count: 5,
                        mode: 'adaptive'
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    questions = data.questions;
                    currentIndex = 0;
                    userAnswers = {};
                    listenCounts = {};
                    correctCount = 0;
                    wrongCount = 0;
                    startTime = {};
                    
                    document.getElementById('total-questions').textContent = questions.length;
                    document.getElementById('q-total').textContent = questions.length;
                    
                    renderQuestion();
                    updateStats();
                } else {
                    alert('加载题目失败: ' + (data.error || '未知错误'));
                }
            } catch (error) {
                console.error('加载题目失败:', error);
                alert('网络错误，请稍后重试');
            } finally {
                showLoading(false);
            }
        }

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'flex' : 'none';
        }

        function renderQuestion() {
            if (questions.length === 0) return;
            
            const question = questions[currentIndex];
            const qId = question.id;
            
            if (!startTime[qId]) {
                startTime[qId] = Date.now();
            }
            
            if (!listenCounts[qId]) {
                listenCounts[qId] = 0;
            }
            
            document.getElementById('q-number').textContent = currentIndex + 1;
            document.getElementById('current-question').textContent = currentIndex + 1;
            
            const diffMap = { 'easy': '初级', 'medium': '中级', 'hard': '高级', 'expert': '专家' };
            document.getElementById('difficulty-tag').textContent = diffMap[question.difficulty] || '中级';
            
            document.getElementById('question-text').textContent = question.content;
            
            const optionsList = document.getElementById('options-list');
            optionsList.innerHTML = '';
            
            question.options.forEach(opt => {
                const optionItem = document.createElement('div');
                optionItem.className = 'option-item';
                optionItem.dataset.key = opt.key;
                
                const isSelected = userAnswers[qId] === opt.key;
                if (isSelected) {
                    optionItem.classList.add('selected');
                }
                
                optionItem.innerHTML = `
                    <div class="option-key">${opt.key}</div>
                    <div class="option-value">${opt.value}</div>
                `;
                
                optionItem.addEventListener('click', () => selectOption(opt.key));
                optionsList.appendChild(optionItem);
            });
            
            document.getElementById('transcript-text').textContent = question.transcript || '';
            document.getElementById('transcript-section').style.display = 'none';
            
            document.getElementById('result-section').className = 'result-section';
            document.getElementById('result-section').style.display = 'none';
            
            document.getElementById('submit-btn').disabled = !userAnswers[qId];
            document.getElementById('next-btn').disabled = !userAnswers[qId];
            
            resetAudio();
            document.getElementById('listen-count').textContent = `已听 ${listenCounts[qId]} 次`;
            
            updateNavButtons();
        }

        function selectOption(key) {
            const qId = questions[currentIndex].id;
            userAnswers[qId] = key;
            
            document.querySelectorAll('.option-item').forEach(item => {
                item.classList.remove('selected');
                if (item.dataset.key === key) {
                    item.classList.add('selected');
                }
            });
            
            document.getElementById('submit-btn').disabled = false;
        }

        function submitAnswer() {
            const question = questions[currentIndex];
            const qId = question.id;
            const userAnswer = userAnswers[qId];
            const correctAnswer = question.correct_answer;
            
            const isCorrect = userAnswer === correctAnswer;
            
            document.querySelectorAll('.option-item').forEach(item => {
                item.classList.remove('selected');
                if (item.dataset.key === correctAnswer) {
                    item.classList.add('correct');
                } else if (item.dataset.key === userAnswer && !isCorrect) {
                    item.classList.add('wrong');
                }
                item.style.pointerEvents = 'none';
            });
            
            const resultSection = document.getElementById('result-section');
            const resultIcon = document.getElementById('result-icon');
            const resultTitle = document.getElementById('result-title');
            const resultExplanation = document.getElementById('result-explanation');
            
            if (isCorrect) {
                correctCount++;
                resultSection.className = 'result-section success show';
                resultIcon.innerHTML = '<i class="fas fa-check-circle"></i>';
                resultIcon.style.color = '#22c55e';
                resultTitle.textContent = '回答正确！';
                resultTitle.style.color = '#22c55e';
            } else {
                wrongCount++;
                resultSection.className = 'result-section error show';
                resultIcon.innerHTML = '<i class="fas fa-times-circle"></i>';
                resultIcon.style.color = '#ef4444';
                resultTitle.textContent = '回答错误';
                resultTitle.style.color = '#ef4444';
            }
            
            resultExplanation.textContent = question.explanation || '暂无解析';
            
            document.getElementById('submit-btn').disabled = true;
            document.getElementById('next-btn').disabled = false;
            
            updateStats();
            
            saveProgress(question, userAnswer, isCorrect);
        }

        async function saveProgress(question, userAnswer, isCorrect) {
            const timeSpent = startTime[question.id] ? (Date.now() - startTime[question.id]) / 1000 : 0;
            
            try {
                await fetch('/api/listening/progress', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        question_id: question.id,
                        user_answer: userAnswer,
                        is_correct: isCorrect,
                        listen_count: listenCounts[question.id] || 0,
                        time_spent: timeSpent
                    })
                });
            } catch (error) {
                console.error('保存进度失败:', error);
            }
        }

        function updateStats() {
            document.getElementById('correct-count').textContent = correctCount;
            document.getElementById('wrong-count').textContent = wrongCount;
            
            const total = correctCount + wrongCount;
            const accuracy = total > 0 ? Math.round((correctCount / total) * 100) : 0;
            document.getElementById('accuracy').textContent = accuracy + '%';
        }

        function updateNavButtons() {
            document.getElementById('prev-btn').disabled = currentIndex === 0;
            document.getElementById('next-btn').disabled = !userAnswers[questions[currentIndex]?.id];
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
            }
        }

        function nextQuestion() {
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                renderQuestion();
            } else {
                showResultSummary();
            }
        }

        function showResultSummary() {
            alert(`练习完成！\n正确: ${correctCount}\n错误: ${wrongCount}\n正确率: ${Math.round((correctCount / questions.length) * 100)}%`);
            loadQuestions();
        }

        function togglePlay() {
            if (isPlaying) {
                audio.pause();
            } else {
                playAudio();
            }
        }

        function playAudio() {
            const question = questions[currentIndex];
            
            if (question.audio_url) {
                audio.src = question.audio_url;
                audio.play().then(() => {
                    isPlaying = true;
                    updatePlayButton();
                    listenCounts[question.id] = (listenCounts[question.id] || 0) + 1;
                    document.getElementById('listen-count').textContent = `已听 ${listenCounts[question.id]} 次`;
                }).catch(() => {
                    fallbackSpeech(question.transcript || question.content);
                });
            } else {
                fallbackSpeech(question.transcript || question.content);
            }
        }

        function fallbackSpeech(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = getLanguageCode(currentLanguage);
                utterance.rate = 0.9;
                
                utterance.onstart = () => {
                    isPlaying = true;
                    updatePlayButton();
                    listenCounts[questions[currentIndex].id] = (listenCounts[questions[currentIndex].id] || 0) + 1;
                    document.getElementById('listen-count').textContent = `已听 ${listenCounts[questions[currentIndex].id]} 次`;
                };
                
                utterance.onend = () => {
                    isPlaying = false;
                    updatePlayButton();
                    onAudioEnded();
                };
                
                window.speechSynthesis.speak(utterance);
            } else {
                alert('您的浏览器不支持语音合成，请使用其他浏览器或检查音频URL');
            }
        }

        function getLanguageCode(language) {
            const codeMap = {
                'english': 'en-US',
                'japanese': 'ja-JP',
                'chinese': 'zh-CN',
                'korean': 'ko-KR',
                'french': 'fr-FR',
                'german': 'de-DE',
                'spanish': 'es-ES'
            };
            return codeMap[language] || 'en-US';
        }

        function replayAudio() {
            audio.currentTime = 0;
            playAudio();
        }

        function updatePlayButton() {
            const btn = document.getElementById('play-btn');
            const icon = btn.querySelector('i');
            
            if (isPlaying) {
                icon.className = 'fas fa-pause';
                btn.classList.add('playing');
            } else {
                icon.className = 'fas fa-play';
                btn.classList.remove('playing');
            }
        }

        function updateProgress() {
            const progress = (audio.currentTime / audio.duration) * 100;
            document.getElementById('progress-fill').style.width = progress + '%';
            document.getElementById('current-time').textContent = formatTime(audio.currentTime);
        }

        function updateDuration() {
            document.getElementById('duration').textContent = formatTime(audio.duration);
        }

        function onAudioEnded() {
            isPlaying = false;
            updatePlayButton();
            document.getElementById('progress-fill').style.width = '0%';
            document.getElementById('current-time').textContent = '00:00';
        }

        function seekAudio(e) {
            const rect = e.target.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            audio.currentTime = percent * audio.duration;
        }

        function formatTime(seconds) {
            if (isNaN(seconds) || seconds === Infinity) return '00:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function resetAudio() {
            audio.pause();
            audio.currentTime = 0;
            isPlaying = false;
            updatePlayButton();
            document.getElementById('progress-fill').style.width = '0%';
            document.getElementById('current-time').textContent = '00:00';
            document.getElementById('duration').textContent = '00:00';
        }

        function toggleTranscript() {
            const section = document.getElementById('transcript-section');
            const btn = document.querySelector('.transcript-toggle');
            
            if (section.style.display === 'none') {
                section.style.display = 'block';
                btn.textContent = '隐藏';
            } else {
                section.style.display = 'none';
                btn.textContent = '显示';
            }
        }
    </script>
</body>
</html>
