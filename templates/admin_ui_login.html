<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTSCOS AI 智能学习评估系统 - 登录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        #particles-js { position: fixed; width: 100%; height: 100%; z-index: 0; background: linear-gradient(135deg, #0c0c1e 0%, #1a1a3e 50%, #0c0c1e 100%); }
        .login-container { position: relative; z-index: 1; width: 100%; max-width: 450px; padding: 20px; margin: 0 auto; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: rgba(20, 20, 40, 0.75); backdrop-filter: blur(20px); border-radius: 24px; padding: 48px; border: 1px solid rgba(99, 102, 241, 0.2); box-shadow: 0 0 60px rgba(99, 102, 241, 0.15), 0 25px 50px rgba(0,0,0,0.5); }
        .login-header { text-align: center; margin-bottom: 35px; }
        .logo-container { position: relative; width: 100px; height: 100px; margin: 0 auto 25px; }
        .logo-circle { position: absolute; width: 100%; height: 100%; border-radius: 50%; background: linear-gradient(135deg, #6366f1, #8b5cf6, #a78bfa); animation: rotate 20s linear infinite; box-shadow: 0 0 40px rgba(99, 102, 241, 0.5); }
        .logo-inner { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 70px; height: 70px; border-radius: 50%; background: rgba(20, 20, 40, 0.9); display: flex; align-items: center; justify-content: center; }
        .logo-icon { width: 42px; height: 42px; fill: white; }
        .logo-glow { position: absolute; top: -5px; left: -5px; right: -5px; bottom: -5px; border-radius: 50%; background: radial-gradient(circle, rgba(99, 102, 241, 0.4) 0%, transparent 70%); animation: pulse 2s ease-in-out infinite; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { opacity: 0.5; transform: scale(1); } 50% { opacity: 1; transform: scale(1.1); } }
        .login-header h1 { font-size: 32px; color: white; margin-bottom: 12px; font-weight: 700; letter-spacing: 1px; }
        .login-header p { font-size: 14px; color: #94a3b8; }
        .form-group { margin-bottom: 22px; }
        .form-group label { display: block; font-size: 14px; color: #94a3b8; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
        .form-group input { width: 100%; padding: 16px 20px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3); color: white; font-size: 16px; transition: all 0.3s; }
        .form-group input:focus { outline: none; border-color: #6366f1; box-shadow: 0 0 25px rgba(99, 102, 241, 0.3), inset 0 0 20px rgba(99, 102, 241, 0.1); }
        .form-group input::placeholder { color: #64748b; }
        .form-group input.input-error { border-color: #e53e3e !important; background: rgba(69,10,10,0.5); color: #fff !important; animation: shake 0.3s ease-in-out; }
        .form-group input.input-ok { border-color: #38a169 !important; }
        .form-group .hint-text { font-size: 12px; color: #94a3b8; margin-top: 6px; min-height: 16px; line-height: 16px; }
        .form-group .hint-text.err { color: #fc8181; font-weight: 500; }
        .form-group .hint-text.ok  { color: #9ae6b4; }
        .password-box { position: relative; }
        .password-box input { padding-right: 48px !important; }
        .toggle-pw { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 34px; height: 34px; border-radius: 8px; background: transparent; border: none; cursor: pointer; color: #94a3b8; font-size: 15px; }
        .toggle-pw:hover { color: #60a5fa; }
        .btn { width: 100%; padding: 16px; border-radius: 14px; border: none; cursor: pointer; font-size: 16px; font-weight: 600; transition: all 0.3s; }
        .btn-primary { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: white; position: relative; overflow: hidden; }
        .btn-primary::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent); transition: left 0.5s; }
        .btn-primary:hover::before { left: 100%; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 15px 40px rgba(99, 102, 241, 0.4); }
        .btn-primary:active { transform: translateY(0); }
        .forgot-link { text-align: center; margin-top: 22px; }
        .forgot-link a { color: #60a5fa; text-decoration: none; font-size: 14px; transition: color 0.3s; }
        .forgot-link a:hover { color: #93c5fd; text-decoration: underline; }
        .system-info { text-align: center; margin-top: 35px; padding-top: 25px; border-top: 1px solid rgba(255,255,255,0.1); }
        .system-info .version { font-size: 12px; color: #64748b; }
        .system-info .version span { color: #a78bfa; font-weight: 600; }
        .system-info .status { font-size: 12px; color: #10b981; margin-top: 8px; }
        .error-message { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 10px; padding: 14px; color: #f87171; font-size: 14px; margin-bottom: 22px; display: none; text-align: center; }
        .error-message.show { display: block; animation: shake 0.3s ease-in-out; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        .icon-svg { width: 16px; height: 16px; fill: #94a3b8; }
        .floating-elements { position: fixed; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: hidden; }
        .float-element { position: absolute; opacity: 0.3; animation: float 15s ease-in-out infinite; }
        .float-element:nth-child(1) { width: 60px; height: 60px; border: 1px solid #6366f1; border-radius: 50%; top: 10%; left: 10%; animation-delay: 0s; }
        .float-element:nth-child(2) { width: 40px; height: 40px; border: 1px solid #8b5cf6; border-radius: 50%; top: 20%; right: 15%; animation-delay: 2s; }
        .float-element:nth-child(3) { width: 80px; height: 80px; border: 1px solid #a78bfa; border-radius: 50%; bottom: 20%; left: 20%; animation-delay: 4s; }
        .float-element:nth-child(4) { width: 50px; height: 50px; border: 1px solid #60a5fa; border-radius: 50%; bottom: 10%; right: 10%; animation-delay: 6s; }
        .float-element:nth-child(5) { width: 70px; height: 70px; border: 1px solid #c084fc; border-radius: 50%; top: 50%; left: 5%; animation-delay: 8s; }
        @keyframes float { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-30px) rotate(180deg); } }
        @media (max-width: 500px) { .login-card { padding: 35px 25px; } .logo-container { width: 80px; height: 80px; } .logo-inner { width: 55px; height: 55px; } .logo-icon { width: 35px; height: 35px; } }
    
.loading-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:9999;}
.loading-spinner{width:40px;height:40px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}

.empty-state{text-align:center;padding:40px 20px;color:#64748b;}
.empty-state .empty-icon{font-size:48px;margin-bottom:12px;opacity:.5;}
.empty-state .empty-text{font-size:14px;}
</style>

    <link rel="stylesheet" href="/static/css/theme.css">
</head>
<body>
    <canvas id="particles-js"></canvas>
    
    <div class="floating-elements">
        <div class="float-element"></div>
        <div class="float-element"></div>
        <div class="float-element"></div>
        <div class="float-element"></div>
        <div class="float-element"></div>
    </div>

    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo-container">
                    <div class="logo-circle"></div>
                    <div class="logo-inner">
                        <svg class="logo-icon" viewBox="0 0 24 24">
                            <path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
                        </svg>
                    </div>
                    <div class="logo-glow"></div>
                </div>
                <h1>MTSCOS AI 系统</h1>
                <p>智能学习评估系统 v{{ version }}</p>
            </div>

            <div class="error-message" id="error-message"></div>

            <form id="login-form" method="POST" action="/auth/login" novalidate>
                <div class="form-group">
                    <label for="username">
                        <svg class="icon-svg" viewBox="0 0 24 24">
                            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                        </svg>
                        用户名
                    </label>
                    <input type="text" id="username" name="username" placeholder="请输入用户名（3-20字符）" required minlength="3" maxlength="20" autocomplete="username" data-validate="username">
                    <div class="hint-text" id="username-hint">用户名长度 3-20 字符</div>
                </div>
                <div class="form-group">
                    <label for="password">
                        <svg class="icon-svg" viewBox="0 0 24 24">
                            <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                        </svg>
                        密码
                    </label>
                    <div class="password-box">
                        <input type="password" id="password" name="password" placeholder="请输入密码（8-64位）" required minlength="8" maxlength="64" autocomplete="current-password" data-validate="password">
                        <button type="button" class="toggle-pw" data-target="password" title="显示/隐藏密码">👁️</button>
                    </div>
                    <div class="hint-text" id="password-hint">建议使用 8-64 位，包含多类字符</div>
                </div>
                <button type="submit" class="btn btn-primary">登录系统</button>
            </form>

            <div class="forgot-link">
                <a href="/forgot-password">忘记密码？</a>
            </div>

            <div class="system-info">
                <div class="version">版本: <span>{{ version }}</span> | {{ version_info.codename if version_info else '' }}</div>
                <div class="status">系统状态: {{ system_status }}</div>
            </div>
        </div>
    </div>

    <script>
(function(){
  function $(id){ return document.getElementById(id); }
  function toggleError(el, ok, msg){
      if (!el) return;
      el.classList.remove('input-error','input-ok');
      var hintId = el.id + '-hint';
      var hint = document.getElementById(hintId);
      if (!hint) return;
      if (!hint.dataset.def) hint.dataset.def = hint.textContent;
      if (ok === null || ok === undefined) { hint.className = 'hint-text'; hint.textContent = hint.dataset.def; return; }
      if (ok) { el.classList.add('input-ok'); hint.className = 'hint-text ok'; hint.textContent = msg || '校验通过'; }
      else { el.classList.add('input-error'); hint.className = 'hint-text err'; hint.textContent = msg || '格式不正确'; }
  }
  function analyzePw(pw){
      pw = String(pw || '');
      var rules = {
          len: pw.length >= 8 && pw.length <= 64,
          lower: /[a-z]/.test(pw),
          upper: /[A-Z]/.test(pw),
          digit: /\d/.test(pw),
          special: /[^A-Za-z0-9]/.test(pw),
      };
      rules.classCount = (rules.lower?1:0) + (rules.upper?1:0) + (rules.digit?1:0) + (rules.special?1:0);
      return rules;
  }
  function validateUsername(){
      var el = $('username'); if (!el) return false;
      var v = (el.value || '').trim();
      if (!v) { toggleError(el, null); return false; }
      if (v.length < 3) { toggleError(el, false, '用户名至少 3 个字符'); return false; }
      if (v.length > 20) { toggleError(el, false, '用户名至多 20 个字符'); return false; }
      toggleError(el, true, v.length + ' 字符');
      return true;
  }
  function validatePassword(){
      var el = $('password'); if (!el) return false;
      var v = el.value || '';
      if (!v) { toggleError(el, null); return false; }
      var rules = analyzePw(v);
      if (!rules.len) { toggleError(el, false, v.length < 8 ? '密码长度不足 8 位' : '密码长度超过 64 位'); return false; }
      toggleError(el, true, '密码长度符合要求（' + rules.classCount + ' 类字符）');
      return true;
  }
  // 可见性切换
  document.addEventListener('click', function(e){
      var btn = e.target.closest && e.target.closest('.toggle-pw');
      if (!btn) return;
      var targetId = btn.getAttribute('data-target');
      var input = document.getElementById(targetId);
      if (!input) return;
      var isPw = input.type === 'password';
      input.type = isPw ? 'text' : 'password';
      btn.textContent = isPw ? '🔒' : '👁️';
  });
  ['input','blur','change'].forEach(function(evt){
      if ($('username')) $('username').addEventListener(evt, validateUsername);
      if ($('password')) $('password').addEventListener(evt, validatePassword);
  });
  [['username-hint','用户名长度 3-20 字符'],
   ['password-hint','建议使用 8-64 位，包含多类字符']].forEach(function(p){
      var el = document.getElementById(p[0]); if (el) el.dataset.def = p[1];
  });
})();
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            if (!document.getElementById('username').value.trim()) {
                var em = document.getElementById('error-message');
                em.textContent = '请输入用户名'; em.classList.add('show');
                setTimeout(() => em.classList.remove('show'), 3000); return;
            }
            if (!document.getElementById('password').value) {
                var em2 = document.getElementById('error-message');
                em2.textContent = '请输入密码'; em2.classList.add('show');
                setTimeout(() => em2.classList.remove('show'), 3000); return;
            }
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            fetch('/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    window.location.href = data.redirect || '/dashboard';
                } else {
                    const errorMsg = document.getElementById('error-message');
                    errorMsg.textContent = data.message || '登录失败';
                    errorMsg.classList.add('show');
                    setTimeout(() => errorMsg.classList.remove('show'), 3000);
                }
            })
            .catch(err => {
                const errorMsg = document.getElementById('error-message');
                errorMsg.textContent = '网络错误，请重试';
                errorMsg.classList.add('show');
                setTimeout(() => errorMsg.classList.remove('show'), 3000);
            });
        });

        class ParticleSystem {
            constructor(canvasId) {
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext('2d');
                this.particles = [];
                this.resize();
                window.addEventListener('resize', () => this.resize());
                this.init();
                this.animate();
            }
            
            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }
            
            init() {
                const particleCount = Math.min(100, Math.floor((this.canvas.width * this.canvas.height) / 15000));
                for (let i = 0; i < particleCount; i++) {
                    this.particles.push(this.createParticle());
                }
            }
            
            createParticle() {
                return {
                    x: Math.random() * this.canvas.width,
                    y: Math.random() * this.canvas.height,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5,
                    radius: Math.random() * 2 + 0.5,
                    opacity: Math.random() * 0.5 + 0.2,
                    color: ['#6366f1', '#8b5cf6', '#a78bfa', '#60a5fa'][Math.floor(Math.random() * 4)]
                };
            }
            
            animate() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                
                this.particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    
                    if (p.x < 0 || p.x > this.canvas.width) p.vx *= -1;
                    if (p.y < 0 || p.y > this.canvas.height) p.vy *= -1;
                    
                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    this.ctx.fillStyle = p.color;
                    this.ctx.globalAlpha = p.opacity;
                    this.ctx.fill();
                    
                    this.particles.forEach(p2 => {
                        const dx = p.x - p2.x;
                        const dy = p.y - p2.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        
                        if (dist < 150) {
                            this.ctx.beginPath();
                            this.ctx.moveTo(p.x, p.y);
                            this.ctx.lineTo(p2.x, p2.y);
                            this.ctx.strokeStyle = p.color;
                            this.ctx.globalAlpha = (150 - dist) / 150 * 0.2;
                            this.ctx.lineWidth = 0.5;
                            this.ctx.stroke();
                        }
                    });
                });
                
                this.ctx.globalAlpha = 1;
                requestAnimationFrame(() => this.animate());
            }
        }

        new ParticleSystem('particles-js');
    </script>
</body>
</html>
