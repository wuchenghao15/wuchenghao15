{% extends "base.html" %}

{% block title %}用户注册{% endblock %}

{% block head %}
<style>
    .register-container {
        max-width: 450px;
        margin: 40px auto;
        background: white;
        border-radius: 16px;
        padding: 40px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .register-container h1 {
        text-align: center;
        color: #333;
        margin-bottom: 30px;
        font-size: 28px;
    }
    .form-group {
        margin-bottom: 20px;
    }
    .form-group label {
        display: block;
        color: #555;
        margin-bottom: 8px;
        font-weight: 600;
        font-size: 14px;
    }
    .form-group input {
        width: 100%;
        padding: 12px 16px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 14px;
        transition: border-color 0.3s;
        box-sizing: border-box;
    }
    .form-group input:focus {
        outline: none;
        border-color: #667eea;
    }
    .form-group input.input-error {
        border-color: #e53e3e;
        background: #fff5f5;
        animation: shake 0.3s ease-in-out;
    }
    .form-group input.input-ok { border-color: #38a169; }
    .form-group .hint-text {
        font-size: 12px; color: #718096; margin-top: 4px; min-height: 16px; line-height: 16px;
    }
    .form-group .hint-text.err { color: #e53e3e; font-weight: 500; }
    .form-group .hint-text.ok  { color: #38a169; }
    .password-box { position: relative; }
    .password-box input { padding-right: 44px; }
    .toggle-pw {
        position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
        width: 34px; height: 34px; border-radius: 6px;
        background: transparent; border: none; cursor: pointer; color: #718096;
        font-size: 15px; transition: color .2s;
    }
    .toggle-pw:hover { color: #667eea; }
    .strength-meter { margin-top: 10px; }
    .strength-bar {
        display: flex; gap: 6px; height: 6px; margin-bottom: 6px;
    }
    .strength-bar span {
        flex: 1; background: #e2e8f0; border-radius: 3px; transition: background .25s;
    }
    .strength-bar.s1 span:nth-child(1)           { background: #e53e3e; }
    .strength-bar.s2 span:nth-child(-n+2)         { background: #dd6b20; }
    .strength-bar.s3 span:nth-child(-n+3)         { background: #d69e2e; }
    .strength-bar.s4 span                         { background: #38a169; }
    .strength-label { font-size: 12px; color: #4a5568; min-height: 16px; }
    .strength-label.s1 { color: #e53e3e; font-weight: 600; }
    .strength-label.s2 { color: #dd6b20; font-weight: 600; }
    .strength-label.s3 { color: #d69e2e; font-weight: 600; }
    .strength-label.s4 { color: #38a169; font-weight: 600; }
    .checklist { font-size: 12px; color: #718096; list-style: none; padding: 0; margin: 6px 0 0; }
    .checklist li { padding: 2px 0 2px 22px; position: relative; }
    .checklist li:before {
        content: '○'; position: absolute; left: 4px; top: 1px; color: #cbd5e0;
    }
    .checklist li.pass:before { content: '✓'; color: #38a169; font-weight: 700; }
    .checklist li.pass { color: #2f855a; }
    @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-5px);} 75%{transform:translateX(5px);} }
    .btn-register {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
    }
    .btn-register:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(102,126,234,0.4);
    }
    .login-link {
        text-align: center;
        margin-top: 20px;
        color: #666;
        font-size: 14px;
    }
    .login-link a {
        color: #667eea;
        text-decoration: none;
        font-weight: 600;
    }
    .alert {
        padding: 12px 16px;
        border-radius: 8px;
        margin-bottom: 20px;
        font-size: 14px;
        display: none;
    }
    .alert-error {
        background: #fee;
        color: #c33;
        border: 1px solid #fcc;
    }
    .alert-success {
        background: #efe;
        color: #363;
        border: 1px solid #cfc;
    }

@media (max-width: 768px) {
    .stats-grid, .section-grid, .feature-grid { grid-template-columns: 1fr !important; }
    .sidebar { width: 60px !important; }
    .main-content { padding: 12px !important; }
}

.loading-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:9999;}
.loading-spinner{width:40px;height:40px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}

.empty-state{text-align:center;padding:40px 20px;color:#64748b;}
.empty-state .empty-icon{font-size:48px;margin-bottom:12px;opacity:.5;}
.empty-state .empty-text{font-size:14px;}
</style>
{% endblock %}

{% block content %}
<div class="register-container">
    <h1><i class="fas fa-file-alt"></i> 用户注册</h1>

    <div class="alert alert-error" id="errorAlert"></div>
    <div class="alert alert-success" id="successAlert"></div>

    <form id="registerForm" onsubmit="return handleRegister(event)" novalidate>
        <div class="form-group">
            <label for="username">用户名</label>
            <input type="text" id="username" name="username" required placeholder="请输入用户名（3-20字符）" minlength="3" maxlength="20" autocomplete="username"
                   data-validate="username">
            <div class="hint-text" id="username-hint">用户名长度 3-20 个字符</div>
        </div>
        <div class="form-group">
            <label for="password">密码</label>
            <div class="password-box">
                <input type="password" id="password" name="password" required placeholder="请输入密码（8-64 位，至少 3 类字符）"
                       minlength="8" maxlength="64"
                       pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}"
                       autocomplete="new-password" data-validate="password">
                <button type="button" class="toggle-pw" data-target="password" title="显示/隐藏密码">👁️</button>
            </div>
            <div class="strength-meter">
                <div class="strength-bar" id="pw-strength-bar"><span></span><span></span><span></span><span></span></div>
                <div class="strength-label" id="pw-strength-label">请输入密码</div>
                <ul class="checklist" id="pw-checklist">
                    <li data-rule="len">长度 8-64 位</li>
                    <li data-rule="lower">包含小写字母</li>
                    <li data-rule="upper">包含大写字母</li>
                    <li data-rule="digit">包含数字</li>
                    <li data-rule="special">包含特殊符号</li>
                    <li data-rule="username">不与用户名重复或包含</li>
                </ul>
            </div>
            <div class="hint-text" id="password-hint">强度至少需满足 3 类字符</div>
        </div>
        <div class="form-group">
            <label for="confirmPassword">确认密码</label>
            <div class="password-box">
                <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="请再次输入密码"
                       minlength="8" maxlength="64" autocomplete="new-password" data-validate="confirm">
                <button type="button" class="toggle-pw" data-target="confirmPassword" title="显示/隐藏密码">👁️</button>
            </div>
            <div class="hint-text" id="confirm-hint">再次输入密码保持一致</div>
        </div>
        <button type="submit" class="btn-register" id="btn-register">注 册</button>
    </form>

    <div class="login-link">
        已有账号？<a href="/">立即登录</a>
    </div>
</div>

<script>
(function(){
  // === 密码框增强：可见性切换 + 实时强度 + 失焦校验 ===
  function $(id){ return document.getElementById(id); }
  function toggleError(el, ok, msg){
      if (!el) return;
      var parent = el.closest ? el.closest('.form-group') : el.parentNode;
      var hintId = el.id + '-hint';
      var hint = $(hintId);
      if (!hint && parent) hint = parent.querySelector('.hint-text');
      el.classList.remove('input-error','input-ok');
      if (ok === null || ok === undefined) {
          if (hint) { hint.className = 'hint-text'; hint.textContent = hint.dataset.def || ''; }
          return;
      }
      if (ok) {
          el.classList.add('input-ok');
          if (hint) { hint.className = 'hint-text ok'; hint.textContent = msg || '校验通过'; }
      } else {
          el.classList.add('input-error');
          if (hint) { hint.className = 'hint-text err'; hint.textContent = msg || '格式不正确'; }
      }
  }

  function analyzePw(pw, username){
      pw = String(pw || '');
      var rules = {
          len:      pw.length >= 8 && pw.length <= 64,
          lower:    /[a-z]/.test(pw),
          upper:    /[A-Z]/.test(pw),
          digit:    /\d/.test(pw),
          special:  /[^A-Za-z0-9]/.test(pw),
      };
      rules.classCount = (rules.lower?1:0) + (rules.upper?1:0) + (rules.digit?1:0) + (rules.special?1:0);
      rules.classes = rules.classCount >= 3;
      rules.username = true;
      if (username) {
          var un = String(username).toLowerCase(), lpw = pw.toLowerCase();
          if (un && (un === lpw || lpw.indexOf(un) >= 0 || un.indexOf(lpw) >= 0)) rules.username = false;
      }
      rules.allOk = rules.len && rules.classes && rules.username;
      rules.level = 0;
      if (pw.length === 0) rules.level = 0;
      else if (rules.classCount < 2 || !rules.len) rules.level = 1;
      else if (rules.classCount === 2) rules.level = 2;
      else if (rules.classCount === 3) rules.level = 3;
      else if (rules.classCount === 4 && rules.len) rules.level = 4;
      return rules;
  }

  function renderPwStrength(rules){
      var bar = $('pw-strength-bar'), label = $('pw-strength-label'), list = $('pw-checklist');
      var cls = ['s0','s1','s2','s3','s4'];
      if (bar) bar.className = 'strength-bar ' + cls[rules.level];
      if (label) {
          label.className = 'strength-label ' + cls[rules.level];
          if (!rules.len) label.textContent = '请输入密码（长度 8-64 位）';
          else switch (rules.level) {
              case 1: label.textContent = '密码强度：弱（' + rules.classCount + ' 类字符，建议≥3 类）'; break;
              case 2: label.textContent = '密码强度：较弱（2 类字符，至少再增 1 类）'; break;
              case 3: label.textContent = '密码强度：中（3 类字符，符合要求）'; break;
              case 4: label.textContent = '密码强度：强（4 类字符全部包含）'; break;
          }
      }
      if (list) {
          for (var i=0; i<list.children.length; i++) {
              var li = list.children[i];
              var r = li.dataset.rule;
              if (r === 'classes') continue;  // reserved
              var pass = rules[r];
              if (r === 'len') pass = rules.len;
              if (r === 'lower'||r==='upper'||r==='digit'||r==='special') pass = rules[r];
              li.classList.toggle('pass', !!pass);
          }
      }
  }

  // 可见性切换
  document.addEventListener('click', function(e){
      var btn = e.target.closest ? e.target.closest('.toggle-pw') : null;
      if (!btn) return;
      var targetId = btn.getAttribute('data-target');
      var input = document.getElementById(targetId);
      if (!input) return;
      var isPw = input.type === 'password';
      input.type = isPw ? 'text' : 'password';
      btn.textContent = isPw ? '🔒' : '👁️';
  });

  // 用户名实时校验（参考密码框对齐逻辑）
  function validateUsername(showHint){
      var el = $('username');
      if (!el) return true;
      var v = (el.value || '').trim();
      var def = el.id + '-hint';
      var hintEl = document.getElementById(def);
      if (hintEl && !hintEl.dataset.def) hintEl.dataset.def = hintEl.textContent;
      if (!v) { toggleError(el, null); return false; }
      if (v.length < 3) { toggleError(el, false, '用户名至少 3 个字符'); return false; }
      if (v.length > 20) { toggleError(el, false, '用户名至多 20 个字符'); return false; }
      if (!/^[A-Za-z0-9_\\-\\u4e00-\\u9fa5\\.@]+$/.test(v)) {
          toggleError(el, false, '用户名仅允许字母/数字/中文/_ - . @'); return false;
      }
      toggleError(el, true, '用户名格式正确（' + v.length + ' 字符）');
      return true;
  }
  // 密码实时校验
  function validatePassword(showHint){
      var el = $('password');
      if (!el) return true;
      var v = el.value || '';
      var un = ($('username') || {}).value || '';
      var hintEl = $('password-hint');
      if (hintEl && !hintEl.dataset.def) hintEl.dataset.def = hintEl.textContent;
      var rules = analyzePw(v, un);
      renderPwStrength(rules);
      if (!v) { toggleError(el, null); return false; }
      if (!rules.len) { toggleError(el, false, '密码长度必须 8-64 位'); return false; }
      if (!rules.username) { toggleError(el, false, '密码不能与用户名相同或互相包含'); return false; }
      if (!rules.classes) {
          var miss = [];
          if (!rules.upper) miss.push('大写字母');
          if (!rules.lower) miss.push('小写字母');
          if (!rules.digit) miss.push('数字');
          if (!rules.special) miss.push('特殊符号');
          toggleError(el, false, '至少再包含 ' + (3 - rules.classCount) + ' 类字符（' + miss.slice(0,3).join(' / ') + '）');
          return false;
      }
      toggleError(el, true, '密码强度符合要求（' + rules.classCount + ' 类字符）');
      if ($('confirmPassword') && $('confirmPassword').value.length > 0) validateConfirm();
      return true;
  }
  // 确认密码校验
  function validateConfirm(showHint){
      var el = $('confirmPassword');
      if (!el) return true;
      var v = el.value || '';
      var pw = ($('password') || {}).value || '';
      var hintEl = $('confirm-hint');
      if (hintEl && !hintEl.dataset.def) hintEl.dataset.def = hintEl.textContent;
      if (!v) { toggleError(el, null); return false; }
      if (!pw || pw !== v) { toggleError(el, false, '两次输入的密码不一致'); return false; }
      toggleError(el, true, '两次输入一致');
      return true;
  }

  // 绑定事件
  ['input','blur','change'].forEach(function(evt){
      if ($('username')) $('username').addEventListener(evt, validateUsername);
      if ($('password')) $('password').addEventListener(evt, validatePassword);
      if ($('confirmPassword')) $('confirmPassword').addEventListener(evt, validateConfirm);
  });

  // 设置初始提示
  [['username-hint','用户名长度 3-20 个字符'],
   ['password-hint','强度至少需满足 3 类字符（大写/小写/数字/特殊）'],
   ['confirm-hint','再次输入密码保持一致']].forEach(function(p){
      var el = document.getElementById(p[0]); if (el) el.dataset.def = p[1];
  });

  window.handleRegister = function(event) {
      event.preventDefault();
      var okU = validateUsername(true);
      var okP = validatePassword(true);
      var okC = validateConfirm(true);
      if (!okU || !okP || !okC) {
          var alert = $('errorAlert');
          if (alert) {
              alert.textContent = (!okU ? '请先完善用户名；' : '') + (!okP ? '请设置符合要求的密码；' : '') + (!okC ? '请两次输入一致的确认密码；' : '');
              alert.style.display = 'block';
              setTimeout(function(){ alert.style.display = 'none'; }, 4000);
          }
          return false;
      }
      var username = document.getElementById('username').value;
      var password = document.getElementById('password').value;
      var confirmPassword = document.getElementById('confirmPassword').value;
      var errorAlert = document.getElementById('errorAlert');
      var successAlert = document.getElementById('successAlert');

      errorAlert.style.display = 'none';
      successAlert.style.display = 'none';

      fetch('/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: username, password: password })
      })
      .then(function(res) { return res.json(); })
      .then(function(data) {
          if (data.success) {
              successAlert.textContent = '注册成功！即将跳转到登录页...';
              successAlert.style.display = 'block';
              setTimeout(function() { window.location.href = '/auth/login'; }, 2000);
          } else {
              var msg = data.message || '注册失败';
              if (data.details && data.details.level !== undefined) {
                  msg += '（强度：' + data.details.level + '）';
              }
              errorAlert.textContent = msg;
              errorAlert.style.display = 'block';
          }
      })
      .catch(function(err) {
          errorAlert.textContent = '网络错误，请稍后重试';
          errorAlert.style.display = 'block';
      });

      return false;
  };
})();
</script>
{% endblock %}
