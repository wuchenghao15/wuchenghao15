{% extends "base.html" %}

{% block title %}账户已锁定{% endblock %}

{% block head %}
<style>
    .lock-container {
        max-width: 500px;
        margin: 80px auto;
        background: white;
        border-radius: 16px;
        padding: 50px 40px;
        text-align: center;
        box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .lock-icon {
        font-size: 72px;
        margin-bottom: 20px;
    }
    .lock-container h1 {
        color: #333;
        font-size: 28px;
        margin-bottom: 15px;
    }
    .lock-container p {
        color: #666;
        font-size: 15px;
        margin-bottom: 25px;
        line-height: 1.6;
    }
    .btn-back {
        display: inline-block;
        padding: 12px 32px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        text-decoration: none;
        border-radius: 8px;
        font-weight: 600;
        transition: all 0.3s;
    }
    .btn-back:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(102,126,234,0.4);
    }
</style>
{% endblock %}

{% block content %}
<div class="lock-container">
    <div class="lock-icon">🔒</div>
    <h1>账户已锁定</h1>
    <p>{{ error | default('由于多次登录失败，您的账户已被临时锁定。') }}</p>
    <p>请稍后再试或联系管理员解锁。</p>
    <a href="/" class="btn-back">返回登录</a>
</div>
{% endblock %}
