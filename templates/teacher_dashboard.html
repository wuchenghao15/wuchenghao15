{% extends "base.html" %}

{% block title %}教师仪表盘{% endblock %}

{% block head %}
<style>
    .dashboard-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 16px;
        margin-top: 24px;
    }
    .dashboard-card {
        background: var(--bg-card);
        backdrop-filter: blur(var(--glass-blur));
        -webkit-backdrop-filter: blur(var(--glass-blur));
        border: 1px solid var(--glass-border);
        border-radius: var(--radius-md);
        padding: 20px;
        box-shadow: var(--shadow-md);
        transition: border-color 0.2s;
    }
    .dashboard-card:hover {
        border-color: var(--accent);
    }
    .dashboard-card .icon {
        font-size: 28px;
        margin-bottom: 10px;
        color: var(--accent-text);
    }
    .dashboard-card h3 {
        color: var(--text-primary);
        margin-bottom: 6px;
        font-size: 15px;
        font-weight: 600;
    }
    .dashboard-card p {
        color: var(--text-secondary);
        font-size: 13px;
        margin-bottom: 14px;
    }
    .btn {
        display: inline-block;
        padding: 8px 16px;
        font-size: 12px;
        font-weight: 600;
        border-radius: var(--radius-sm);
        text-decoration: none;
        color: var(--text-primary);
        background: var(--bg-card-alt);
        border: 1px solid var(--border-strong);
        transition: all 0.2s;
    }
    .btn:hover {
        background: var(--accent-soft);
        border-color: var(--accent);
    }
</style>
{% endblock %}

{% block content %}
<div style="max-width: 1200px; margin: 0 auto; padding: 20px;">
    <h1 style="text-align: center; color: var(--text-primary); margin-bottom: 30px; font-size: 24px; font-weight: 700;"><i class="fas fa-chalkboard-user" style="color: var(--accent); margin-right: 10px;"></i>教师仪表盘</h1>

    <div class="dashboard-grid">
        <div class="dashboard-card">
            <div class="icon"><i class="fas fa-file-alt"></i></div>
            <h3>考试管理</h3>
            <p>创建和管理考试试卷</p>
            <a href="/exam_system" class="btn">进入考试系统</a>
        </div>
        <div class="dashboard-card">
            <div class="icon"><i class="fas fa-chart-bar"></i></div>
            <h3>成绩分析</h3>
            <p>查看学生成绩和统计数据</p>
            <a href="/admin_app/data_analysis" class="btn">查看分析</a>
        </div>
        <div class="dashboard-card">
            <div class="icon"><i class="fas fa-users"></i></div>
            <h3>学生管理</h3>
            <p>查看和管理学生信息</p>
            <a href="/admin_app/student_analytics" class="btn">学生分析</a>
        </div>
        <div class="dashboard-card">
            <div class="icon"><i class="fas fa-book-open"></i></div>
            <h3>课程管理</h3>
            <p>管理课程内容和学习路径</p>
            <a href="/admin_app/courses" class="btn">课程列表</a>
        </div>
        <div class="dashboard-card">
            <div class="icon"><i class="fas fa-robot"></i></div>
            <h3>AI辅导</h3>
            <p>AI智能辅导系统</p>
            <a href="/ai-chat" class="btn">AI对话</a>
        </div>
        <div class="dashboard-card">
            <div class="icon"><i class="fas fa-bell"></i></div>
            <h3>通知中心</h3>
            <p>发送通知给学生</p>
            <a href="/admin_app/notifications" class="btn">通知管理</a>
        </div>
    </div>

    <div style="text-align: center; margin-top: 30px;">
        <a href="/" class="btn">返回首页</a>
    </div>
</div>
{% endblock %}
