{% extends "base.html" %}
{% block head %}
<style>
  .fp-wrap{min-height:calc(100vh - 80px);display:flex;align-items:center;justify-content:center;padding:40px 20px;}
  .fp-card{background:var(--surface-card);border:1px solid var(--border-soft);border-radius:16px;padding:36px 38px;width:100%;max-width:460px;box-shadow:0 20px 60px rgba(0,0,0,0.14);}
  .fp-card h2{margin:0 0 6px;text-align:center;font-size:22px;color:var(--text-primary);}
  .fp-card .fp-sub{text-align:center;color:var(--text-secondary);font-size:13px;margin-bottom:24px;}
  .fp-row{margin-bottom:16px;}
  .fp-row label{font-size:12px;color:var(--text-secondary);font-weight:600;margin-bottom:6px;display:block;}
  .fp-row input{width:100%;padding:10px 14px;border-radius:9px;border:1px solid var(--border-soft);background:var(--surface-muted);color:var(--text-primary);font-size:14px;box-sizing:border-box;}
  .fp-row input:focus{outline:none;border-color:var(--accent-primary);box-shadow:0 0 0 3px color-mix(in srgb, var(--accent-primary) 14%, transparent);}
  .fp-btn{width:100%;padding:11px;border:none;border-radius:9px;background:linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));color:#fff;font-size:14px;font-weight:700;cursor:pointer;}
  .fp-btn:hover{filter:brightness(1.05);}
  .fp-msg{padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:14px;}
  .fp-ok{background:color-mix(in srgb, var(--accent-success) 14%, transparent);color:var(--accent-success);}
  .fp-err{background:color-mix(in srgb, var(--accent-error) 14%, transparent);color:var(--accent-error);}
  .fp-links{display:flex;justify-content:space-between;margin-top:16px;font-size:12px;color:var(--text-secondary);}
  .fp-links a{color:var(--accent-primary);text-decoration:none;}
</style>
{% endblock %}
{% block content %}
<div class="fp-wrap">
  <form class="fp-card" method="post" action="/auth/forgot_password">
    <h2><i class="fas fa-unlock-alt" style="color:var(--accent-primary);"></i> 找回密码</h2>
    <p class="fp-sub">输入注册邮箱或用户名，系统将向您的邮箱发送重置链接（演示环境：直接显示重置结果）。</p>
    {% if success %}
    <div class="fp-msg fp-ok"><i class="fas fa-check-circle"></i> {{ success }}</div>
    {% endif %}
    {% if error %}
    <div class="fp-msg fp-err"><i class="fas fa-exclamation-circle"></i> {{ error }}</div>
    {% endif %}
    <div class="fp-row">
      <label>用户名 / 邮箱</label>
      <input type="text" name="identifier" required autocomplete="username" placeholder="请输入用户名或邮箱" value="{{ request.form.identifier or '' }}">
    </div>
    <div class="fp-row">
      <label>验证码（如已接入邮箱可留空）</label>
      <input type="text" name="token" placeholder="演示环境可留空" value="{{ request.form.token or '' }}">
    </div>
    <button type="submit" class="fp-btn"><i class="fas fa-paper-plane"></i> 发送重置申请</button>
    <div class="fp-links">
      <a href="/auth/login"><i class="fas fa-arrow-left"></i> 返回登录</a>
      <a href="/"><i class="fas fa-home"></i> 返回首页</a>
    </div>
  </form>
</div>
{% endblock %}
