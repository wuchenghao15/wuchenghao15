<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>考试中心</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-sans);
            background: var(--bg-page);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text-primary);
        }
        .container {
            background: var(--bg-card);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            padding: 32px;
            text-align: center;
            box-shadow: var(--shadow-md);
            max-width: 500px;
            width: 100%;
        }
        .icon {
            font-size: 48px;
            margin-bottom: 16px;
            color: var(--accent-text);
        }
        h1 {
            color: var(--text-primary);
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        p {
            color: var(--text-secondary);
            margin-bottom: 16px;
            font-size: 14px;
        }
        .path {
            background: var(--bg-card-alt);
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 16px;
            border: 1px solid var(--border-subtle);
        }
        .btn {
            display: inline-block;
            padding: 10px 24px;
            background: var(--accent);
            color: white;
            text-decoration: none;
            border-radius: var(--radius-sm);
            font-weight: 600;
            transition: background 0.2s;
            margin: 4px;
            font-size: 14px;
        }
        .btn:hover {
            background: #4338ca;
        }
        .btn-secondary {
            background: var(--bg-card-alt);
            color: var(--text-secondary);
            border: 1px solid var(--border-strong);
        }
        .btn-secondary:hover {
            background: var(--accent-soft);
            color: var(--accent-text);
            border-color: var(--accent);
        }
    
@media (max-width: 768px) {
    .stats-grid, .section-grid, .feature-grid { grid-template-columns: 1fr !important; }
    .sidebar { width: 60px !important; }
    .main-content { padding: 12px !important; }
}

.loading-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:9999;}
.loading-spinner{width:40px;height:40px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}

.empty-state{text-align:center;padding:40px 20px;color:#64748b;}
.empty-state .empty-icon{font-size:48px;margin-bottom:12px;opacity:.5;}
.empty-state .empty-text{font-size:14px;}
</style>

    <link rel="stylesheet" href="/static/css/theme.css">
</head>
<body>
    <div class="container">
        <div class="icon"><i class="fas fa-file-alt"></i></div>
        <h1>考试中心</h1>
        <p>考试中心页面。</p>
        <div class="path">/templates/exam_center.html</div>
        <a href="/" class="btn">返回首页</a>
        
    </div>
</body>
</html>
